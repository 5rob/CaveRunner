name: Android app + Pages

# Ship a build to the phone: push game changes to main (or run this manually).
# - deploy-pages publishes index.html + version.txt to GitHub Pages (the update
#   source the installed app checks).
# - build-apk builds the WebView shell and attaches app-debug.apk to a Release
#   you download once to your phone.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the newest run needs to finish; cancel superseded ones.
concurrency:
  group: android-pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (game + version.txt)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          node -e "const fs=require('fs');const m=fs.readFileSync('index.html','utf8').match(/VERSION\s*=\s*'(v\d+)'/);fs.writeFileSync('_site/version.txt',(m?m[1]:'v0')+'\n');"
          echo "Published version:"; cat _site/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure a stable debug keystore
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CaveRunner Debug,O=CaveRunner,C=US"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/debug.keystore
            git commit -m "Add stable debug keystore [skip ci]"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle current game into the app
        run: node android/prep-assets.js

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to the "app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: CaveRunner app (latest shell)
          body: |
            Install once on your phone. It plays offline and offers game updates
            from GitHub Pages on launch. Only reinstall this when the shell
            itself changes.
          files: android/app/build/outputs/apk/debug/app-debug.apk
