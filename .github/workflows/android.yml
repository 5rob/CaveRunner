name: Android app + Pages

# Ship a build to the phone: push game changes to main (or run this manually).
# - deploy-pages publishes index.html + version.txt to GitHub Pages (the update
#   source the installed app checks). Pages is one site per repo, replaced whole
#   by every deploy, so each run publishes BOTH builds: main's at the root and
#   the autobattler branch's (CaveRunner Auto) under auto/. Keep this file the
#   same on both branches.
# - build-apk builds the WebView shell and attaches app-debug.apk to a Release
#   you download once to your phone: tag "app" from main, "app-auto" (the second
#   app, com.caverunner.auto, updating from auto/) from autobattler.
on:
  push:
    branches: [ main, autobattler ]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    # Only the newest deploy needs to finish (each carries both builds).
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: autobattler
          path: auto
        continue-on-error: true
      - name: Assemble site (both games + version.txt)
        run: |
          for d in main auto; do
            [ -f $d/index.html ] || continue
            cd $d
            mkdir -p _site
            cp index.html _site/index.html
            # "<update number> <label>", e.g. "132 v0.0.132": an app from before semver reads the first number
            node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const n=s.match(/VERSION\s*=\s*'v(\d+)'/);const v=s.match(/VERSION\s*=\s*'(v\d+\.\d+\.\d+)'/);fs.writeFileSync('_site/version.txt',(n?n[1]:'0')+' '+(v?v[1]:'')+'\n');"
            cd ..
          done
          mkdir -p _site
          cp main/_site/* _site/
          if [ -d auto/_site ]; then mkdir -p _site/auto && cp auto/_site/* _site/auto/; fi
          echo "Published:"; cat _site/version.txt; cat _site/auto/version.txt || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    # Per branch: an autobattler push must not cancel main's APK.
    concurrency:
      group: apk-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure a stable debug keystore
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CaveRunner Debug,O=CaveRunner,C=US"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/debug.keystore
            git commit -m "Add stable debug keystore [skip ci]"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle current game into the app
        run: node android/prep-assets.js

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        # -PcaveAuto=true builds the second app (android/app/build.gradle); main builds as before
        run: gradle assembleDebug --no-daemon --stacktrace ${{ github.ref_name == 'autobattler' && '-PcaveAuto=true' || '' }}

      - name: Publish APK to the "app" release
        if: github.ref_name != 'autobattler'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: CaveRunner app (latest shell)
          body: |
            Install once on your phone. It plays offline and offers game updates
            from GitHub Pages on launch. Only reinstall this when the shell
            itself changes.
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "app-auto" release
        if: github.ref_name == 'autobattler'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-auto
          target_commitish: ${{ github.sha }}
          name: CaveRunner Auto app (latest shell)
          body: |
            The auto-battler test app (branch autobattler). Installs beside the
            main CaveRunner app and updates from GitHub Pages' auto/ address.
          files: android/app/build/outputs/apk/debug/app-debug.apk
