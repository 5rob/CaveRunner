.pop.ingame .dtile{padding:1px 5px}
.pop.ingame .ptitle span,.pop.ingame .dnote,.pop.ingame .prow{color:rgba(233,236,242,0.62)}
.pop.ingame .prow,.pop.ingame .pglyph{background:rgba(255,255,255,0.07)}
.pop.ingame .prow b,.pop.ingame .dtile i{color:#e9ecf2}
.pop.ingame .pdemo{border-top-color:rgba(255,255,255,0.18)}
.phead{display:flex;align-items:center;gap:10px}
.pglyph{width:42px;height:42px;flex:0 0 auto;border:2px solid;border-radius:10px;

.gtab.base{box-shadow:inset 0 0 0 2px var(--ring)}
.pdemo{margin-top:11px;border-top:1px solid var(--ring);padding-top:9px;
  display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:flex-start;gap:8px}
.dmark{flex:0 0 auto;width:18px;font-size:14px;font-weight:700;line-height:20px;text-align:center}

.dmark.no{color:#d5563a}
.dtiles{display:flex;gap:4px;flex-wrap:wrap}
.dtile{border:1px solid;border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:4px}
.dtile b{font-size:12px;line-height:1}
.dtile i{font-style:normal;font:600 10px system-ui,sans-serif;color:var(--text);opacity:.8}
.dtile.off{opacity:.42}
.dnote{display:block;font-size:11px;color:var(--muted);margin-top:3px}
/* the shop/pickup panel: the item's card and its buy/take line in one box, grown up
   from the bottom of the view. pointer-events:none so a tap falls through to the sticks —
   buying is a tap on the right stick's dead zone. */
.buypanel{position:absolute;left:25%;right:25%;bottom:12px;z-index:5;box-sizing:border-box;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;
  max-height:calc(100% - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(18,20,26,0.93);border:1px solid rgba(255,255,255,0.18);border-radius:15px;
  padding:11px 12px 13px;color:#e9ecf2;box-shadow:0 12px 40px rgba(0,0,0,0.35);
  /* the card inside is always dark regardless of site theme, so force the dark-bg gun colour */
  --gun-l:72%}
/* the card sits inline inside the panel: strip its own frame and let the panel be the box */
.buypanel .pop{position:static;top:auto;left:auto;right:auto;bottom:auto;width:auto;
  background:none;border:0;box-shadow:none;padding:0;margin:0;max-height:none;overflow:visible}
/* a long stat list (a loaded gun, a busy mod) gets its own small scroll box so the panel
   stays short — about three rows, then it scrolls. pointer-events back on just here so you
   can flick through it; the rest of the panel stays click-through */
.buypanel .prows{max-height:60px;overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto}
/* the buy/take line (v89): a thin white circle with an R in it — "tap the right stick" —
   and beside it the amber price (or "free", or a nameless item's name) */
.pbuy{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  height:40px;color:#fff;font:700 14px system-ui,sans-serif;letter-spacing:.03em}
.pbuy b{color:#ffc93c;font-size:15px}
.pbuy .rkey{flex:0 0 auto;display:block}
.pbuy.cant{opacity:.45}
.pbuy.cant b{color:#fff}
.weapon.locked{opacity:.45}
.pop.flow{position:static;max-height:none;box-shadow:none;margin-bottom:2px}
.spacer{flex:1 1 auto;min-height:6px}
/* gun pickup: the two cards share what is left over. Head and mod row are fixed,
   only the stat chips give way, so neither gun's mods can fall off the bottom. */
.swapsheet{gap:6px}
.pop.split{display:flex;flex-direction:column;flex:0 1 auto;min-height:0;overflow:hidden;
  padding:9px 11px 10px;margin-bottom:0}
.pop.split .phead{flex:0 0 auto}
.pop.split .pglyph{width:32px;height:32px;font-size:16px;border-radius:9px}
.pop.split .ptitle b{font-size:14.5px}
.pop.split .ptitle span{font-size:10px}
.pop.split .vs{flex:0 0 auto;margin:5px 0 0}
.pop.split .gstats{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:7px 0 0;gap:4px}
.pop.split .gstats .st{padding:2px 7px;font-size:10px}
.pop.split .gstats .st b{font-size:11px}
.pop.split .st.up b{color:var(--good)}
.pop.split .st.down b{color:var(--bad)}
.pop.split .pdemo{flex:0 0 auto;margin-top:7px;padding-top:7px;gap:6px}
.pop.split .dtile{padding:1px 5px}
.pop.split .dtile b{font-size:11px}
.pop.split .dtile i{font-size:9.5px}
.pop.split .dnote{font-size:10px;margin-top:2px}
.swapsheet>.shead,.swapsheet>.lab{flex:0 0 auto}
.swapsheet>.lab{margin:0}
/* keeps the slot row down by the thumb when there is space, and costs nothing when there is not */
.swapsheet>.lab.hint{margin-top:auto;padding-top:4px}
.swaprow{display:flex;gap:6px;margin-top:4px;flex:0 0 auto}
.swaprow .gtab{position:relative;height:62px;padding-top:6px}
.gtab.holding,.slot.holding{background:linear-gradient(to right,#ff8a1f 0%,#ff8a1f 100%);
  background-size:100% 100%;animation:fill .45s linear forwards;color:#12141a}
@keyframes fill{from{background-size:0% 100%}to{background-size:100% 100%}}
.gtab.holding{background-repeat:no-repeat}
.slot.holding{background-repeat:no-repeat}
.purse{font:700 14px system-ui,sans-serif;color:#c08a1f;margin-left:auto;margin-right:10px}
.dbg{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--ring);
  background:var(--pad);color:var(--muted);font:700 10px system-ui,sans-serif;letter-spacing:.09em}
.dbg.on{background:#ff8a1f;border-color:#ff8a1f;color:#12141a}
.bag.debug{box-shadow:inset 0 0 0 1.5px rgba(255,138,31,0.5)}
/* the dev tools: a gear in the top-right, and the panel it opens (Restart lives inside) */
.devbtn{position:absolute;top:10px;right:10px;z-index:6;border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.35);color:#e9ecf2;border-radius:8px;width:38px;height:38px;padding:0;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.devcopy{display:block;width:100%;margin-top:10px}
.devcopytext{width:100%;box-sizing:border-box;height:120px;margin-top:6px;font:12px ui-monospace,monospace;
  background:var(--pad);color:var(--text);border:1px solid var(--ring);border-radius:8px}
.dbg.restart{background:#c2401f;border-color:#c2401f;color:#fff}
.devwrap{position:fixed;left:0;right:0;top:0;bottom:0;z-index:26;display:flex;
  align-items:flex-start;justify-content:center;padding:52px 12px 12px}
/* a light backdrop so the cave is still visible behind while you tune the look of it */
.devback{position:absolute;inset:0;background:rgba(0,0,0,0.2)}
.devpanel{position:relative;z-index:1;width:100%;max-width:360px;max-height:calc(100% - 64px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;background:var(--btn);
  border:1px solid var(--ring);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,0.45);color:var(--text)}
.devhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.devhead h2{margin:0;font-size:17px}
.devbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.devvars{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.devgroup{border-top:1px solid var(--ring)}
.devghead{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0;border:0;background:none;
  color:var(--text);font:700 13px system-ui,sans-serif;text-align:left}
.devcaret{width:12px;color:var(--muted)}
.spawnpanel .spawngo{margin-top:12px;width:100%}
.devrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.devrow label{font-size:13px;color:var(--text);flex:1 1 auto}
.devrow input[type=color]{width:56px;padding:2px 4px}
.devrow input[type=range]{width:118px;padding:0;border:0;background:none;accent-color:#5ad65a}
.devval{display:block;font:600 12px system-ui,sans-serif;color:var(--muted)}
/* the live jellyfish above its colour knobs: stuck to the top of the panel while you
   scroll through them, so every change shows as you make it */
.jellyprev{position:sticky;top:-14px;z-index:2;display:block;width:100%;height:200px;margin:4px 0 6px;
  border-radius:10px;border:1px solid var(--ring);background:#0d0f14;box-shadow:0 6px 14px rgba(0,0,0,0.35)}
/* the hologram flash's fade curve (FadeCurve): drag the handles; touch-action none so a drag

.fcsvg{display:block;width:100%;height:auto;touch-action:none;border-radius:10px;border:1px solid var(--ring);background:#0d0f14}
.fcbox{fill:none;stroke:rgba(255,255,255,0.15);stroke-width:0.6}
.fctxt{fill:#aab;font:600 7px system-ui,sans-serif}
.fcarm{stroke:rgba(255,255,255,0.4);stroke-width:0.8;stroke-dasharray:2 2}

.fchandle{fill:#0d0f14;stroke:#5ad65a;stroke-width:1.6}
.fcreset{display:block;margin:4px 0 0 auto}
.devreset{flex:0 0 auto;width:34px;height:36px;border-radius:8px;border:1px solid var(--ring);
  background:var(--pad);color:var(--text);font-size:16px}
.devrow input{width:92px;flex:0 0 auto;box-sizing:border-box;height:36px;border-radius:8px;
  border:1px solid var(--ring);background:var(--pad);color:var(--text);
  font:600 14px system-ui,sans-serif;padding:0 9px;text-align:right;
  user-select:text;-webkit-user-select:text}
.devnote{margin:14px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
/* the death replay: a button on the death screen, then the replay's own screen over everything */
.witnessbtn{position:absolute;left:50%;top:238px;transform:translateX(-50%);z-index:7;white-space:nowrap;
  background:rgba(20,6,6,0.78);border:1.5px solid #ff4a3a;color:#ffd9d4;border-radius:24px;padding:12px 20px;
  font:800 14px system-ui,sans-serif;letter-spacing:0.18em;box-shadow:0 0 18px rgba(255,74,58,0.35)}

.witness{position:fixed;inset:0;z-index:28;display:flex;flex-direction:column}

.wtitle{position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none;
  font:800 13px system-ui,sans-serif;letter-spacing:0.3em;color:rgba(255,255,255,0.72);text-shadow:0 1px 3px #000}

.crystalcard .pglyph{background:none;border:0}
.vcrys{display:inline-flex;align-items:center;gap:3px;font:700 14px system-ui,sans-serif;color:#ff6a78}

.xperk{position:relative;aspect-ratio:1;border-radius:10px;border:1.5px solid;background:var(--btn);
  display:flex;align-items:center;justify-content:center;font-size:19px;touch-action:pan-y}
.xperk.none{opacity:.45;border-style:dashed}
.xperk.locked{opacity:.3;border-style:dashed;filter:grayscale(1)}
.xperk i{position:absolute;right:3px;bottom:1px;font:700 9px system-ui,sans-serif;font-style:normal;color:var(--text)}
.xperk u{position:absolute;right:2px;top:1px;font-size:9px;text-decoration:none}
/* the crystals you carry: silhouettes under the gold (hud.js CrystalRow) */
.crysrow{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 2px;max-width:170px;margin:1px auto 2px}
.crysrow .cbit{width:11px;height:11px;display:block}
.crysrow .cbit.red{fill:#e8283c;filter:drop-shadow(0 0 2px rgba(255,40,60,0.6))}
.crysrow .cbit.green{fill:#2fe56c;filter:drop-shadow(0 0 2px rgba(40,255,100,0.6))}
.crysrow .cmore{font:700 10px system-ui,sans-serif;line-height:11px}
.crysrow .cmore.red{color:#ff6a78}
.crysrow .cmore.green{color:#5dff8f}
.vmark{position:absolute;right:2px;bottom:1px;font:700 8px system-ui,sans-serif;font-style:normal;color:currentColor}
.vcell{position:relative}
/* the Exo Suit's stat rows: a slot for that stat's perks, its name, now, and what perks add */
.xrows{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.xrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.xrow .xslot.stat{flex:0 0 34px;width:34px;height:34px;aspect-ratio:auto;border-radius:9px;font-size:16px}
.xrow .xrl{flex:1;font-weight:700;white-space:nowrap}
.xrow b{font-variant-numeric:tabular-nums;color:var(--text)}
.xrow i{flex:0 0 42px;text-align:right;font-style:normal;font-weight:700;color:#3fb85f;font-size:11px}
.xslot{position:relative}
.xslot i{position:absolute;right:3px;bottom:1px;font:700 8px system-ui,sans-serif;font-style:normal}
.xslot.ok{border-color:#3fb85f;border-style:solid;box-shadow:0 0 0 2px rgba(63,184,95,0.35)}
.xperk em{position:absolute;left:3px;bottom:1px;font:700 8px system-ui,sans-serif;font-style:normal}
.xmsg{margin-top:4px}
.xstats{grid-template-columns:1fr}
.xtop .xport{width:84px;height:84px}
/* the menus' left-stick pointer (vendshop.js useMenuNav): a second knob, a very thin ring, no fill */
.mptr{position:fixed;left:0;top:0;z-index:40;display:none;box-sizing:border-box;border-radius:50%;

        g.addColorStop(0.25, "rgba(255,200,60,0.85)");
        g.addColorStop(0.7, "rgba(255,90,20,0.55)");

        ctx.quadraticCurveTo(x - w, fy - h3 * 0.5, x + (hash3(fl + x) - 0.5) * 8, fy - h3);

  function drawCamera(W, G, F) {
    const dpr = F.dpr = window.devicePixelRatio || 1;
    const ctlPx = Math.min(G.c.height * 0.8, (G.RPV ? G.RPV.panelH || 0 : G.input.current.ctlH || 0) * dpr);
    const playPx = F.playPx = G.c.height - ctlPx;
    const s = Math.min(G.c.width / VIEW_W, playPx / VIEW_MIN_H) * DEV.zoom * (G.RPV ? G.RPV.zoom : 1), vw = F.vw = G.c.width / s, vh = F.vh = G.c.height / s;

    W.unitPx = s / dpr;
    const pcx = F.pcx = W.p.x + PW / 2, pcy = F.pcy = W.p.y + PH / 2;
    if (G.RPV) {
      if (G.RPV.follow) {
        G.RPV.cx = vw >= WW ? WW / 2 : clamp(G.RPV.cx - vw / 2, 0, WW - vw) + vw / 2;
        G.RPV.cy = clamp(G.RPV.cy - vhp * 0.55, 0, Math.max(0, WH - vhp)) + vhp / 2;
      }
      W.camX = G.RPV.cx - vw / 2;
      W.camY = G.RPV.cy - vhp / 2;
      G.RPV.unit = W.unitPx;
    } else {
      const tx = vw >= WW ? (WW - vw) / 2 : clamp(pcx - vw / 2, 0, WW - vw);
      const ty = clamp(pcy - vhp * 0.55, 0, Math.max(0, WH - vhp));
      if (!W.camReady) {
        W.camX = tx;
        W.camY = ty;
        W.camReady = true;
        W.camT = W.time;
      }
      const cdt = clamp(W.time - W.camT, 0, 0.1);
      W.camT = W.time;
      const ease = 1 - Math.pow(0.85, cdt * 60);
      W.camX += (tx - W.camX) * ease;
      W.camY += (ty - W.camY) * ease;
    }
    G.ctx.setTransform(1, 0, 0, 1, 0, 0);
    G.ctx.imageSmoothingEnabled = false;
    G.ctx.fillStyle = "rgb(" + themeFor(W.floor).bg.join(",") + ")";
    G.ctx.fillRect(0, 0, G.c.width, G.c.height);
    const ox = Math.round(W.camX * s), oy = Math.round(W.camY * s);
    G.ctx.setTransform(s, 0, 0, s, -ox, -oy);
    F.snapX = (Math.round((W.p.x - W.camX) * s) + ox) / s - W.p.x;
    F.snapY = (Math.round((W.p.y - W.camY) * s) + oy) / s - W.p.y;
  }

  // src/game/systems/fields.js
  function fireBeam(W, G, sh, x, y, nx, ny, bonus, pd, pc) {
    pd = pd || 1;
    pc = pc || 0;
    let hitAt = sh.beam;
    for (let d = 6; d <= sh.beam; d += 4) {
      const bx = x + nx * d, by = y + ny * d;
      if (sh.bore) dig(W, G, bx, by, sh.bore);
      else if (solidAt(W, bx, by)) {
        hitAt = d;
        break;
      }
      const j = enemyAt(W, bx, by, sh.size + 3);
      if (j >= 0) {
        damageEnemy(W, j, critRoll((sh.dmg + bonus) * pd, sh.crit + pc));
        burst(W, bx, by, 4, sh.col);
        if (sh.knock) shove(W.enemies[j], nx, ny, sh.knock);
        if (!sh.pierce) {
          hitAt = d;
          break;
        }
      }
    }
    W.beams.push({ x, y, nx, ny, len: hitAt, col: sh.col, w: sh.size, t: 0, look: sh.look });
    if (sh.look) {
      const ex = x + nx * hitAt, ey = y + ny * hitAt;
      for (let k = 0; k < 5; k++) glowDot(
        W,
        ex,
        ey,
        -nx * rnd(20, 80) + rnd(-50, 50),
        -ny * rnd(20, 80) + rnd(-50, 30),
        k ? sh.col : "#ffffff",
        rnd(0.8, 1.3),
        rnd(0.12, 0.3),
        0.3
      );
      if (sh.pit && hitAt < sh.beam) dig(W, G, ex + nx * 2, ey + ny * 2, sh.pit);
    }
    if (sh.explode) explode(W, G, x + nx * hitAt, y + ny * hitAt, sh.explode);
    if (sh.payload && sh.payload.length) releaseAt(W, G, sh.payload, x + nx * hitAt, y + ny * hitAt, nx, ny, sh.col);
  }
  function throwEmbers(W, x, y, n) {
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 4.2, v = 60 + Math.random() * 150;
      W.dparts.push({
        x,
        y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 20,
        g: 0.45,
        c: FIRE_COLS[Math.floor(Math.random() * 3)],
        s: 1 + Math.random() * 0.8,
        life: 0.7 + Math.random() * 0.6,
        max: 1.3,
        glow: 1,
        ember: 1

    }
  }
  function castField(W, G, sh, x, y, ang) {
    const pay = sh.payload && sh.payload.length ? sh.payload : null;
    if (sh.field === "explode") {
      explode(W, G, x, y, sh.r, void 0, sh.fire);
      if (sh.embers) throwEmbers(W, x, y, sh.embers);
      if (pay) releaseAt(W, G, pay, x, y, Math.cos(ang || 0), Math.sin(ang || 0), sh.col);
      return;
    }
    W.fields.push({
      x,
      y,
      r: sh.r,
      field: sh.field,
      life: sh.life,
      max: sh.life,
      col: sh.col,
      dmg: sh.dmg || 1,
      tick: 0,
      payload: pay,
      ang: ang || 0,

  }
  var fieldPayload = (W, G, f) => {
    if (!f.payload) return;
    const list = f.payload;
    f.payload = null;
    releaseAt(W, G, list, f.x, f.y, Math.cos(f.ang), Math.sin(f.ang), f.col);
  };
  function stepFields(W, G, F) {
    const { dt, MHP, pcx, pcy } = F;
    for (let i = W.fields.length - 1; i >= 0; i--) {
      const f = W.fields[i];
      f.life -= dt;
      f.tick -= dt;
      const near = (j) => Math.hypot(W.enemies[j].x - f.x, W.enemies[j].ty - f.y) < f.r;
      if (f.field === "slow" || f.field === "storm") {
        if ((f.dT = (f.dT || 0) - dt) <= 0) {
          f.dT = 0.15;
          if (fireDouse(W.fire, f.x, f.y, f.r) && Math.random() < 0.5) SFX.fx("steam", f.x, f.y);
          for (const e of W.enemies) if (e.burn > 0 && Math.hypot(e.x - f.x, e.ty - f.y) < f.r) e.burn = 0;
          if (W.p.burn > 0 && Math.hypot(pcx - f.x, pcy - f.y) < f.r) W.p.burn = 0;
        }
        if (f.field === "slow" && Math.random() < dt * 14) {
          const a = Math.random() * 6.283, r = Math.random() * f.r;
          glowDot(W, f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, rnd(-4, 4), rnd(4, 12), Math.random() < 0.5 ? "#ffffff" : "#bfe8ff", rnd(0.7, 1.1), rnd(0.4, 0.9));
        }
      }
      if (f.field === "heal" && Math.random() < dt * 10) {
        const a = Math.random() * 6.283, r = Math.random() * f.r;
        glowDot(W, f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, 0, rnd(-18, -8), Math.random() < 0.5 ? "#9dff9a" : "#46c48c", rnd(0.8, 1.2), rnd(0.4, 0.8));
      }
      if (f.field === "mine") {
        f.near = W.enemies.some((e) => Math.hypot(e.x - f.x, e.ty - f.y) < f.r * 2.2);
        let trip = f.life <= 0;
        for (let j = 0; j < W.enemies.length && !trip; j++) if (near(j)) trip = true;
        if (trip) {
          explode(W, G, f.x, f.y, f.r);
          fieldPayload(W, G, f);
          W.fields.splice(i, 1);
          continue;
        }
      } else if (f.field === "dormant") {
        for (const fl of W.flashes) {
          if (Math.hypot(fl.x - f.x, fl.y - f.y) < fl.r + f.r * 0.5) {
            explode(W, G, f.x, f.y, f.r * 1.6);
            fieldPayload(W, G, f);
            W.fields.splice(i, 1);
            f.life = -1;
            break;
          }
        }
        if (f.life < 0) continue;
      } else if (f.field === "slow") {
        for (const e of W.enemies) if (Math.hypot(e.x - f.x, e.ty - f.y) < f.r) e.chill = 0.2;
      } else if (f.field === "shield") {
        for (let k = W.enemyShots.length - 1; k >= 0; k--) {
          const b = W.enemyShots[k];
          if (Math.hypot(b.x - f.x, b.y - f.y) < f.r) {
            burst(W, b.x, b.y, 3, f.col);
            SFX.fx("absorb", b.x, b.y);
            W.enemyShots.splice(k, 1);
          }
        }
      } else if (f.field === "heal") {
        if (Math.hypot(pcx - f.x, pcy - f.y) < f.r && W.p.hp < MHP && f.tick <= 0) {
          f.tick = 0.4;
          W.p.hp = Math.min(MHP, W.p.hp + 4 * W.pb.heal);
          G.input.current.notify();
          SFX.fx("healtick");
        }
      } else if (f.field === "storm") {
        if (f.tick <= 0) {
          f.tick = 0.22;
          const a = Math.random() * Math.PI * 2, rr2 = Math.random() * f.r;
          const sx = f.x + Math.cos(a) * rr2, sy = f.y + Math.sin(a) * rr2;
          for (let j = W.enemies.length - 1; j >= 0; j--)
            if (Math.hypot(W.enemies[j].x - sx, W.enemies[j].ty - sy) < 22) damageEnemy(W, j, 2);
          burst(W, sx, sy, 6, "#a8e4ff");
          addArc(W, [{ x: sx + rnd(-8, 8), y: f.y - f.r * 0.85 }, { x: sx, y: sy }], "#a8e4ff", 1.2, 0.14);
          SFX.arc(sx, sy, true);
        }
      } else if (f.field === "vacuum") {
        if (!f.done && f.max - f.life >= VACUUM_WAIT) {
          f.done = true;
          const inR = (x, y) => Math.hypot(x - f.x, y - f.y) < f.r;
          for (const e of W.enemies) if (inR(e.x, e.ty)) {
            e.y += f.y - e.ty;
            e.x = f.x;
            e.tgt = null;
          }
          for (const b of W.bullets) if (inR(b.x, b.y)) {
            b.x = f.x;
            b.y = f.y;
          }
          for (const b of W.enemyShots) if (inR(b.x, b.y)) {
            b.x = f.x;
            b.y = f.y;
          }
          for (const g of W.coins) if (inR(g.x, g.y)) {
            g.x = f.x;
            g.y = f.y;
          }
          for (const q of W.pickups) if (!q.taken && inR(q.x, q.y)) {
            q.x = f.x;
            q.y = f.y;
          }
          burst(W, f.x, f.y, 14, f.col);
          SFX.fx("warp", f.x, f.y);
        }
      } else if (f.field === "glitter") {
        if (f.tick <= 0) {
          f.tick = 0.16;
          const a = Math.random() * Math.PI * 2, rr2 = Math.random() * f.r;
          explode(W, G, f.x + Math.cos(a) * rr2, f.y + Math.sin(a) * rr2, 9);
        }
      }
      if (f.life <= 0) W.fields.splice(i, 1);
    }
    for (let i = W.beams.length - 1; i >= 0; i--) if ((W.beams[i].t += dt) > 0.12) W.beams.splice(i, 1);
  }

  // src/game/systems/gun.js
  function cast(W, G, g, gx, gy, nx, ny) {
    const pas = gunPassives(g);
    const wrap = () => {
      g.idx = 0;
      g.rechT = g.skipRech ? 0 : effRecharge(g) * W.pb.rech;
      g.rechLen = g.rechT;
      g.skipRech = false;
      shuffleOrder(g);
    };
    const plan = planCast(g, G.input.current.loadout.guns);
    if (!plan.shots.length) {
      wrap();
      return;
    }
    const cost = W.pb.mana === 0 ? 0 : plan.cost;
    if (g.mana < cost) {
      g.idx = plan.start;
      g.delayT = 0.12;
      g.delayMax = 0.12;
      SFX.ui("empty");
      return;
    }
    g.mana -= cost;
    const base = Math.atan2(ny, nx);
    const acts = plan.acts || [];
    let bonus = 0;
    if (plan.hp && !W.p.dead) hurt(W, G, plan.hp);
    if (acts.includes("refresh")) {
      g.skipRech = true;
      SFX.fx("refresh");
    }
    if (acts.includes("manapow")) {
      SFX.fx("drain");
      const spare = Math.max(0, g.mana - 50);
      g.mana -= spare;
      bonus += spare / 12;
    }
    if (acts.includes("gpower")) {
      const LO2 = G.input.current.loadout;
      const spend = Math.floor(LO2.gold * 0.05);
      LO2.gold -= spend;
      bonus += spend / 8;
      if (spend) {
        G.input.current.notify();
        SFX.fx("gspend");
      }
    }
    if (acts.includes("saws")) {
      SFX.fx("saws");
      for (const b of W.bullets) {
        b.dmg = Math.max(b.dmg, 3);
        b.size = 5;
        b.bore = 4;
        b.col = "#d9dde4";
        b.life = Math.max(b.life, 1.2);
        b.bounce = Math.max(b.bounce, 4);
        b.explode = 0;
      }
    }
    let ox = gx, oy = gy;
    const clearSpot = (tx, ty) => {
      for (let k = 0; k <= 10; k++) {
        const t = k / 10;
        const cx = tx + (gx - tx) * t, cy = ty + (gy - ty) * t;
        if (!solidAt(W, cx, cy)) return [cx, cy];
      }
      return [gx, gy];
    };
    if (acts.includes("far")) [ox, oy] = clearSpot(gx + nx * 95, gy + ny * 95);
    if (acts.includes("tele")) {
      let best = null, bd = 420;
      for (const e of W.enemies) {
        const d = Math.hypot(e.x - gx, e.ty - gy);
        if (d < bd) {
          bd = d;
          best = e;
        }
      }
      if (best) [ox, oy] = clearSpot(best.x - nx * 14, best.ty - ny * 14);
    }
    const warp = acts.includes("warp");
    if (warp || acts.includes("far") || acts.includes("tele")) SFX.fx("warp", ox, oy);
    for (const sh of plan.shots) spawnShot(W, G, sh, ox, oy, base, bonus, warp, 30);
    SFX.cast(plan.shots, ox === gx && oy === gy ? null : ox, oy);
    let kick = 0;
    for (const sh of plan.shots) kick += sh.recoil;
    if (kick && !W.p.dead) {
      kick = Math.min(220, kick * 1.4 * W.pb.recoil);
      W.p.vx -= Math.cos(base) * kick;
      W.p.vy -= Math.sin(base) * kick;
    }
    g.delayT = plan.delay * W.pb.delay;
    g.delayMax = Math.max(g.delayT, 1e-3);
    if (plan.wrap) wrap();
  }
  function spawnShot(W, G, sh, ox, oy, base, bonus, warp, fd) {
    if (sh.still) {
      castField(W, G, sh, ox + Math.cos(base) * fd, oy + Math.sin(base) * fd, base);
      return;
    }
    const n = Math.min(24, Math.max(1, Math.round(sh.count)));
    const off = (sh.ang || 0) * Math.PI / 180;
    const pd = W.pb.dmg;
    let pc = W.pb.crit;
    if (W.pb.close && W.enemies.some((e) => Math.hypot(e.x - ox, e.ty - oy) < 56)) pc += 0.4;
    for (let i = 0; i < n; i++) {
      let a = base + off + (Math.random() - 0.5) * sh.spread * W.pb.spread * Math.PI / 180;
      if (sh.autoaim) {
        let best = null, bd = 320;
        for (const e of W.enemies) {
          const d = Math.hypot(e.x - ox, e.ty - oy);
          if (d < bd) {
            bd = d;
            best = e;
          }
        }
        if (best) a = Math.atan2(best.ty - oy, best.x - ox);

      if (sh.flat) a = Math.cos(a) >= 0 ? 0 : Math.PI;
      if (sh.beam) {

      const reach = sh.reach != null ? sh.reach : 10;
      let bx = ox + Math.cos(a) * reach, by = oy + Math.sin(a) * reach;

        for (let step2 = 0; step2 < 14; step2++) {
          const tx = bx + Math.cos(a) * 10, ty = by + Math.sin(a) * 10;
          if (solidAt(W, tx, ty)) break;

          by = ty;

        pop: sh.pop,

      G.input.current.sig = sig;
      G.input.current.prompt = label;
      G.input.current.promptBottom = pbottom;
      G.input.current.inShop = inShop;
      G.input.current.notify();
    }
    if (W.p.dead && G.input.current.interact) {
      G.input.current.interact = false;
      if (G.input.current.requestRestart) G.input.current.requestRestart();
    }
    if (G.input.current.interact && near) {
      G.input.current.interact = false;
      if (near.src === "vend") vendUse(W, G, near.kind, LO);
      else if (near.src === "shopvend") shopUse(G, near.kind);
      else if (near.src === "shop") {
        const it = near.it;
        if (it.kind === "heal") {
          if (W.p.hp >= MHP) {
            toast(W, "Already at full health");
            SFX.ui("poor");
          } else if (LO.gold < it.price) {
            toast(W, "Not enough gold");
            SFX.ui("poor");
          } else {
            LO.gold -= it.price;
            W.p.hp = MHP;
            it.bought = (it.bought || 0) + 1;
            it.price = healPrice(it.bought, W.floor);
            toast(W, "Patched up");
            SFX.ui("heal");
          }
        } else if (LO.gold < it.price) {
          toast(W, "Not enough gold");
          SFX.ui("poor");
        } else if (it.kind === "gun") {
          LO.gold -= it.price;
          it.sold = true;
          W.pickups.push({ kind: "gun", x: it.x, y: it.y, gun: it.gun, t: 0 });
          toast(W, "Bought " + it.gun.name);
          SFX.ui("buy");
        } else {
          LO.gold -= it.price;
          LO.bag.push(it.id);
          it.sold = true;
          toast(W, "Bought " + MODS[it.id].name);
          SFX.ui("buy");
        }
      } else if (near.src === "room") {
        const r = near.r;
        if (r.kind === "green") {
          (LO.greens || (LO.greens = [])).push(W.floor);
          toast(W, "Green crystal");
          SFX.ui("perk");
        } else if (r.kind === "perk" && r.id) {
          LO.perks.push(r.id);
          toast(W, "Perk: " + PERKS[r.id].name);
          SFX.ui("perk");
        } else {
          LO.maxBonus = (LO.maxBonus || 0) + 25;
          toast(W, "+25 Max Health");
          SFX.ui("heart");
        }
        r.taken = true;
      } else {
        const q = near.q;
        if (q.kind === "mod") {
          LO.bag.push(q.id);
          q.taken = true;
          q.cool = PICKUP_COOL;
          toast(W, "Picked up " + MODS[q.id].name);
          SFX.ui("mod");
        } else if (q.kind === "perk") {
          LO.perks.push(q.id);
          q.taken = true;
          toast(W, "Perk: " + PERKS[q.id].name + " (fit it in the Bag)");
          SFX.ui("perk");
        } else if (q.kind === "crystal") {
          (LO.crystals || (LO.crystals = [])).push(q.floor || W.floor);
          q.taken = true;
          toast(W, "Red crystal");
          SFX.ui("mod");
        } else {
          G.input.current.found = q;
        }
      }
      G.input.current.sig = "";
      G.input.current.notify();
    }
    G.input.current.interact = false;
  }

  // src/game/systems/step.js
  function step(W, G, dt) {
    const F = { dt, LO: null, MHP: 0, pcx: 0, pcy: 0 };
    if (stepRequests(W, G, F)) return;
    stepPerks(W, G, F);
    movePlayer(W, G, F);
    if (atPortal(W, G, F)) return;
    aimAndCast(W, G, F);
    stepBullets(W, G, F);
    stepSound(W, F);
    stepFields(W, G, F);
    stepPickups(W, G, F);
    stepWarp(W, G, F);
    stepRepo(W, G, F);
    stepToasts(W, F);
    decorStep(W, G, dt, F.pcx, F.pcy);
    stepEnemies(W, G, F);
    stepGhost(W, F);
    fireFrame(W, G, dt, F.pcx, F.pcy);
    stepTrail(W, F);
    stepParticles(W, F);
    W.best = Math.max(W.best, Math.round((W.start.y - W.p.y) / 10));
    stepTorch(W, F);
    stepMotes(W, F);
  }
  function stepRequests(W, G, F) {
    const { dt } = F;
    W.time += dt;
    W.levelT += dt;
    if (G.input.current.pendingToast) {
      toast(W, G.input.current.pendingToast);
      G.input.current.pendingToast = null;
    }
    G.input.current.floor = W.floor;
    if (G.input.current.newCave) {
      G.input.current.newCave = false;
      enterLevel(W, G);
      if (!W.hasLvl) voidCave(W, G);
      toast(W, "New cave");
      return true;
    }
    if (G.input.current.spawnGun) {
      const gun = caveGun(G.input.current.spawnGun, Math.random);
      G.input.current.spawnGun = 0;
      W.pickups.push({ kind: "gun", x: W.p.x + PW / 2 + W.p.face * 22, y: W.p.y + PH - 9, gun, t: 0 });
      toast(W, "Spawned " + gun.name);
    }
  }
  function stepPerks(W, G, F) {
    const { dt } = F;
    F.LO = G.input.current.loadout;
    const MHP = F.MHP = maxHp(W, G);
    if (W.p.hp > MHP) W.p.hp = MHP;
    if (W.pb.shield && !W.p.shieldReady) {
      W.p.shieldT -= dt;
      if (W.p.shieldT <= 0) {
        W.p.shieldReady = true;
        SFX.fx("shieldUp");
      }
    }
  }
  function atPortal(W, G, F) {
    const pcx = F.pcx = W.p.x + PW / 2, pcy = F.pcy = W.p.y + PH / 2;
    if (!W.p.dead && W.hasLvl && pcx > W.portal.x && pcx < W.portal.x + W.portal.w && pcy > W.portal.y && pcy < W.portal.y + W.portal.h) {
      W.p.x = W.start.x;
      W.p.y = W.start.y;
      W.p.vx = 0;
      W.p.vy = 0;
      W.p.fuel = 1;
      W.p.empty = false;
      W.camReady = false;
      saveRun(W, G);
      SFX.fx("portalIn");
      setTimeout(() => SFX.fx("portalOut", W.arrival.x, W.arrival.y), 260);
      toast(W, "Back to the shop");
      G.input.current.notify();
      return true;
    }
  }
  function stepSound(W, F) {
    const { dt, MHP, pcx, pcy } = F;
    SFX.ear(pcx, pcy);
    if (!W.jetLoop && SFX.ready) W.jetLoop = SFX.loop("jet");
    if (W.jetLoop) W.jetLoop.set(
      W.p.dead ? 0 : Math.min(1, W.p.flame) * 0.35,
      null,
      null,
      (1 + 0.49 * Math.min(1, W.p.flame)) * jetPitch(W.jetSt.onT)
    );
    if (W.p.empty && !W.wasEmpty) SFX.ui("sputter");
    W.wasEmpty = W.p.empty;
    for (const b of W.bullets) if (b.pull) {
      let h3 = W.bhLoops.get(b);
      if (!h3 && W.bhLoops.size < 3 && SFX.ready) {
        h3 = SFX.loop("void");
        if (h3) W.bhLoops.set(b, h3);
      }
      if (h3) h3.set(0.5, b.x, b.y);
    }
    for (const [b, h3] of W.bhLoops) if (!W.bullets.includes(b)) {
      h3.stop();
      W.bhLoops.delete(b);
    }
    SFX.ambTick(dt);
    if (!W.portalLoop && SFX.ready) W.portalLoop = SFX.loop("portal");
    if (W.portalLoop) W.portalLoop.set(0.55, W.portal.x + W.portal.w / 2, W.portal.y + W.portal.h / 2);
    if (W.matterProps.length) {
      let best = null, bd = 300;
      for (const pr of W.matterProps) {
        const d = Math.hypot(pr.x - pcx, pr.y - pcy);
        if (!pr.gone && d < bd) {
          bd = d;
          best = pr;
        }
      }
      if (best && !W.matterLoop && SFX.ready) W.matterLoop = SFX.loop("matter");
      if (W.matterLoop && best) W.matterLoop.set(0.6, best.x, best.y);
    }
    if (W.p.jet > 0 && !W.wasJet) SFX.fx("ignite");
    W.wasJet = W.p.jet > 0;
    for (const dv of W.devils) if ((dv.snd = (dv.snd || 0) - dt) <= 0) {
      dv.snd = 0.9 + Math.random() * 0.8;
      SFX.fx("whirl", dv.x, dv.y - 14);
    }
    if (!W.p.dead && W.p.hp / MHP < 0.3 && (W.beatT -= dt) <= 0) {
      W.beatT = 0.55 + 1.5 * W.p.hp / MHP;
      SFX.ui("beat");
    }
  }
  function stepGhost(W, F) {
    const { dt, pcx, pcy } = F;
    if (W.pb.ghost) {
      if (!W.ghost) W.ghost = { x: pcx, y: pcy, cd: 0 };
      const gtx = pcx - W.p.face * 22, gty = W.p.y - 4;
      const lp = Math.min(1, dt * 4);
      W.ghost.x += (gtx - W.ghost.x) * lp;
      W.ghost.y += (gty - W.ghost.y) * lp;
      W.ghost.cd -= dt;
      if (W.ghost.cd <= 0 && !W.p.dead) {
        let best = null, bd = 340;
        for (const e of W.enemies) {
          const d = Math.hypot(e.x - W.ghost.x, e.ty - W.ghost.y);
          if (d < bd) {
            bd = d;
            best = e;
          }
        }
        if (best) {
          W.ghost.cd = 0.7;
          const a = Math.atan2(best.ty - W.ghost.y, best.x - W.ghost.x);
          W.bullets.push({
            x: W.ghost.x,
            y: W.ghost.y,
            vx: Math.cos(a) * 480,
            vy: Math.sin(a) * 480,
            life: 1.2,
            dmg: 2 * W.pb.dmg,
            size: 2,
            col: "#c9a6ff",
            spin: 0,
            homing: 3,
            bounce: 0,
            pierce: 0,
            explode: 0,
            grav: 0,
            accel: 0,
            bore: 0,
            hit: null,
            knock: 0,
            crit: 0,
            age: 0,
            born: 1.2
          });
          SFX.fx("ghost", W.ghost.x, W.ghost.y);
        }
      }
    } else W.ghost = null;
  }

  // src/game/testhook.js
  function testHook(W, g) {
    const { tctx, dctx, paintFog: paintFog2 } = g;
    if (!window.__TEST_VOID) W.hasLvl = true;
    const sandbox = (o) => {
      o = o || {};
      const w = o.w || 300, h3 = o.h || 200;
      const cx = Math.round((W.portal.x + W.portal.w / 2 < WW / 2 ? WW * 0.72 : WW * 0.28) / CELL) * CELL;
      const fy = (SHOP_TOP - SHOP_ROOF) * CELL - 160;
      const x0 = Math.max(2, Math.floor((cx - w / 2) / CELL)), x1 = Math.min(CW - 3, Math.ceil((cx + w / 2) / CELL));
      const y0 = Math.max(2, Math.floor((fy - h3) / CELL)), fr = fy / CELL, y1 = Math.min(CH - 3, fr + 6);
      const d = W.img.data, dd = W.dimg.data;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const i = y * CW + x, k = i * 4;
        dd[k + 3] = 0;
        if (W.ore) W.ore[i] = 0;
        W.fire.fuel[i] = 0;
        W.fire.t[i] = 0;
        const ramp = o.ramp && x > x1 - (x1 - x0) / 3 && y >= fr - (x - (x1 - (x1 - x0) / 3));
        if (y < fr && !ramp) {
          W.mat[i] = 0;
          d[k + 3] = 0;
        } else {
          W.mat[i] = BRICK;
          d[k] = 132;
          d[k + 1] = 99;
          d[k + 2] = 71;
          d[k + 3] = 255;
        }
      }
      if (o.roof) for (let y = Math.max(0, y0 - 6); y < y0; y++) for (let x = x0; x <= x1; x++) {
        const i = y * CW + x, k = i * 4;
        W.mat[i] = BRICK;
        d[k] = 132;
        d[k + 1] = 99;
        d[k + 2] = 71;
        d[k + 3] = 255;
        dd[k + 3] = 0;
      }
      tctx.putImageData(W.img, 0, 0, x0, Math.max(0, y0 - 6), x1 - x0 + 1, y1 - y0 + 7);
      dctx.putImageData(W.dimg, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      W.enemies.length = 0;
      W.props.length = 0;
      W.pickups.length = 0;
      W.bullets.length = 0;
      W.enemyShots.length = 0;
      W.webs.length = 0;
      W.silk.length = 0;
      W.strings.length = 0;
      W.fields.length = 0;
      W.dparts.length = 0;
      W.amb.length = 0;
      for (let y = Math.floor(y0 * CELL / FOG_U); y <= Math.floor(y1 * CELL / FOG_U); y++)
        for (let x = Math.floor(x0 * CELL / FOG_U); x <= Math.floor(x1 * CELL / FOG_U); x++) W.seen[y * FW + x] = 2;
      paintFog2();
      W.p.x = cx - PW / 2;
      W.p.y = fy - PH - 0.5;
      W.p.vx = 0;
      W.p.vy = 0;
      W.p.hp = 9999;
      W.p.dead = false;
      return { x: cx, y: fy, l: x0 * CELL, r: x1 * CELL };
    };
    const placeProp = (pr, x, y) => {
      const q = Object.assign({}, pr, {
        x,
        y,
        gone: false,
        fall: false,
        vy: 0,
        anc: [Math.floor(x / CELL), Math.floor(y / CELL)]
      });
      W.props.push(q);
      return q;
    };
    Object.assign(W, {
      sandbox,
      placeProp,
      hurt: g.hurt,
      maxHp: g.maxHp,
      dig: g.dig,
      explode: g.explode,
      recSample: g.recSample,
      ignite: g.ignite,
      setAlight: g.setAlight,
      youAlight: g.youAlight,
      nextFloor: g.nextFloor,
      world: { CW, CH, CELL, WW, WH, SHOP_FLOOR, SHOP_TOP, SHOP_Y },
      fog: { get seen() {
        return W.seen;
      }, FW, FH, FOG, FOG_U, SIGHT, SHOP_TOP, SHOP_ROOF, reveal: fogReveal, paint: paintFog2 },
      light: {
        get flick() {
          return W.flick;
        },
        get r() {
          return W.torchR;
        },
        get cam() {
          return { x: W.camX, y: W.camY };
        },
        get s() {
          return W.unitPx * (window.devicePixelRatio || 1);
        },
        get embers() {
          return W.torchP.length;
        },
        get vis() {
          return W.visPts;
        },
        visPoly,
        losClear
      }
    });
    Object.defineProperties(W, {
      seed: { get: () => W.levelSeed, configurable: true },
      theme: { get: () => W.themeName, configurable: true },
      rec: { get: () => g.REC, configurable: true },
      rt: { get: () => g.RT, configurable: true }
    });
    return W;
  }

  // src/game/world.js
  function makeWorld() {
    return {
      // ---- you ----
      p: {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        onGround: false,
        face: 1,
        jet: 0,
        fuel: 1,
        empty: false,
        sput: false,
        flame: 0,
        cough: 0,
        hp: PLAYER_HP,
        hitT: 0,
        dead: false,
        kick: 0,
        shieldReady: true,
        shieldT: 0,
        // Permanent Shield: up, and its recharge clock
        jx: 0,
        jy: 0,
        aim: { on: false, show: false, nx: 1, ny: 0 }
      },
      pb: perkBag([]),
      // what the perks you carry add up to (refreshBag)
      ghost: null,
      // the Angry Ghost companion, if owned
      // what the props did to you this frame (slowed, slick, holding a vine, gravity flipped),
      // read by next frame's steering; decorStep makes a new one each frame
      zfx: { slow: 1, slick: 0, climb: null, rev: 0, web: null, webs: 0, webMul: 1 },
      // ---- the clock, the camera, the torch ----
      time: 0,
      // seconds of play (step adds dt)
      levelT: 0,
      // seconds on this floor (the floor's name card)
      best: 0,
      // the highest you've climbed on this floor
      // the camera: draw() eases it toward you, so step() reads last frame's
      camX: 0,
      camY: 0,
      camReady: false,
      camT: 0,
      unitPx: 1,
      // css pixels per world unit, set while drawing
      viewW: VIEW_W,
      viewH: VIEW_MIN_H,
      // the view in world units, set while drawing
      // one flicker number drives the flame and the lamp, so the light breathes with the fire
      flick: 1,
      torchR: SIGHT,
      // how far the lamp reaches this frame
      visPts: [],
      // the line-of-sight fan from you, this frame
      leanX: 0,
      leanY: 0,
      // the hand torch's flame lean (sprung, trails behind you)
      glowN: 0,
      // the torch glow's flicker
      // ---- terrain ----
      mat: null,
      img: null,
      // the rock: solid cells, and its pixels (drawn to the terrain canvas)
      dimg: null,
      // the decoration layer's pixels (walk-through: moss, beams, rubble)
      ore: null,
      // gold seams in the rock (per terrain pixel)
      // rat burrows (a mask over each nest's room and tunnel), and the rock's change count
      // (the rats' way-finding fields rebuild when it moves; see ratSolid / navFor)
      burrow: null,
      terrainV: 0,
      // ---- the floor's layout (enterLevel sets all of these) ----
      floor: 1,
      // the level above the shop is bought from the vending machine and sold back (vend.js): false
      // while there isn't one (the cave is solid dark, the roof sealed); warp is the teleport under way
      hasLvl: false,
      warp: null,
      repo: null,
      // the repayment deadline passed: the level is taken back, then the fire
      start: void 0,
      portal: void 0,
      arrival: void 0,
      // where you come in, the way out
      stock: void 0,
      // the shop's plinths
      zone: null,
      // built-up vs natural, per terrain pixel (floor 1)
      rooms: [],
      // the perk room and the heart room
      sconces: [],
      // wall torches: by the portals and the prizes
      levelSeed: 0,
      levelOwned: [],
      // what made this cave, for the autosave
      roster: [],
      themeName: "",
      // this floor's creatures, and its palette
      total: void 0,
      // how many creatures the floor started with
      miniEdgeIdx: [],
      // the map's wall-outline cells
      matterProps: [],
      // the dark matter props (their hum)
      ambKinds: [],
      // the theme's ambience particle kinds
      plantW: 255,
      // the jellies' plant glow: this floor's white point
      // ---- what's in it: new lists from each floor (and swapped for the recorded ones while
      // the death replay draws a frame) ----
      enemies: void 0,
      // the creatures, nests included
      pickups: void 0,
      // loot on the ground: mods, guns, hearts
      props: [],
      // the decoration that does things (see DECOR): plants, lamps, carts…
      // ---- the fog of war ----
      seen: fogStart(),
      // per fog cell: 0 never been, 1 been (draw() lifts it), 2 never fogged (the shop)
      deepFog: null,
      // the fog cells over the rat nests' rooms (no soft edge there)
      // ---- fire (v86, see fireStep): what's alight in the cave, the plants and carts it can
      // take, the burning pixels on view this frame (for the glow after the fog), its crackle ----
      fire: fireNew(new Uint8Array(CW * CH)),
      firePlants: [],
      fireArches: [],
      fireCarts: [],
      // what can burn (fireList, rebuilt when the props change)
      firePropN: -1,
      firePropLast: null,
      // how fireList notices the props changed
      fireLoop: null,
      // the crackle, at the nearest blaze
      fireN: 0,
      // burning pixels on view (the glow's strength)
      fireVis: [],
      // and which ones, for the glow after the fog
      // ---- the run's lists: kept for the whole run, emptied by enterLevel (not fields, beams,
      // toasts), and never replaced: the recorder's RP_ARR holds them by reference ----
      bullets: [],
      enemyShots: [],
      // your shots, and the creatures'
      fields: [],
      beams: [],
      // static projectiles, and instant beam streaks
      arcs: [],
      // lightning forks: jagged lines that flash and fade
      coins: [],
      toasts: [],
      // the messages at the bottom of the view
      smoke: [],
      sparks: [],
      flashes: [],
      torchP: [],
      // the embers the torch throws off
      // soft magic particles: the Black Hole's trail ('drift'), motes sucked into the exit
      // portal ('in') and motes wafting out of the arrival portal ('out')
      motes: [],
      burns: [],
      // the fire trail (Levitation Trail), if owned
      // the spiders' silk: webs are the lines they travel on (they stay), silk the strings in
      // flight at you, strings the ones stuck to you (each slows you; pull one too long, it snaps)
      webs: [],
      silk: [],
      strings: [],
      // the decoration's particles (glow dots, drips, embers), the theme's ambience, spore
      // clouds, noise rings and dust devils
      dparts: [],
      amb: [],
      clouds: [],
      rings: [],
      devils: [],
      // ---- frame-to-frame counters and sound loops (each kept by the one part of step() that
      // uses it) ----
      // sound: the jetpack's roar, each live Black Hole's drone, the low-health heartbeat,
      // the exit portal's hum and the dark matter's
      jetLoop: null,
      beatT: 0,
      wasEmpty: false,
      jetSt: { cut: 0, onT: 0, start: false },
      // the jet's cough clock and how long it's been held
      bhLoops: /* @__PURE__ */ new Map(),
      portalLoop: null,
      matterLoop: null,
      wasJet: false,
      stepT: 0,
      lastNear: "",
      // the footstep clock; what you were last standing by
      portalAcc: 0,
      // the exit portal's motes, spawned by the clock
      // the hand torch's flame lean velocity (a sprung offset dragged opposite to how you move,
      // the same way the jet flame swings), and the torch's flicker and ember clocks
      leanVX: 0,
      leanVY: 0,
      flickN: 0,
      torchT: 0,
      torchAcc: 0,
      smokeAcc: 0,
      // the jetpack's smoke
      webCheck: 0,
      // which web line step() checks this frame (a few per frame)
      webLetGo: 0,
      // pushed off a web or arch: don't grab one again yet
      // decorStep: the plants you're brushing (and last frame's), the rustle pause, its frame
      // count, the drip-damage clock
      plantsNow: /* @__PURE__ */ new Set(),
      plantsLast: /* @__PURE__ */ new Set(),
      rustle: { t: 0 },
      decoFrame: 0,
      dripHurt: 0,
      oreBank: 0,
      // the loose change from gold seams dug out
      navYou: {}
      // the shared way-to-you field the hunting rats follow (see navFor)
    };

      loadout: saved ? saved.loadout : {
        guns: startingGuns(),
        bag: [],
        sel: 0,
        gold: START_GOLD,
        debug: false,
        perks: [],
        suit: Array(SUIT_LEN).fill(null),
        maxBonus: 0,
        usedLives: 0
      },
      saved,
      // handed to Game once, to rebuild the floor
      paused: false,
      notify: () => {
      },
      inShop: true,
      prompt: null,
      interact: false,
      sig: "",
      found: null,
      // a gun on the ground, waiting on the swap chooser
      confirmAct: null,
      confirmAim: null,
      // legacy hooks still read (harmlessly) by Stick
      pendingToast: null,
      // raised while paused, shown by the loop when it resumes
      collection: loadCollection(),
      // the mods unlocked, across runs
      perkCollection: loadPerkCollection(),
      // and the perks
      shopOpen: null,
      menuTap: null,
      dispense: null,
      keys: { w: false, a: false, s: false, d: false },
      mouse: { x: 0, y: 0, inside: false, down: false }
    });
    const [size, setSize] = useState(150);
    const [vw, setVw] = useState(window.innerWidth);
    const [mapOpen, setMapOpen] = useState(false);
    const ctlRef = useRef(null);
    const sticksRef = useRef(null);
    const [run, setRun] = useState(0);
    const [edit, setEdit] = useState(false);
    const [devOpen, setDevOpen] = useState(false);
    const [spawnOpen, setSpawnOpen] = useState(false);
    const [witnessOpen, setWitnessOpen] = useState(false);
    const [gunInfo, setGunInfo] = useState(-1);
    const [held, setHeld] = useState(-1);
    const [perkInfo, setPerkInfo] = useState(-1);
    const [confirmAt, setConfirmAt] = useState(null);
    const [, bump] = useState(0);
    const refresh = () => bump((n) => n + 1);
    input.current.notify = refresh;
    const found = input.current.found;
    input.current.mapOpen = mapOpen;
    const shopOpen = input.current.shopOpen;
    input.current.paused = edit || !!found || devOpen || spawnOpen || mapOpen || witnessOpen || perkInfo >= 0 || !!shopOpen;
    const closeShop = () => {
      input.current.shopOpen = null;
      input.current.sig = "";
      refresh();
    };
    const LO = input.current.loadout;
    const select = (i) => {
      const L2 = input.current.loadout;
      if (L2.guns[i]) {
        if (L2.sel !== i) SFX.fx("switch");
        L2.sel = i;
        refresh();
      }
    };
    const restart = () => {
      clearSave();
      input.current.saved = null;
      input.current.loadout = {
        guns: startingGuns(),
        bag: [],
        sel: 0,
        gold: START_GOLD,
        debug: false,
        perks: [],
        suit: Array(SUIT_LEN).fill(null),
        maxBonus: 0,
        usedLives: 0
      };
      input.current.sig = "";
      input.current.found = null;
      input.current.shopOpen = null;
      input.current.witness = null;
      input.current.replay = null;
      setWitnessOpen(false);
      setGunInfo(-1);
      setPerkInfo(-1);
      setEdit(false);
      setRun((r) => r + 1);
    };
    input.current.requestRestart = restart;
    useEffect(() => {
      const fit = () => {
        setSize(Math.max(80, Math.floor(Math.min((window.innerWidth - 28) / 2, window.innerHeight * 0.28))));
        setVw(window.innerWidth);
      };
      fit();
      window.addEventListener("resize", fit);
      const ro = new ResizeObserver(() => {
        if (ctlRef.current) input.current.ctlH = ctlRef.current.getBoundingClientRect().height;
      });
      if (ctlRef.current) {
        ro.observe(ctlRef.current);
        input.current.ctlH = ctlRef.current.getBoundingClientRect().height;
      }
      return () => {
        window.removeEventListener("resize", fit);
        ro.disconnect();
      };
    }, []);
    useEffect(() => {
      const stop = (e) => {
        if (!e.target.closest || !e.target.closest(".scroll")) e.preventDefault();
      };
      const grab = () => {
        try {
          window.focus();
        } catch (_) {
        }
        SFX.unlock();
      };
      grab();
      document.addEventListener("pointerdown", grab, true);
      document.addEventListener("contextmenu", stop);
      document.addEventListener("touchmove", stop, { passive: false });
      const map = { w: "w", arrowup: "w", " ": "w", a: "a", arrowleft: "a", s: "s", arrowdown: "s", d: "d", arrowright: "d" };
      const key = (down) => (e) => {
        const t = e.target;
        if (t && /^(input|textarea|select)$/i.test(t.tagName)) return;
        const k = e.key.toLowerCase();
        if (map[k]) {
          input.current.keys[map[k]] = down;
          e.preventDefault();
        }
        if (!down) return;
        SFX.unlock();
        if (k >= "1" && k <= "4") select(Number(k) - 1);
        if (k === "e" || k === "tab") {
          e.preventDefault();
          if (input.current.inShop || perkBag(activePerks(input.current.loadout)).tinker) setEdit((v) => !v);
        }
        if ((k === "r" || k === "f" || k === "enter") && input.current.menuTap) {
          input.current.menuTap();
          return;
        }
        if (k === "r" && input.current.perkTap) input.current.perkTap();
        if (k === "f") input.current.interact = true;
        if (k === "m") setMapOpen((v) => !v);
        if (k === "escape") {
          setEdit(false);
          if (input.current.shopOpen) {
            input.current.shopOpen = null;
            input.current.sig = "";
            refresh();
          }
        }
      };
      const kd = key(true), ku = key(false);
      const blur = () => {
        Object.keys(input.current.keys).forEach((k) => {
          input.current.keys[k] = false;
        });
        input.current.mouse.down = false;
      };
      window.addEventListener("keydown", kd);
      window.addEventListener("keyup", ku);
      window.addEventListener("blur", blur);
      return () => {
        document.removeEventListener("pointerdown", grab, true);
        document.removeEventListener("contextmenu", stop);
        document.removeEventListener("touchmove", stop);
        window.removeEventListener("keydown", kd);
        window.removeEventListener("keyup", ku);
        window.removeEventListener("blur", blur);
      };
    }, []);
    const prompt = input.current.prompt;
    const inShop = input.current.inShop;
    const perkB = perkBag(activePerks(LO));
    const canEdit = inShop || perkB.tinker;
    const heldGun = input.current.loadout.guns[input.current.loadout.sel];
    const fitted = activePerks(LO);
    input.current.perkTap = null;
    const deck = deckLayout(vw, size, LO.guns.length);
    const btnAt = (pt) => ({
      width: deck.btn,
      height: deck.btn,
      left: Math.round(pt.x - deck.btn / 2),
      top: Math.round(pt.y - deck.btn / 2)
    });
    const sticksTop = sticksRef.current ? sticksRef.current.getBoundingClientRect().top : window.innerHeight - (input.current.ctlH || 0);
    const perkRoom = sticksTop + deck.map.y - deck.btn / 2 - 8 - PERK_TOP;
    const perkPer = Math.max(1, Math.floor((perkRoom + PERK_GAP) / (PERK_PIP + PERK_GAP)));
    const perkColH = perkPer * (PERK_PIP + PERK_GAP) - PERK_GAP;
    const witness = input.current.witness;
    const openWitness = () => {
      input.current.replay = { t: witness.t0, speed: 1, playing: true, loop: true, fog: true, follow: true, zoom: 1, cx: 0, cy: 0, unit: 1 };
      setWitnessOpen(true);
    };
    const closeWitness = () => {
      input.current.replay = null;
      setWitnessOpen(false);
    };
    return h(
      "div",
      { className: "app" + (witnessOpen ? " witnessing" : "") },
      h(
        "div",
        { className: "view" },
        h(Game, { key: run, input }),
        witness && !witnessOpen ? h("button", {
          className: "witnessbtn",
          onPointerDown: (e) => {
            e.preventDefault();
            openWitness();
          }
        }, "WITNESS YOURSELF") : null,
        witnessOpen && witness ? h(Witness, { input, close: closeWitness }) : null,
        // The item's card and its buy/take line are one panel now, grown up from the
        // bottom: the info you're reading and the price you're paying sit together.
        // The panel is pointer-events:none so a tap still reaches the sticks underneath;
        // buying and taking a mod is a tap on the right stick's dead zone (or the f key),
        // taken straight. A gun on the ground opens the swap chooser instead, so the panel
        // hides while that is up (the game pauses behind it).
        prompt && !found && !shopOpen ? h(
          "div",
          {
            className: "buypanel",
            style: {
              bottom: (input.current.promptBottom || 12) + "px",
              maxHeight: "calc(100% - " + ((input.current.promptBottom || 12) + 12) + "px)"
            }
          },
          prompt.id ? h(ModCard, { id: prompt.id, ingame: true }) : null,
          prompt.perk ? h(PerkCard, { id: prompt.perk, ingame: true }) : null,
          prompt.crystal || prompt.green ? h(
            "div",
            { className: "pop scroll ingame crystalcard" },
            h(
              "div",
              { className: "phead" },
              h("div", { className: "pglyph" }, h(CrystalIcon, { size: 28, green: !!prompt.green })),
              h(
                "div",
                { className: "ptitle" },
                h("b", null, prompt.green ? "Green crystal" : "Red crystal"),
                h("span", null, prompt.green ? "Unlocks a perk at the shop" : "From floor " + prompt.crystal + " · unlocks a mod, or boosts a gun reroll, at the shop")
              )
            )
          ) : null,
          prompt.gun ? h(GunCard, {
            gun: prompt.gun,
            label: prompt.found ? "Found" : "For sale",
            ingame: true,
            compare: heldGun,
            compareName: heldGun ? heldGun.name : ""
          }) : null,
          // shop stock is "Buy <price>"; anything you pick up for free is just "Take" —
          // the card above already names it, so a nameless item (the heal) shows its name here.
          h(
            "div",
            {
              className: "pbuy" + (prompt.can ? "" : " cant"),
              "aria-label": "Tap the right stick to " + (prompt.price ? "buy for " + prompt.price + "g" : "take")
            },
            h(RKey),
            h("b", null, prompt.price ? prompt.price + "g" : prompt.id || prompt.gun || prompt.perk || prompt.heart || prompt.crystal || prompt.green ? "free" : prompt.text)
          )
        ) : null,
        // one gear in the top-right opens the Dev panel; Restart now lives inside it.
        // gold, top centre: "g" not "gold", truncated to k/M/B (1234 -> 1.2k). Under it in red, what
        // you owe the company for the level you're on, in full (64,000,000,000), and the time left to settle it
        h(
          "div",
          { className: "gold" },
          h("div", { className: "purse" }, fmtGold(LO.gold), h("span", null, "g")),
          h(CrystalRow, { red: (LO.crystals || []).length, green: (LO.greens || []).length }),
          LO.debt > 0 ? h("div", { className: "debt" }, "-" + Math.trunc(LO.debt).toLocaleString("en-US"), h("span", null, "g owed")) : null,
          LO.debt > 0 && LO.due ? h(DueClock, { due: LO.due }) : null
        ),
        h("button", {
          className: "devbtn",
          title: "Dev tools",
          onPointerDown: (e) => {
            e.preventDefault();
            setDevOpen(true);
          }
        }, "⚙️"),
        confirmAt != null ? h(
          "div",
          { className: "confirm" },
          h("div", { className: "shade", onPointerDown: (e) => {
            e.preventDefault();
            setConfirmAt(null);
          } }),
          h(
            "div",
            { className: "confirmCard" },
            h("p", null, "Restart the run? You’ll lose your guns and mods."),
            h(
              "div",
              { className: "confirmRow" },
              h("button", {
                className: "cancel",
                onPointerDown: (e) => {
                  e.preventDefault();
                  setConfirmAt(null);
                }
              }, "Cancel"),
              h("button", {
                className: "go",
                onPointerDown: (e) => {
                  e.preventDefault();
                  if (performance.now() - confirmAt < 400) return;
                  setConfirmAt(null);
                  restart();
                }
              }, "Yes, restart")
            )
          )
        ) : null
      ),
      h(
        "div",
        { className: "controls", ref: ctlRef },
        h(
          "div",
          { className: "sticks", ref: sticksRef },
          h(Stick, { size, kind: "left", input, refresh }),
          h(Stick, { size, kind: "right", input, refresh }),
          // the gun buttons ride an arc round the right stick; tap to hold it, hold for its card
          h(
            "div",
            { className: "slots" },
            LO.guns.map((g, i) => h("button", {
              key: i,
              className: "dbtn slot" + (g ? "" : " empty") + (i === LO.sel ? " on" : "") + (held === i ? " holding" : ""),
              style: btnAt(deck.guns[i]),
              title: g ? g.name + " — hold for details" : "Empty slot",
              onPointerDown: holdPress(
                () => select(i),
                () => {
                  if (input.current.loadout.guns[i]) setGunInfo(i);
                },
                (on) => setHeld(on ? i : -1)
              )
            }, g ? h(GunIcon, { gun: g }) : null))
          ),
          // the bag mirrors the last gun on the left, and the map toggle sits right above it
          h(
            "button",
            {
              className: "dbtn weapon" + (canEdit ? "" : " locked"),
              style: btnAt(deck.bag),
              title: canEdit ? "Bag: guns & mods" : "Bag: guns & mods (edit in the shop or with Tinker)",
              "aria-label": "Bag",
              onPointerDown: (e) => {
                e.preventDefault();
                setMapOpen(false);
                setEdit(true);
              }
            },
            h("span", { className: "emo" }, "🎒"),
            LO.bag.length ? h("b", { className: "badge" }, LO.bag.length) : null
          ),
          h(
            "button",
            {
              className: "dbtn mapbtn" + (mapOpen ? " on" : ""),
              style: btnAt(deck.map),
              title: "Map",
              "aria-label": "Map",
              onPointerDown: (e) => {
                e.preventDefault();
                setMapOpen((v) => !v);
              }
            },
            h("span", { className: "emo" }, "🗺️")
          ),
          // the perks you carry: a column going up from above the map, wrapping into a new
          // column further in. Tap one for its card
          fitted.length ? h(
            "div",
            { className: "perkcol", style: {
              left: Math.round(deck.map.x - PERK_PIP / 2),
              top: Math.round(deck.map.y - deck.btn / 2 - 8 - perkColH),
              height: perkColH
            } },
            fitted.map((id, i) => PERKS[id] ? h(
              "button",
              {
                key: i,
                "data-i": i,
                className: "perkpip" + (perkInfo === i ? " sel" : ""),
                title: PERKS[id].name,
                style: { color: PERKS[id].tint },
                onPointerDown: (e) => {
                  e.preventDefault();
                  setMapOpen(false);
                  setPerkInfo(i);
                }
              },
              PERKS[id].glyph
            ) : null)
          ) : null
        )
      ),
      edit ? h(Bag, { input, refresh, canEdit, close: () => setEdit(false) }) : null,
      devOpen ? h(DevPanel, {
        input,
        refresh,
        close: () => setDevOpen(false),
        onRestart: () => {
          setDevOpen(false);
          setConfirmAt(performance.now());
        },
        onSpawnGun: () => {
          setDevOpen(false);
          setSpawnOpen(true);
        }
      }) : null,
      spawnOpen ? h(SpawnGun, { input, close: () => setSpawnOpen(false) }) : null,
      shopOpen && SHOP_MENUS[shopOpen] ? h(SHOP_MENUS[shopOpen], { key: shopOpen, input, close: closeShop }) : null,
      found ? h(GunSwap, { input, refresh, onDone: () => {
        setGunInfo(-1);
        refresh();
      } }) : null,
      perkInfo >= 0 && PERKS[fitted[perkInfo]] ? h(
        "div",
        null,
        // the shade stops above the controls, so the right stick can still be tapped
        h("div", {
          className: "shade",
          style: { bottom: (input.current.ctlH || 0) + "px" },
          onPointerDown: (e) => {
            e.preventDefault();
            const pip = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.classList.contains("perkpip"));
            setPerkInfo(pip ? Number(pip.getAttribute("data-i")) : -1);
          }
        }),
        h(
          "div",
          { className: "perkinfo" },
          h(PerkCard, { id: fitted[perkInfo], ingame: true }),
          h("p", { className: "perkhint" }, "Fitted to your Exo Suit: change it in the Bag")
        )
      ) : null,
      gunInfo >= 0 && LO.guns[gunInfo] ? h(
        "div",
        null,
        h("div", { className: "shade", onPointerDown: (e) => {
          e.preventDefault();
          setGunInfo(-1);
        } }),
        h(GunCard, {
          gun: LO.guns[gunInfo],
          label: "Slot " + (gunInfo + 1),
          onClose: () => setGunInfo(-1)
        })
      ) : null
    );
  }

  // src/main.js
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
