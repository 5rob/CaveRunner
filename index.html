<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CaveRunner v44</title>
<style>
:root{
  --bg:#cfdbe4; --text:#1c2a38; --muted:rgba(28,42,56,0.55);
  --pad:rgba(28,42,56,0.07); --ring:rgba(28,42,56,0.25);
  --line:rgba(28,42,56,0.3); --knob:#1c2a38; --jet:rgba(255,138,31,0.18);
  --btn:#e3ebf1;
  --good:#1d8a52; --bad:#c2401f;
  /* per-gun name colour: hue varies per gun (see gunColor), s/l fixed so every
     hue clears an accessible contrast floor against this theme's backgrounds */
  --gun-s:65%; --gun-l:22%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
    --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
    --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
    --btn:#1a2633;
    --good:#5fd39a; --bad:#ff8a6a;
    --gun-s:65%; --gun-l:72%;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
  --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
  --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
  --btn:#1a2633;
  --good:#5fd39a; --bad:#ff8a6a;
  --gun-s:65%; --gun-l:72%;
}
/* ---- the control deck's own palette ----
   The sticks and the toolbar are a black arcade panel, in both light and dark, so they
   get their own variables rather than borrowing the sheet's. Amber is the live colour:
   the selected slot, the dead-zone ring, the button you are pointing at. */
:root{
  --ctl-bg:#0a0a0c; --ctl-face:#151519; --ctl-edge:#000;
  --ctl-line:#33333d; --ctl-fg:#eae7de; --ctl-dim:#8b8b96; --ctl-hot:#ffb02e;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{height:100%}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#12141a}
.game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:none}
.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;position:relative;
  padding:5px 0 calc(10px + env(safe-area-inset-bottom));background:var(--ctl-bg);
  color:var(--ctl-fg);border-top:2px solid var(--ctl-edge);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)}
/* a scanline wash over the panel, the way a cabinet bezel reads up close */
.controls::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,0.04) 0 1px,rgba(0,0,0,0) 1px 3px)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 8px;height:36px}
.sticks{display:flex;justify-content:space-evenly;position:relative;z-index:3}
/* the perks you have found, a row of glyphs above the thumbsticks */
.perkrow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;
  min-height:26px;padding:0 8px;position:relative;z-index:3}
.perkpip{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:14px;line-height:1;box-sizing:border-box;
  border:1.5px solid currentColor;background:rgba(255,255,255,0.05)}
.slots{display:flex;gap:6px}
.slot{position:relative;box-sizing:border-box;width:46px;height:36px;border-radius:3px;
  border:2px solid var(--ctl-line);background:var(--ctl-face);color:var(--ctl-fg);
  padding:0;touch-action:none;cursor:pointer}
.slot.on{border-color:var(--ctl-hot);box-shadow:0 0 0 1px var(--ctl-hot),0 0 14px rgba(255,176,46,0.3)}
.slot.empty{opacity:.35;cursor:default}
.num{position:absolute;top:2px;left:5px;font:600 10px ui-monospace,monospace;color:var(--ctl-dim)}
.ico{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)}
.ico.gun{width:18px;height:5px;border-radius:1px;background:var(--ctl-hot)}
.ico.grenade{width:12px;height:12px;border-radius:2px;background:#7fbf4a}
/* No overflow:hidden here, deliberately: a knob this size is wider than the gap
   between the middle and the rim, so clipping to the rim would take a bite out of it
   at full deflection. The decorations get their own clip layer instead (see .stickclip)
   so the wash and the centre line still stop at the circle. */
.stick{position:relative;flex:none;box-sizing:border-box;border-radius:50%;
  touch-action:none;
  background:radial-gradient(circle at 50% 40%,#1d1d23 0%,#0c0c0f 74%);
  border:3px solid var(--ctl-edge);box-shadow:0 0 0 2px var(--ctl-line),inset 0 0 16px rgba(0,0,0,0.9)}
.stickclip{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.hline{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.09)}
.jetzone{position:absolute;left:0;right:0;top:0;height:50%;background:rgba(255,176,46,0.16);opacity:0;transition:opacity .1s}
.jetting .jetzone{opacity:1}
/* the amber ring is the line the knob's edge has to cross before the gun fires. Dotted,
   so it reads as a threshold rather than a solid boundary. */
.deadzone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px dotted rgba(255,176,46,0.85);pointer-events:none}
/* the knob is the thing under your thumb, so it is sized to still show an edge around
   a thumbprint rather than disappearing underneath one. Its size comes from KNOB, and
   the dead-zone ring is built from the same number — see AIM_RING. */
/* a white ring with a black fill. Its stroke is 1.5x the deadzone ring's 1.5px line,
   so the knob reads as the boldest circle on the stick. */
.knob{position:absolute;left:50%;top:50%;box-sizing:border-box;border-radius:50%;
  background:#000;
  border:2.25px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,0.75);
  opacity:.95;pointer-events:none}
.lbl{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;
  font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ctl-dim)}
.lbl.top{top:12%}
.lbl.bot{bottom:12%}
.weapon{box-sizing:border-box;height:36px;padding:0 14px;border-radius:3px;cursor:pointer;
  border:2px solid var(--ctl-line);background:var(--ctl-face);color:var(--ctl-fg);
  font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;touch-action:none}
.wicon{width:10px;height:10px;border-radius:1px;background:var(--ctl-hot)}
.slots{flex:1 1 auto;min-width:0}
.slot{flex:1 1 0;width:auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:1px;overflow:hidden}
.gname{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ctl-fg);max-width:100%;
  padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ctl-dim)}
.badge{margin-left:2px;font-size:11px;opacity:.7}

/* ---- a mod on the ground: read it, then pick it up or leave it ----
   pointer-events:none across the overlay on purpose: the right stick has to stay live
   underneath it, because dragging the stick at a button is how you choose. Only the
   card and the two buttons take touches back. ModFound also stops the overlay short of
   the control deck, so the stick you are being asked to drag is not sat in shadow. */
.modfound{position:fixed;top:0;left:0;right:0;bottom:0;z-index:29;display:flex;
  flex-direction:column;justify-content:center;
  gap:12px;background:rgba(6,6,8,0.88);pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top)) 12px 14px}
/* the standing-on-a-plinth card, sat in the middle of the overlay instead of pinned
   to the top of the view */
.modfound .pop.ingame{position:static;left:auto;right:auto;top:auto;width:100%;max-width:340px;
  align-self:center;max-height:calc(100% - 108px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  pointer-events:auto;background:rgba(16,17,22,0.98);border-color:rgba(255,255,255,0.16)}
.modfoundrow{display:flex;gap:10px;width:100%;max-width:340px;align-self:center;flex:0 0 auto}
.modfoundbtn{flex:1 1 0;height:54px;border-radius:3px;border:2px solid var(--ctl-line);
  background:var(--ctl-face);color:var(--ctl-fg);touch-action:none;pointer-events:auto;
  font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
/* neither button is lit until the stick is past the trigger line and pointing at one:
   the card must not look like it has already chosen for you */
.modfoundbtn.hot{border-color:var(--ctl-hot);color:var(--ctl-hot);
  box-shadow:0 0 16px rgba(255,176,46,0.25)}
.modfoundhint{margin:0;text-align:center;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.06em;color:var(--ctl-dim)}

/* ---- mod sheet ---- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;padding:0 12px calc(12px + env(safe-area-inset-bottom));
  padding-top:calc(10px + env(safe-area-inset-top))}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 8px}
.shead h2{margin:0;font-size:17px}
.done{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--ring);
  background:var(--btn);color:var(--text);font:600 14px system-ui,sans-serif}
.gtabs{display:flex;gap:6px;margin-bottom:8px}
.gtab{flex:1 1 0;min-width:0;height:44px;border-radius:9px;border:1px solid var(--ring);
  background:var(--btn);color:var(--text);padding:0 4px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:1px;overflow:hidden}
.gtab.on{border:2px solid #ff8a1f}
.gtab.lifted{opacity:.35}
.gtab.target{border:2px dashed #ff8a1f}
.gghost{position:fixed;z-index:30;transform:translate(-50%,-50%);pointer-events:none;
  padding:7px 12px;border-radius:9px;border:2px solid #ff8a1f;background:var(--btn);
  color:var(--text);font:600 12px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.gtab.empty{opacity:.4}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.st{background:var(--pad);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--muted);
  display:flex;gap:5px;align-items:baseline}
.st b{font-size:12px;color:var(--text)}
.lab{font-size:11px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.06em}
.advice{margin:0 0 9px}
.diag{display:flex;align-items:baseline;gap:7px;font-size:11.5px;color:var(--muted);
  border-left:3px solid var(--ring);padding:2px 0 2px 8px}
.diag b{font:700 13px system-ui,sans-serif;color:var(--text)}
.diag.rech{border-left-color:var(--bad)}
.diag.mana{border-left-color:#63c8ff}
.diag.blood{border-left-color:#c2401f}
.diag.cast{border-left-color:#ff9e3d}
.diag.none{border-left-color:var(--muted)}
.tips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tip{display:flex;align-items:center;gap:6px;border:1px solid var(--ring);background:var(--pad);
  color:var(--text);border-radius:8px;padding:5px 9px;font:500 11px system-ui,sans-serif;
  touch-action:none}
.tip b{color:var(--good);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:3px 8px;margin:0 0 7px}
.lg{display:flex;align-items:center;gap:4px;font:500 9.5px system-ui,sans-serif;color:var(--muted)}
.lg i{width:8px;height:8px;border-radius:2px;display:block}
.slotRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:flex-start}
.grp{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.gtiles{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border:1.5px solid var(--ring);border-radius:12px;
  background:var(--pad);min-width:0;max-width:100%;box-sizing:border-box}
.glab{font:600 9px system-ui,sans-serif;color:var(--muted);padding-left:6px;
  text-transform:uppercase;letter-spacing:.04em}
.gfx{display:flex;flex-wrap:wrap;gap:3px 4px;padding:2px 4px 0;max-width:100%}
.fx{display:flex;align-items:baseline;gap:3px;font:500 9.5px system-ui,sans-serif;
  color:var(--muted);background:var(--pad);border-radius:5px;padding:1px 5px}
.fx i{font-style:normal}
.fx b{color:var(--text);font-size:10px;font-variant-numeric:tabular-nums}
.fx u{text-decoration:none;font-weight:700;font-size:9.5px}
.fx.up u{color:var(--good)}
.fx.down u{color:var(--bad)}
.grp.cold .gtiles{border-style:dashed;border-color:var(--pad);background:transparent;opacity:.6}
.bagHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bagHead .lab{margin:0}
.sortBag{flex:0 0 auto;height:22px;padding:0 10px;border-radius:11px;border:1px solid var(--ring);
  background:var(--pad);color:var(--muted);font:700 10px system-ui,sans-serif;letter-spacing:.06em}
.bag{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow-y:auto;
  flex:1 1 0;min-height:70px;border-radius:9px;background:var(--pad);padding:6px;
  scroll-padding-bottom:12px;margin-top:5px}
.tile{width:60px;height:56px;border-radius:9px;border:1px solid var(--ring);background:var(--btn);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;cursor:grab;overflow:hidden;flex:0 0 auto}
.tile.hole{border-style:dashed;opacity:.5;cursor:default}
.tile.shot{box-shadow:inset 0 0 0 2px currentColor}
.tg{font-size:17px;line-height:1}
.tn{font:500 8.5px system-ui,sans-serif;color:var(--muted);text-align:center;line-height:1.1;
  max-width:100%;padding:0 2px}
.ghost{position:fixed;z-index:30;width:60px;height:56px;border-radius:9px;border:2px solid;
  background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:20px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
.info{min-height:30px;font-size:12px;color:var(--muted);padding:7px 2px 0}
.info b{color:var(--text)}

/* ---- mod detail card ---- */
.shade{position:fixed;inset:0;z-index:27;background:rgba(0,0,0,0.42)}
.pop{position:fixed;z-index:28;box-sizing:border-box;left:10px;right:10px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  max-height:34%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--btn);border:1px solid var(--ring);
  border-radius:15px;padding:12px 13px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.35)}
.pop.top{top:calc(10px + env(safe-area-inset-top));bottom:auto;
  max-height:min(62%, calc(100vh - 320px))}   /* stays clear of the mod bag below */
.pop.ingame{position:absolute;top:8px;left:8px;right:8px;bottom:auto;z-index:5;
  max-height:calc(100% - 134px);        /* always clears the Buy button below it */
  overflow:hidden;padding:11px 12px 16px;
  pointer-events:none;background:rgba(18,20,26,0.93);border-color:rgba(255,255,255,0.18);color:#e9ecf2;
  /* this card is always dark regardless of site theme, so force the dark-bg gun colour */
  --gun-l:72%}
.pop.ingame .pinfo{margin-top:7px;font-size:12.5px}
.pop.ingame .pnote{display:none}
.pop.ingame .prows{margin-top:6px}
.pop.ingame .prow{padding:1.5px 2px;font-size:11px}
.pop.ingame .prow b{font-size:11.5px}
.pop.ingame .pglyph{width:36px;height:36px;font-size:17px}
.pop.ingame .ptitle b{font-size:15px}
.pop.ingame .pdemo{margin-top:6px;padding-top:6px;gap:6px}
.pop.ingame .dnote{font-size:10.5px;margin-top:2px}
.pop.ingame .dtile{padding:1px 5px}
.pop.ingame .ptitle span,.pop.ingame .dnote,.pop.ingame .prow{color:rgba(233,236,242,0.62)}
.pop.ingame .prow,.pop.ingame .pglyph{background:rgba(255,255,255,0.07)}
.pop.ingame .prow b,.pop.ingame .dtile i{color:#e9ecf2}
.pop.ingame .pdemo{border-top-color:rgba(255,255,255,0.18)}
.phead{display:flex;align-items:center;gap:10px}
.pglyph{width:42px;height:42px;flex:0 0 auto;border:2px solid;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.ptitle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.ptitle b{font-size:16px}
.ptitle span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pclose{flex:0 0 auto;width:34px;height:34px;border-radius:17px;border:1px solid var(--ring);
  background:var(--pad);color:var(--text);font-size:19px;line-height:1;padding:0}
.pinfo{margin:9px 0 0;font-size:13px}
.pnote{margin:7px 0 0;font-size:11.5px;line-height:1.45;color:var(--muted);
  border-left:2px solid var(--ring);padding-left:8px}
.prows{display:flex;flex-direction:column;margin-top:9px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;color:var(--muted);padding:4px 2px;border-bottom:1px solid var(--pad)}
.prow:last-child{border-bottom:0}
.prow b{font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.prow.up b{color:var(--good)}
.prow.down b{color:var(--bad)}
.prow.up b::after{content:' \25b2';font-size:8px}
.prow.down b::after{content:' \25bc';font-size:8px}
.vs{margin:8px 0 0;font-size:11px;color:var(--muted)}
.gtab.base{box-shadow:inset 0 0 0 2px var(--ring)}
.pdemo{margin-top:11px;border-top:1px solid var(--ring);padding-top:9px;
  display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:flex-start;gap:8px}
.dmark{flex:0 0 auto;width:18px;font-size:14px;font-weight:700;line-height:20px;text-align:center}
.dmark.yes{color:#3aa76d}
.dmark.no{color:#d5563a}
.dtiles{display:flex;gap:4px;flex-wrap:wrap}
.dtile{border:1px solid;border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:4px}
.dtile b{font-size:12px;line-height:1}
.dtile i{font-style:normal;font:600 10px system-ui,sans-serif;color:var(--text);opacity:.8}
.dtile.off{opacity:.42}
.dnote{display:block;font-size:11px;color:var(--muted);margin-top:3px}
/* the shop/pickup panel: the item's card and its buy/take line in one box, grown up
   from the bottom of the view. pointer-events:none so a tap falls through to the sticks —
   buying is a tap on the right stick's dead zone. */
.buypanel{position:absolute;left:25%;right:25%;bottom:12px;z-index:5;box-sizing:border-box;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;
  max-height:calc(100% - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(18,20,26,0.93);border:1px solid rgba(255,255,255,0.18);border-radius:15px;
  padding:11px 12px 13px;color:#e9ecf2;box-shadow:0 12px 40px rgba(0,0,0,0.35);
  /* the card inside is always dark regardless of site theme, so force the dark-bg gun colour */
  --gun-l:72%}
/* the card sits inline inside the panel: strip its own frame and let the panel be the box */
.buypanel .pop{position:static;top:auto;left:auto;right:auto;bottom:auto;width:auto;
  background:none;border:0;box-shadow:none;padding:0;margin:0;max-height:none;overflow:visible}
/* a long stat list (a loaded gun, a busy mod) gets its own small scroll box so the panel
   stays short — pointer-events back on just here so you can flick through it; the rest of
   the panel stays click-through */
.buypanel .prows{max-height:156px;overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto}
/* the buy/take line: the amber price is the thing your eye goes to */
.pbuy{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;
  height:40px;border-radius:20px;border:2px solid #ffc93c;background:rgba(255,201,60,0.1);
  color:#fff;font:700 14px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.pbuy b{color:#ffc93c;font-size:15px;text-transform:none}
.pbuy.cant{border-color:rgba(255,255,255,0.25);background:none;opacity:.55}
.weapon.locked{opacity:.45}
.pop.flow{position:static;max-height:none;box-shadow:none;margin-bottom:2px}
.spacer{flex:1 1 auto;min-height:6px}
/* gun pickup: the two cards share what is left over. Head and mod row are fixed,
   only the stat chips give way, so neither gun's mods can fall off the bottom. */
.swapsheet{gap:6px}
.pop.split{display:flex;flex-direction:column;flex:0 1 auto;min-height:0;overflow:hidden;
  padding:9px 11px 10px;margin-bottom:0}
.pop.split .phead{flex:0 0 auto}
.pop.split .pglyph{width:32px;height:32px;font-size:16px;border-radius:9px}
.pop.split .ptitle b{font-size:14.5px}
.pop.split .ptitle span{font-size:10px}
.pop.split .vs{flex:0 0 auto;margin:5px 0 0}
.pop.split .gstats{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:7px 0 0;gap:4px}
.pop.split .gstats .st{padding:2px 7px;font-size:10px}
.pop.split .gstats .st b{font-size:11px}
.pop.split .st.up b{color:var(--good)}
.pop.split .st.down b{color:var(--bad)}
.pop.split .pdemo{flex:0 0 auto;margin-top:7px;padding-top:7px;gap:6px}
.pop.split .dtile{padding:1px 5px}
.pop.split .dtile b{font-size:11px}
.pop.split .dtile i{font-size:9.5px}
.pop.split .dnote{font-size:10px;margin-top:2px}
.swapsheet>.shead,.swapsheet>.lab{flex:0 0 auto}
.swapsheet>.lab{margin:0}
/* keeps the slot row down by the thumb when there is space, and costs nothing when there is not */
.swapsheet>.lab.hint{margin-top:auto;padding-top:4px}
.swaprow{display:flex;gap:6px;margin-top:4px;flex:0 0 auto}
.swaprow .gtab{position:relative;height:62px;padding-top:6px}
.gtab.holding,.slot.holding{background:linear-gradient(to right,#ff8a1f 0%,#ff8a1f 100%);
  background-size:100% 100%;animation:fill .45s linear forwards;color:#12141a}
@keyframes fill{from{background-size:0% 100%}to{background-size:100% 100%}}
.gtab.holding{background-repeat:no-repeat}
.slot.holding{background-repeat:no-repeat}
.purse{font:700 14px system-ui,sans-serif;color:#c08a1f;margin-left:auto;margin-right:10px}
.dbg{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--ring);
  background:var(--pad);color:var(--muted);font:700 10px system-ui,sans-serif;letter-spacing:.09em}
.dbg.on{background:#ff8a1f;border-color:#ff8a1f;color:#12141a}
.bag.debug{box-shadow:inset 0 0 0 1.5px rgba(255,138,31,0.5)}
.reset{position:absolute;top:10px;right:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.35);
  color:#e9ecf2;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
/* the dev tools: a button by Restart, and the panel it opens */
.devbtn{position:absolute;top:10px;right:88px;z-index:6;border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.35);color:#e9ecf2;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
.devwrap{position:fixed;left:0;right:0;top:0;bottom:0;z-index:26;display:flex;
  align-items:flex-start;justify-content:center;padding:52px 12px 12px}
/* a light backdrop so the cave is still visible behind while you tune the look of it */
.devback{position:absolute;inset:0;background:rgba(0,0,0,0.2)}
.devpanel{position:relative;z-index:1;width:100%;max-width:360px;max-height:calc(100% - 64px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;background:var(--btn);
  border:1px solid var(--ring);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,0.45);color:var(--text)}
.devhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.devhead h2{margin:0;font-size:17px}
.devbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.devvars{display:flex;flex-direction:column;gap:10px}
.devrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.devrow label{font-size:13px;color:var(--text);flex:1 1 auto}
.devrow input{width:92px;flex:0 0 auto;box-sizing:border-box;height:36px;border-radius:8px;
  border:1px solid var(--ring);background:var(--pad);color:var(--text);
  font:600 14px system-ui,sans-serif;padding:0 9px;text-align:right;
  user-select:text;-webkit-user-select:text}
.devnote{margin:14px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
.confirm{position:fixed;inset:0;z-index:29;display:flex;align-items:center;justify-content:center;padding:24px}
.confirmCard{position:relative;z-index:30;background:var(--btn);border:1px solid var(--ring);border-radius:14px;
  padding:18px 20px;max-width:260px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.4)}
.confirmCard p{margin:0 0 14px;font:600 14px system-ui,sans-serif;color:var(--text)}
.confirmRow{display:flex;gap:10px;justify-content:center}
.confirmRow button{height:40px;padding:0 16px;border-radius:20px;font:600 13px system-ui,sans-serif}
.confirmRow .cancel{background:var(--pad);color:var(--text);border:1px solid var(--ring)}
.confirmRow .go{background:#c2401f;color:#fff;border:1px solid #c2401f}

<body>

<script>
const { useRef, useEffect, useState } = React;
const h = React.createElement;

// ---- world ----
const CELL = 2;                   // world units per terrain pixel
const CW = 640, CH = 1600;        // terrain size in pixels
const WW = CW * CELL, WH = CH * CELL;
const BW = CW / 4, BH = CH / 4;   // background at quarter resolution
const BCELL = WW / BW;            // world units per background pixel
const VIEW_W = 360;               // world units visible across a phone screen
const VIEW_MIN_H = 340;           // wide screens: keep at least this much height in view
const ROCK = 1, BRICK = 2, BED = 3;
const VERSION = 'v44';

// ---- tuning ----
const GRAVITY = 1400;
const WALK = 150, GROUND_ACC = 1400, AIR_ACC = 600;
const JET = 240, JET_ACC = 900;
const DEAD = 0.12;
// the right stick's own dead zone: drag past this fraction of its throw to aim/fire.
// A tap that never leaves it is an interact instead — see Stick() and the pickup/shop
// code in Game.step. 0.35 of the stick's max throw is a big enough circle to land a
// thumb on reliably without eating so much of the throw that aiming feels numb.
const AIM_DEAD = 0.35;
// The knob's diameter as a share of the stick. Big enough that its edge still shows
// around a thumbprint, which is the whole point of it.
const KNOB = 0.38;
// The ring drawn on the right stick, as a share of the stick: the throw you have to
// make (AIM_DEAD of the knob's full travel) plus one knob radius. So the ring is the
// line the knob's *edge* crosses at the exact moment the trigger goes live, which is
// what makes it worth drawing rather than just being another circle.
const AIM_RING = AIM_DEAD * 0.72 + KNOB;
const PW = 12, PH = 22;
const FUEL_DRAIN = 0.28, FUEL_REGEN = 0.7, FUEL_RESTART = 0.2;
const PLAYER_HP = 100;
const START_GOLD = 40;

// ---- dev settings ----
// Live, tweakable knobs for testing, read by the Game every frame so a change shows at
// once, and saved to localStorage so they survive a reload and carry across sessions.
// Each has a default; clearing a field in the dev panel puts the default back. Every
// localStorage touch is wrapped: it throws in a private window and does not exist at all
// under Node (the logic tests eval this file), and a missing store just means "defaults".
const DEV_DEFAULTS = { zoom: 1, torch: 1, fogDark: 0.99, fogDim: 0.85, move: 1 };
const DEV_META = [
  { k: 'zoom',    label: 'Camera zoom',                 min: 0.3, max: 3,  step: 0.05 },
  { k: 'torch',   label: 'Torch fall-off distance',     min: 0.2, max: 5,  step: 0.05 },
  { k: 'fogDark', label: 'Fog of war darkness',         min: 0,   max: 1,  step: 0.01 },
  { k: 'fogDim',  label: 'Outside-torchlight darkness', min: 0,   max: 1,  step: 0.01 },
  { k: 'move',    label: 'Base movement speed',         min: 0.2, max: 5,  step: 0.05 },
];
const DEV_KEY = 'caverunner-dev';
const DEV = Object.assign({}, DEV_DEFAULTS);
(() => { try {
  const raw = localStorage.getItem(DEV_KEY);
  if (raw) { const o = JSON.parse(raw); for (const k in DEV_DEFAULTS)
    if (typeof o[k] === 'number' && isFinite(o[k])) DEV[k] = o[k]; }
} catch (_) {} })();
function devSet(k, v) {
  DEV[k] = v;
  try { localStorage.setItem(DEV_KEY, JSON.stringify(DEV)); } catch (_) {}
}

const COIN_PULL = 36;         // gold within this many units flies to you
// how many enemies a floor gets before the floor lift. What they are and how hard
// they hit is the roster's business now — see CREATURES.
const ENEMY_COUNT = 80;
const MOD_DROPS = 7;          // mods lying in the cave: half what it used to be
const GUN_DROPS = 5;          // guns lying in the cave, unchanged
const PICKUP_GAP = 260;       // and no two of them closer than this
const PATROL_R = 70;          // how far an enemy will drift from where it spawned
                              // (each creature carries its own patrol speed — see CREATURES)
const PICKUP_COOL = 2;        // a gun you walked away from stays quiet this long
const NO_INPUT = { active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false };

// ---- level themes ----
// One palette per floor, picked by the floor number rather than rolled with the seed.
// So floor 3 is the same frozen cave on every run and every restart, which is the
// whole point: you learn "3 is the ice one" the way you learn a map, and the colour
// tells you where you are before you have read the number. Wraps at the end rather
// than running out.
const THEMES = [
  { name: 'Mossy caves',    bg: [16, 18, 24],  bg2: [34, 37, 46],
    rock: [[62, 56, 54], [96, 84, 74]],    moss: [[62, 104, 40], [108, 150, 64]],
    brick: [[112, 84, 62], [146, 110, 78]], mortar: [66, 50, 40], bed: [[28, 28, 34], [44, 44, 52]] },
  { name: 'Coal seams',     bg: [12, 13, 17],  bg2: [28, 30, 36],
    rock: [[44, 44, 50], [74, 74, 82]],    moss: [[46, 74, 52], [84, 116, 74]],
    brick: [[64, 62, 66], [96, 92, 98]],   mortar: [38, 36, 40], bed: [[24, 24, 28], [40, 40, 46]] },
  { name: 'Frozen deep',    bg: [14, 20, 30],  bg2: [32, 44, 60],
    rock: [[62, 72, 88], [104, 118, 138]], moss: [[120, 150, 170], [176, 204, 222]],
    brick: [[86, 100, 120], [126, 142, 164]], mortar: [52, 62, 78], bed: [[26, 32, 44], [44, 52, 66]] },
  { name: 'Ember halls',    bg: [22, 12, 12],  bg2: [48, 24, 22],
    rock: [[70, 48, 44], [110, 74, 62]],   moss: [[150, 72, 36], [204, 120, 52]],
    brick: [[100, 58, 44], [138, 84, 62]], mortar: [54, 32, 26], bed: [[34, 20, 20], [56, 34, 32]] },
  { name: 'Fungal grotto',  bg: [18, 14, 26],  bg2: [42, 34, 56],
    rock: [[66, 58, 80], [104, 92, 124]],  moss: [[88, 150, 120], [140, 200, 168]],
    brick: [[92, 72, 110], [130, 104, 150]], mortar: [50, 40, 62], bed: [[30, 26, 40], [50, 44, 64]] },

    rock: [[108, 104, 94], [152, 146, 132]], moss: [[110, 120, 72], [158, 170, 108]],
    brick: [[124, 116, 98], [164, 154, 132]], mortar: [70, 66, 56], bed: [[38, 38, 34], [60, 58, 52]] },
  { name: 'Drowned halls',  bg: [10, 18, 22],  bg2: [24, 42, 50],
    rock: [[48, 68, 72], [82, 108, 112]],  moss: [[56, 124, 124], [104, 176, 170]],
    brick: [[62, 84, 88], [98, 124, 128]], mortar: [36, 52, 56], bed: [[22, 32, 36], [40, 54, 58]] },
  { name: 'Ash wastes',     bg: [18, 17, 17],  bg2: [42, 40, 40],
    rock: [[72, 68, 66], [110, 104, 100]], moss: [[120, 96, 80], [168, 140, 116]],
    brick: [[92, 84, 80], [130, 120, 114]], mortar: [54, 50, 48], bed: [[30, 29, 29], [50, 48, 48]] },
  { name: 'Void hollow',    bg: [8, 8, 14],    bg2: [22, 20, 38],
    rock: [[42, 38, 58], [70, 64, 94]],    moss: [[72, 180, 190], [130, 230, 236]],
    brick: [[56, 48, 78], [88, 76, 116]],  mortar: [32, 28, 46], bed: [[18, 16, 28], [34, 30, 48]] },
];
const themeFor = floor => THEMES[(Math.max(1, floor) - 1) % THEMES.length];

// ---- creatures ----
// Who lives on a floor. Floors 1-10 each own a fixed roster of 2-6 of these, and the
// roster is the same on every run, so the thing that killed you on floor 6 is the
// thing you meet on floor 6 next time. Stats and gold scale with the floor a creature
// belongs to, so a floor 9 Hiisi is worth more and takes more killing than a floor 2
// one. Past floor 10 the roster is drawn at random instead, so the run keeps moving.
//
// act:  shoot   hovers, patrols, fires when it has a line on you
//       turret  holds station, longer reach, winds up before it fires
//       chase   comes at you and hurts on contact
//       bomb    comes at you and bursts on contact
// body: which sprite draws it
const CREATURES = {
  heikko: { name: 'Heikkohiisi', body: 'drone', act: 'shoot',
    col: { a: '#6b8f4e', b: '#2e3d22', c: '#9dc46f', eye: '#d8ff9a' },
    hp: 2, dmg: 6, bspd: 170, range: 200, cd: 1.9, gold: 4, r: 8, spd: 34 },
  hiisi:  { name: 'Hiisi', body: 'drone', act: 'shoot',
    col: { a: '#4f7a52', b: '#22331f', c: '#7fb383', eye: '#ffd98a' },
    hp: 5, dmg: 10, bspd: 190, range: 230, cd: 1.5, gold: 8, r: 9, spd: 34 },
  tappura: { name: 'Tappurahiisi', body: 'drone', act: 'shoot', shots: 4,
    col: { a: '#7a5a3a', b: '#33241a', c: '#b08a5c', eye: '#ffb347' },
    hp: 6, dmg: 7, bspd: 200, range: 180, cd: 2.3, gold: 10, r: 10, spd: 30 },
  chain:  { name: 'Chaingunner', body: 'drone', act: 'shoot',
    col: { a: '#8a3f3f', b: '#3a1c1c', c: '#c06a6a', eye: '#ff8a8a' },
    hp: 7, dmg: 5, bspd: 230, range: 250, cd: 0.6, gold: 12, r: 10, spd: 32 },
  snipu:  { name: 'Snipuhiisi', body: 'drone', act: 'turret', tele: 0.55,
    col: { a: '#5a5f8a', b: '#252a44', c: '#8f95c4', eye: '#9ad4ff' },
    hp: 4, dmg: 22, bspd: 420, range: 460, cd: 3.0, gold: 14, r: 9, spd: 0 },
  hamahakki: { name: 'Hämähäkki', body: 'crawler', act: 'chase', aggro: 300,
    col: { a: '#6a4a86', b: '#2b1d38', c: '#a077c4', eye: '#ffd98a' },
    hp: 4, dmg: 12, bspd: 0, range: 0, cd: 0, gold: 6, r: 9, spd: 62 },
  lohkare: { name: 'Lohkare', body: 'crawler', act: 'chase', aggro: 260,
    col: { a: '#6a625a', b: '#2c2823', c: '#9d948a', eye: '#ffb347' },
    hp: 16, dmg: 18, bspd: 0, range: 0, cd: 0, gold: 20, r: 13, spd: 26 },
  mato:   { name: 'Mato', body: 'worm', act: 'chase', aggro: 320,
    col: { a: '#a2607a', b: '#40222e', c: '#d68fa8', eye: '#ffd98a' },
    hp: 6, dmg: 14, bspd: 0, range: 0, cd: 0, gold: 9, r: 8, spd: 84 },
  hurtta: { name: 'Hurtta', body: 'crawler', act: 'chase', aggro: 360,
    col: { a: '#7a4a3a', b: '#2f1a14', c: '#b3765c', eye: '#ff9a5a' },
    hp: 5, dmg: 15, bspd: 0, range: 0, cd: 0, gold: 10, r: 9, spd: 105 },
  kobold: { name: 'Kobold', body: 'crawler', act: 'chase', aggro: 300,
    col: { a: '#8a7a4a', b: '#332d18', c: '#c0ad74', eye: '#ffe066' },
    hp: 3, dmg: 8, bspd: 0, range: 0, cd: 0, gold: 5, r: 7, spd: 92 },
  konna:  { name: 'Konna', body: 'blob', act: 'chase', aggro: 260,
    col: { a: '#4a7a6a', b: '#1c332c', c: '#79b3a0', eye: '#d8ff9a' },
    hp: 6, dmg: 11, bspd: 0, range: 0, cd: 0, gold: 7, r: 10, spd: 48 },
  lima:   { name: 'Limanuljaska', body: 'blob', act: 'bomb', aggro: 300,
    col: { a: '#6fa03a', b: '#2a3d14', c: '#a6d46a', eye: '#e6ff9a' },
    hp: 5, dmg: 20, bspd: 0, range: 0, cd: 0, gold: 11, r: 10, spd: 55 },
  tuli:   { name: 'Stendari', body: 'blob', act: 'bomb', aggro: 330,
    col: { a: '#c05a2a', b: '#3f1c0e', c: '#ff9a5a', eye: '#ffe066' },
    hp: 6, dmg: 26, bspd: 0, range: 0, cd: 0, gold: 13, r: 10, spd: 60 },
  karpas: { name: 'Kärpässieni', body: 'blob', act: 'turret',
    col: { a: '#b04a4a', b: '#3d1616', c: '#e88a8a', eye: '#ffffff' },
    hp: 5, dmg: 12, bspd: 150, range: 300, cd: 1.9, gold: 9, r: 10, spd: 0 },
  jaatio: { name: 'Jäätiö', body: 'skull', act: 'turret', tele: 0.3,
    col: { a: '#7ab8d8', b: '#22414f', c: '#b6e2f4', eye: '#d8f4ff' },
    hp: 8, dmg: 12, bspd: 130, range: 240, cd: 1.7, gold: 15, r: 10, spd: 0 },
  skull:  { name: 'Elävät luut', body: 'skull', act: 'turret', tele: 0.35,
    col: { a: '#d8d2be', b: '#4a463c', c: '#f4f0e0', eye: '#5ee0a0' },
    hp: 7, dmg: 14, bspd: 200, range: 320, cd: 2.1, gold: 16, r: 9, spd: 0 },
};
const CREATURE_IDS = Object.keys(CREATURES);

// Floors 1-10, fixed for good — that is the familiarity. Order is roughly the order
// you meet them: weak gunners and one crawler first, snipers and bombers in the
// middle, the armoured and the wind-up shooters at the top.
const ROSTERS = [
  ['heikko', 'hamahakki'],
  ['heikko', 'hamahakki', 'hiisi'],
  ['hiisi', 'konna', 'hamahakki'],
  ['hiisi', 'mato', 'lima', 'kobold'],
  ['hiisi', 'karpas', 'hurtta', 'lima'],
  ['snipu', 'hiisi', 'hurtta', 'tuli', 'karpas'],
  ['snipu', 'lohkare', 'mato', 'tuli', 'kobold'],
  ['jaatio', 'chain', 'lohkare', 'hamahakki', 'hurtta', 'karpas'],
  ['jaatio', 'chain', 'snipu', 'tuli', 'lohkare', 'skull'],
  ['chain', 'snipu', 'lohkare', 'skull', 'jaatio', 'tappura'],
];
// the roster for a floor. Past the fixed ten it rolls a fresh 2-6 off the whole list,
// using the level's own seeded rnd so a floor stays consistent while you are on it.
function rosterFor(floor, rnd) {
  if (floor >= 1 && floor <= ROSTERS.length) return ROSTERS[floor - 1].slice();
  const r = rnd || Math.random, pool = CREATURE_IDS.slice(), out = [];
  const n = 2 + Math.floor(r() * 5);
  while (out.length < n && pool.length) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  return out;
}

// One floor's worth of one creature: the type's own numbers, lifted by the floor it
// belongs to. Health climbs hardest, gold next, damage least — a floor 10 enemy is
// worth a lot more than it hurts, or the shop heal would never keep up.
function enemyFor(id, floor) {
  const c = CREATURES[id];
  const hp = 1 + (floor - 1) * 0.35, dmg = 1 + (floor - 1) * 0.16, gold = 1 + (floor - 1) * 0.30;
  return { id, name: c.name, body: c.body, act: c.act, col: c.col,
    hp: Math.max(1, Math.round(c.hp * hp)),
    dmg: Math.max(1, Math.round(c.dmg * dmg)),
    bspd: Math.round(c.bspd * (1 + (floor - 1) * 0.05)),
    gold: Math.max(1, Math.round(c.gold * gold)),
    range: c.range, cd: c.cd, tele: c.tele || 0, shots: c.shots || 1,
    r: c.r, spd: c.spd, aggro: c.aggro || 300 };
}

const COL = {
  text: '#e9ecf2', muted: 'rgba(233,236,242,0.55)', barBg: 'rgba(255,255,255,0.12)',
  player: '#ff5a36', visor: '#17222e', bullet: '#ffc93c', flame: '#ff8a1f', flame2: '#ffe066',
  enemy: '#b57cff', eye: '#f4f0ff', smoke: '#9aa3ad', hp: '#46c48c', grenade: '#7cc04f', portal: '#5ee0a0',
};

// ---- mods ----
// 'shot' mods are the projectiles. 'mod' mods change the shots cast AFTER them in
// the list, so the order you arrange them in is the whole game. 'passive' mods
// work from anywhere on the gun.
const MODS = {
  bolt:    { name: 'Bolt', kind: 'shot', glyph: '•', col: '#ffc93c', mana: 5,
             info: 'Cheap all-rounder',
             dmg: 1, speed: 540, spread: 2, delay: 0.10, size: 2, life: 1.2, recoil: 6 },
  spark:   { name: 'Spark', kind: 'shot', glyph: '·', col: '#ffe066', mana: 3,
             info: 'Fast, weak and nearly free', rech: -0.05,
             dmg: 0.5, speed: 720, spread: 5, delay: 0.05, size: 1.5, life: 0.8, recoil: 2 },

// tiers, so the early cave is workhorses and the Greek letters stay a find.
function modWeight(id, floor) {
  const over = Math.max(0, tierOf(id) - (1 + (floor - 1) * 0.55));
  return 1 / (1 + over * over);
}
function rollMod(rnd, floor, skip) {
  let total = 0;
  for (const id of ALL_IDS) if (!skip || !skip[id]) total += modWeight(id, floor);
  let r = rnd() * total;
  for (const id of ALL_IDS) {
    if (skip && skip[id]) continue;
    r -= modWeight(id, floor);
    if (r <= 0) return id;
  }
  return 'bolt';
}

// ---- fog of war ----
// A coarse reveal grid, never per pixel: one fog cell covers FOG terrain pixels each
// way, and the overlay is a tiny FW x FH canvas scaled up over the view, so hiding the
// map costs one image draw a frame however big the map gets.
const FOG = 8;                         // terrain pixels per fog cell
const FOG_U = FOG * CELL;              // world units per fog cell
const FW = Math.ceil(CW / FOG), FH = Math.ceil(CH / FOG);
const SIGHT = 200;                     // how far the torch reaches: line of sight out to
                                       // here lifts the fog, and the lamp then lights the
                                       // ground it lifted. A cell this close and in view is
                                       // marked as somewhere you have been and stays marked
                                       // for the rest of the floor. This is a medium bubble —
                                       // generous, but the cave beyond it stays dark
const LAMP_REACH = 1.15;               // the lamp's pool is this many times the sight radius,
                                       // so the whole lifted bubble is lit and fades out at
                                       // its edge. The lamp is MASKED by the fog: it brightens
                                       // ground the line of sight has already uncovered and
                                       // leaves the rest dark — see the note on the lamp in draw()
const FOG_DIM = 0.85;                  // how dark somewhere you have been but cannot see
const FOG_DARK = 0.99;                 // how dark somewhere you have never been — near black,
                                       // because that darkness is the fog of war now

// What the map is allowed to remember is worked out as a fan of rays out from the player,
// each stopping at the first wall: one ray per fog cell the fan crosses, so a shadow edge
// lands on about the grid it is drawn into. See fogReveal.
const VIS_RAYS = 160;

// Light every cell within r world units of (wx, wy) that the torch can actually reach,
// and return how many were newly lit so the caller can leave the overlay alone on the
// frames where nothing changed. `pts` is the fan visPoly cast from the same spot, and a
// cell is only lit if the fan reaches at least that far in its direction — so ground
// round the corner of a wall is not seen and never goes on the map.
function fogReveal(seen, wx, wy, r, pts, rays) {
  const cx = wx / FOG_U, cy = wy / FOG_U, cr = r / FOG_U, r2 = cr * cr;
  const x0 = Math.max(0, Math.floor(cx - cr)), x1 = Math.min(FW - 1, Math.ceil(cx + cr));
  const y0 = Math.max(0, Math.floor(cy - cr)), y1 = Math.min(FH - 1, Math.ceil(cy + cr));
  let n = 0;
  for (let y = y0; y <= y1; y++) {
    const row = y * FW, dy = y + 0.5 - cy, dy2 = dy * dy;
    for (let x = x0; x <= x1; x++) {
      if (seen[row + x]) continue;
      const dx = x + 0.5 - cx;
      if (dx * dx + dy2 > r2) continue;
      const d = Math.sqrt(dx * dx + dy2) * FOG_U;            // world units, to match the fan
      // how far the fan got in this direction: the shorter of the two rays either side of
      // it, so a cell only goes on the map if a ray actually reached it. Interpolating
      // between the two would reach a little further than either and mark cells just round
      // a corner — which is the one thing this is here to stop.
      const t = (Math.atan2(dy, dx) / (Math.PI * 2) + 1) % 1 * rays;
      const i0 = Math.floor(t), i1 = (i0 + 1) % rays;
      const a = Math.hypot(pts[i0 * 2] - wx, pts[i0 * 2 + 1] - wy);
      const b = Math.hypot(pts[i1 * 2] - wx, pts[i1 * 2 + 1] - wy);
      if (d > Math.min(a, b)) continue;
      seen[row + x] = 1; n++;
    }
  }
  return n;
}

// A fresh grid for a fresh floor. 0 is never been there, 1 is been there, 2 is never
// fogged at all - which is the shop, a known safe room you are put down in, where a
// haze over the plinths would just hide the stock you came here to buy.
function fogStart() {
  const seen = new Uint8Array(FW * FH);
  for (let y = Math.floor((SHOP_TOP - SHOP_ROOF) / FOG); y < FH; y++)
    for (let x = 0; x < FW; x++) seen[y * FW + x] = 2;
  return seen;
}

// How far a ray from (x, y) heading (dx, dy) gets before it walks into a solid cell,
// capped at r. It steps from one cell boundary to the next, so it visits every cell the
// ray crosses — a fixed sampling step would jump clean over a one-pixel wall and let a
// sliver of light through the far side of it.
function rayDist(x, y, dx, dy, r, solidCell) {
  let cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
  const dtx = dx ? Math.abs(CELL / dx) : Infinity;
  const dty = dy ? Math.abs(CELL / dy) : Infinity;
  let tx = dx ? (dx > 0 ? ((cx + 1) * CELL - x) / dx : (cx * CELL - x) / dx) : Infinity;
  let ty = dy ? (dy > 0 ? ((cy + 1) * CELL - y) / dy : (cy * CELL - y) / dy) : Infinity;
  let t = 0;
  for (;;) {
    if (tx < ty) { t = tx; tx += dtx; cx += sx; }
    else { t = ty; ty += dty; cy += sy; }
    if (t >= r) return r;
    if (solidCell(cx, cy)) return t;
  }
}

// Is the straight line from one point to another clear of rock? Marched the same way the
// light is, so "can I shoot that" and "can I see that" give the same answer, and a
// one-pixel wall stops both.
function losClear(x0, y0, x1, y1, solidCell) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  if (d < 0.001) return true;
  return rayDist(x0, y0, dx / d, dy / d, d, solidCell) >= d - 0.001;
}

// The fan of points that bound what can be seen from (cx, cy) out to r. The lamp is
// clipped to this, which is what makes walls cast shadows.
function visPoly(cx, cy, r, solidCell, rays) {
  const pts = [];
  for (let i = 0; i < rays; i++) {
    const a = i / rays * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, r, solidCell);
    pts.push(cx + dx * d, cy + dy * d);
  }
  return pts;
}

for (const k of Object.keys(MODS)) MODS[k].id = k;

const MIN_CAST = 0.016;      // one frame: the fastest a gun can chain casts
const MIN_RECH = 0.05;

// Recharge counts every slot on the gun, wherever the mod sits, so the number on
// the gun card is always the number you get.
function effRecharge(g) {
  const pas = gunPassives(g);
  return Math.max(MIN_RECH, (g.recharge + pas.rech) * pas.rechMul);
}

const SHOT_IDS = Object.keys(MODS).filter(k => MODS[k].kind === 'shot');
// a found gun is seeded with something that hurts on its own, so never a bare trigger
const SEED_SHOTS = SHOT_IDS.filter(k => !MODS[k].payload);
const ALL_IDS = Object.keys(MODS);

// ---- guns ----
const GUN_A = ['Rusty', 'Bone', 'Cracked', 'Copper', 'Glass', 'Ivory', 'Molten', 'Static',
               'Hollow', 'Ember', 'Quartz', 'Iron', 'Pale', 'Gilded'];
const GUN_B = ['Pistol', 'Repeater', 'Carbine', 'Scattergun', 'Lance', 'Sidearm',
               'Blaster', 'Cannon', 'Spitter', 'Wand'];

function shuffleOrder(g) {
  g.order = g.slots.map((_, i) => i);
  if (g.shuffle) for (let i = g.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [g.order[i], g.order[j]] = [g.order[j], g.order[i]];
  }
}
function resetGun(g) {
  g.idx = 0; g.delayT = 0; g.rechT = 0;
  shuffleOrder(g);
  return g;
}

// How good a gun should roll. Height in the cave still matters, but every floor
// you clear lifts the whole range, so late floors stop handing out scratch pistols.
const FLOOR_TIER = 0.16;
function gunTier(cy, floor) {
  const depth = (CH - 60 - cy) / (CH - 140);          // 0 at the bottom, 1 at the top
  const run = Math.min(0.85, (floor - 1) * FLOOR_TIER);
  return Math.min(1, Math.max(0, run + Math.max(0, depth) * (1 - run * 0.5)));
}

// tier 0..1: guns found higher up the cave are better
function makeGun(rnd, tier) {
  const cap = Math.min(8, 2 + Math.floor(rnd() * 4 + tier * 3));
  const g = {
    name: GUN_A[Math.floor(rnd() * GUN_A.length)] + ' ' + GUN_B[Math.floor(rnd() * GUN_B.length)],
    cap,
    castDelay: Math.max(0.04, 0.34 - tier * 0.14 + rnd() * 0.2),
    recharge: Math.max(0.15, 1.2 - tier * 0.45 + rnd() * 0.6),
    manaMax: Math.round(90 + tier * 260 + rnd() * 130),
    manaRegen: Math.round(25 + tier * 75 + rnd() * 45),
    spread: rnd() * 9 * (1 - tier * 0.5),
    speedMul: 0.8 + rnd() * (0.5 + tier * 0.5),
    multi: rnd() < 0.12 + tier * 0.22 ? 2 : 1,
    shuffle: rnd() < 0.35 - tier * 0.18,
    slots: new Array(cap).fill(null),
    hue: Math.floor(rnd() * 360),
  };
  // seed it with something that already shoots
  const used = 1 + Math.floor(rnd() * Math.min(cap, 2 + tier * 3));
  const spots = g.slots.map((_, i) => i).sort(() => rnd() - 0.5).slice(0, used);
  const asFloor = 1 + tier * 5;               // a high-tier gun comes with better mods on it
  spots.forEach((slot, n) => {
    g.slots[slot] = n === 0 ? SEED_SHOTS[Math.floor(rnd() * SEED_SHOTS.length)]
                            : rollMod(rnd, asFloor);
  });
  if (!g.slots.some(id => id && MODS[id].kind === 'shot')) g.slots[spots[0]] = 'bolt';
  g.mana = g.manaMax;
  return resetGun(g);
}

function startingGuns() {
  // three bolts before it needs a breather, so it feels like a gun from the start
  const pistol = resetGun({ name: 'Scratch Pistol', cap: 4, castDelay: 0.12, recharge: 0.35,
    manaMax: 140, manaRegen: 55, spread: 3, multi: 1, shuffle: false, mana: 140, speedMul: 1,
    slots: ['bolt', 'bolt', 'bolt', null], hue: Math.floor(Math.random() * 360) });
  const blaster = resetGun({ name: 'Old Blaster', cap: 3, castDelay: 0.5, recharge: 1.1,
    manaMax: 150, manaRegen: 30, spread: 2, multi: 1, shuffle: false, mana: 150, speedMul: 1,
    slots: ['blast', null, null], hue: Math.floor(Math.random() * 360) });
  return [pistol, blaster, null, null];
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the shots that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// Anything that comes out of the barrel: a shot has these and nothing else, so a
// modifier's f() can only touch fields that exist here.
function blankShot(sm, spread) {
  return { dmg: sm.dmg || 0, speed: sm.speed || 0, spread: (sm.spread || 0) + spread,
    size: sm.size || 2, life: sm.life || 1, count: sm.count || 1,
    bounce: sm.bounce || 0, pierce: sm.pierce || 0, explode: sm.explode || 0,
    grav: sm.grav || 0, homing: sm.homing || 0, accel: 0, bore: sm.bore || 0, recoil: sm.recoil || 0,
    col: sm.col, knock: 0, crit: 0, boomer: 0, spiral: 0, pong: 0, orbit: 0,
    autoaim: 0, homeR: 0, flat: 0, eat: sm.eat || 0, pull: sm.pull || 0,
    split: 0, cluster: 0, bounceFx: null, friendly: 0, chain: sm.chain || 0,
    fuse: sm.fuse || 0, beam: sm.beam || 0, payload: null,
    still: sm.kind === 'static' ? 1 : 0, field: sm.field || null, r: sm.r || 0 };
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the spells that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// `others` is your other guns, which only Zeta looks at.
function planCast(g, others) {
  const start = g.idx, mods = [], defs = [];
  // what each cast spell is carrying, by its index in defs: a trigger fills this
  // with the spells drawn after it, and everything else leaves it empty
  const holds = [];
  let need = 0, hold = null;
  let multi = g.multi, cost = 0, manaMul = 1, ran = false, wrapped = 0;
  // delay is walked in draw order: most mods nudge it, a few reset it outright,
  // and anything drawn after a reset adds its own delay back on top
  let delay = g.castDelay;
  let form = null, hp = 0;
  const acts = [];
  const timing = m => {
    if (m.setDelay !== undefined) delay = m.setDelay;
    else delay += (m.kind === 'shot' || m.kind === 'static' ? m.delay : m.d) || 0;
  };
  const live = () => g.slots.filter(id => id && MODS[id].kind !== 'passive');
  const casts = id => id && (MODS[id].kind === 'shot' || MODS[id].kind === 'static');
  // how many things the gun still has left to fire this cycle, which is what Myriad takes
  const rest = () => {
    let n = 0;
    for (let i = g.idx; i < g.order.length; i++) if (casts(g.slots[g.order[i]])) n++;
    return n;
  };
  const onGun = () => g.slots.filter(casts).length;
  let queued = 0;                       // copies waiting in the queue that will fire
  // A Greek letter drops the spells it copies into this queue, and they are drawn
  // before the gun moves on. Copies never copy again, so Omega cannot run away.
  const queue = [];
  const copiesOf = m => {
    const all = live().filter(id => !MODS[id].copy);   // a copy never copies a copy
    if (m.copy === 'first') return all.slice(0, 1);
    if (m.copy === 'last') return all.slice(-1);
    if (m.copy === 'all') return all;
    if (m.copy === 'shots') return all.filter(id => MODS[id].kind === 'shot');
    if (m.copy === 'statics') return all.filter(id => MODS[id].kind === 'static');
    if (m.copy === 'next2') {
      const out = [];
      for (let i = g.idx; i < g.order.length && out.length < 2; i++) {
        const id = g.slots[g.order[i]];
        if (id && MODS[id].kind !== 'passive') out.push(id);
      }
      return out;
    }
    if (m.copy === 'other') {
      const pool = [];
      for (const o of others || []) {
        if (!o || o === g) continue;
        for (const id of o.slots) if (id && MODS[id].kind !== 'passive' && !MODS[id].copy) pool.push(id);
      }
      return pool.length ? [pool[Math.floor(Math.random() * pool.length)]] : [];
    }
    return [];
  };

  // a trigger still owed a payload keeps the draw going past the multicast limit,
  // because the spells it carries are not casts of their own
  for (let guard = 0; (defs.length < multi || need > 0) && guard < 96; guard++) {
    let id, copied = false;
    if (queue.length) { id = queue.shift(); copied = true; }
    else {
      if (g.idx >= g.order.length) {
        ran = true;
        // a multicast still owed spells wraps back to the front to find them
        if (defs.length >= multi || wrapped++ || !defs.length && !mods.length) break;
        g.idx = 0;
      }
      id = g.slots[g.order[g.idx]];
      g.idx++;
    }
    if (!id) continue;
    const m = MODS[id];
    if (m.kind === 'passive') continue;
    if (m.kind === 'mod' || m.kind === 'util') {
      cost += m.mana || 0;
      if (m.hp) hp += m.hp;
      if (m.act) acts.push(m.act);
      if (m.manaMul) manaMul *= m.manaMul;
      if (m.f) mods.push(m);
      // Copies and multicasts only open up on the first pass. Once the gun has
      // wrapped round to the front they are skipped, or a Myriad would widen the
      // cast every time it came round and never finish.
      if (!copied && !wrapped) {
        if (m.multi) multi += m.multi;
        if (m.form) form = m.form;
        if (m.myriad) { multi += rest(); multi = Math.min(multi, queued + onGun()); }
        if (m.copy === 'mods') {
          for (const oid of live()) if (MODS[oid].f && !mods.includes(MODS[oid])) mods.push(MODS[oid]);
        } else if (m.copy) {
          let room = 0;
          for (const c of copiesOf(m)) { queue.push(c); if (casts(c)) { room++; queued++; } }
          // the copies need room, and so do the originals they came from: sweeping the
          // whole gun fires everything on it, and Tau fires its pair twice
          if (m.copy === 'all' || m.copy === 'shots' || m.copy === 'statics') multi += room + rest();
          else if (m.copy === 'next2') multi += room * 2;
          else multi += room;
          // never ask for more than the gun can actually produce, or the wrap-around
          // hands out a stray extra shot
          multi = Math.min(multi, queued + onGun());
        }
      }
      timing(m);
      continue;
    }
    // a trigger is holding the barrel: this spell rides along with it instead of
    // being cast now. It is paid for and timed here, but it goes off on impact.
    if (need > 0) {
      need--;
      hold.push(m);
      cost += m.mana;
      timing(m);
      if (!need) hold = null;
      continue;
    }
    defs.push(m);
    cost += m.mana;
    timing(m);
    // a carrier takes the next spells with it. Nothing it carries is ever given a
    // payload of its own, which is what stops a trigger chaining into another.
    if (m.payload) { hold = []; need = m.payload; holds[defs.length - 1] = hold; }
  }
  const dress = sm => {
    const sh = blankShot(sm, g.spread);
    for (const m of mods) if (m.f) m.f(sh);
    sh.speed *= g.speedMul || 1;
    if (sh.flat) sh.grav = 0;
    return sh;
  };
  const shots = defs.map((sm, i) => {
    const sh = dress(sm);
    // the same modifiers reach what a trigger is carrying, and a carried spell
    // carries nothing, so the payload is always exactly one level deep
    if (holds[i] && holds[i].length) sh.payload = holds[i].map(pm => {
      const ps = dress(pm);
      ps.payload = null;
      return ps;
    });
    return sh;
  });
  if (form) shots.forEach((sh, i) => { sh.ang = form[i % form.length]; });
  let more = false;                       // anything left worth firing this cycle?
  for (let i = g.idx; i < g.order.length; i++) {
    const id = g.slots[g.order[i]];
    const k = id && MODS[id].kind;
    if (k === 'shot' || k === 'static') { more = true; break; }
  }
  return { shots, defs, start, cost: cost * manaMul, acts, hp,
    delay: Math.max(MIN_CAST, delay),
    wrap: ran || !more };
}

// What does this mod actually do? Rather than describing it by hand, run a plain
// bolt through the planner with and without it and report whatever changed.
const PREVIEW_FIELDS = [['dmg', 'damage'], ['speed', 'speed'], ['spread', 'spread', '\u00b0'],
  ['size', 'size'], ['life', 'flight time', 's'], ['bounce', 'bounces'], ['pierce', 'pierce'],
  ['homing', 'homing'], ['explode', 'blast radius'], ['bore', 'drill'], ['recoil', 'recoil'],
  ['accel', 'acceleration']];
const num = v => {
  const r = Math.round(v * 100) / 100;
  return String(r);
};
function previewGun(slots, over) {
  return resetGun(Object.assign({ name: 'p', cap: slots.length, castDelay: 0.2, recharge: 1,
    manaMax: 99999, manaRegen: 0, spread: 0, multi: 1, shuffle: false, mana: 99999,
    speedMul: 1, slots }, over || {}));
}
function previewPlan(slots) { return planCast(previewGun(slots)); }
function modPreview(id) {
  const m = MODS[id];
  const rows = [];
  const push = (label, x, y, unit) => {
    if (Math.abs(x - y) < 1e-6) return;
    rows.push([label, num(x) + (unit || '') + ' \u2192 ' + num(y) + (unit || '')]);
  };
  // a plain, readable gun to measure against
  const REF = { recharge: 1, manaMax: 100, manaRegen: 40 };
  const ref = slots => previewGun(slots, REF);

  if (m.kind === 'passive') {
    const a = ref(['bolt']), b = ref([id, 'bolt']);
    push('recharge', effRecharge(a), effRecharge(b), 's');
    push('mana', a.manaMax + gunPassives(a).manaMax, b.manaMax + gunPassives(b).manaMax);
    push('mana regen', a.manaRegen + gunPassives(a).manaRegen,
      b.manaRegen + gunPassives(b).manaRegen, '/s');
    return { rows };
  }

  if (m.kind === 'static') {
    const p = previewPlan([id]);
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's'],
      ['radius', num(m.r)]);
    if (m.life > 0.2) rows.push(['lasts', num(m.life) + 's']);
    rows.push(['does', FIELD_WHAT[m.field] || m.field]);
    return { rows };
  }

  if (m.kind === 'util') {
    const p = previewPlan([id, 'bolt']), a = previewPlan(['bolt']);
    rows.push(['mana', num(m.mana || 0)]);
    push('cast delay', a.delay, p.delay, 's');
    push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
    if (m.manaMul) rows.push(['mana cost', '\u00d7' + num(m.manaMul)]);
    if (m.hp) rows.push(['health per pull', '\u2212' + num(m.hp)]);
    const sa = a.shots[0], sb = p.shots[0];
    if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
    return { rows };
  }

  if (m.kind === 'shot') {
    const p = previewPlan([id]);
    const sh = p.shots[0];
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's']);
    if (m.payload) rows.push(['carries',
      m.payload === 1 ? 'the next spell' : 'the next ' + m.payload + ' spells']);
    if (m.rech || m.rechMul) rows.push(['recharge', num(effRecharge(ref([id]))) + 's']);
    for (const [key, label, unit] of PREVIEW_FIELDS) {
      if (!sh[key]) continue;
      rows.push([label, num(sh[key]) + (unit || '')]);
    }
    if (sh.count > 1) rows.splice(2, 0, ['pellets', num(sh.count)]);
    return { rows };
  }

  const a = previewPlan(['bolt']);
  const b = previewPlan([id, 'bolt', 'bolt', 'bolt', 'bolt']);
  push('shots per pull', a.shots.length, b.shots.length);
  push('mana', a.cost, b.cost);
  push('cast delay', a.delay, b.delay, 's');
  push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
  const sa = a.shots[0], sb = b.shots[0];
  if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
  return { rows };
}

// How much damage a gun really puts out, averaged over a whole cycle: every pull
// in the list, then the recharge. Firing faster than mana allows just stalls, so
// the rate is capped by what regen can sustain.
// what your health can pay out per second and still last a decent fight
const HP_BUDGET = PLAYER_HP / 25;

// What one planned shot is worth: every pellet of it, plus anything a trigger is
// carrying to the point of impact. Payloads are one level deep, so this ends.
const shotPower = sh => (sh.dmg || 0) * Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPower(ps), 0);
const shotPellets = sh => Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPellets(ps), 0);

function gunRate(gun) {
  const g = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  let cast = 0, dmg = 0, cost = 0, shots = 0, blood = 0;
  for (let guard = 0; guard < 16; guard++) {
    const p = planCast(g);
    cast += p.delay;
    cost += p.cost;
    blood += p.hp || 0;
    for (const sh of p.shots) {
      // a trigger's mana is already counted; its payload's damage has to be too
      shots += 1 + (sh.payload ? sh.payload.length : 0);
      dmg += shotPower(sh);
    }
    if (p.wrap) break;
  }
  const rech = effRecharge(g);
  const cycle = Math.max(0.001, cast + rech);
  const pas = gunPassives(gun);
  const regen = gun.manaRegen + pas.manaRegen;
  const manaPerSec = cost / cycle;
  const sustain = manaPerSec > regen ? regen / manaPerSec : 1;
  // health is a resource too: a gun that bleeds you dry in five seconds is not really
  // doing that much damage per second, however good the raw numbers look
  const hpPerSec = blood / cycle;
  const bleed = hpPerSec > HP_BUDGET ? HP_BUDGET / hpPerSec : 1;
  return { dps: (dmg / cycle) * sustain * bleed, cycle, cast, rech, manaPerSec, regen,
    shots, sustain, hpPerSec, bleed };
}

// Spot the bottleneck, then brute-force every single swap between the gun and the
// bag to see which one helps most. No cleverness, just the planner run a few
// hundred times, which costs a few milliseconds.
// how many promising mods get the full every-slot treatment
const SHORTLIST = 14;

function buildAdvice(gun, bag) {
  const now = gunRate(gun);
  let limit;
  if (!now.shots) limit = { key: 'none', text: 'Nothing on this gun fires — it needs a shot mod' };
  else if (now.bleed < 0.95) limit = { key: 'blood',
    text: 'Your health is the limit — ' + now.hpPerSec.toFixed(1) + ' hp/s to keep this up' };
  else if (now.sustain < 0.95) limit = { key: 'mana',
    text: 'Mana is the limit — ' + Math.round(now.manaPerSec) + '/s used against ' +
      Math.round(now.regen) + '/s regen' };
  else if (now.rech > now.cast) limit = { key: 'rech',
    text: 'Recharge is the limit — ' + Math.round(100 * now.rech / now.cycle) + '% of the cycle' };
  else limit = { key: 'cast',
    text: 'Cast delay is the limit — ' + Math.round(100 * now.cast / now.cycle) + '% of the cycle' };

  const tips = [];
  const score = slots => gunRate(Object.assign({}, gun, { slots })).dps;
  if (now.shots) {
    const seen = {};
    const pool = bag.filter(id => !seen[id] && (seen[id] = 1));
    // With a hundred-odd mods to hand, trying every one in every slot is far too much
    // work for one render. So: a cheap first look at each mod in a couple of slots,
    // then the handful that showed promise get tried properly everywhere.
    const probe = [0, gun.slots.indexOf(null) >= 0 ? gun.slots.indexOf(null) : gun.slots.length - 1]
      .filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
    let shortlist = pool;
    if (pool.length > SHORTLIST) {
      const rough = [];
      for (const id of pool) {
        let bestDps = 0;
        for (const i of probe) {
          if (gun.slots[i] === id) continue;
          const slots = gun.slots.slice();
          slots[i] = id;
          bestDps = Math.max(bestDps, score(slots));
        }
        rough.push({ id, bestDps });
      }
      rough.sort((a, b) => b.bestDps - a.bestDps);
      shortlist = rough.slice(0, SHORTLIST).map(r => r.id);
    }
    // bringing one mod in from the bag
    for (let i = 0; i < gun.slots.length; i++) {
      for (const id of shortlist) {
        if (gun.slots[i] === id) continue;
        const slots = gun.slots.slice();
        slots[i] = id;
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'fit', slot: i, id, dps, gain: dps / now.dps });
      }
    }
    // or just moving what is already on the gun, which is often the real fix
    for (let i = 0; i < gun.slots.length; i++) {
      for (let j = i + 1; j < gun.slots.length; j++) {
        if (!gun.slots[i] && !gun.slots[j]) continue;
        const slots = gun.slots.slice();
        slots[i] = gun.slots[j]; slots[j] = gun.slots[i];
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'move', slot: i, other: j, dps, gain: dps / now.dps });
      }
    }
    tips.sort((a, b) => b.dps - a.dps);
  }
  // one tip per slot, so the list does not fill up with variations on one idea
  const picked = [], usedSlot = {}, usedMod = {};
  for (const t of tips) {
    if (usedSlot[t.slot] || (t.other !== undefined && usedSlot[t.other])) continue;
    if (t.id && usedMod[t.id]) continue;   // you only own one of each, so only its best slot
    if (t.id) usedMod[t.id] = 1;
    usedSlot[t.slot] = 1;
    if (t.other !== undefined) usedSlot[t.other] = 1;
    picked.push(t);
    if (picked.length === 3) break;
  }
  return { now, limit, tips: picked };
}

// Which slots come out together on one pull. A modifier lands in the same group
// as the shots it modifies, which is exactly what the outline in the build screen
// draws. Null means the order is shuffled, so there is nothing fixed to show.
function castGroups(gun) {
  if (gun.shuffle) return null;
  const sim = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  const groups = [];
  for (let guard = 0; guard < 16; guard++) {
    const from = sim.idx;
    if (from >= sim.order.length) break;
    const plan = planCast(sim);
    let to = sim.idx;
    const wrapped = to <= from;              // a multicast that ran back to the front
    if (wrapped) to = sim.order.length;
    if (plan.shots.length) groups.push({ from, to, wrapped, shots: plan.shots.length, plan });
    if (plan.wrap) break;
  }
  return groups;
}

// Replay a pull with its modifiers stripped out, so the difference is exactly
// what the mods in that group are contributing.
function groupStats(gun, gr) {
  const plan = gr.plan;
  const ids = plan.defs.map(d => d.id);
  const bare = planCast(resetGun(Object.assign({}, gun, {
    cap: Math.max(1, ids.length), slots: ids.slice(),
    multi: Math.max(1, ids.length), shuffle: false })));
  const sum = (p, f) => p.shots.reduce((t, sh) => t + (sh[f] || 0), 0);
  // damage is what the whole pull puts out, so a pellet spray counts every pellet
  const power = p => p.shots.reduce((t, sh) => t + shotPower(sh), 0);
  const top = (p, f) => p.shots.reduce((t, sh) => Math.max(t,
    (sh.payload || []).reduce((n, ps) => Math.max(n, ps[f] || 0), sh[f] || 0)), 0);
  const pellets = p => p.shots.reduce((t, sh) => t + shotPellets(sh), 0);
  const avg = (p, f) => (p.shots.length ? sum(p, f) / p.shots.length : 0);

  const out = [];
  const add = (label, now, was, better, fmt, always) => {
    const d = now - was;
    if (!always && Math.abs(d) < 1e-6) return;
    const dir = Math.abs(d) < 1e-6 ? '' : (d > 0) === (better > 0) ? 'up' : 'down';
    const delta = Math.abs(d) < 1e-6 ? ''
      : (d > 0 ? '+' : '\u2212') + fmt(Math.abs(d));
    out.push({ label, value: fmt(now), delta, dir });
  };
  const n = v => String(Math.round(v * 100) / 100);
  const sec = v => (Math.round(v * 1000) / 1000) + 's';

  // recharge counts from any slot, so credit it to the group its mods sit in
  const without = Object.assign({}, gun, {
    slots: gun.slots.map((id, i) => (i >= gr.from && i < gr.to ? null : id)) });
  add('recharge', effRecharge(gun), effRecharge(without), -1, sec);

  add('dmg', power(plan), power(bare), 1, n, true);
  add('shots', pellets(plan), pellets(bare), 1, n, pellets(plan) > plan.shots.length);
  add('mana', plan.cost, bare.cost, -1, n, true);
  add('delay', plan.delay, bare.delay, -1, sec, true);
  add('speed', avg(plan, 'speed'), avg(bare, 'speed'), 1, v => String(Math.round(v)));
  add('spread', avg(plan, 'spread'), avg(bare, 'spread'), -1, v => n(v) + '\u00b0');
  add('homing', top(plan, 'homing'), top(bare, 'homing'), 1, n);
  add('bounces', top(plan, 'bounce'), top(bare, 'bounce'), 1, n);
  add('pierce', top(plan, 'pierce'), top(bare, 'pierce'), 1, n);
  add('blast', top(plan, 'explode'), top(bare, 'explode'), 1, n);
  add('drill', top(plan, 'bore'), top(bare, 'bore'), 1, n);
  add('life', avg(plan, 'life'), avg(bare, 'life'), 1, sec);
  return out;
}

// what the gun actually does with the mods on it right now
function gunPassives(g) {
  let rech = 0, rechMul = 1, manaMax = 0, manaRegen = 0;
  for (const id of g.slots) {
    if (!id) continue;
    const m = MODS[id];
    if (m.rech) rech += m.rech;
    if (m.rechMul) rechMul *= m.rechMul;
    if (m.manaMax) manaMax += m.manaMax;
    if (m.manaRegen) manaRegen += m.manaRegen;
  }
  return { rech, rechMul, manaMax, manaRegen };
}

// ---- sprites ----
// Everything is drawn from primitives at world scale (the player is 12x22 units),
// so it stays crisp at any zoom and there are no images to load.
function rr(ctx, x, y, w, hh, r) {
  const k = Math.min(r, w / 2, hh / 2);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, hh, k);
  else {
    ctx.moveTo(x + k, y);
    ctx.arcTo(x + w, y, x + w, y + hh, k);
    ctx.arcTo(x + w, y + hh, x, y + hh, k);
    ctx.arcTo(x, y + hh, x, y, k);
    ctx.arcTo(x, y, x + w, y, k);
    ctx.closePath();
  }
}

// A gun, grip at the origin, barrel down +x. Scaled so the same drawing works for
// the one in your hands and the little one lying on the cave floor.
function drawGun(ctx, x, y, ang, sc, accent) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  if (Math.cos(ang) < 0) ctx.scale(1, -1);     // aiming left: flip, don't hang upside down
  ctx.scale(sc, sc);
  ctx.fillStyle = '#20242c';                    // stock and grip
  rr(ctx, -6.5, -4.6, 4.5, 3.6, 1.2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-1.4, -1.2); ctx.lineTo(1.8, -1.2); ctx.lineTo(0.9, 4.6); ctx.lineTo(-2.2, 4.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3c424e';                    // magazine
  ctx.beginPath();
  ctx.moveTo(2.2, -1); ctx.lineTo(5, -1); ctx.lineTo(4.4, 3.4); ctx.lineTo(1.8, 3.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a515f';                    // receiver
  rr(ctx, -4.4, -5.2, 10.5, 4.4, 1.3); ctx.fill();
  ctx.fillStyle = '#5f6878';                    // barrel
  rr(ctx, 5.5, -4.4, 7.5, 2.4, 1); ctx.fill();
  ctx.fillStyle = '#343a45';                    // sight
  rr(ctx, 0.5, -6.6, 2.4, 1.6, 0.6); ctx.fill();
  ctx.fillStyle = accent || COL.bullet;         // muzzle and a flash of the gun's colour
  rr(ctx, 12.4, -5, 1.8, 3.6, 0.7); ctx.fill();
  rr(ctx, -3.4, -4.4, 2.6, 2.6, 0.8); ctx.fill();
  ctx.restore();
}

// The runner: jetpack on the back, sealed helmet, legs that actually move.
function drawRunner(ctx, x, y, w, hh, face, gait, air, jet, flash) {
  const suit = flash ? '#ffffff' : '#ff5a36';
  const dark = flash ? '#d8dde6' : '#c33a1f';
  ctx.save();
  ctx.translate(x + w / 2, y);
  ctx.scale(face, 1);
  // jetpack
  ctx.fillStyle = '#2b3039';
  rr(ctx, -6.2, 6.5, 4.4, 9, 1.6); ctx.fill();
  ctx.fillStyle = '#ff8a1f';
  rr(ctx, -5.6, 8.4, 3.2, 1.4, 0.6); ctx.fill();
  ctx.fillStyle = '#1b1f26';
  rr(ctx, -5.4, 15, 3, 2.2, 0.8); ctx.fill();
  if (jet > 0) {                                  // the nozzle glows when it is lit
    ctx.fillStyle = COL.flame2;
    rr(ctx, -5.2, 16.4, 2.6, 1.6, 0.8); ctx.fill();
  }
  // legs: a stride on the ground, tucked up in the air
  ctx.fillStyle = dark;
  const swing = air ? -1.4 : gait * 2.6;
  const lift = air ? 2 : 0;
  rr(ctx, -3.4 + swing, 15.5 - lift * 0.5, 3, 6.5 - lift, 1.2); ctx.fill();
  rr(ctx, 0.4 - swing, 15.5 - lift, 3, 6.5 - lift * 0.6, 1.2); ctx.fill();
  ctx.fillStyle = '#24282f';                      // boots
  rr(ctx, -3.6 + swing, 20.2 - lift * 1.2, 3.6, 1.8, 0.7); ctx.fill();
  rr(ctx, 0.2 - swing, 20.2 - lift * 1.4, 3.6, 1.8, 0.7); ctx.fill();
  // torso
  ctx.fillStyle = suit;
  rr(ctx, -3.8, 6, 7.6, 10.5, 2.6); ctx.fill();
  ctx.fillStyle = dark;
  rr(ctx, -3.8, 12.4, 7.6, 2.2, 1); ctx.fill();   // belt
  // arm reaching for the gun
  ctx.fillStyle = suit;
  rr(ctx, 1, 8.4, 5, 2.8, 1.3); ctx.fill();
  // helmet
  ctx.fillStyle = flash ? '#ffffff' : '#d7dbe3';
  ctx.beginPath(); ctx.arc(0, 4.4, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1d2733';                      // visor
  rr(ctx, -0.6, 1.9, 4.6, 4.2, 1.8); ctx.fill();
  ctx.fillStyle = 'rgba(126,214,255,0.75)';       // glint
  rr(ctx, 1.4, 2.7, 1.8, 1.4, 0.6); ctx.fill();
  ctx.restore();
}

// The torch in the runner's free hand. `flick` is the very same number the lamp is drawn
// with, so the flame and the light it throws gutter together and the cave reads as
// torchlight rather than as a dimmer switch. The embers are the loop's particles.
function drawTorch(ctx, x, y, face, flick, embers) {
  const fx = x + face * 1.6, fy = y - 7;           // the flame rides above the fist
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#5b4630'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(x, y + 2.5); ctx.lineTo(fx, fy); ctx.stroke();
  ctx.strokeStyle = '#8a6b45'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + 2.5); ctx.lineTo(fx, fy); ctx.stroke();
  const s = flick;                                 // a low flame is a small one
  ctx.globalAlpha = 0.32 * flick;                  // the halo is what really gutters
  ctx.fillStyle = COL.flame;
  ctx.beginPath(); ctx.ellipse(fx, fy - 3.5 * s, 4.4 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = flick;
  ctx.beginPath(); ctx.ellipse(fx, fy - 2.5 * s, 2.9 * s, 4.8 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COL.flame2;
  ctx.beginPath(); ctx.ellipse(fx, fy - 2 * s, 1.5 * s, 2.6 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const q of embers) {
    ctx.globalAlpha = Math.max(0, q.life / q.max) * 0.85;
    ctx.fillStyle = q.c;
    ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}

// The enemies, one sprite per body. Every one of them takes the same colour set
// ({ a main, b dark, c light, eye }) so a creature's identity is carried by shape and
// colour together, and a flash on hit is the same white for all of them.
//
// The drone: a hovering gunner with one big eye that follows you around.
function drawDrone(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const shell = flash ? '#f4f0ff' : col.b;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lx * 0.22);
  // thruster wash underneath
  const puff = 0.55 + 0.25 * Math.sin(time * 9 + phase);
  ctx.globalAlpha = 0.3 * puff;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.9, r * 0.45, r * 0.8 * puff, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // stubby fins, drawn first so they read as sticking out of the hull
  ctx.fillStyle = flash ? '#e6e0f5' : col.b;
  rr(ctx, -r * 1.52, -r * 0.4, r * 0.62, r * 0.9, r * 0.22); ctx.fill();
  rr(ctx, r * 0.9, -r * 0.4, r * 0.62, r * 0.9, r * 0.22); ctx.fill();
  rr(ctx, -r * 0.34, r * 0.5, r * 0.68, r * 0.5, r * 0.18); ctx.fill();    // vent
  // hull
  ctx.fillStyle = shell;
  rr(ctx, -r * 1.05, -r * 0.78, r * 2.1, r * 1.5, r * 0.62); ctx.fill();
  ctx.strokeStyle = flash ? '#ffffff' : col.a;
  ctx.lineWidth = r * 0.14;
  rr(ctx, -r * 1.05, -r * 0.78, r * 2.1, r * 1.5, r * 0.62); ctx.stroke();
  ctx.fillStyle = flash ? '#ffffff' : col.c;
  rr(ctx, -r * 0.72, -r * 0.7, r * 1.44, r * 0.46, r * 0.22); ctx.fill();  // canopy
  ctx.restore();
  // the eye sits in the hull and swivels to keep you in view
  const ex = x + lx * r * 0.34, ey = y + ly * r * 0.26;
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#ffffff' : col.eye;
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b1526';
  ctx.beginPath(); ctx.arc(ex + lx * r * 0.15, ey + ly * r * 0.15, r * 0.16, 0, Math.PI * 2); ctx.fill();
}

// The crawler: a low body on six legs that scuttle as it walks. Spiders, hounds,
// kobolds and the armoured Lohkare all wear this one.
function drawCrawler(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const s = Math.sin(time * 7 + phase);
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = flash ? '#ffffff' : col.b;
  ctx.lineWidth = r * 0.2; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const o = (i - 1) * r * 0.5, sw = s * r * 0.26 * (i % 2 ? 1 : -1);
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(o * 0.6, 0);
      ctx.lineTo(o * 0.6 + side * r * 0.8, side * r * 0.5 + sw);
      ctx.lineTo(o * 0.6 + side * r * 1.3, side * r * 0.95 - sw * 0.5);
      ctx.stroke();
    }
  }
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.05, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.12, r * 0.82, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const side of [-1, 1]) {
    ctx.fillStyle = flash ? '#ffffff' : col.eye;
    ctx.beginPath(); ctx.arc(x + lx * r * 0.35 + side * r * 0.3, y + ly * r * 0.25, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
}

// The blob: a wobbling sac with two eyes. Slimes, toads and the fungal turret.
function drawBlob(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const wob = 1 + 0.09 * Math.sin(time * 3.4 + phase);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.85, r * 0.72, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 1.0, r * 0.92 * wob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.76, r * 0.66 * wob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#1b1526';
    ctx.beginPath(); ctx.arc(x + lx * r * 0.3 + side * r * 0.26, y + r * 0.12 + ly * r * 0.18,
      r * 0.15, 0, Math.PI * 2); ctx.fill();
  }
}

// The skull: bone, a jaw, and a halo of whatever it is made of. The Jäätiö and the
// living bones are both this, one frozen blue and one bare.
function drawSkull(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lx * 0.18);
  ctx.globalAlpha = 0.26 + 0.1 * Math.sin(time * 4 + phase);
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.85, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  rr(ctx, -r * 0.55, r * 0.4, r * 1.1, r * 0.55, r * 0.2); ctx.fill();      // jaw
  ctx.fillStyle = '#1b1526';
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(side * r * 0.34, -r * 0.18, r * 0.24, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = col.eye;
  for (const side of [-1, 1]) {
