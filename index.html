.buypanel .pop{position:static;top:auto;left:auto;right:auto;bottom:auto;width:auto;

.pbuy.cant{opacity:.45}
.pbuy.cant b{color:#fff}
.weapon.locked{opacity:.45}
.pop.flow{position:static;max-height:none;box-shadow:none;margin-bottom:2px}
.spacer{flex:1 1 auto;min-height:6px}

.pop.split .ptitle b{font-size:14.5px}
.pop.split .ptitle span{font-size:10px}
.pop.split .vs{flex:0 0 auto;margin:5px 0 0}
.pop.split .gstats{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;

.pop.split .gstats .st{padding:2px 7px;font-size:10px}
.pop.split .gstats .st b{font-size:11px}

.pop.split .st.down b{color:var(--bad)}
.pop.split .pdemo{flex:0 0 auto;margin-top:7px;padding-top:7px;gap:6px}
.pop.split .dtile{padding:1px 5px}
.pop.split .dtile b{font-size:11px}
.pop.split .dtile i{font-size:9.5px}

.gtab.holding{background-repeat:no-repeat}
.slot.holding{background-repeat:no-repeat}
.purse{font:700 14px system-ui,sans-serif;color:#c08a1f;margin-left:auto;margin-right:10px}

.dbg.restart{background:#c2401f;border-color:#c2401f;color:#fff}

.devvars{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.devgroup{border-top:1px solid var(--ring)}

.app.witnessing .controls,.app.witnessing .devbtn,.app.witnessing .buypanel{visibility:hidden}

.wscene{flex:1 1 auto;position:relative;touch-action:none}

.wscrub{position:relative;height:36px;touch-action:none}
.wtrack,.wfill{position:absolute;left:0;top:16px;height:4px;border-radius:2px}
.wtrack{right:0;background:rgba(255,255,255,0.18)}
.wfill{background:#ff8a1f}
.wdeath{position:absolute;top:9px;width:3px;height:18px;margin-left:-1.5px;border-radius:1px;background:#ff4a3a}

            { className: "confirmCard" },
            h("p", null, "Restart the run? You’ll lose your guns and mods."),
            h(
              "div",
              { className: "confirmRow" },
              h("button", {
                className: "cancel",
                onPointerDown: (e) => {
                  e.preventDefault();
                  setConfirmAt(null);
                }
              }, "Cancel"),
              h("button", {
                className: "go",
                onPointerDown: (e) => {
                  e.preventDefault();
                  if (performance.now() - confirmAt < 400) return;
                  setConfirmAt(null);
                  restart();
                }
              }, "Yes, restart")
            )
          )
        ) : null
      ),
      h(
        "div",
        { className: "controls", ref: ctlRef },
        LO.perks && LO.perks.length ? h(
          "div",
          { className: "perkrow" },
          LO.perks.map((id, i) => PERKS[id] ? h("span", {
            key: i,
            className: "perkpip",
            title: PERKS[id].name,
            style: { color: PERKS[id].tint }
          }, PERKS[id].glyph) : null)
        ) : null,
        h(
          "div",
          { className: "sticks" },
          h(Stick, { size, kind: "left", input, refresh }),
          h(Stick, { size, kind: "right", input, refresh }),
          // gold sits in the gap between the two sticks, down level with their bottom halves.
          // "g" not "gold", and thousands truncate to a "k" (1234 -> 1.2k, 2000 -> 2k).
          h("div", { className: "gold" }, fmtGold(LO.gold), h("span", null, "g")),
          // the gun buttons ride an arc round the right stick; tap to hold it, hold for its card
          h(
            "div",
            { className: "slots" },
            LO.guns.map((g, i) => h("button", {
              key: i,
              className: "dbtn slot" + (g ? "" : " empty") + (i === LO.sel ? " on" : "") + (held === i ? " holding" : ""),
              style: btnAt(deck.guns[i]),
              title: g ? g.name + " — hold for details" : "Empty slot",
              onPointerDown: holdPress(
                () => select(i),
                () => {
                  if (input.current.loadout.guns[i]) setGunInfo(i);
                },
                (on) => setHeld(on ? i : -1)
              )
            }, g ? h(GunIcon, { gun: g }) : null))
          ),
          // the bag mirrors the last gun on the left, and the map toggle sits right above it
          h(
            "button",
            {
              className: "dbtn weapon" + (canEdit ? "" : " locked"),
              style: btnAt(deck.bag),
              title: canEdit ? "Bag: guns & mods" : "Bag: guns & mods (edit in the shop or with Tinker)",
              "aria-label": "Bag",
              onPointerDown: (e) => {
                e.preventDefault();
                setMapOpen(false);
                setEdit(true);
              }
            },
            h("span", { className: "emo" }, "🎒"),
            LO.bag.length ? h("b", { className: "badge" }, LO.bag.length) : null
          ),
          h(
            "button",
            {
              className: "dbtn mapbtn" + (mapOpen ? " on" : ""),
              style: btnAt(deck.map),
              title: "Map",
              "aria-label": "Map",
              onPointerDown: (e) => {
                e.preventDefault();
                setMapOpen((v) => !v);
              }
            },
            h("span", { className: "emo" }, "🗺️")
          )
        )
      ),
      edit ? h(Editor, { input, refresh, canEdit, close: () => setEdit(false) }) : null,
      devOpen ? h(DevPanel, {
        input,
        refresh,
        close: () => setDevOpen(false),
        onRestart: () => {
          setDevOpen(false);
          setConfirmAt(performance.now());
        },
        onSpawnGun: () => {
          setDevOpen(false);
          setSpawnOpen(true);
        }
      }) : null,
      spawnOpen ? h(SpawnGun, { input, close: () => setSpawnOpen(false) }) : null,
      found ? h(GunSwap, { input, refresh, onDone: () => {
        setGunInfo(-1);
        refresh();
      } }) : null,
      gunInfo >= 0 && LO.guns[gunInfo] ? h(
        "div",
        null,
        h("div", { className: "shade", onPointerDown: (e) => {
          e.preventDefault();
          setGunInfo(-1);
        } }),
        h(GunCard, {
          gun: LO.guns[gunInfo],
          label: "Slot " + (gunInfo + 1),
          onClose: () => setGunInfo(-1)
        })
      ) : null
    );
  }

  // src/main.js
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
