<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CaveRunner v14</title>
<style>
:root{
  --bg:#cfdbe4; --text:#1c2a38; --muted:rgba(28,42,56,0.55);
  --pad:rgba(28,42,56,0.07); --ring:rgba(28,42,56,0.25);
  --line:rgba(28,42,56,0.3); --knob:#1c2a38; --jet:rgba(255,138,31,0.18);
  --btn:#e3ebf1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
    --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
    --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
    --btn:#1a2633;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
  --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
  --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
  --btn:#1a2633;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{height:100%}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#12141a}
.game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:none}
.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:42px}
.sticks{display:flex;justify-content:space-evenly}
.slots{display:flex;gap:6px}
.slot{position:relative;width:46px;height:40px;border-radius:8px;border:1px solid var(--ring);
  background:var(--btn);padding:0;touch-action:none;cursor:pointer}
.slot.on{border:2px solid #ff8a1f}
.slot.empty{opacity:.4;cursor:default}
.num{position:absolute;top:2px;left:5px;font-size:10px;color:var(--muted)}
.ico{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)}
.ico.gun{width:18px;height:5px;border-radius:2px;background:#e0a100}
.ico.grenade{width:12px;height:12px;border-radius:50%;background:#5f9e3a}
.stick{position:relative;flex:none;border-radius:50%;background:var(--pad);
  border:2px solid var(--ring);overflow:hidden;touch-action:none}
.hline{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.jetzone{position:absolute;left:0;right:0;top:0;height:50%;background:var(--jet);opacity:0;transition:opacity .1s}
.jetting .jetzone{opacity:1}
.knob{position:absolute;left:50%;top:50%;width:26%;height:26%;border-radius:50%;
  background:var(--knob);opacity:.75;pointer-events:none}
.lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.lbl.top{top:13%}
.lbl.bot{bottom:13%}
.weapon{height:40px;padding:0 16px;border-radius:20px;cursor:pointer;
  border:1px solid var(--ring);background:var(--btn);color:var(--text);
  font:600 14px system-ui,-apple-system,sans-serif;display:flex;align-items:center;gap:8px;touch-action:none}
.wicon{width:10px;height:10px;border-radius:50%;background:#e0a100}
.slots{flex:1 1 auto;min-width:0}
.slot{flex:1 1 0;width:auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:1px;overflow:hidden}
.gname{font:600 10px system-ui,sans-serif;color:var(--text);max-width:100%;padding:0 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{font:500 9px system-ui,sans-serif;color:var(--muted)}
.badge{margin-left:2px;font-size:11px;opacity:.7}

/* ---- mod sheet ---- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;padding:0 12px calc(12px + env(safe-area-inset-bottom));
  padding-top:calc(10px + env(safe-area-inset-top))}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 8px}
.shead h2{margin:0;font-size:17px}
.done{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--ring);
  background:var(--btn);color:var(--text);font:600 14px system-ui,sans-serif}
.gtabs{display:flex;gap:6px;margin-bottom:8px}
.gtab{flex:1 1 0;min-width:0;height:44px;border-radius:9px;border:1px solid var(--ring);
  background:var(--btn);color:var(--text);padding:0 4px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:1px;overflow:hidden}
.gtab.on{border:2px solid #ff8a1f}
.gtab.empty{opacity:.4}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.st{background:var(--pad);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--muted);
  display:flex;gap:5px;align-items:baseline}
.st b{font-size:12px;color:var(--text)}
.lab{font-size:11px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.06em}
.slotRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bag{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow-y:auto;
  flex:1 1 0;min-height:70px;border-radius:9px;background:var(--pad);padding:6px}
.tile{width:60px;height:56px;border-radius:9px;border:1px solid var(--ring);background:var(--btn);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;cursor:grab;overflow:hidden;flex:0 0 auto}
.tile.hole{border-style:dashed;opacity:.5;cursor:default}
.tile.shot{box-shadow:inset 0 0 0 2px currentColor}
.tg{font-size:17px;line-height:1}
.tn{font:500 8.5px system-ui,sans-serif;color:var(--muted);text-align:center;line-height:1.1;
  max-width:100%;padding:0 2px}
.ghost{position:fixed;z-index:30;width:60px;height:56px;border-radius:9px;border:2px solid;
  background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:20px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
.info{min-height:30px;font-size:12px;color:var(--muted);padding:7px 2px 0}
.info b{color:var(--text)}

/* ---- mod detail card ---- */
.shade{position:fixed;inset:0;z-index:27;background:rgba(0,0,0,0.42)}
.pop{position:fixed;z-index:28;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  max-height:82%;overflow-y:auto;background:var(--btn);border:1px solid var(--ring);
  border-radius:15px;padding:12px 13px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.35)}
.phead{display:flex;align-items:center;gap:10px}
.pglyph{width:42px;height:42px;flex:0 0 auto;border:2px solid;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.ptitle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.ptitle b{font-size:16px}
.ptitle span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pclose{flex:0 0 auto;width:34px;height:34px;border-radius:17px;border:1px solid var(--ring);
  background:var(--pad);color:var(--text);font-size:19px;line-height:1;padding:0}
.pinfo{margin:9px 0 0;font-size:13px}
.prows{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:9px}
.prow{background:var(--pad);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--muted);
  display:flex;gap:6px;align-items:baseline}
.prow b{font-size:12px;color:var(--text)}
.pdemo{margin-top:11px;border-top:1px solid var(--ring);padding-top:9px;
  display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:flex-start;gap:8px}
.dmark{flex:0 0 auto;width:18px;font-size:14px;font-weight:700;line-height:20px;text-align:center}
.dmark.yes{color:#3aa76d}
.dmark.no{color:#d5563a}
.dtiles{display:flex;gap:4px;flex-wrap:wrap}
.dtile{border:1px solid;border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:4px}
.dtile b{font-size:12px;line-height:1}
.dtile i{font-style:normal;font:600 10px system-ui,sans-serif;color:var(--text);opacity:.8}
.dtile.off{opacity:.42}
.dnote{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.buy{position:absolute;left:50%;transform:translateX(-50%);bottom:78px;display:flex;align-items:center;
  gap:8px;height:42px;padding:0 18px;border-radius:21px;border:2px solid #ffc93c;
  background:rgba(20,22,28,0.82);color:#fff;font:600 14px system-ui,sans-serif;touch-action:none}
.buy b{color:#ffc93c}
.buy.cant{border-color:rgba(255,255,255,0.25);opacity:.55}
.weapon.locked{opacity:.45}
.purse{font:700 14px system-ui,sans-serif;color:#c08a1f;margin-left:auto;margin-right:10px}
.reset{position:absolute;top:10px;right:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.35);
  color:#e9ecf2;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useRef, useEffect, useState } = React;
const h = React.createElement;

// ---- world ----
const CELL = 2;                   // world units per terrain pixel
const CW = 320, CH = 800;         // terrain size in pixels
const WW = CW * CELL, WH = CH * CELL;
const BW = CW / 2, BH = CH / 2;   // background at half resolution
const VIEW_W = 360;               // world units visible across a phone screen
const VIEW_MIN_H = 340;           // wide screens: keep at least this much height in view
const ROCK = 1, BRICK = 2, BED = 3;
const VERSION = 'v14';

// ---- tuning ----
const GRAVITY = 1400;
const WALK = 150, GROUND_ACC = 1400, AIR_ACC = 600;
const JET = 240, JET_ACC = 900;
const DEAD = 0.12;
const PW = 12, PH = 22;
const FUEL_DRAIN = 0.28, FUEL_REGEN = 0.7, FUEL_RESTART = 0.2;
const PLAYER_HP = 100;
const START_GOLD = 40;
const ENEMY_HP = 3, ENEMY_RANGE = 220, ENEMY_BULLET = 180, ENEMY_DMG = 10, ENEMY_COUNT = 20;
const NO_INPUT = { active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false };

const THEME = {
  name: 'Mossy caves',
  bg: [16, 18, 24], bg2: [34, 37, 46],
  rock: [[62, 56, 54], [96, 84, 74]],
  moss: [[62, 104, 40], [108, 150, 64]],
  brick: [[112, 84, 62], [146, 110, 78]], mortar: [66, 50, 40],
  bed: [[28, 28, 34], [44, 44, 52]],
};

const COL = {
  text: '#e9ecf2', muted: 'rgba(233,236,242,0.55)', barBg: 'rgba(255,255,255,0.12)',
  player: '#ff5a36', visor: '#17222e', bullet: '#ffc93c', flame: '#ff8a1f', flame2: '#ffe066',
  enemy: '#b57cff', eye: '#f4f0ff', smoke: '#9aa3ad', hp: '#46c48c', grenade: '#7cc04f', portal: '#5ee0a0',
};

// ---- mods ----
// 'shot' mods are the projectiles. 'mod' mods change the shots cast AFTER them in
// the list, so the order you arrange them in is the whole game. 'passive' mods
// work from anywhere on the gun.
const MODS = {
  bolt:    { name: 'Bolt', kind: 'shot', glyph: '•', col: '#ffc93c', mana: 5,
             info: 'Cheap all-rounder',
             dmg: 1, speed: 540, spread: 2, delay: 0.10, size: 2, life: 1.2, recoil: 6 },
  spark:   { name: 'Spark', kind: 'shot', glyph: '·', col: '#ffe066', mana: 3,
             info: 'Fast, weak and nearly free',
             dmg: 0.5, speed: 720, spread: 5, delay: 0.05, size: 1.5, life: 0.8, recoil: 2 },
  slug:    { name: 'Slug', kind: 'shot', glyph: '⬤', col: '#e88a3c', mana: 20,
             info: 'Slow and very heavy',
             dmg: 4, speed: 320, spread: 1, delay: 0.26, size: 4, life: 1.6, recoil: 45 },
  buck:    { name: 'Buckshot', kind: 'shot', glyph: '⁙', col: '#ffb347', mana: 12,
             info: 'Five pellets in a cone',
             dmg: 0.7, speed: 460, spread: 15, delay: 0.32, size: 2, life: 0.7, count: 5, recoil: 32 },
  lance:   { name: 'Lance', kind: 'shot', glyph: '➤', col: '#7ad7ff', mana: 20,
             info: 'Very fast, punches through two',
             dmg: 2, speed: 900, spread: 0.6, delay: 0.28, size: 2, life: 1.2, pierce: 2, recoil: 22 },
  orb:     { name: 'Bounce Orb', kind: 'shot', glyph: '◍', col: '#9ef07a', mana: 8,
             info: 'Ricochets off rock ten times',
             dmg: 2, speed: 300, spread: 0.6, delay: 0.14, size: 3.5, life: 4, bounce: 10, recoil: 8 },
  blast:   { name: 'Blast', kind: 'shot', glyph: '✹', col: '#7cc04f', mana: 28,
             info: 'Lobbed, explodes and digs',
             dmg: 2, speed: 380, spread: 2, delay: 0.5, size: 3.5, life: 3, grav: 600,
             explode: 28, recoil: 25 },

  dmg_up:  { name: 'Damage Plus', kind: 'mod', glyph: '✚', col: '#ff7a5a', mana: 5, d: 0.08,
             info: '+1.5 damage', f: s => { s.dmg += 1.5; s.recoil += 10; } },
  heavy:   { name: 'Heavy Shot', kind: 'mod', glyph: '⬇', col: '#ff7a5a', mana: 7, d: 0.17,
             info: 'x2.5 damage, x0.35 speed, big kick',
             f: s => { s.dmg *= 2.5; s.speed *= 0.35; s.size *= 1.4; s.recoil += 50; } },
  light:   { name: 'Light Shot', kind: 'mod', glyph: '⬆', col: '#7ad7ff', mana: 5, d: -0.05,
             info: 'x4 speed, x0.6 damage, tighter',
             f: s => { s.dmg *= 0.6; s.speed *= 4; s.size *= 0.7; s.spread = Math.max(0, s.spread - 6); s.recoil *= 0.5; } },
  speed:   { name: 'Speed Up', kind: 'mod', glyph: '»', col: '#7ad7ff', mana: 3,
             info: 'x2.5 speed', f: s => { s.speed *= 2.5; } },
  accel:   { name: 'Accelerating', kind: 'mod', glyph: '↗', col: '#7ad7ff', mana: 18, d: 0.13,
             info: 'starts slow, speeds up hard', f: s => { s.speed *= 0.35; s.accel = 3.6; } },
  homing:  { name: 'Homing', kind: 'mod', glyph: '◎', col: '#b57cff', mana: 40,
             info: 'curves onto enemies', f: s => { s.homing += 3.5; } },
  seeker:  { name: 'Seeker', kind: 'mod', glyph: '⊙', col: '#b57cff', mana: 60,
             info: 'hard homing, x0.8 speed', f: s => { s.homing += 10; s.speed *= 0.8; } },
  bounce:  { name: 'Bouncing', kind: 'mod', glyph: '⤢', col: '#9ef07a', mana: 6,
             info: '+5 bounces', f: s => { s.bounce += 5; } },
  pierce:  { name: 'Piercing', kind: 'mod', glyph: '⊹', col: '#9ef07a', mana: 70,
             info: '+3 pierce, x0.75 damage', f: s => { s.pierce += 3; s.dmg *= 0.75; } },
  tight:   { name: 'Reduce Spread', kind: 'mod', glyph: '│', col: '#e9ecf2', mana: 1,
             info: '-20° spread', f: s => { s.spread = Math.max(0, s.spread - 20); } },
  scatter: { name: 'Scatter', kind: 'mod', glyph: '≡', col: '#ffb347', mana: 4, d: -0.1,
             info: 'x3 shots, wide, weaker',
             f: s => { s.count *= 3; s.spread += 14; s.dmg *= 0.55; } },
  big:     { name: 'Big Shot', kind: 'mod', glyph: '⬢', col: '#ff7a5a', mana: 6, d: 0.06,
             info: 'x2 size, x1.3 damage', f: s => { s.size *= 2; s.dmg *= 1.3; s.recoil += 20; } },
  range:   { name: 'Long Range', kind: 'mod', glyph: '⟶', col: '#e9ecf2', mana: 30, d: 0.2,
             info: 'x2.5 flight time', f: s => { s.life *= 2.5; } },
  brief:   { name: 'Short Fuse', kind: 'mod', glyph: '⟜', col: '#e9ecf2', mana: 8, d: -0.22,
             info: 'x0.45 flight time, fast cast', f: s => { s.life *= 0.45; } },
  tip:     { name: 'Explosive Tip', kind: 'mod', glyph: '✸', col: '#ff8a1f', mana: 28, d: 0.3,
             info: 'blows a hole on impact',
             f: s => { s.explode = Math.max(s.explode, 15); s.dmg += 1; s.speed *= 0.8; } },
  borer:   { name: 'Borer', kind: 'mod', glyph: '⛏', col: '#c8a06a', mana: 4, d: 0.02,
             info: 'drills through rock', f: s => { s.bore = 6; s.life *= 1.4; } },
  fast:    { name: 'Fast Cast', kind: 'mod', glyph: '≫', col: '#46c48c', mana: 3, d: -0.08,
             info: '-0.08s cast delay' },
  over:    { name: 'Overcharge', kind: 'mod', glyph: '⚡', col: '#ff7a5a', mana: 12, d: 0.2,
             info: 'x1.8 damage, slow cast', f: s => { s.dmg *= 1.8; s.recoil += 30; } },
  double:  { name: 'Double Cast', kind: 'mod', glyph: '②', col: '#ffe066', mana: 0,
             info: 'fires the next 2 shots at once', multi: 1 },
  triple:  { name: 'Triple Cast', kind: 'mod', glyph: '③', col: '#ffe066', mana: 2,
             info: 'fires the next 3 shots at once', multi: 2 },
  quad:    { name: 'Quad Cast', kind: 'mod', glyph: '④', col: '#ffe066', mana: 5,
             info: 'fires the next 4 shots at once', multi: 3 },
  cheap:   { name: 'Efficient', kind: 'mod', glyph: '◇', col: '#46c48c', mana: 0, d: 0.1,
             info: 'halves the mana cost', manaMul: 0.5 },

  recharge: { name: 'Quick Recharge', kind: 'passive', glyph: '↻', col: '#46c48c', mana: 0,
              info: '-0.33s recharge', rech: -0.33 },
  battery:  { name: 'Mana Battery', kind: 'passive', glyph: '▮', col: '#46c48c', mana: 0,
              info: '+60 mana, +30 regen', manaMax: 60, manaRegen: 30 },
};
// shop prices in gold
const MOD_PRICE = {
  bolt: 20, spark: 12, slug: 40, buck: 35, lance: 45, orb: 30, blast: 45,
  dmg_up: 30, heavy: 40, light: 30, speed: 25, accel: 35, homing: 70, seeker: 90,
  bounce: 25, pierce: 85, tight: 15, scatter: 35, big: 30, range: 30, brief: 20,
  tip: 55, borer: 25, fast: 30, over: 45, double: 45, triple: 60, quad: 75, cheap: 40,
  recharge: 50, battery: 50,
};
const priceOf = id => MOD_PRICE[id] || 30;

// the shop room sits under the whole cave: floor, interior, then a brick roof
const SHOP_FLOOR = CH - 10;            // first row of solid floor
const SHOP_H = 48;                     // interior height
const SHOP_TOP = SHOP_FLOOR - SHOP_H;  // first open row of the room
const SHOP_ROOF = 6;                   // roof thickness
const SHOP_Y = SHOP_TOP * CELL;        // world y of the ceiling, for "am I in the shop?"

const SHOT_IDS = Object.keys(MODS).filter(k => MODS[k].kind === 'shot');
const ALL_IDS = Object.keys(MODS);

// ---- guns ----
const GUN_A = ['Rusty', 'Bone', 'Cracked', 'Copper', 'Glass', 'Ivory', 'Molten', 'Static',
               'Hollow', 'Ember', 'Quartz', 'Iron', 'Pale', 'Gilded'];
const GUN_B = ['Pistol', 'Repeater', 'Carbine', 'Scattergun', 'Lance', 'Sidearm',
               'Blaster', 'Cannon', 'Spitter', 'Wand'];

function shuffleOrder(g) {
  g.order = g.slots.map((_, i) => i);
  if (g.shuffle) for (let i = g.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [g.order[i], g.order[j]] = [g.order[j], g.order[i]];
  }
}
function resetGun(g) {
  g.idx = 0; g.delayT = 0; g.rechT = 0;
  shuffleOrder(g);
  return g;
}

// tier 0..1: guns found higher up the cave are better
function makeGun(rnd, tier) {
  const cap = Math.min(8, 2 + Math.floor(rnd() * 4 + tier * 3));
  const g = {
    name: GUN_A[Math.floor(rnd() * GUN_A.length)] + ' ' + GUN_B[Math.floor(rnd() * GUN_B.length)],
    cap,
    castDelay: Math.max(0.04, 0.34 - tier * 0.14 + rnd() * 0.2),
    recharge: Math.max(0.15, 1.2 - tier * 0.45 + rnd() * 0.6),
    manaMax: Math.round(90 + tier * 260 + rnd() * 130),
    manaRegen: Math.round(25 + tier * 75 + rnd() * 45),
    spread: rnd() * 9 * (1 - tier * 0.5),
    speedMul: 0.8 + rnd() * (0.5 + tier * 0.5),
    multi: rnd() < 0.12 + tier * 0.22 ? 2 : 1,
    shuffle: rnd() < 0.35 - tier * 0.18,
    slots: new Array(cap).fill(null),
  };
  // seed it with something that already shoots
  const used = 1 + Math.floor(rnd() * Math.min(cap, 2 + tier * 3));
  const spots = g.slots.map((_, i) => i).sort(() => rnd() - 0.5).slice(0, used);
  spots.forEach((slot, n) => {
    g.slots[slot] = n === 0 ? SHOT_IDS[Math.floor(rnd() * SHOT_IDS.length)]
                            : ALL_IDS[Math.floor(rnd() * ALL_IDS.length)];
  });
  if (!g.slots.some(id => id && MODS[id].kind === 'shot')) g.slots[spots[0]] = 'bolt';
  g.mana = g.manaMax;
  return resetGun(g);
}

function startingGuns() {
  // three bolts before it needs a breather, so it feels like a gun from the start
  const pistol = resetGun({ name: 'Scratch Pistol', cap: 4, castDelay: 0.12, recharge: 0.35,
    manaMax: 140, manaRegen: 55, spread: 3, multi: 1, shuffle: false, mana: 140, speedMul: 1,
    slots: ['bolt', 'bolt', 'bolt', null] });
  const blaster = resetGun({ name: 'Old Blaster', cap: 3, castDelay: 0.5, recharge: 1.1,
    manaMax: 150, manaRegen: 30, spread: 2, multi: 1, shuffle: false, mana: 150, speedMul: 1,
    slots: ['blast', null, null] });
  return [pistol, blaster, null, null];
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the shots that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
function planCast(g) {
  const start = g.idx, mods = [], defs = [];
  let multi = g.multi, cost = 0, manaMul = 1, delay = 0, ran = false, wrapped = 0;
  for (let guard = 0; defs.length < multi && guard < 64; guard++) {
    if (g.idx >= g.order.length) {
      ran = true;
      // a multicast still owed shots wraps back to the front to find them
      if (defs.length >= multi || wrapped++ || !defs.length && !mods.length) break;
      g.idx = 0;
    }
    const id = g.slots[g.order[g.idx]];
    g.idx++;
    if (!id) continue;
    const m = MODS[id];
    if (m.kind === 'passive') continue;
    if (m.kind === 'mod') {
      mods.push(m);
      cost += m.mana || 0;
      if (m.multi) multi += m.multi;
      if (m.manaMul) manaMul *= m.manaMul;
      if (m.d) delay += m.d;
      continue;
    }
    defs.push(m);
    cost += m.mana;
  }
  const shots = defs.map(sm => {
    const sh = { dmg: sm.dmg, speed: sm.speed, spread: sm.spread + g.spread, size: sm.size,
      life: sm.life, count: sm.count || 1, bounce: sm.bounce || 0, pierce: sm.pierce || 0,
      explode: sm.explode || 0, grav: sm.grav || 0, homing: 0, accel: 0, bore: 0,
      recoil: sm.recoil || 0, col: sm.col };
    for (const m of mods) if (m.f) m.f(sh);
    sh.speed *= g.speedMul || 1;
    delay += sm.delay;
    return sh;
  });
  let more = false;                       // anything left worth firing this cycle?
  for (let i = g.idx; i < g.order.length; i++) {
    const id = g.slots[g.order[i]];
    if (id && MODS[id].kind === 'shot') { more = true; break; }
  }
  return { shots, start, cost: cost * manaMul,
    delay: Math.max(0.03, g.castDelay + delay),
    wrap: ran || !more };
}

// What does this mod actually do? Rather than describing it by hand, run a plain
// bolt through the planner with and without it and report whatever changed.
const PREVIEW_FIELDS = [['dmg', 'damage'], ['speed', 'speed'], ['spread', 'spread', '\u00b0'],
  ['size', 'size'], ['life', 'flight time', 's'], ['bounce', 'bounces'], ['pierce', 'pierce'],
  ['homing', 'homing'], ['explode', 'blast radius'], ['bore', 'drill'], ['recoil', 'recoil'],
  ['accel', 'acceleration']];
const num = v => {
  const r = Math.round(v * 100) / 100;
  return String(r);
};
function previewPlan(slots) {
  return planCast(resetGun({ name: 'p', cap: slots.length, castDelay: 0, recharge: 1,
    manaMax: 99999, manaRegen: 0, spread: 0, multi: 1, shuffle: false, mana: 99999,
    speedMul: 1, slots }));
}
function modPreview(id) {
  const m = MODS[id];
  if (m.kind === 'passive') return { rows: [] };
  if (m.kind === 'shot') {
    const p = previewPlan([id]);
    const sh = p.shots[0], rows = [['mana', num(p.cost)], ['cast delay', num(p.delay) + 's']];
    for (const [key, label, unit] of PREVIEW_FIELDS) {
      if (!sh[key]) continue;
      rows.push([label, num(sh[key]) + (unit || '')]);
    }
    if (sh.count > 1) rows.splice(2, 0, ['pellets', num(sh.count)]);
    return { rows };
  }
  const a = previewPlan(['bolt']);
  const b = previewPlan([id, 'bolt', 'bolt', 'bolt', 'bolt']);
  const rows = [];
  const push = (label, x, y, unit) => {
    if (Math.abs(x - y) < 1e-6) return;
    rows.push([label, num(x) + (unit || '') + ' \u2192 ' + num(y) + (unit || '')]);
  };
  push('shots per pull', a.shots.length, b.shots.length);
  push('mana', a.cost, b.cost);
  push('cast delay', a.delay, b.delay, 's');
  const sa = a.shots[0], sb = b.shots[0];
  if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
  return { rows };
}

// what the gun actually does with the mods on it right now
function gunPassives(g) {
  let rech = 0, manaMax = 0, manaRegen = 0;
  for (const id of g.slots) {
    if (!id) continue;
    const m = MODS[id];
    if (m.rech) rech += m.rech;
    if (m.manaMax) manaMax += m.manaMax;
    if (m.manaRegen) manaRegen += m.manaRegen;
  }
  return { rech, manaMax, manaRegen };
}

const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function makeLevel(seed, floor) {
  floor = floor || 1;
  const hash = (x, y) => {
    let v = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 982451653)) | 0;
    v = Math.imul(v ^ (v >>> 13), 1274126177);
    v ^= v >>> 16;
    return (v >>> 0) / 4294967296;
  };
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y) => 0.55 * vn(x, y) + 0.3 * vn(x * 2 + 17, y * 2 + 31) + 0.15 * vn(x * 4 + 53, y * 4 + 7);
  let rs = seed % 2147483646 + 1;
  const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 12; i++) rnd();     // this generator starts cold on small seeds

  const mat = new Uint8Array(CW * CH);
  const inside = (x, y) => x >= 0 && y >= 0 && x < CW && y < CH;
  const disc = (ex, ey, r, v) => {
    const r2 = r * r;
    for (let y = Math.floor(ey - r); y <= Math.ceil(ey + r); y++)
      for (let x = Math.floor(ex - r); x <= Math.ceil(ex + r); x++)
        if (inside(x, y) && (x - ex) * (x - ex) + (y - ey) * (y - ey) <= r2) mat[y * CW + x] = v;
  };

  // 1. solid ground with caves eaten out of it.
  //    A slow "openness" noise decides whether an area is cramped or vast.
  for (let cy = 0; cy < CH; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const open = Math.min(1, Math.max(0, (fbm(cx / 160 + 500, cy / 160 + 500) - 0.42) / 0.16));
      const pocket = fbm(cx / 60, cy / 60) < 0.34 + 0.24 * open;
      const tunnel = Math.abs(fbm(cx / 90 + 200, cy / 90 + 200) - 0.5) < 0.018 + 0.018 * open;
      mat[cy * CW + cx] = pocket || tunnel ? 0 : ROCK;
    }
  }

  // 2. main route from bottom to top: chambers linked by winding tunnels
  //    that are always wide enough to fly through (side pockets still need blasting)
  const shopExit = 40 + Math.floor(rnd() * (CW - 80));   // the one way out of the shop
  const points = [{ x: shopExit, y: SHOP_TOP - 30 }];
  const hops = 6;
  for (let i = 1; i <= hops; i++) {
    points.push({ x: 40 + rnd() * (CW - 80), y: CH - 26 - (CH - 60) * i / (hops + 1) + (rnd() - 0.5) * 40 });
  }
  points.push({ x: CW / 2, y: 22 });

  const blob = (ex, ey, r) => {
    const r2 = r * 1.3;
    for (let y = Math.floor(ey - r2); y <= ey + r2; y++)
      for (let x = Math.floor(ex - r2); x <= ex + r2; x++) {
        if (!inside(x, y)) continue;
        const a = Math.atan2(y - ey, x - ex);
        const wob = r * (0.75 + 0.5 * vn(Math.cos(a) * 1.5 + ex, Math.sin(a) * 1.5 + ey));
        if (Math.hypot(x - ex, (y - ey) * 1.4) <= wob) mat[y * CW + x] = 0;
      }
  };
  const routePath = [];   // remembered so smoothing can't pinch the links shut
  const worm = (x, y, tx, ty, r, maxSteps, keep) => {
    let ang = tx !== null ? Math.atan2(ty - y, tx - x) : rnd() * Math.PI * 2;
    for (let s = 0; s < maxSteps; s++) {
      disc(x, y, r, 0);
      if (keep) routePath.push({ x, y, r: r - 1 });
      if (tx !== null && Math.hypot(tx - x, ty - y) < 3) break;
      const want = tx !== null ? Math.atan2(ty - y, tx - x) : ang;
      let diff = want - ang;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      ang += diff * 0.12 + (rnd() - 0.5) * 0.9;
      x += Math.cos(ang) * 1.5; y += Math.sin(ang) * 1.5;
      x = Math.max(6, Math.min(CW - 7, x)); y = Math.max(6, Math.min(CH - 12, y));
    }
  };
  for (let i = 1; i < points.length - 1; i++) {
    if (rnd() < 0.7) blob(points[i].x, points[i].y, 16 + rnd() * 30);
  }
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const r = rnd() < 0.4 ? 7 + rnd() * 2 : 11 + rnd() * 6;   // tight ones are still snug, but you fit
    worm(a.x, a.y, b.x, b.y, r, 2000, true);
  }
  // side branches and dead ends
  for (let i = 0; i < 12; i++) {
    worm(10 + rnd() * (CW - 20), 20 + rnd() * (CH - 60), null, null, 5 + rnd() * 6, 40 + rnd() * 150, true);
  }

  // 3. smooth everything into natural shapes
  for (let pass = 0; pass < 4; pass++) {
    const src = mat.slice();
    for (let cy = 1; cy < CH - 1; cy++)
      for (let cx = 1; cx < CW - 1; cx++) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) if (src[(cy + dy) * CW + cx + dx]) n++;
        mat[cy * CW + cx] = n >= 5 ? ROCK : 0;
      }
  }
  for (const c of routePath) disc(c.x, c.y, c.r, 0);

  // solid floor and the exit room at the top
  for (let cy = SHOP_FLOOR; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) mat[cy * CW + cx] = ROCK;
  const carve = (ex, ey, rx, ry, maxY) => {
    for (let y = Math.max(0, ey - ry); y <= Math.min(maxY, ey + ry); y++)
      for (let x = Math.max(0, ex - rx); x <= Math.min(CW - 1, ex + rx); x++) {
        const dx = (x - ex) / rx, dy = (y - ey) / ry;
        if (dx * dx + dy * dy <= 1) mat[y * CW + x] = 0;
      }
  };
  carve(CW / 2, 22, 40, 16, CH);

  const emptyRatio = (x0, y0, w, hh) => {
    let e = 0, n = 0;
    for (let y = y0; y < y0 + hh; y++)
      for (let x = x0; x < x0 + w; x++) { n++; if (inside(x, y) && !mat[y * CW + x]) e++; }
    return e / n;
  };
  const slab = (x0, y0, w, hh) => {
    for (let y = y0; y < y0 + hh; y++)
      for (let x = x0; x < x0 + w; x++) if (inside(x, y)) mat[y * CW + x] = BRICK;
  };

  // 4. built ledges sticking out of cave walls
  let ledges = 0;
  for (let a = 0; a < 600 && ledges < 30; a++) {
    const x = 10 + Math.floor(rnd() * (CW - 20)), y = 20 + Math.floor(rnd() * (SHOP_TOP - 50));
    if (mat[y * CW + x]) continue;
    const dir = rnd() < 0.5 ? -1 : 1;
    let wx = x, dist = 0;
    while (dist < 50 && inside(wx, y) && !mat[y * CW + wx]) { wx += dir; dist++; }
    if (dist >= 50 || dist < 8) continue;
    const len = Math.min(dist + 4, 14 + Math.floor(rnd() * 26));
    const x0 = dir < 0 ? wx - 3 : wx - len + 4;
    if (emptyRatio(dir < 0 ? wx + 1 : x0, y - 12, len - 4, 12) < 0.9) continue;
    slab(x0, y, len, 4);
    ledges++;
  }

  // 5. old brick frames half buried in the rock
  for (let i = 0; i < 9; i++) {
    const fw = 30 + Math.floor(rnd() * 40), fh = 20 + Math.floor(rnd() * 20);
    const fx = 8 + Math.floor(rnd() * (CW - 16 - fw)), fy = 60 + Math.floor(rnd() * (SHOP_TOP - 120));
    const rockRatio = 1 - emptyRatio(fx, fy, fw, fh);
    if (rockRatio < 0.25 || rockRatio > 0.85) continue;
    const gap = Math.floor(rnd() * 4);   // which side gets a doorway
    slab(fx, fy, fw, 4);
    slab(fx, fy + fh - 4, fw, 4);
    slab(fx, fy, 4, fh);
    slab(fx + fw - 4, fy, 4, fh);
    if (gap === 0) for (let y = fy; y < fy + 4; y++) for (let x = fx + 8; x < fx + 22; x++) mat[y * CW + x] = 0;
    if (gap === 1) for (let y = fy + 4; y < fy + fh - 4; y++) for (let x = fx; x < fx + 4; x++) mat[y * CW + x] = 0;
    if (gap === 2) for (let y = fy + 4; y < fy + fh - 4; y++) for (let x = fx + fw - 4; x < fx + fw; x++) mat[y * CW + x] = 0;
  }

  // 6. a few floating platforms in the big open spaces
  let floats = 0;
  for (let a = 0; a < 400 && floats < 10; a++) {
    const len = 18 + Math.floor(rnd() * 22);
    const x0 = 8 + Math.floor(rnd() * (CW - 16 - len)), y0 = 40 + Math.floor(rnd() * (SHOP_TOP - 80));
    if (emptyRatio(x0 - 12, y0 - 18, len + 24, 34) < 0.98) continue;
    slab(x0, y0, len, 4);
    floats++;
  }

  // clear a doorway wherever a ledge, frame or platform landed across a link
  for (const c of routePath) disc(c.x, c.y, Math.min(c.r, 7), 0);

  // ---- the shop: an enclosed room the full width of the level, one hole in the roof ----
  for (let cy = SHOP_TOP; cy < SHOP_FLOOR; cy++)
    for (let cx = 0; cx < CW; cx++) mat[cy * CW + cx] = 0;
  for (let cy = SHOP_TOP - SHOP_ROOF; cy < SHOP_TOP; cy++)
    for (let cx = 0; cx < CW; cx++) mat[cy * CW + cx] = BRICK;
  for (let cy = SHOP_FLOOR; cy < SHOP_FLOOR + 4; cy++)
    for (let cx = 0; cx < CW; cx++) mat[cy * CW + cx] = BRICK;
  // the way up, and a short shaft so the cave above is always reachable
  for (let cy = SHOP_TOP - SHOP_ROOF - 26; cy < SHOP_TOP; cy++)
    for (let cx = shopExit - 9; cx <= shopExit + 9; cx++)
      if (inside(cx, cy)) mat[cy * CW + cx] = 0;

  // exit ledge
  slab(CW / 2 - 24, 34, 48, 3);

  // unbreakable border
  for (let cy = 0; cy < CH; cy++)
    for (let cx = 0; cx < CW; cx++)
      if (cx < 3 || cx >= CW - 3 || cy < 3 || cy >= CH - 3) mat[cy * CW + cx] = BED;
  // colour the terrain
  const img = new ImageData(CW, CH);
  const d = img.data;
  for (let cy = 0; cy < CH; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const i = cy * CW + cx, m = mat[i];
      if (!m) continue;
      const r1 = hash(cx * 7 + 3, cy * 13 + 5);
      let c;
      if (m === ROCK) {
        const exposed = cy > 1 && (mat[i - CW] === 0 || mat[i - 2 * CW] === 0);
        c = exposed ? mix(THEME.moss[0], THEME.moss[1], r1)
                    : mix(THEME.rock[0], THEME.rock[1], fbm(cx / 6 + 100, cy / 6 + 100));
      } else if (m === BRICK) {
        const k = cx + (cy % 2) * 3;
        if (k % 6 === 0) c = THEME.mortar;
        else {
          c = mix(THEME.brick[0], THEME.brick[1], hash(Math.floor(k / 6), cy));
          if (cy > 0 && mat[i - CW] === 0) c = c.map(v => v * 1.18);
        }
      } else {
        c = mix(THEME.bed[0], THEME.bed[1], r1);
      }
      const j = (r1 - 0.5) * 10;
      d[i * 4] = c[0] + j; d[i * 4 + 1] = c[1] + j; d[i * 4 + 2] = c[2] + j; d[i * 4 + 3] = 255;
    }
  }

  // background
  const bgImg = new ImageData(BW, BH);
  for (let y = 0; y < BH; y++)
    for (let x = 0; x < BW; x++) {
      const t = Math.pow(fbm(x / 10 + 300, y / 10 + 300), 1.6);
      const c = mix(THEME.bg, THEME.bg2, Math.min(1, t * 1.3));
      const j = (hash(x + 900, y + 900) - 0.5) * 4, k = (y * BW + x) * 4;
      bgImg.data[k] = c[0] + j; bgImg.data[k + 1] = c[1] + j; bgImg.data[k + 2] = c[2] + j; bgImg.data[k + 3] = 255;
    }

  const start = { x: shopExit * CELL - PW / 2, y: SHOP_FLOOR * CELL - PH };

  // shop stock: a free heal and four mods, spread across the room
  const stock = [];
  const offer = ALL_IDS.slice();
  for (let i = offer.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [offer[i], offer[j]] = [offer[j], offer[i]];
  }
  const shelf = (SHOP_FLOOR - 13) * CELL;
  for (let i = 0; i < 5; i++) {
    const x = (CW / 6) * (i + 1) * CELL;
    if (i === 0) stock.push({ kind: 'heal', x, y: shelf, price: 0, sold: false });
    else {
      const id = offer[i - 1];
      stock.push({ kind: 'mod', id, x, y: shelf, price: priceOf(id), sold: false });
    }
  }
  const portal = { x: WW / 2 - 10, y: 34 * CELL - 30, w: 20, h: 30 };

  // enemies in open spaces
  const clear = (cx, cy, r) => {
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= CW || y >= CH || mat[y * CW + x]) return false;
      }
    return true;
  };
  const enemies = [];
  const wanted = Math.min(34, ENEMY_COUNT + (floor - 1) * 3);
  for (let a = 0; a < 4000 && enemies.length < wanted; a++) {
    const cx = 8 + Math.floor(rnd() * (CW - 16)), cy = 50 + Math.floor(rnd() * (SHOP_TOP - 70));
    if (!clear(cx, cy, 8)) continue;
    const x = cx * CELL, y = cy * CELL;
    if (Math.hypot(x - start.x, y - start.y) < 200) continue;
    if (enemies.some(e => Math.hypot(e.x - x, e.y - y) < 90)) continue;
    enemies.push({ x, y, ty: y, r: 9, phase: rnd() * 6.28, hp: ENEMY_HP, cd: 1 + rnd() * 2, flash: 0, lx: 0, ly: 1 });
  }

  // guns and mods to find: the higher up the cave, the better the roll
  const pickups = [];
  for (let a = 0; a < 5000 && pickups.length < 18; a++) {
    const cx = 8 + Math.floor(rnd() * (CW - 16)), cy = 30 + Math.floor(rnd() * (SHOP_TOP - 60));
    if (!clear(cx, cy, 6)) continue;
    const x = cx * CELL, y = cy * CELL;
    if (Math.hypot(x - start.x, y - start.y) < 130) continue;
    if (pickups.some(q => Math.hypot(q.x - x, q.y - y) < 110)) continue;
    const tier = Math.min(1, Math.max(0, (CH - 60 - cy) / (CH - 140) + (floor - 1) * 0.12));
    const guns = pickups.filter(q => q.kind === 'gun').length;
    if (guns < 5 && (rnd() < 0.3 || pickups.length > 12 && guns < 2)) {
      pickups.push({ kind: 'gun', x, y, gun: makeGun(rnd, tier), t: rnd() * 6.28 });
    } else {
      pickups.push({ kind: 'mod', x, y, id: ALL_IDS[Math.floor(rnd() * ALL_IDS.length)], t: rnd() * 6.28 });
    }
  }

  return { mat, img, bgImg, start, portal, enemies, pickups, stock, shopExit };
}

const approach = (v, t, a) => (v < t ? Math.min(t, v + a) : Math.max(t, v - a));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function Game({ input }) {

    const bg = document.createElement('canvas');
    bg.width = BW; bg.height = BH;
    const bgctx = bg.getContext('2d');

    let mat, img, start, portal, enemies, pickups, stock, total, floor = 1;

    const p = { x: 0, y: 0, vx: 0, vy: 0, onGround: false, face: 1, jet: 0,
      fuel: 1, empty: false, hp: PLAYER_HP, hitT: 0, dead: false, kick: 0,
      jx: 0, jy: 0, aim: { on: false, show: false, nx: 1, ny: 0 } };
    const bullets = [], enemyShots = [], smoke = [], sparks = [], flashes = [], toasts = [], coins = [];
    let smokeAcc = 0, time = 0, camX = 0, camY = 0, camReady = false;
