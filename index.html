<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CaveRunner v9</title>
<style>
:root{
  --bg:#cfdbe4; --text:#1c2a38; --muted:rgba(28,42,56,0.55);
  --pad:rgba(28,42,56,0.07); --ring:rgba(28,42,56,0.25);
  --line:rgba(28,42,56,0.3); --knob:#1c2a38; --jet:rgba(255,138,31,0.18);
  --btn:#e3ebf1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
    --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
    --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
    --btn:#1a2633;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
  --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
  --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
  --btn:#1a2633;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{height:100%}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#12141a}
.game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:none}
.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:42px}
.sticks{display:flex;justify-content:space-evenly}
.slots{display:flex;gap:6px}
.slot{position:relative;width:46px;height:40px;border-radius:8px;border:1px solid var(--ring);
  background:var(--btn);padding:0;touch-action:none;cursor:pointer}
.slot.on{border:2px solid #ff8a1f}
.slot.empty{opacity:.4;cursor:default}
.num{position:absolute;top:2px;left:5px;font-size:10px;color:var(--muted)}
.ico{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)}
.ico.gun{width:18px;height:5px;border-radius:2px;background:#e0a100}
.ico.grenade{width:12px;height:12px;border-radius:50%;background:#5f9e3a}
.stick{position:relative;flex:none;border-radius:50%;background:var(--pad);
  border:2px solid var(--ring);overflow:hidden;touch-action:none}
.hline{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.jetzone{position:absolute;left:0;right:0;top:0;height:50%;background:var(--jet);opacity:0;transition:opacity .1s}
.jetting .jetzone{opacity:1}
.knob{position:absolute;left:50%;top:50%;width:26%;height:26%;border-radius:50%;
  background:var(--knob);opacity:.75;pointer-events:none}
.lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.lbl.top{top:13%}
.lbl.bot{bottom:13%}
.weapon{height:40px;padding:0 16px;border-radius:20px;cursor:pointer;
  border:1px solid var(--ring);background:var(--btn);color:var(--text);
  font:600 14px system-ui,-apple-system,sans-serif;display:flex;align-items:center;gap:8px;touch-action:none}
.wicon{width:10px;height:10px;border-radius:50%;background:#e0a100}
.weapon.grenade .wicon{width:13px;height:13px;background:#5f9e3a}
.reset{position:absolute;top:10px;right:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.35);
  color:#e9ecf2;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useRef, useEffect, useState } = React;
const h = React.createElement;

// ---- world ----
const CELL = 2;                   // world units per terrain pixel
const CW = 320, CH = 800;         // terrain size in pixels
const WW = CW * CELL, WH = CH * CELL;
const BW = CW / 2, BH = CH / 2;   // background at half resolution
const VIEW_W = 360;               // world units visible across a phone screen
const VIEW_MIN_H = 340;           // wide screens: keep at least this much height in view
const SLOTS = [{ id: 'gun', name: 'Gun' }, { id: 'grenade', name: 'Grenades' }, null, null];
const ROCK = 1, BRICK = 2, BED = 3;
const VERSION = 'v9';

// ---- tuning ----
const GRAVITY = 1400;
const WALK = 150, GROUND_ACC = 1400, AIR_ACC = 600;
const JET = 240, JET_ACC = 900;
const DEAD = 0.12;
const PW = 12, PH = 22;
const BULLET = 540, FIRE_RATE = 0.1;
const GRENADE_SPEED = 380, GRENADE_GRAVITY = 600, GRENADE_RATE = 0.55, BLAST = 28;
const FUEL_DRAIN = 0.28, FUEL_REGEN = 0.7, FUEL_RESTART = 0.2;
const PLAYER_HP = 100;
const ENEMY_HP = 3, ENEMY_RANGE = 220, ENEMY_BULLET = 180, ENEMY_DMG = 10, ENEMY_COUNT = 20;
const NO_INPUT = { active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false };

const THEME = {
  name: 'Mossy caves',
  bg: [16, 18, 24], bg2: [34, 37, 46],
  rock: [[62, 56, 54], [96, 84, 74]],
  moss: [[62, 104, 40], [108, 150, 64]],
  brick: [[112, 84, 62], [146, 110, 78]], mortar: [66, 50, 40],
  bed: [[28, 28, 34], [44, 44, 52]],
};

const COL = {
  text: '#e9ecf2', muted: 'rgba(233,236,242,0.55)', barBg: 'rgba(255,255,255,0.12)',
  player: '#ff5a36', visor: '#17222e', bullet: '#ffc93c', flame: '#ff8a1f', flame2: '#ffe066',
  enemy: '#b57cff', eye: '#f4f0ff', smoke: '#9aa3ad', hp: '#46c48c', grenade: '#7cc04f', portal: '#5ee0a0',
};

const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function makeLevel(seed) {
  const hash = (x, y) => {
    let v = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 982451653)) | 0;
    v = Math.imul(v ^ (v >>> 13), 1274126177);
    v ^= v >>> 16;
    return (v >>> 0) / 4294967296;
  };
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y) => 0.55 * vn(x, y) + 0.3 * vn(x * 2 + 17, y * 2 + 31) + 0.15 * vn(x * 4 + 53, y * 4 + 7);
  let rs = seed % 2147483646 + 1;
  const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;

  const mat = new Uint8Array(CW * CH);
  const inside = (x, y) => x >= 0 && y >= 0 && x < CW && y < CH;
  const disc = (ex, ey, r, v) => {
    const r2 = r * r;
    for (let y = Math.floor(ey - r); y <= Math.ceil(ey + r); y++)
      for (let x = Math.floor(ex - r); x <= Math.ceil(ex + r); x++)
        if (inside(x, y) && (x - ex) * (x - ex) + (y - ey) * (y - ey) <= r2) mat[y * CW + x] = v;
  };

  // 1. solid ground with caves eaten out of it.
  //    A slow "openness" noise decides whether an area is cramped or vast.
  for (let cy = 0; cy < CH; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const open = Math.min(1, Math.max(0, (fbm(cx / 160 + 500, cy / 160 + 500) - 0.42) / 0.16));
      const pocket = fbm(cx / 60, cy / 60) < 0.34 + 0.24 * open;
      const tunnel = Math.abs(fbm(cx / 90 + 200, cy / 90 + 200) - 0.5) < 0.018 + 0.018 * open;
      mat[cy * CW + cx] = pocket || tunnel ? 0 : ROCK;
    }
  }

  // 2. main route from bottom to top: chambers linked by winding tunnels
  //    that are always wide enough to fly through (side pockets still need blasting)
  const points = [{ x: CW / 2, y: CH - 26 }];
  const hops = 6;
  for (let i = 1; i <= hops; i++) {
    points.push({ x: 40 + rnd() * (CW - 80), y: CH - 26 - (CH - 60) * i / (hops + 1) + (rnd() - 0.5) * 40 });
  }
  points.push({ x: CW / 2, y: 22 });

  const blob = (ex, ey, r) => {
    const r2 = r * 1.3;
    for (let y = Math.floor(ey - r2); y <= ey + r2; y++)
      for (let x = Math.floor(ex - r2); x <= ex + r2; x++) {
        if (!inside(x, y)) continue;
        const a = Math.atan2(y - ey, x - ex);
        const wob = r * (0.75 + 0.5 * vn(Math.cos(a) * 1.5 + ex, Math.sin(a) * 1.5 + ey));
        if (Math.hypot(x - ex, (y - ey) * 1.4) <= wob) mat[y * CW + x] = 0;
      }
  };
  const routePath = [];   // remembered so smoothing can't pinch the links shut
  const worm = (x, y, tx, ty, r, maxSteps, keep) => {
    let ang = tx !== null ? Math.atan2(ty - y, tx - x) : rnd() * Math.PI * 2;
    for (let s = 0; s < maxSteps; s++) {
      disc(x, y, r, 0);
      if (keep) routePath.push({ x, y, r: r - 1 });
      if (tx !== null && Math.hypot(tx - x, ty - y) < 3) break;
      const want = tx !== null ? Math.atan2(ty - y, tx - x) : ang;
      let diff = want - ang;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      ang += diff * 0.12 + (rnd() - 0.5) * 0.9;
      x += Math.cos(ang) * 1.5; y += Math.sin(ang) * 1.5;
      x = Math.max(6, Math.min(CW - 7, x)); y = Math.max(6, Math.min(CH - 12, y));
    }
  };
  for (let i = 1; i < points.length - 1; i++) {
    if (rnd() < 0.7) blob(points[i].x, points[i].y, 16 + rnd() * 30);
  }
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const r = rnd() < 0.4 ? 7 + rnd() * 2 : 11 + rnd() * 6;   // tight ones are still snug, but you fit
    worm(a.x, a.y, b.x, b.y, r, 2000, true);
  }
  // side branches and dead ends
  for (let i = 0; i < 12; i++) {
    worm(10 + rnd() * (CW - 20), 20 + rnd() * (CH - 60), null, null, 5 + rnd() * 6, 40 + rnd() * 150, true);
  }

  // 3. smooth everything into natural shapes
  for (let pass = 0; pass < 4; pass++) {
    const src = mat.slice();
    for (let cy = 1; cy < CH - 1; cy++)
      for (let cx = 1; cx < CW - 1; cx++) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) if (src[(cy + dy) * CW + cx + dx]) n++;
        mat[cy * CW + cx] = n >= 5 ? ROCK : 0;
      }
  }
  for (const c of routePath) disc(c.x, c.y, c.r, 0);

  // solid floor, start room and exit room
  for (let cy = CH - 10; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) mat[cy * CW + cx] = ROCK;
  const carve = (ex, ey, rx, ry, maxY) => {
    for (let y = Math.max(0, ey - ry); y <= Math.min(maxY, ey + ry); y++)
      for (let x = Math.max(0, ex - rx); x <= Math.min(CW - 1, ex + rx); x++) {
        const dx = (x - ex) / rx, dy = (y - ey) / ry;
        if (dx * dx + dy * dy <= 1) mat[y * CW + x] = 0;
      }
  };
  carve(CW / 2, CH - 26, 40, 16, CH - 11);
  carve(CW / 2, 22, 40, 16, CH);

  const emptyRatio = (x0, y0, w, hh) => {
    let e = 0, n = 0;
    for (let y = y0; y < y0 + hh; y++)
      for (let x = x0; x < x0 + w; x++) { n++; if (inside(x, y) && !mat[y * CW + x]) e++; }
    return e / n;
  };
  const slab = (x0, y0, w, hh) => {
    for (let y = y0; y < y0 + hh; y++)
      for (let x = x0; x < x0 + w; x++) if (inside(x, y)) mat[y * CW + x] = BRICK;
  };

  // 4. built ledges sticking out of cave walls
  let ledges = 0;
  for (let a = 0; a < 600 && ledges < 30; a++) {
    const x = 10 + Math.floor(rnd() * (CW - 20)), y = 20 + Math.floor(rnd() * (CH - 50));
    if (mat[y * CW + x]) continue;
    const dir = rnd() < 0.5 ? -1 : 1;
    let wx = x, dist = 0;
    while (dist < 50 && inside(wx, y) && !mat[y * CW + wx]) { wx += dir; dist++; }
    if (dist >= 50 || dist < 8) continue;
    const len = Math.min(dist + 4, 14 + Math.floor(rnd() * 26));
    const x0 = dir < 0 ? wx - 3 : wx - len + 4;
    if (emptyRatio(dir < 0 ? wx + 1 : x0, y - 12, len - 4, 12) < 0.9) continue;
    slab(x0, y, len, 4);
    ledges++;
  }

  // 5. old brick frames half buried in the rock
  for (let i = 0; i < 9; i++) {
    const fw = 30 + Math.floor(rnd() * 40), fh = 20 + Math.floor(rnd() * 20);
    const fx = 8 + Math.floor(rnd() * (CW - 16 - fw)), fy = 60 + Math.floor(rnd() * (CH - 140));
    const rockRatio = 1 - emptyRatio(fx, fy, fw, fh);
    if (rockRatio < 0.25 || rockRatio > 0.85) continue;
    const gap = Math.floor(rnd() * 4);   // which side gets a doorway
    slab(fx, fy, fw, 4);
    slab(fx, fy + fh - 4, fw, 4);
    slab(fx, fy, 4, fh);
    slab(fx + fw - 4, fy, 4, fh);
    if (gap === 0) for (let y = fy; y < fy + 4; y++) for (let x = fx + 8; x < fx + 22; x++) mat[y * CW + x] = 0;
    if (gap === 1) for (let y = fy + 4; y < fy + fh - 4; y++) for (let x = fx; x < fx + 4; x++) mat[y * CW + x] = 0;
    if (gap === 2) for (let y = fy + 4; y < fy + fh - 4; y++) for (let x = fx + fw - 4; x < fx + fw; x++) mat[y * CW + x] = 0;
  }

  // 6. a few floating platforms in the big open spaces
  let floats = 0;
  for (let a = 0; a < 400 && floats < 10; a++) {
    const len = 18 + Math.floor(rnd() * 22);
    const x0 = 8 + Math.floor(rnd() * (CW - 16 - len)), y0 = 40 + Math.floor(rnd() * (CH - 90));
    if (emptyRatio(x0 - 12, y0 - 18, len + 24, 34) < 0.98) continue;
    slab(x0, y0, len, 4);
    floats++;
  }

  // clear a doorway wherever a ledge, frame or platform landed across a link
  for (const c of routePath) disc(c.x, c.y, Math.min(c.r, 7), 0);

  // exit ledge
  slab(CW / 2 - 24, 34, 48, 3);

  // unbreakable border
  for (let cy = 0; cy < CH; cy++)
    for (let cx = 0; cx < CW; cx++)
      if (cx < 3 || cx >= CW - 3 || cy < 3 || cy >= CH - 3) mat[cy * CW + cx] = BED;
  // colour the terrain
  const img = new ImageData(CW, CH);
  const d = img.data;
  for (let cy = 0; cy < CH; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const i = cy * CW + cx, m = mat[i];
      if (!m) continue;
      const r1 = hash(cx * 7 + 3, cy * 13 + 5);
      let c;
      if (m === ROCK) {
        const exposed = cy > 1 && (mat[i - CW] === 0 || mat[i - 2 * CW] === 0);
        c = exposed ? mix(THEME.moss[0], THEME.moss[1], r1)
                    : mix(THEME.rock[0], THEME.rock[1], fbm(cx / 6 + 100, cy / 6 + 100));
      } else if (m === BRICK) {
        const k = cx + (cy % 2) * 3;
        if (k % 6 === 0) c = THEME.mortar;
        else {
          c = mix(THEME.brick[0], THEME.brick[1], hash(Math.floor(k / 6), cy));
          if (cy > 0 && mat[i - CW] === 0) c = c.map(v => v * 1.18);
        }
      } else {
        c = mix(THEME.bed[0], THEME.bed[1], r1);
      }
      const j = (r1 - 0.5) * 10;
      d[i * 4] = c[0] + j; d[i * 4 + 1] = c[1] + j; d[i * 4 + 2] = c[2] + j; d[i * 4 + 3] = 255;
    }
  }

  // background
  const bgImg = new ImageData(BW, BH);
  for (let y = 0; y < BH; y++)
    for (let x = 0; x < BW; x++) {
      const t = Math.pow(fbm(x / 10 + 300, y / 10 + 300), 1.6);
      const c = mix(THEME.bg, THEME.bg2, Math.min(1, t * 1.3));
      const j = (hash(x + 900, y + 900) - 0.5) * 4, k = (y * BW + x) * 4;
      bgImg.data[k] = c[0] + j; bgImg.data[k + 1] = c[1] + j; bgImg.data[k + 2] = c[2] + j; bgImg.data[k + 3] = 255;
    }

  const start = { x: WW / 2 - PW / 2, y: (CH - 10) * CELL - PH };
  const portal = { x: WW / 2 - 10, y: 34 * CELL - 30, w: 20, h: 30 };

  // enemies in open spaces
  const clear = (cx, cy, r) => {
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= CW || y >= CH || mat[y * CW + x]) return false;
      }
    return true;
  };
  const enemies = [];
  for (let a = 0; a < 3000 && enemies.length < ENEMY_COUNT; a++) {
    const cx = 8 + Math.floor(rnd() * (CW - 16)), cy = 50 + Math.floor(rnd() * (CH - 120));
    if (!clear(cx, cy, 8)) continue;
    const x = cx * CELL, y = cy * CELL;
    if (Math.hypot(x - start.x, y - start.y) < 220) continue;
    if (enemies.some(e => Math.hypot(e.x - x, e.y - y) < 90)) continue;
    enemies.push({ x, y, ty: y, r: 9, phase: rnd() * 6.28, hp: ENEMY_HP, cd: 1 + rnd() * 2, flash: 0, lx: 0, ly: 1 });
  }

  return { mat, img, bgImg, start, portal, enemies };
}

const approach = (v, t, a) => (v < t ? Math.min(t, v + a) : Math.max(t, v - a));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function Game({ input }) {
  const cv = useRef(null);
  useEffect(() => {
    const c = cv.current, ctx = c.getContext('2d');
    const seed = 1 + Math.floor(Math.random() * 2147483000);
    const level = makeLevel(seed);
    const { mat, img, start, portal, enemies } = level;
    const total = enemies.length;

    const terrain = document.createElement('canvas');
    terrain.width = CW; terrain.height = CH;
    const tctx = terrain.getContext('2d');
    tctx.putImageData(img, 0, 0);
    const bg = document.createElement('canvas');
    bg.width = BW; bg.height = BH;
    bg.getContext('2d').putImageData(level.bgImg, 0, 0);

    const p = { x: start.x, y: start.y, vx: 0, vy: 0, onGround: false, face: 1, jet: 0,
      fuel: 1, empty: false, hp: PLAYER_HP, hitT: 0, dead: false, kick: 0,
      jx: 0, jy: 0, aim: { on: false, show: false, nx: 1, ny: 0 } };
    const bullets = [], grenades = [], enemyShots = [], smoke = [], sparks = [], flashes = [];
    let smokeAcc = 0, time = 0, fireT = 0, camX = 0, camY = 0, camReady = false;
    let won = false, best = 0, raf, last = performance.now();

    const resize = () => {
      const r = c.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(c.parentElement);
    window.addEventListener('resize', resize);

    // ---- mouse ----
    const mouse = input.current.mouse;
    let unitPx = 1;   // css pixels per world unit, set while drawing
    const mMove = e => {
      if (e.pointerType !== 'mouse') return;
      const r = c.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.inside = true;
    };
    const mDown = e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      mMove(e); mouse.down = true;
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const mUp = e => { if (e.pointerType === 'mouse') mouse.down = false; };
    const mLeave = e => { if (e.pointerType === 'mouse' && !mouse.down) mouse.inside = false; };
    c.addEventListener('pointermove', mMove);
    c.addEventListener('pointerdown', mDown);
    c.addEventListener('pointerup', mUp);
    c.addEventListener('pointercancel', mUp);
    c.addEventListener('pointerleave', mLeave);

    // ---- terrain queries ----
    const solidAt = (x, y) => {
      const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
      if (cx < 0 || cy < 0 || cx >= CW || cy >= CH) return true;
      return mat[cy * CW + cx] !== 0;
    };
    const boxHit = (x, y) => {
      const x0 = Math.floor(x / CELL), x1 = Math.floor((x + PW - 0.001) / CELL);
      const y0 = Math.floor(y / CELL), y1 = Math.floor((y + PH - 0.001) / CELL);
      for (let cy = y0; cy <= y1; cy++) {
        if (cy < 0 || cy >= CH) return true;
        for (let cx = x0; cx <= x1; cx++) {
          if (cx < 0 || cx >= CW || mat[cy * CW + cx]) return true;
        }
      }
      return false;
    };
    const lineOfSight = (x0, y0, x1, y1) => {
      const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3);
      for (let i = 1; i < n; i++) if (solidAt(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false;
      return true;
    };
    const enemyAt = (x, y, pad) => {
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (Math.hypot(x - e.x, y - e.ty) < e.r + pad) return j;
      }
      return -1;
    };

    function burst(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.28, sp = 60 + Math.random() * 160;
        sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, max: 0.45, c: color, size: 3 });
      }
    }
    function hurt(n) {
      if (p.dead || n <= 0) return;
      p.hp = Math.max(0, p.hp - n);
      p.hitT = 0.3;
      if (p.hp === 0) { p.dead = true; burst(p.x + PW / 2, p.y + PH / 2, 24, COL.player); }
    }
    function damageEnemy(j, dmg) {
      const e = enemies[j];
      e.hp -= dmg; e.flash = 0.08;
      if (e.hp <= 0) { burst(e.x, e.ty, 16, COL.enemy); enemies.splice(j, 1); }
    }

    function explode(x, y, R) {
      const cx0 = x / CELL, cy0 = y / CELL, rc = R / CELL, ring = rc + 2.5;
      const minX = Math.max(0, Math.floor(cx0 - ring)), maxX = Math.min(CW - 1, Math.ceil(cx0 + ring));
      const minY = Math.max(0, Math.floor(cy0 - ring)), maxY = Math.min(CH - 1, Math.ceil(cy0 + ring));
      const d = img.data;
      let debris = 0;
      for (let cy = minY; cy <= maxY; cy++) {
        for (let cx = minX; cx <= maxX; cx++) {
          const i = cy * CW + cx, m = mat[i];
          if (!m) continue;
          const dist = Math.hypot(cx + 0.5 - cx0, cy + 0.5 - cy0);
          const k = i * 4;
          if (dist <= rc && m !== BED) {
            if (debris < 40 && Math.random() < 0.08) {
              debris++;
              const f = 0.5 + Math.random();
              sparks.push({ x: cx * CELL, y: cy * CELL,
                vx: (cx - cx0) / rc * 220 * f, vy: ((cy - cy0) / rc * 220 - 140) * f,
                life: 0.8 + Math.random() * 0.4, max: 1.2, c: `rgb(${d[k]},${d[k + 1]},${d[k + 2]})`, size: 2, heavy: true });
            }
            mat[i] = 0;
            d[k + 3] = 0;
          } else if (dist <= ring) {
            d[k] *= 0.72; d[k + 1] *= 0.72; d[k + 2] *= 0.72;   // scorch the crater edge
          }
        }
      }
      tctx.putImageData(img, 0, 0, minX, minY, maxX - minX + 1, maxY - minY + 1);

      flashes.push({ x, y, r: R, t: 0 });
      for (let i = 0; i < 10; i++) {
        smoke.push({ x: x + (Math.random() - 0.5) * R, y: y + (Math.random() - 0.5) * R,
          vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40 - 20,
          r: 4 + Math.random() * 5, life: 1.2, max: 1.2 });
      }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j], dist = Math.hypot(e.x - x, e.ty - y);
        if (dist < R + e.r) damageEnemy(j, dist < R * 0.5 ? 3 : 2);
      }
      const pcx = p.x + PW / 2, pcy = p.y + PH / 2;
      const dist = Math.hypot(pcx - x, pcy - y), reach = R + 10;
      if (dist < reach && !p.dead) {
        const f = 1 - dist / reach;
        hurt(Math.round(25 * f));
        const nx = (pcx - x) / (dist || 1), ny = (pcy - y) / (dist || 1);
        p.vx += nx * 500 * f;
        p.vy += ny * 500 * f - 150 * f;
        p.kick = 0.25;
      }
    }

    function step(dt) {
      time += dt;
      const weapon = input.current.weapon;
      // movement: thumbstick first, otherwise keyboard (full strength)
      let L = input.current.left;
      if (!L.active) {
        const keys = input.current.keys;
        const kx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
        if (kx || keys.w) {
          const ny = keys.w ? -1 : 0, len = Math.hypot(kx, ny);
          L = { active: true, nx: kx / len, ny: ny / len, mag: 1, dy: keys.w ? -1 : 1, on: true };
        }
      }
      if (p.dead) L = NO_INPUT;
      p.jx = L.nx; p.jy = L.ny;

      // ---- jetpack and fuel ----
      const raw = L.active ? L.mag : 0;
      const mag = raw > DEAD ? (raw - DEAD) / (1 - DEAD) : 0;
      const wantJet = mag > 0 && L.dy < 0;
      if (p.empty && p.fuel >= FUEL_RESTART) p.empty = false;
      const jet = wantJet && !p.empty;
      p.jet = jet ? mag : 0;
      if (jet) {
        p.fuel -= FUEL_DRAIN * (0.5 + 0.5 * mag) * dt;
        if (p.fuel <= 0) { p.fuel = 0; p.empty = true; }
      } else if (p.onGround) {
        p.fuel = Math.min(1, p.fuel + FUEL_REGEN * dt);
      }

      // ---- steering ----
      p.kick -= dt;
      const k = p.kick > 0 ? 0.15 : 1;   // let explosions push you around briefly
      if (jet) {
        p.vx = approach(p.vx, L.nx * mag * JET, JET_ACC * dt * k);
        const ty = L.ny * mag * JET;
        // rising beats a fall instantly; only an explosion still throws you around
        if (ty < p.vy && p.kick <= 0) p.vy = ty;
        else p.vy = approach(p.vy, ty, JET_ACC * dt * k);
      } else {
        const target = mag > 0 ? L.nx * mag * WALK : 0;
        p.vx = approach(p.vx, target, (p.onGround ? GROUND_ACC : AIR_ACC) * dt * k);
        p.vy = Math.min(p.vy + GRAVITY * dt, 900);
      }

      // ---- move against the pixel terrain ----
      const wasGround = p.onGround;
      let n = Math.ceil(Math.abs(p.vx * dt));
      if (n > 0) {
        const sx = p.vx * dt / n;
        for (let i = 0; i < n; i++) {
          if (!boxHit(p.x + sx, p.y)) { p.x += sx; continue; }
          let moved = false;
          const maxUp = wasGround ? 6 : 3;          // walk up small bumps and slopes
          for (let up = 1; up <= maxUp; up++) {
            if (!boxHit(p.x + sx, p.y - up)) { p.x += sx; p.y -= up; moved = true; break; }
          }
          if (!moved) { p.vx = 0; break; }
        }
      }
      n = Math.ceil(Math.abs(p.vy * dt));
      if (n > 0) {
        const sy = p.vy * dt / n;
        for (let i = 0; i < n; i++) {
          if (!boxHit(p.x, p.y + sy)) { p.y += sy; continue; }
          if (sy > 0) p.y = Math.floor((p.y + sy + PH - 0.001) / CELL) * CELL - PH;
          else p.y = (Math.floor((p.y + sy) / CELL) + 1) * CELL;
          if (boxHit(p.x, p.y)) p.y -= sy;   // fallback
          p.vy = 0;
          break;
        }
      }
      // stick to the ground when walking down slopes
      if (wasGround && !jet && p.vy >= 0 && p.kick <= 0 && !boxHit(p.x, p.y + 1)) {
        for (let dn = 1; dn <= 6; dn++) {
          if (boxHit(p.x, p.y + dn + 1)) { p.y += dn; p.vy = 0; break; }
        }
      }
      // never stay stuck inside terrain
      if (boxHit(p.x, p.y)) {
        for (let up = 1; up <= 40; up++) if (!boxHit(p.x, p.y - up)) { p.y -= up; break; }
      }
      if (p.y > WH) { p.x = start.x; p.y = start.y; p.vx = 0; p.vy = 0; }
      p.onGround = boxHit(p.x, p.y + 0.5);

      const pcx = p.x + PW / 2, pcy = p.y + PH / 2;
      if (!won && pcx > portal.x && pcx < portal.x + portal.w && pcy > portal.y && pcy < portal.y + portal.h) won = true;

      // ---- aiming: thumbstick first, otherwise mouse ----
      const gx = pcx, gy = p.y + PH * 0.4;
      const TR = input.current.right;
      let R = { on: false, show: false, nx: p.face, ny: 0 };
      if (TR.active) R = { on: TR.on, show: TR.on, nx: TR.nx, ny: TR.ny };
      else if (mouse.inside) {
        const dx = camX + mouse.x / unitPx - gx, dy = camY + mouse.y / unitPx - gy, d = Math.hypot(dx, dy);
        if (d > 1) R = { on: mouse.down, show: true, nx: dx / d, ny: dy / d };
      }
      if (p.dead) R.on = false;
      p.aim = R;

      if (R.show) p.face = R.nx >= 0 ? 1 : -1;
      else if (Math.abs(p.vx) > 10) p.face = p.vx > 0 ? 1 : -1;

      fireT -= dt;
      if (R.on && fireT <= 0) {
        if (weapon === 'grenade') {
          fireT = GRENADE_RATE;
          grenades.push({ x: gx + R.nx * 10, y: gy + R.ny * 10, vx: R.nx * GRENADE_SPEED, vy: R.ny * GRENADE_SPEED, life: 3, spin: 0 });
        } else {
          fireT = FIRE_RATE;
          bullets.push({ x: gx + R.nx * 10, y: gy + R.ny * 10, vx: R.nx * BULLET, vy: R.ny * BULLET, life: 1.2 });
        }
      }

      // ---- player bullets ----
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.life -= dt;
        let dead = b.life <= 0;
        const sn = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2);
        for (let s = 0; s < sn && !dead; s++) {
          b.x += b.vx * dt / sn; b.y += b.vy * dt / sn;
          if (solidAt(b.x, b.y)) { burst(b.x - b.vx * 0.004, b.y - b.vy * 0.004, 3, COL.bullet); dead = true; break; }
          const j = enemyAt(b.x, b.y, 2.5);
          if (j >= 0) { damageEnemy(j, 1); burst(b.x, b.y, 4, COL.bullet); dead = true; }
        }
        if (dead) bullets.splice(i, 1);
      }

      // ---- grenades ----
      for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        g.life -= dt; g.spin += dt * 12;
        g.vy += GRENADE_GRAVITY * dt;
        let boom = g.life <= 0;
        const sn = Math.ceil(Math.hypot(g.vx, g.vy) * dt / 2);
        for (let s = 0; s < sn && !boom; s++) {
          const nx = g.x + g.vx * dt / sn, ny = g.y + g.vy * dt / sn;
          if (solidAt(nx, ny) || enemyAt(nx, ny, 3) >= 0) { boom = true; break; }
          g.x = nx; g.y = ny;
        }
        if (Math.random() < 0.5) smoke.push({ x: g.x, y: g.y, vx: 0, vy: -8, r: 1.2, life: 0.5, max: 0.5 });
        if (boom) { explode(g.x, g.y, BLAST); grenades.splice(i, 1); }
      }

      // ---- enemies ----
      for (const e of enemies) {
        e.ty = e.y + Math.sin(time * 2 + e.phase) * 4;
        e.flash -= dt;
        const dx = pcx - e.x, dy = pcy - e.ty, dist = Math.hypot(dx, dy) || 1;
        e.lx = dx / dist; e.ly = dy / dist;
        e.cd -= dt;
        if (!p.dead && dist < ENEMY_RANGE && e.cd <= 0) {
          e.cd = 0.4;   // re-check soon if we can't see the player
          if (lineOfSight(e.x, e.ty, pcx, pcy)) {
            e.cd = 1.4 + Math.random() * 1.2;
            const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.25;
            enemyShots.push({ x: e.x + Math.cos(a) * 12, y: e.ty + Math.sin(a) * 12,
              vx: Math.cos(a) * ENEMY_BULLET, vy: Math.sin(a) * ENEMY_BULLET, life: 2.5 });
          }
        }
      }
      for (let i = enemyShots.length - 1; i >= 0; i--) {
        const b = enemyShots[i];
        b.life -= dt;
        let gone = b.life <= 0;
        const sn = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 2);
        for (let s = 0; s < sn && !gone; s++) {
          b.x += b.vx * dt / sn; b.y += b.vy * dt / sn;
          if (solidAt(b.x, b.y)) { gone = true; break; }
          if (!p.dead && b.x > p.x - 2 && b.x < p.x + PW + 2 && b.y > p.y - 2 && b.y < p.y + PH + 2) {
            gone = true;
            burst(b.x, b.y, 5, COL.player);
            hurt(ENEMY_DMG);
          }
        }
        if (gone) enemyShots.splice(i, 1);
      }
      p.hitT -= dt;

      // ---- jetpack smoke ----
      if (p.jet > 0) {
        let fx = -p.jx, fy = -p.jy + 0.8;
        const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
        smokeAcc += dt * (25 + 35 * p.jet);
        while (smokeAcc >= 1) {
          smokeAcc--;
          smoke.push({ x: pcx + (Math.random() - 0.5) * 5, y: p.y + PH + 3,
            vx: fx * 50 + (Math.random() - 0.5) * 20, vy: fy * 50 + (Math.random() - 0.5) * 20,
            r: 1.5 + Math.random(), life: 0.9, max: 0.9 });
        }
      }
      for (let i = smoke.length - 1; i >= 0; i--) {
        const m = smoke[i];
        m.x += m.vx * dt; m.y += m.vy * dt;
        m.vx *= 1 - 2.5 * dt; m.vy = m.vy * (1 - 2.5 * dt) - 12 * dt;
        m.r += 5 * dt; m.life -= dt;
        if (m.life <= 0) smoke.splice(i, 1);
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const q = sparks[i];
        q.vy += (q.heavy ? 600 : 300) * dt;
        const nx = q.x + q.vx * dt, ny = q.y + q.vy * dt;
        if (q.heavy && solidAt(nx, ny)) { q.vx *= 0.3; q.vy = 0; }
        else { q.x = nx; q.y = ny; }
        q.life -= dt;
        if (q.life <= 0) sparks.splice(i, 1);
      }
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].t += dt;
        if (flashes[i].t > 0.25) flashes.splice(i, 1);
      }

      best = Math.max(best, Math.round((start.y - p.y) / 10));
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const s = Math.min(c.width / VIEW_W, c.height / VIEW_MIN_H), vw = c.width / s, vh = c.height / s;
      unitPx = s / dpr;
      const pcx = p.x + PW / 2, pcy = p.y + PH / 2;

      // camera
      const tx = vw >= WW ? (WW - vw) / 2 : clamp(pcx - vw / 2, 0, WW - vw);
      const ty = clamp(pcy - vh * 0.55, 0, Math.max(0, WH - vh));
      if (!camReady) { camX = tx; camY = ty; camReady = true; }
      camX += (tx - camX) * 0.15;
      camY += (ty - camY) * 0.15;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = 'rgb(' + THEME.bg.join(',') + ')';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.setTransform(s, 0, 0, s, -Math.round(camX * s), -Math.round(camY * s));

      // background and terrain (visible part only)
      const bx0 = clamp(Math.floor(camX / 4), 0, BW - 1), by0 = clamp(Math.floor(camY / 4), 0, BH - 1);
      const bx1 = clamp(Math.ceil((camX + vw) / 4) + 1, 1, BW), by1 = clamp(Math.ceil((camY + vh) / 4) + 1, 1, BH);
      ctx.drawImage(bg, bx0, by0, bx1 - bx0, by1 - by0, bx0 * 4, by0 * 4, (bx1 - bx0) * 4, (by1 - by0) * 4);
      const tx0 = clamp(Math.floor(camX / CELL), 0, CW - 1), ty0 = clamp(Math.floor(camY / CELL), 0, CH - 1);
      const tx1 = clamp(Math.ceil((camX + vw) / CELL) + 1, 1, CW), ty1 = clamp(Math.ceil((camY + vh) / CELL) + 1, 1, CH);
      ctx.drawImage(terrain, tx0, ty0, tx1 - tx0, ty1 - ty0, tx0 * CELL, ty0 * CELL, (tx1 - tx0) * CELL, (ty1 - ty0) * CELL);

      // exit portal
      const pulse = 0.55 + 0.25 * Math.sin(time * 3);
      ctx.globalAlpha = pulse * 0.35;
      ctx.fillStyle = COL.portal;
      ctx.beginPath(); ctx.ellipse(portal.x + portal.w / 2, portal.y + portal.h / 2, portal.w, portal.h * 0.75, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = pulse;
      ctx.beginPath(); ctx.ellipse(portal.x + portal.w / 2, portal.y + portal.h / 2, portal.w / 2, portal.h / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;

      // smoke
      ctx.fillStyle = COL.smoke;
      for (const m of smoke) {
        ctx.globalAlpha = Math.max(0, m.life / m.max) * 0.5;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // enemies
      for (const e of enemies) {
        const ey = e.ty;
        if (ey > camY + vh + 20 || ey < camY - 20 || e.x < camX - 20 || e.x > camX + vw + 20) continue;
        ctx.fillStyle = e.flash > 0 ? COL.eye : COL.enemy;
        ctx.beginPath(); ctx.arc(e.x, ey, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = COL.eye;
        ctx.beginPath(); ctx.arc(e.x + e.lx * 2, ey + e.ly * 2, e.r * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = COL.enemy;
        ctx.beginPath(); ctx.arc(e.x + e.lx * 4, ey + e.ly * 4, e.r * 0.25, 0, Math.PI * 2); ctx.fill();
        const hw = 20, hx = e.x - hw / 2, hy = ey - e.r - 6;
        ctx.fillStyle = COL.barBg; ctx.fillRect(hx, hy, hw, 3);
        ctx.fillStyle = COL.player; ctx.fillRect(hx, hy, hw * e.hp / ENEMY_HP, 3);
      }

      // projectiles
      ctx.fillStyle = COL.enemy;
      for (const b of enemyShots) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = COL.bullet;
      for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill(); }
      for (const g of grenades) {
        ctx.fillStyle = COL.grenade;
        ctx.beginPath(); ctx.arc(g.x, g.y, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = Math.sin(g.spin) > 0 ? COL.flame2 : COL.visor;
        ctx.fillRect(g.x - 1, g.y - 1, 2, 2);
      }

      // sparks and debris
      for (const q of sparks) {
        ctx.fillStyle = q.c;
        ctx.globalAlpha = Math.max(0, q.life / q.max);
        ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
      }
      ctx.globalAlpha = 1;

      // explosion flashes
      for (const f of flashes) {
        const t = f.t / 0.25;
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = COL.flame;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + 0.5 * t), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = COL.flame2;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.35 + 0.3 * t), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // jet flame
      if (p.jet > 0) {
        let fx = -p.jx, fy = -p.jy + 0.8;
        const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
        const len = 6 + p.jet * 16 + Math.random() * 3;
        const bx = pcx, by = p.y + PH - 2;
        ctx.fillStyle = COL.flame;
        ctx.beginPath(); ctx.moveTo(bx - 4, by); ctx.lineTo(bx + 4, by); ctx.lineTo(bx + fx * len, by + fy * len); ctx.fill();
        ctx.fillStyle = COL.flame2;
        ctx.beginPath(); ctx.moveTo(bx - 2, by); ctx.lineTo(bx + 2, by); ctx.lineTo(bx + fx * len * 0.55, by + fy * len * 0.55); ctx.fill();
      }

      // aim, grenade arc preview, gun
      const R = p.aim, weapon = input.current.weapon;
      const ax = R.show ? R.nx : p.face, ay = R.show ? R.ny : 0;
      const gy = p.y + PH * 0.4;
      if (!p.dead && R.show && weapon === 'grenade') {
        let x = pcx + R.nx * 10, y = gy + R.ny * 10, vx = R.nx * GRENADE_SPEED, vy = R.ny * GRENADE_SPEED;
        ctx.fillStyle = COL.grenade;
        for (let i = 0; i < 40; i++) {
          vy += GRENADE_GRAVITY * 0.03; x += vx * 0.03; y += vy * 0.03;
          if (solidAt(x, y)) break;
          if (i % 2 === 0) { ctx.globalAlpha = 0.7 * (1 - i / 40); ctx.fillRect(x - 1, y - 1, 2, 2); }
        }
        ctx.globalAlpha = 1;
      }
      if (!p.dead) {
        ctx.strokeStyle = COL.visor; ctx.lineCap = 'round';
        ctx.lineWidth = weapon === 'grenade' ? 4.5 : 2.5;
        const len = weapon === 'grenade' ? 10 : 12;
        ctx.beginPath(); ctx.moveTo(pcx, gy); ctx.lineTo(pcx + ax * len, gy + ay * len); ctx.stroke();
      }

      // player
      if (p.dead) ctx.globalAlpha = 0.35;
      const flashing = p.hitT > 0 && Math.floor(p.hitT * 30) % 2 === 0;
      ctx.fillStyle = flashing ? COL.eye : COL.player;
      ctx.fillRect(p.x, p.y, PW, PH);
      ctx.fillStyle = COL.visor;
      ctx.fillRect(p.face > 0 ? p.x + PW - 7 : p.x + 1, p.y + 4, 6, 4);
      ctx.globalAlpha = 1;

      // ---- HUD ----
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cw = c.width / dpr;
      ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 3;
      ctx.fillStyle = COL.text;
      ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText('Height ' + best + ' m', 12, 26);
      ctx.fillText('Enemies ' + (total - enemies.length) + '/' + total, 12, 46);
      const bar = (label, y, frac, fill) => {
        ctx.fillStyle = COL.text;
        ctx.fillText(label, 12, y + 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = COL.barBg; ctx.fillRect(66, y, 110, 10);
        ctx.fillStyle = fill; ctx.fillRect(66, y, 110 * frac, 10);
        ctx.shadowBlur = 3;
      };
      bar('Health', 58, p.hp / PLAYER_HP, p.hp <= 30 ? COL.player : COL.hp);
      bar('Fuel', 78, p.fuel, p.empty ? COL.player : COL.flame);
      ctx.fillStyle = COL.muted;
      ctx.font = '500 12px system-ui, sans-serif';
      ctx.fillText(VERSION, 12, 106);

      ctx.textAlign = 'center';
      if (time < 3) {
        ctx.fillStyle = COL.text;
        ctx.globalAlpha = Math.min(1, 3 - time);
        ctx.font = '700 22px system-ui, sans-serif';
        ctx.fillText(THEME.name, cw / 2, 130);
        ctx.font = '500 14px system-ui, sans-serif';
        ctx.fillText('Find the green exit at the top', cw / 2, 152);
        ctx.fillText('Blast through tight spots', cw / 2, 170);
        ctx.globalAlpha = 1;
      }
      let msgY = 130;
      ctx.fillStyle = COL.text;
      if (p.dead) {
        ctx.font = '700 22px system-ui, sans-serif';
        ctx.fillText('You were shot down', cw / 2, msgY);
        ctx.font = '500 14px system-ui, sans-serif';
        ctx.fillText('Tap Restart for a new cave', cw / 2, msgY + 22);
      } else {
        if (won) {
          ctx.font = '700 22px system-ui, sans-serif';
          ctx.fillText('You found the exit', cw / 2, msgY);
          msgY += 26;
        }
        if (enemies.length === 0) {
          ctx.font = '700 18px system-ui, sans-serif';
          ctx.fillText('All enemies destroyed', cw / 2, msgY);
        }
      }
      ctx.textAlign = 'left';
      ctx.shadowBlur = 0;

      // mouse reticule
      if (mouse.inside) {
        const mx = mouse.x, my = mouse.y;
        for (const [w, colr] of [[4, 'rgba(0,0,0,0.6)'], [2, mouse.down ? COL.flame2 : COL.text]]) {
          ctx.strokeStyle = colr; ctx.lineWidth = w;
          ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(mx - 15, my); ctx.lineTo(mx - 5, my);
          ctx.moveTo(mx + 5, my); ctx.lineTo(mx + 15, my);
          ctx.moveTo(mx, my - 15); ctx.lineTo(mx, my - 5);
          ctx.moveTo(mx, my + 5); ctx.lineTo(mx, my + 15);
          ctx.stroke();
        }
      }
    }

    const loop = t => {
      const dt = Math.max(0, Math.min(0.033, (t - last) / 1000));
      last = t;
      step(dt); draw();
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('resize', resize);
      c.removeEventListener('pointermove', mMove);
      c.removeEventListener('pointerdown', mDown);
      c.removeEventListener('pointerup', mUp);
      c.removeEventListener('pointercancel', mUp);
      c.removeEventListener('pointerleave', mLeave);
      mouse.inside = false; mouse.down = false;
    };
  }, []);
  return h('canvas', { ref: cv, className: 'game' });
}

function Stick({ size, kind, input }) {
  const [knob, setKnob] = useState({ x: 0, y: 0, jet: false });
  const ref = useRef(null);
  const pid = useRef(null);

  const update = e => {
    const r = ref.current.getBoundingClientRect();
    const rad = r.width / 2;
    const dx = e.clientX - (r.left + rad), dy = e.clientY - (r.top + rad);
    const dist = Math.hypot(dx, dy);
    const maxD = rad * 0.72;
    const cl = Math.min(dist, maxD);
    const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0;
    const mag = cl / maxD;
    const st = input.current[kind];
    st.active = true; st.nx = nx; st.ny = ny; st.mag = mag; st.dy = dy; st.on = mag > 0.15;
    setKnob({ x: nx * cl, y: ny * cl, jet: kind === 'left' && dy < 0 && mag > DEAD });
  };
  const down = e => {
    if (pid.current !== null) return;
    pid.current = e.pointerId;
    try { ref.current.setPointerCapture(e.pointerId); } catch (_) {}
    update(e);
  };
  const move = e => { if (e.pointerId === pid.current) update(e); };
  const end = e => {
    if (e.pointerId !== pid.current) return;
    pid.current = null;
    Object.assign(input.current[kind], { active: false, mag: 0, on: false, dy: 0 });
    setKnob({ x: 0, y: 0, jet: false });
  };

  const left = kind === 'left';
  return h('div', {
      ref, className: 'stick' + (knob.jet ? ' jetting' : ''),
      style: { width: size, height: size },
      onPointerDown: down, onPointerMove: move, onPointerUp: end,
      onPointerCancel: end, onLostPointerCapture: end,
    },
    left && h('div', { className: 'jetzone' }),
    left && h('div', { className: 'hline' }),
    h('span', { className: 'lbl top' }, left ? 'jet' : 'aim'),
    left && h('span', { className: 'lbl bot' }, 'walk'),
    h('div', { className: 'knob', style: { transform: `translate(-50%,-50%) translate(${knob.x}px,${knob.y}px)` } })
  );
}

function App() {
  const blank = () => ({ active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false });
  const input = useRef({
    left: blank(), right: blank(), weapon: 'gun',
    keys: { w: false, a: false, s: false, d: false },
    mouse: { x: 0, y: 0, inside: false, down: false },
  });
  const [size, setSize] = useState(150);
  const [run, setRun] = useState(0);
  const [weapon, setWeapon] = useState('gun');

  const select = id => { input.current.weapon = id; setWeapon(id); };

  useEffect(() => {
    const fit = () => setSize(Math.max(80, Math.floor(Math.min((window.innerWidth - 36) / 2, window.innerHeight * 0.28))));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  useEffect(() => {
    const stop = e => e.preventDefault();
    document.addEventListener('contextmenu', stop);
    document.addEventListener('touchmove', stop, { passive: false });

    const map = { w: 'w', arrowup: 'w', ' ': 'w', a: 'a', arrowleft: 'a', s: 's', arrowdown: 's', d: 'd', arrowright: 'd' };
    const key = down => e => {
      const k = e.key.toLowerCase();
      if (map[k]) { input.current.keys[map[k]] = down; e.preventDefault(); }
      if (down && k >= '1' && k <= '4') {
        const slot = SLOTS[Number(k) - 1];
        if (slot) select(slot.id);
      }
    };
    const kd = key(true), ku = key(false);
    const blur = () => {
      Object.keys(input.current.keys).forEach(k => { input.current.keys[k] = false; });
      input.current.mouse.down = false;
    };
    window.addEventListener('keydown', kd);
    window.addEventListener('keyup', ku);
    window.addEventListener('blur', blur);
    return () => {
      document.removeEventListener('contextmenu', stop);
      document.removeEventListener('touchmove', stop);
      window.removeEventListener('keydown', kd);
      window.removeEventListener('keyup', ku);
      window.removeEventListener('blur', blur);
    };
  }, []);

  const cycleWeapon = e => {
    e.preventDefault();
    const owned = SLOTS.filter(Boolean);
    const i = owned.findIndex(w => w.id === input.current.weapon);
    select(owned[(i + 1) % owned.length].id);
  };
  const current = SLOTS.find(w => w && w.id === weapon);

  return h('div', { className: 'app' },
    h('div', { className: 'view' },
      h(Game, { key: run, input }),
      h('button', { className: 'reset', onClick: () => setRun(r => r + 1) }, 'Restart')
    ),
    h('div', { className: 'controls' },
      h('div', { className: 'toolbar' },
        h('div', { className: 'slots' },
          SLOTS.map((slot, i) => h('button', {
              key: i,
              className: 'slot' + (slot ? '' : ' empty') + (slot && slot.id === weapon ? ' on' : ''),
              title: slot ? slot.name + ' (' + (i + 1) + ')' : 'Empty slot',
              onPointerDown: e => { e.preventDefault(); if (slot) select(slot.id); },
            },
            h('span', { className: 'num' }, i + 1),
            slot && h('span', { className: 'ico ' + slot.id })
          ))
        ),
        h('button', { className: 'weapon ' + weapon, onPointerDown: cycleWeapon },
          h('span', { className: 'wicon' }), current ? current.name : '')
      ),
      h('div', { className: 'sticks' },
        h(Stick, { size, kind: 'left', input }),
        h(Stick, { size, kind: 'right', input })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
