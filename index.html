  ['esph_ti',   'esph',    'timer',  { timer: 0.5 }],
  ['eorb_ti',   'eorb',    'timer',  { timer: 0.8 }],
  ['ldrill_ti', 'ldrill',  'timer',  { timer: 0 }],
  ['void_d',    'void',    'expire', { name: 'Black Hole With Death Trigger' }],
];
const TIMER_ADD = 0.33;                 // how long Add Timer waits
for (const [id, base, trig, extra] of TRIG_VARIANTS) {
  const m = MODS[base], k = TRIG_KINDS[trig];
  MODS[id] = Object.assign({}, m, {
    name: m.name + ' ' + k.tag, trig, draw: 1, base,
    mana: Math.round(m.mana * 1.3 + 5), mark: k.mark,
    info: m.info + '. ' + (trig === 'hit' ? 'Casts the next spell where it hits'
      : trig === 'timer' ? 'Casts the next spell a moment after firing'
      : 'Casts the next spell where it dies'),
  }, extra || {});
  if (extra && extra.mana) MODS[id].mana = m.mana + extra.mana;
  FAMILY_OF[id] = FAMILY_OF[base];
  MOD_PRICE[id] = Math.round((MOD_PRICE[base] || 30) * 1.4 + 15);
  MOD_TIER[id] = Math.min(4, tierOf(base) + 1);
}

// What a floor is likely to hand you. Each floor reaches a little further up the
// tiers, so the early cave is workhorses and the Greek letters stay a find.
function modWeight(id, floor) {
  const over = Math.max(0, tierOf(id) - (1 + (floor - 1) * 0.55));
  return 1 / (1 + over * over);
}
function rollMod(rnd, floor, skip) {
  let total = 0;
  for (const id of ALL_IDS) if (!skip || !skip[id]) total += modWeight(id, floor);
  let r = rnd() * total;
  for (const id of ALL_IDS) {
    if (skip && skip[id]) continue;
    r -= modWeight(id, floor);
    if (r <= 0) return id;
  }
  return 'bolt';
}

const priceOf = id => MOD_PRICE[id] || 30;

// Guns are priced off what they actually do: slots to build in, how fast they
// cycle, how much mana they hold, and whether they fire in the order you set.
function gunPrice(g) {
  const rate = 1 / Math.max(0.05, g.castDelay) + 1 / Math.max(0.1, g.recharge);
  const v = g.cap * 20 + rate * 7 + g.manaMax * 0.1 + g.manaRegen * 0.3
    + (g.multi - 1) * 45 + ((g.speedMul || 1) - 1) * 40 - g.spread * 3
    + (g.shuffle ? -30 : 20);
  return Math.max(45, Math.round(v / 5) * 5);
}

// Every second shop is a gun shop instead of a mod shop.
const isGunShop = floor => floor % 2 === 0;

// the shop room sits under the whole cave: floor, interior, then a brick roof
const SHOP_FLOOR = CH - 10;            // first row of solid floor
const SHOP_H = 48;                     // interior height
const SHOP_TOP = SHOP_FLOOR - SHOP_H;  // first open row of the room
const SHOP_ROOF = 6;                   // roof thickness
const SHOP_Y = SHOP_TOP * CELL;        // world y of the ceiling, for "am I in the shop?"

// ---- fog of war ----
// A coarse reveal grid, never per pixel: one fog cell covers FOG terrain pixels each
// way, and the overlay is a tiny FW x FH canvas scaled up over the view, so hiding the
// map costs one image draw a frame however big the map gets.
const FOG = 8;                         // terrain pixels per fog cell
const FOG_U = FOG * CELL;              // world units per fog cell
const FW = Math.ceil(CW / FOG), FH = Math.ceil(CH / FOG);
// the minimap samples the real terrain at a finer grid than the fog: a cell is an
// outline if a wall passes through it (has both rock and open), which traces every wall
// continuously instead of the scatter you get detecting edges at the coarse fog grid.
const MINI_D = 4;                      // terrain pixels per minimap cell
const MMW = Math.ceil(CW / MINI_D), MMH = Math.ceil(CH / MINI_D);
const SIGHT = 200;                     // how far the torch reaches: line of sight out to
                                       // here lifts the fog, and the lamp then lights the
                                       // ground it lifted. A cell this close and in view is
                                       // marked as somewhere you have been and stays marked
                                       // for the rest of the floor. This is a medium bubble —
                                       // generous, but the cave beyond it stays dark
const LAMP_REACH = 1.15;               // the lamp's pool is this many times the sight radius,
                                       // so the whole lifted bubble is lit and fades out at
                                       // its edge. The lamp is MASKED by the fog: it brightens
                                       // ground the line of sight has already uncovered and
                                       // leaves the rest dark — see the note on the lamp in draw()
const FOG_DIM = 0.85;                  // how dark somewhere you have been but cannot see
const FOG_DARK = 0.99;                 // how dark somewhere you have never been — near black,
                                       // because that darkness is the fog of war now

// What the map is allowed to remember is worked out as a fan of rays out from the player,
// each stopping at the first wall: one ray per fog cell the fan crosses, so a shadow edge
// lands on about the grid it is drawn into. See fogReveal.
const VIS_RAYS = 160;

// Light every cell within r world units of (wx, wy) that the torch can actually reach,
// and return how many were newly lit so the caller can leave the overlay alone on the
// frames where nothing changed. `pts` is the fan visPoly cast from the same spot, and a
// cell is only lit if the fan reaches at least that far in its direction — so ground
// round the corner of a wall is not seen and never goes on the map.
function fogReveal(seen, wx, wy, r, pts, rays) {
  const cx = wx / FOG_U, cy = wy / FOG_U, cr = r / FOG_U, r2 = cr * cr;
  const x0 = Math.max(0, Math.floor(cx - cr)), x1 = Math.min(FW - 1, Math.ceil(cx + cr));
  const y0 = Math.max(0, Math.floor(cy - cr)), y1 = Math.min(FH - 1, Math.ceil(cy + cr));
  let n = 0;
  for (let y = y0; y <= y1; y++) {
    const row = y * FW, dy = y + 0.5 - cy, dy2 = dy * dy;
    for (let x = x0; x <= x1; x++) {
      if (seen[row + x]) continue;
      const dx = x + 0.5 - cx;
      if (dx * dx + dy2 > r2) continue;
      const d = Math.sqrt(dx * dx + dy2) * FOG_U;            // world units, to match the fan
      // how far the fan got in this direction: the shorter of the two rays either side of
      // it, so a cell only goes on the map if a ray actually reached it. Interpolating
      // between the two would reach a little further than either and mark cells just round
      // a corner — which is the one thing this is here to stop.
      const t = (Math.atan2(dy, dx) / (Math.PI * 2) + 1) % 1 * rays;
      const i0 = Math.floor(t), i1 = (i0 + 1) % rays;
      const a = Math.hypot(pts[i0 * 2] - wx, pts[i0 * 2 + 1] - wy);
      const b = Math.hypot(pts[i1 * 2] - wx, pts[i1 * 2 + 1] - wy);
      if (d > Math.min(a, b)) continue;
      seen[row + x] = 1; n++;
    }
  }
  return n;
}

// A fresh grid for a fresh floor. 0 is never been there, 1 is been there, 2 is never
// fogged at all - which is the shop, a known safe room you are put down in, where a
// haze over the plinths would just hide the stock you came here to buy.
function fogStart() {
  const seen = new Uint8Array(FW * FH);
  for (let y = Math.floor((SHOP_TOP - SHOP_ROOF) / FOG); y < FH; y++)
    for (let x = 0; x < FW; x++) seen[y * FW + x] = 2;
  return seen;
}

// How far a ray from (x, y) heading (dx, dy) gets before it walks into a solid cell,
// capped at r. It steps from one cell boundary to the next, so it visits every cell the
// ray crosses — a fixed sampling step would jump clean over a one-pixel wall and let a
// sliver of light through the far side of it.
function rayDist(x, y, dx, dy, r, solidCell) {
  let cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
  const dtx = dx ? Math.abs(CELL / dx) : Infinity;
  const dty = dy ? Math.abs(CELL / dy) : Infinity;
  let tx = dx ? (dx > 0 ? ((cx + 1) * CELL - x) / dx : (cx * CELL - x) / dx) : Infinity;
  let ty = dy ? (dy > 0 ? ((cy + 1) * CELL - y) / dy : (cy * CELL - y) / dy) : Infinity;
  let t = 0;
  for (;;) {
    if (tx < ty) { t = tx; tx += dtx; cx += sx; }
    else { t = ty; ty += dty; cy += sy; }
    if (t >= r) return r;
    if (solidCell(cx, cy)) return t;
  }
}

// Is the straight line from one point to another clear of rock? Marched the same way the
// light is, so "can I shoot that" and "can I see that" give the same answer, and a
// one-pixel wall stops both.
function losClear(x0, y0, x1, y1, solidCell) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  if (d < 0.001) return true;
  return rayDist(x0, y0, dx / d, dy / d, d, solidCell) >= d - 0.001;
}

// ---- the spider (Hämähäkki) ----
// It lives on the rock and on its own silk and nowhere else. On rock it slides along the
// surface: the "normal" is the average direction from the rock in a small disc round it
// to its centre, which smooths the pixel steps away, so it glides round bumps and
// corners instead of snagging on single pixels. It moves in short fast bursts with rests
// between (rests long when roaming, short when it has you). At the start of each burst
// it looks at where it wants to be: if that's off the surface (dot with the normal ≥
// DEV.spDot) it rides a nearby line that heads that way, or else shoots a new line at
// the rock over there and crosses on it. Lines stay. Pure, so the logic tests can run it
// on a hand-made grid. Nearly every number is a Dev-panel knob (DEV.sp*, group Spider);
// SPIDER holds only the body's own geometry.
const SPIDER = { hold: 6, feel: 14, step: 1.5, fall: 900 };

// the smoothed surface normal at (x, y): points away from the rock, null if there's no
// rock within R. Also the nearest rock: d is the distance to it, (px, py) the way out.
function surfNormal(x, y, R, solidCell) {
  const cx0 = Math.floor(x / CELL), cy0 = Math.floor(y / CELL), rc = Math.ceil(R / CELL);
  let nx = 0, ny = 0, n = 0, d = Infinity, px = 0, py = -1;
  for (let dy = -rc; dy <= rc; dy++) for (let dx = -rc; dx <= rc; dx++) {
    const wx = (cx0 + dx + 0.5) * CELL - x, wy = (cy0 + dy + 0.5) * CELL - y;
    if (wx * wx + wy * wy > R * R) continue;
    if (!solidCell(cx0 + dx, cy0 + dy)) continue;
    nx -= wx; ny -= wy; n++;
    // the nearest point of this cell's box
    const qx = Math.max(wx - CELL / 2, Math.min(0, wx + CELL / 2)), qy = Math.max(wy - CELL / 2, Math.min(0, wy + CELL / 2));
    const q = Math.hypot(qx, qy);
    if (q < d) { d = q; if (q > 1e-6) { px = -qx / q; py = -qy / q; } }
  }
  if (!n) return null;
  const l = Math.hypot(nx, ny);
  return l < 1e-6 ? { x: px, y: py, d, px, py } : { x: nx / l, y: ny / l, d, px, py };
}

// sit the spider at `hold` off the nearest rock: pushed straight out of anything closer
// (so a spike or a step just lifts it over, like a ball rolling on it), pulled in along
// the smoothed normal if it has drifted off. false if there's no rock to sit on.
function spiderSeat(e, S, solidCell, maxMove) {
  let n = surfNormal(e.x, e.y, SPIDER.feel, solidCell);
  if (!n) return false;
  if (n.d < SPIDER.hold) {
    const m = SPIDER.hold - n.d;
    e.x += n.px * m; e.y += n.py * m;
    n = surfNormal(e.x, e.y, SPIDER.feel, solidCell) || n;
  } else {
    const m = Math.min(maxMove, n.d - SPIDER.hold);
    e.x -= n.x * m; e.y -= n.y * m;
  }
  S.nx = n.x; S.ny = n.y;
  return true;
}

// a timing knob is the average; each burst or rest is 60-140% of it
const spRange = (rnd, mean) => mean * (0.6 + 0.8 * rnd());
const segNear = (L, x, y) => {
  const vx = L.bx - L.ax, vy = L.by - L.ay, ll = vx * vx + vy * vy || 1;
  const u = Math.max(0, Math.min(1, ((x - L.ax) * vx + (y - L.ay) * vy) / ll));
  return { u, d: Math.hypot(L.ax + vx * u - x, L.ay + vy * u - y) };
};

// a new line from (x, y) toward the rock along (dx, dy), or null if no rock within reach.
// Tries straight at it first, then fans out a little.
function spiderAim(x, y, dx, dy, reach, solidCell) {
  for (const a of [0, 0.22, -0.22, 0.45, -0.45]) {
    const c = Math.cos(a), s = Math.sin(a), ux = dx * c - dy * s, uy = dx * s + dy * c;
    const d = rayDist(x, y, ux, uy, reach, solidCell);
    if (d < reach && d > SPIDER.hold * 2.5) return { dx: ux, dy: uy, len: d };
  }
  return null;
}

// One frame of one spider. env: { solidCell, webs, goal: {x,y}, hunting, rnd, speed,
// reach }. Moves e, may push a line onto env.webs. Returns 'web' on the frame a shot
// line lands (for a sound), else null.
function spiderStep(e, env, dt) {
  const { solidCell, webs, rnd } = env;
  const S = e.sp || (e.sp = { mode: 'fall', vy: 0, nx: 0, ny: -1, on: 0, rest: rnd() * 0.5,
    side: 1, line: null, u: 0, dir: 1, shot: null, rx: e.hx, ry: e.hy, ra: rnd() * 6.28, high: false });
  // the roam point drifts slowly round home, and is pulled back if it wanders too far
  S.webT = (S.webT || 0) - dt;
  S.ra += (rnd() - 0.5) * 3 * dt;
  const hd = Math.hypot(S.rx - e.hx, S.ry - e.hy);
  if (hd > DEV.spRoamR) S.ra = Math.atan2(e.hy - S.ry, e.hx - S.rx);
  S.rx += Math.cos(S.ra) * DEV.spRoamSpd * dt; S.ry += Math.sin(S.ra) * DEV.spRoamSpd * dt;
  const goal = env.hunting ? env.goal : { x: S.rx, y: S.ry };
  let out = null;

  if (S.mode === 'fall') {
    S.vy = Math.min(S.vy + SPIDER.fall * dt, 600);
    const n = Math.max(1, Math.ceil(S.vy * dt / SPIDER.step));
    for (let i = 0; i < n; i++) {
      e.y += S.vy * dt / n;
      if (e.y > CH * CELL) { e.y = CH * CELL; break; }
      if (surfNormal(e.x, e.y, SPIDER.hold + 1, solidCell)) {
        spiderSeat(e, S, solidCell, SPIDER.hold);
        S.mode = 'surf'; S.vy = 0; S.on = 0; S.rest = 0.1;
        break;
      }
    }
    return null;
  }

  if (S.mode === 'shoot') {
    const sh = S.shot;
    sh.t += DEV.spLineSpd * dt;
    if (sh.t < sh.len) return null;
    // the line lands: it only holds if the rock is still there
    const hx = sh.x + sh.dx * sh.len, hy = sh.y + sh.dy * sh.len;
    const inx = hx + sh.dx * 1.2, iny = hy + sh.dy * 1.2;
    S.mode = sh.from; S.shot = null;
    if (!solidCell(Math.floor(inx / CELL), Math.floor(iny / CELL))) return null;
    const L = { ax: sh.x, ay: sh.y, bx: hx - sh.dx * SPIDER.hold, by: hy - sh.dy * SPIDER.hold,
      a0x: sh.ax0, a0y: sh.ay0, b0x: hx, b0y: hy, ain: sh.ain, bin: { x: inx, y: iny }, owner: e };
    webs.push(L);
    // an old line of this spider's goes, unless something is riding it
    const mine = webs.filter(w => w.owner === e);
    if (mine.length > DEV.spMaxLines) {
      const old = mine.find(w => w !== S.line);
      if (old) webs.splice(webs.indexOf(old), 1);
    }
    S.mode = 'line'; S.line = L; S.u = 0; S.dir = 1;
    return 'web';
  }

  // on a line whose rock has gone: drop
  if (S.mode === 'line' && webs.indexOf(S.line) < 0) { S.mode = 'fall'; S.line = null; S.vy = 0; return null; }
  // on rock that has been dug away from under it: drop
  if (S.mode === 'surf' && !surfNormal(e.x, e.y, SPIDER.hold + 2, solidCell)) { S.mode = 'fall'; S.vy = 0; return null; }
  const arrive = env.hunting ? DEV.spArrive : 3;

  // resting: count down, then start a burst and decide where it goes. Nothing worth doing
  // (already there, right under it): look again shortly — never sit with no clock running
  if (S.on <= 0) {
    if ((S.rest -= dt) > 0) return null;
    S.on = spRange(rnd, env.hunting ? DEV.spHuntOn : DEV.spRoamOn);
    decide();
    if (S.mode === 'shoot') return null;
    if (S.on <= 0) { S.rest = 0.1 + rnd() * 0.2; return null; }
  }
  if (S.mode === 'shoot') return null;

  const speed = env.speed;
  const dist = speed * Math.min(dt, S.on);
  S.on -= dt;
  const n = Math.max(1, Math.ceil(dist / SPIDER.step));
  for (let i = 0; i < n && S.mode !== 'shoot'; i++) {
    const st = dist / n;
    if (S.mode === 'surf') {
      const tx = -S.ny * S.side, ty = S.nx * S.side;
      e.x += tx * st; e.y += ty * st;
      if (!spiderSeat(e, S, solidCell, st * 2)) {
        // stepped off the edge of nothing: curl back round toward where the rock was
        e.x -= S.nx * st * 2; e.y -= S.ny * st * 2;
        if (!spiderSeat(e, S, solidCell, st * 2)) { S.mode = 'fall'; S.vy = 0; break; }
      }
      // came round a corner and now faces the goal off the surface: look again
      const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy) || 1;
      const high = (gx * S.nx + gy * S.ny) / gd >= DEV.spDot;
      if (high && !S.high) { S.high = true; decide(); }
      else if (!high) S.high = false;
      // there, or just walked past the closest it gets on this surface: stop
      if (gd < arrive || (-S.ny * gx + S.nx * gy) * S.side < 0) { S.on = 0; break; }
    } else if (S.mode === 'line') {
      const L = S.line, len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
      const ux = (L.bx - L.ax) / len * S.dir, uy = (L.by - L.ay) / len * S.dir;
      // hanging: going further along would take it away from the goal
      if (!S.go && (goal.x - e.x) * ux + (goal.y - e.y) * uy <= 0) { S.on = 0; break; }
      S.u += S.dir * st / len;
      if (S.u >= 1 || S.u <= 0) {
        S.u = S.u >= 1 ? 1 : 0;
        e.x = S.u ? L.bx : L.ax; e.y = S.u ? L.by : L.ay;
        S.mode = 'surf'; S.line = null; S.go = false;
        if (!spiderSeat(e, S, solidCell, SPIDER.hold)) { S.mode = 'fall'; S.vy = 0; break; }
        decide();
        continue;
      }
      e.x = L.ax + (L.bx - L.ax) * S.u; e.y = L.ay + (L.by - L.ay) * S.u;
    }
  }
  if (S.on <= 0 && S.rest <= 0) S.rest = spRange(rnd, env.hunting ? DEV.spHuntOff : DEV.spRoamOff);
  return out;

  // where to go this burst: along the rock, onto a line, or shoot a new one
  function decide() {
    const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy);
    if (gd < arrive) { S.on = 0; return; }
    const dx = gx / gd, dy = gy / gd;
    const tryLine = () => {
      let best = null, bd = DEV.spGrab;
      for (const L of webs) {
        if (L === S.line) continue;
        const q = segNear(L, e.x, e.y);
        if (q.d > bd) continue;
        const len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
        const ux = (L.bx - L.ax) / len, uy = (L.by - L.ay) / len, al = ux * dx + uy * dy;
        if (Math.abs(al) < 0.5) continue;
        if ((al > 0 && q.u > 0.97) || (al < 0 && q.u < 0.03)) continue;   // nowhere left to go on it
        best = { L, u: q.u, dir: al > 0 ? 1 : -1 }; bd = q.d;
      }
      if (!best) return false;
      S.mode = 'line'; S.line = best.L; S.u = best.u; S.dir = best.dir;
      e.x = best.L.ax + (best.L.bx - best.L.ax) * best.u; e.y = best.L.ay + (best.L.by - best.L.ay) * best.u;
      return true;
    };
    const tryShoot = from => {
      // a roaming spider spins a new line now and then, not every hop; hunting, much more often
      if (S.webT > 0 || (!env.hunting && gd < 40)) return false;
      const a = spiderAim(e.x, e.y, dx, dy, env.reach, solidCell);
      if (!a) return false;
      let ax0 = e.x, ay0 = e.y, ain = null;
      if (from === 'surf') {
        const d = rayDist(e.x, e.y, -S.nx, -S.ny, SPIDER.feel + 4, solidCell);
        ax0 = e.x - S.nx * d; ay0 = e.y - S.ny * d;
        ain = { x: e.x - S.nx * (d + 1.2), y: e.y - S.ny * (d + 1.2) };
      }
      S.webT = env.hunting ? DEV.spHuntWeb : DEV.spRoamWeb;
      S.shot = { x: e.x, y: e.y, dx: a.dx, dy: a.dy, len: a.len, t: 0, from, ax0, ay0, ain };
      S.mode = 'shoot';
      return true;
    };
    if (S.mode === 'surf') {
      const dot = dx * S.nx + dy * S.ny;
      S.high = dot >= DEV.spDot;
      if (S.high && (tryLine() || tryShoot('surf'))) return;
      const t = -S.ny * dx + S.nx * dy;
      if (Math.abs(t) * gd < 4) { S.on = 0; return; }   // right under it already
      S.side = t > 0 ? 1 : -1;
    } else if (S.mode === 'line') {
      const L = S.line, len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
      const al = ((L.bx - L.ax) * dx + (L.by - L.ay) * dy) / len;
      S.go = false;
      if (Math.abs(al) > 0.3) { S.dir = al > 0 ? 1 : -1; return; }
      // the goal is off to the side of this line: another line, a new one, or the nearer end
      if (tryLine() || tryShoot('line')) return;
      const da = Math.hypot(goal.x - L.ax, goal.y - L.ay), db = Math.hypot(goal.x - L.bx, goal.y - L.by);
      S.dir = db < da ? 1 : -1;
      S.go = true;
    }
  }
}

// The fan of points that bound what can be seen from (cx, cy) out to r. The lamp is
// clipped to this, which is what makes walls cast shadows.
function visPoly(cx, cy, r, solidCell, rays) {
  const pts = [];
  for (let i = 0; i < rays; i++) {
    const a = i / rays * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, r, solidCell);
    pts.push(cx + dx * d, cy + dy * d);
  }
  return pts;
}

for (const k of Object.keys(MODS)) MODS[k].id = k;

const MIN_CAST = 0.016;      // one frame: the fastest a gun can chain casts
const MIN_RECH = 0.05;

// Recharge counts every slot on the gun, wherever the mod sits, so the number on
// the gun card is always the number you get.
function effRecharge(g) {
  const pas = gunPassives(g);
  return Math.max(MIN_RECH, (g.recharge + pas.rech) * pas.rechMul);
}

// `off` mods (the Greek letters, for now) stay in MODS but are never handed out
const SHOT_IDS = Object.keys(MODS).filter(k => MODS[k].kind === 'shot' && !MODS[k].off);
// a found gun is seeded with something that hurts on its own, so never a bare trigger
const SEED_SHOTS = SHOT_IDS.filter(k => !MODS[k].trig);
const ALL_IDS = Object.keys(MODS).filter(k => !MODS[k].off);

// ---- guns ----
const GUN_A = ['Rusty', 'Bone', 'Cracked', 'Copper', 'Glass', 'Ivory', 'Molten', 'Static',
               'Hollow', 'Ember', 'Quartz', 'Iron', 'Pale', 'Gilded'];
const GUN_B = ['Pistol', 'Repeater', 'Carbine', 'Scattergun', 'Lance', 'Sidearm',
               'Blaster', 'Cannon', 'Spitter', 'Wand'];

function shuffleOrder(g) {
  g.order = g.slots.map((_, i) => i);
  if (g.shuffle) for (let i = g.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [g.order[i], g.order[j]] = [g.order[j], g.order[i]];
  }
}
function resetGun(g) {
  g.idx = 0; g.delayT = 0; g.rechT = 0;
  shuffleOrder(g);
  return g;
}

// A gun's level (1-10) comes from the floor alone: floor 1 rolls level 1 guns, floor 10
// and beyond roll level 10. Every stat has a worst and a best end. A level 1 gun rolls
// anywhere between them (wild); each level squeezes the roll toward the best end, until a
// level 10 gun lands in the best tenth of every range (a little variance, never junk).
const GUN_LV_MAX = 10;
const RARE_GUN = 0.2;                     // chance a cave gun rolls a random higher level
const GUN_RANGE = {                       // [worst, best]
  cap: [2, 25], castDelay: [1.5, 0.01], recharge: [1.5, 0.01], manaMax: [50, 1000],
  manaRegen: [10, 500], spread: [20, 0], speedMul: [0.5, 2] };
// the colour a gun's level wears: grey through green, blue, purple to gold
const GUN_LV_COL = ['#9a9a9a', '#d8d8d8', '#5fd35f', '#3fc9a8', '#4aa3ff',
                    '#7a7aff', '#b565ff', '#ff5fcf', '#ff9a2a', '#ffd23c'];
const gunLvTier = lvl => Math.min(1, Math.max(0, (lvl - 1) / (GUN_LV_MAX - 1)));
function gunStat(rnd, k, t) {
  const [w, b] = GUN_RANGE[k];
  const f = rnd() * (1 - t) + rnd() * 0.1 * t;       // share of the way from best to worst
  return b + (w - b) * f;
}
// the level of a gun found on this floor: the floor's own, or now and then a rare one
// somewhere between the next level up and 10
function gunLevel(floor, rnd) {
  const base = Math.min(GUN_LV_MAX, Math.max(1, floor));
  if (base < GUN_LV_MAX && rnd() < RARE_GUN) return base + 1 + Math.floor(rnd() * (GUN_LV_MAX - base));
  return base;
}

// a gun of level `lvl` (the Dev panel's Spawn gun uses it to try deeper floors' guns on floor 1)
function caveGun(lvl, rnd) {
  return makeGun(rnd, Math.min(GUN_LV_MAX, Math.max(1, Math.floor(lvl))));
}

function makeGun(rnd, lvl) {
  const t = gunLvTier(lvl);
  const cap = Math.max(2, Math.min(25, Math.round(gunStat(rnd, 'cap', t))));
  const g = {
    name: GUN_A[Math.floor(rnd() * GUN_A.length)] + ' ' + GUN_B[Math.floor(rnd() * GUN_B.length)],
    lvl, cap,
    castDelay: gunStat(rnd, 'castDelay', t),
    recharge: gunStat(rnd, 'recharge', t),
    manaMax: Math.round(gunStat(rnd, 'manaMax', t)),
    manaRegen: Math.round(gunStat(rnd, 'manaRegen', t)),
    spread: gunStat(rnd, 'spread', t),
    speedMul: gunStat(rnd, 'speedMul', t),
    multi: rnd() < 0.1 + t * 0.4 ? 2 : 1,
    shuffle: rnd() < 0.5 * (1 - t),
    slots: new Array(cap).fill(null),
    hue: Math.floor(rnd() * 360),
  };
  // seed it with something that already shoots
  const used = 1 + Math.floor(rnd() * Math.min(cap, 2 + t * 3));
  const spots = g.slots.map((_, i) => i).sort(() => rnd() - 0.5).slice(0, used);
  const asFloor = 1 + t * 5;                  // a high-level gun comes with better mods on it
  spots.forEach((slot, n) => {
    g.slots[slot] = n === 0 ? SEED_SHOTS[Math.floor(rnd() * SEED_SHOTS.length)]
                            : rollMod(rnd, asFloor);
  });
  if (!g.slots.some(id => id && MODS[id].kind === 'shot')) g.slots[spots[0]] = 'bolt';
  g.mana = g.manaMax;
  return resetGun(g);
}

function startingGuns() {
  // The Scratch Pistol is a weak backup on purpose: slow, thirsty and single-shot, so
  // anything you find on floor 1 is an upgrade over it. It's first in line (selected).
  const pistol = resetGun({ name: 'Scratch Pistol', cap: 3, castDelay: 0.32, recharge: 1.7,
    manaMax: 90, manaRegen: 22, spread: 5, multi: 1, shuffle: false, mana: 90, speedMul: 1,
    slots: ['bolt', null, null], hue: Math.floor(Math.random() * 360) });
  // The Pick Axe holds a Buzzsaw: no travel, a big circular slice right in front that chews
  // rock and shreds anything close. Buzzsaw zeroes cast delay, so recharge (1s) sets the swing.
  const pickaxe = resetGun({ name: 'Pick Axe', cap: 1, castDelay: 0.05, recharge: 1.0,
    manaMax: 120, manaRegen: 60, spread: 0, multi: 1, shuffle: false, mana: 120, speedMul: 1,
    slots: ['saw'], hue: 20 });
  return [pistol, pickaxe, null, null];
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the shots that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// Anything that comes out of the barrel: a shot has these and nothing else, so a
// modifier's f() can only touch fields that exist here.
function blankShot(sm, spread) {
  return { dmg: sm.dmg || 0, speed: sm.speed || 0, spread: (sm.spread || 0) + spread,
    size: sm.size || 2, life: sm.life || 1, count: sm.count || 1,
    bounce: sm.bounce || 0, pierce: sm.pierce || 0, explode: sm.explode || 0,
    grav: sm.grav || 0, homing: sm.homing || 0, accel: 0, bore: sm.bore || 0, recoil: sm.recoil || 0,
    col: sm.col, knock: 0, crit: 0, boomer: 0, spiral: 0, pong: 0, orbit: 0,
    autoaim: 0, homeR: sm.homeR || 0, flat: 0, eat: sm.eat || 0, pull: sm.pull || 0,
    split: 0, cluster: 0, bounceFx: null, friendly: 0, chain: sm.chain || 0,
    fuse: sm.fuse || 0, beam: sm.beam || 0, payload: null,
    trig: sm.trig || null, timer: sm.timer != null ? sm.timer : TIMER_ADD,
    reach: sm.reach != null ? sm.reach : 10,     // how far ahead of the muzzle it spawns
    hidden: sm.hidden || 0,                       // don't draw it (Buzzsaw cuts unseen)
    drift: sm.drift || 0, pop: sm.pop || 0,       // Pollen: slows, floats, locks on; small pop on contact
    arc: sm.arc || 0,                             // Lightning: jagged bolt that throws side arcs
    sid: sm.id,                                   // which spell it is, for its sound
    still: sm.kind === 'static' ? 1 : 0, field: sm.field || null, r: sm.r || 0 };
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the spells that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// `others` is your other guns, which only Zeta looks at.
function planCast(g, others) {
  const start = g.idx, mods = [], defs = [];
  // what each cast spell is carrying, by its index in defs: a trigger fills this
  // with the payload it drew, and everything else leaves it empty
  const holds = [];
  let addTrig = null;                   // an Add Trigger waiting for the next projectile
  let multi = g.multi, cost = 0, manaMul = 1, ran = false, wrapped = 0;
  // delay is walked in draw order: most mods nudge it, a few reset it outright,
  // and anything drawn after a reset adds its own delay back on top
  let delay = g.castDelay;
  let form = null, hp = 0;
  const acts = [];
  const timing = m => {
    if (m.setDelay !== undefined) delay = m.setDelay;
    else delay += (m.kind === 'shot' || m.kind === 'static' ? m.delay : m.d) || 0;
  };
  const live = () => g.slots.filter(id => id && MODS[id].kind !== 'passive');
  const casts = id => id && (MODS[id].kind === 'shot' || MODS[id].kind === 'static');
  // how many things the gun still has left to fire this cycle, which is what Myriad takes
  const rest = () => {
    let n = 0;
    for (let i = g.idx; i < g.order.length; i++) if (casts(g.slots[g.order[i]])) n++;
    return n;
  };
  const onGun = () => g.slots.filter(casts).length;
  let queued = 0;                       // copies waiting in the queue that will fire
  // A Greek letter drops the spells it copies into this queue, and they are drawn
  // before the gun moves on. Copies never copy again, so Omega cannot run away.
  const queue = [];
  const copiesOf = m => {
    const all = live().filter(id => !MODS[id].copy);   // a copy never copies a copy
    if (m.copy === 'first') return all.slice(0, 1);
    if (m.copy === 'last') return all.slice(-1);
    if (m.copy === 'all') return all;
    if (m.copy === 'shots') return all.filter(id => MODS[id].kind === 'shot');
    if (m.copy === 'statics') return all.filter(id => MODS[id].kind === 'static');
    if (m.copy === 'next2') {
      const out = [];
      for (let i = g.idx; i < g.order.length && out.length < 2; i++) {
        const id = g.slots[g.order[i]];
        if (id && MODS[id].kind !== 'passive') out.push(id);
      }
      return out;
    }
    if (m.copy === 'other') {
      const pool = [];
      for (const o of others || []) {
        if (!o || o === g) continue;
        for (const id of o.slots) if (id && MODS[id].kind !== 'passive' && !MODS[id].copy) pool.push(id);
      }
      return pool.length ? [pool[Math.floor(Math.random() * pool.length)]] : [];
    }
    return [];
  };

  const dress = (sm, list) => {
    const sh = blankShot(sm, g.spread);
    for (const m of list) if (m.f) m.f(sh);
    sh.speed *= g.speedMul || 1;
    if (sh.flat) sh.grav = 0;
    return sh;
  };
  // A trigger's payload is a little cast of its own, drawn straight after the carrier:
  // `n` casts, with its own modifiers, multicasts and triggers. Nothing outside it
  // reaches in and nothing in it leaks out. It may wrap round the gun once (shared with
  // the main draw), and the depth cap plus the one wrap keep it from running away.
  // Like Noita, a wrap only brings back spells fired on earlier pulls: nothing drawn in
  // this pull can be drawn again, so a lone trigger does not carry itself.
  let drawn = 0;
  const took = new Set();
  const payloadOf = (n, depth) => {
    const pm = [], out = [];
    let want = n, pform = null, pAdd = null;
    while (out.length < want && drawn++ < 96) {
      if (g.idx >= g.order.length) { ran = true; if (wrapped++) break; g.idx = 0; }
      if (took.has(g.idx)) { g.idx++; continue; }
      took.add(g.idx);
      const id = g.slots[g.order[g.idx++]];
      if (!id) continue;
      const m = MODS[id];
      if (m.kind === 'passive') continue;
      cost += m.mana || 0;
      if (m.hp) hp += m.hp;
      if (m.manaMul) manaMul *= m.manaMul;
      timing(m);
      if (m.kind === 'mod' || m.kind === 'util') {
        if (m.f) pm.push(m);
        if (m.multi) want += m.multi;
        if (m.form) pform = m.form;
        if (m.addTrig) pAdd = m.addTrig;
        continue;
      }
      const sh = dress(m, pm);
      if (pAdd && m.kind === 'shot' && !sh.trig) sh.trig = pAdd;
      pAdd = null;
      if (sh.trig) sh.payload = depth < 6 ? payloadOf(m.draw || 1, depth + 1) : [];
      out.push(sh);
    }
    if (pform) out.forEach((sh, i) => { sh.ang = pform[i % pform.length]; });
    return out;
  };

  for (let guard = 0; defs.length < multi && guard < 96; guard++) {
    let id, copied = false;
    if (queue.length) { id = queue.shift(); copied = true; }
    else {
      if (g.idx >= g.order.length) {
        ran = true;
        // a multicast still owed spells wraps back to the front to find them
        if (defs.length >= multi || wrapped++ || !defs.length && !mods.length) break;
        g.idx = 0;
      }
      id = g.slots[g.order[g.idx]];
      took.add(g.idx);
      g.idx++;
    }
    if (!id) continue;
    const m = MODS[id];
    if (m.kind === 'passive') continue;
    if (m.kind === 'mod' || m.kind === 'util') {
      cost += m.mana || 0;
      if (m.hp) hp += m.hp;
      if (m.act) acts.push(m.act);
      if (m.manaMul) manaMul *= m.manaMul;
      if (m.f) mods.push(m);
      if (m.addTrig) addTrig = m.addTrig;
      // Copies and multicasts only open up on the first pass. Once the gun has
      // wrapped round to the front they are skipped, or a Myriad would widen the
      // cast every time it came round and never finish.
      if (!copied && !wrapped) {
        if (m.multi) multi += m.multi;
        if (m.form) form = m.form;
        if (m.myriad) { multi += rest(); multi = Math.min(multi, queued + onGun()); }
        if (m.copy === 'mods') {
          for (const oid of live()) if (MODS[oid].f && !mods.includes(MODS[oid])) mods.push(MODS[oid]);
        } else if (m.copy) {
          let room = 0;
          for (const c of copiesOf(m)) { queue.push(c); if (casts(c)) { room++; queued++; } }
          // the copies need room, and so do the originals they came from: sweeping the
          // whole gun fires everything on it, and Tau fires its pair twice
          if (m.copy === 'all' || m.copy === 'shots' || m.copy === 'statics') multi += room + rest();
          else if (m.copy === 'next2') multi += room * 2;
          else multi += room;
          // never ask for more than the gun can actually produce, or the wrap-around
          // hands out a stray extra shot
          multi = Math.min(multi, queued + onGun());
        }
      }
      timing(m);
      continue;
    }
    defs.push(m);
    cost += m.mana;
    timing(m);
    // a carrier (a "with Trigger" spell, or any projectile after Add Trigger) draws its
    // payload right now, so the spells it takes are not cast from the barrel as well
    const kind = m.trig || (m.kind === 'shot' && addTrig) || null;
    if (m.kind === 'shot') addTrig = null;
    if (kind) holds[defs.length - 1] = { kind, list: payloadOf(m.draw || 1, 1) };
  }
  const shots = defs.map((sm, i) => {
    const sh = dress(sm, mods);
    if (holds[i]) { sh.trig = holds[i].kind; sh.payload = holds[i].list; }
    return sh;
  });
  if (form) shots.forEach((sh, i) => { sh.ang = form[i % form.length]; });
  let more = false;                       // anything left worth firing this cycle?
  for (let i = g.idx; i < g.order.length; i++) {
    const id = g.slots[g.order[i]];
    const k = id && MODS[id].kind;
    if (k === 'shot' || k === 'static') { more = true; break; }
  }
  return { shots, defs, start, cost: cost * manaMul, acts, hp,
    delay: Math.max(MIN_CAST, delay),
    wrap: ran || !more };
}

// What does this mod actually do? Rather than describing it by hand, run a plain
// bolt through the planner with and without it and report whatever changed.
const PREVIEW_FIELDS = [['dmg', 'damage'], ['speed', 'speed'], ['spread', 'spread', '\u00b0'],
  ['size', 'size'], ['life', 'flight time', 's'], ['bounce', 'bounces'], ['pierce', 'pierce'],
  ['homing', 'homing'], ['explode', 'blast radius'], ['bore', 'drill'], ['recoil', 'recoil'],
  ['accel', 'acceleration']];
const num = v => {
  const r = Math.round(v * 100) / 100;
  return String(r);
};
function previewGun(slots, over) {
  return resetGun(Object.assign({ name: 'p', cap: slots.length, castDelay: 0.2, recharge: 1,
    manaMax: 99999, manaRegen: 0, spread: 0, multi: 1, shuffle: false, mana: 99999,
    speedMul: 1, slots }, over || {}));
}
function previewPlan(slots) { return planCast(previewGun(slots)); }
function modPreview(id) {
  const m = MODS[id];
  const rows = [];
  const push = (label, x, y, unit) => {
    if (Math.abs(x - y) < 1e-6) return;
    rows.push([label, num(x) + (unit || '') + ' \u2192 ' + num(y) + (unit || '')]);
  };
  // a plain, readable gun to measure against
  const REF = { recharge: 1, manaMax: 100, manaRegen: 40 };
  const ref = slots => previewGun(slots, REF);

  if (m.kind === 'passive') {
    const a = ref(['bolt']), b = ref([id, 'bolt']);
    push('recharge', effRecharge(a), effRecharge(b), 's');
    push('mana', a.manaMax + gunPassives(a).manaMax, b.manaMax + gunPassives(b).manaMax);
    push('mana regen', a.manaRegen + gunPassives(a).manaRegen,
      b.manaRegen + gunPassives(b).manaRegen, '/s');
    return { rows };
  }

  if (m.kind === 'static') {
    const p = previewPlan([id]);
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's'],
      ['radius', num(m.r)]);
    if (m.life > 0.2) rows.push(['lasts', num(m.life) + 's']);
    rows.push(['does', FIELD_WHAT[m.field] || m.field]);
    return { rows };
  }

  if (m.kind === 'util') {
    const p = previewPlan([id, 'bolt']), a = previewPlan(['bolt']);
    rows.push(['mana', num(m.mana || 0)]);
    push('cast delay', a.delay, p.delay, 's');
    push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
    if (m.manaMul) rows.push(['mana cost', '\u00d7' + num(m.manaMul)]);
    if (m.hp) rows.push(['health per pull', '\u2212' + num(m.hp)]);
    const sa = a.shots[0], sb = p.shots[0];
    if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
    return { rows };
  }

  if (m.kind === 'shot') {
    const p = previewPlan([id]);
    const sh = p.shots[0];
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's']);
    if (m.trig) rows.push(['carries',
      (m.draw === 1 ? 'the next spell' : 'the next ' + m.draw + ' spells')
      + (m.trig === 'hit' ? ', on a hit' : m.trig === 'timer' ? ', after ' + num(m.timer) + 's'
        : ', when it dies')]);
    if (m.rech || m.rechMul) rows.push(['recharge', num(effRecharge(ref([id]))) + 's']);
    for (const [key, label, unit] of PREVIEW_FIELDS) {
      if (!sh[key]) continue;
      rows.push([label, num(sh[key]) + (unit || '')]);
    }
    if (sh.count > 1) rows.splice(2, 0, ['pellets', num(sh.count)]);
    return { rows };
  }

  const a = previewPlan(['bolt']);
  const b = previewPlan([id, 'bolt', 'bolt', 'bolt', 'bolt']);
  push('shots per pull', a.shots.length, b.shots.length);
  push('mana', a.cost, b.cost);
  push('cast delay', a.delay, b.delay, 's');
  push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
  const sa = a.shots[0], sb = b.shots[0];
  if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
  return { rows };
}

// How much damage a gun really puts out, averaged over a whole cycle: every pull
// in the list, then the recharge. Firing faster than mana allows just stalls, so
// the rate is capped by what regen can sustain.
// what your health can pay out per second and still last a decent fight
const HP_BUDGET = PLAYER_HP / 25;

// What one planned shot is worth: every pellet of it, plus anything a trigger is
// carrying to the point of impact. Payloads nest, but are finite, so this ends.
const shotPower = sh => (sh.dmg || 0) * Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPower(ps), 0);
const shotCount = sh => 1 + (sh.payload || []).reduce((t, ps) => t + shotCount(ps), 0);
const shotPellets = sh => Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPellets(ps), 0);

function gunRate(gun) {
  const g = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  let cast = 0, dmg = 0, cost = 0, shots = 0, blood = 0;
  for (let guard = 0; guard < 16; guard++) {
    const p = planCast(g);
    cast += p.delay;
    cost += p.cost;
    blood += p.hp || 0;
    for (const sh of p.shots) {
      // a trigger's mana is already counted; its payload's damage has to be too
      shots += shotCount(sh);
      dmg += shotPower(sh);
    }
    if (p.wrap) break;
  }
  const rech = effRecharge(g);
  const cycle = Math.max(0.001, cast + rech);
  const pas = gunPassives(gun);
  const regen = gun.manaRegen + pas.manaRegen;
  const manaPerSec = cost / cycle;
  const sustain = manaPerSec > regen ? regen / manaPerSec : 1;
  // health is a resource too: a gun that bleeds you dry in five seconds is not really
  // doing that much damage per second, however good the raw numbers look
  const hpPerSec = blood / cycle;
  const bleed = hpPerSec > HP_BUDGET ? HP_BUDGET / hpPerSec : 1;
  return { dps: (dmg / cycle) * sustain * bleed, cycle, cast, rech, manaPerSec, regen,
    shots, sustain, hpPerSec, bleed };
}

// Spot the bottleneck, then brute-force every single swap between the gun and the
// bag to see which one helps most. No cleverness, just the planner run a few
// hundred times, which costs a few milliseconds.
// how many promising mods get the full every-slot treatment
const SHORTLIST = 14;

function buildAdvice(gun, bag) {
  const now = gunRate(gun);
  let limit;
  if (!now.shots) limit = { key: 'none', text: 'Nothing on this gun fires — it needs a shot mod' };
  else if (now.bleed < 0.95) limit = { key: 'blood',
    text: 'Your health is the limit — ' + now.hpPerSec.toFixed(1) + ' hp/s to keep this up' };
  else if (now.sustain < 0.95) limit = { key: 'mana',
    text: 'Mana is the limit — ' + Math.round(now.manaPerSec) + '/s used against ' +
      Math.round(now.regen) + '/s regen' };
  else if (now.rech > now.cast) limit = { key: 'rech',
    text: 'Recharge is the limit — ' + Math.round(100 * now.rech / now.cycle) + '% of the cycle' };
  else limit = { key: 'cast',
    text: 'Cast delay is the limit — ' + Math.round(100 * now.cast / now.cycle) + '% of the cycle' };

  const tips = [];
  const score = slots => gunRate(Object.assign({}, gun, { slots })).dps;
  if (now.shots) {
    const seen = {};
    const pool = bag.filter(id => !seen[id] && (seen[id] = 1));
    // With a hundred-odd mods to hand, trying every one in every slot is far too much
    // work for one render. So: a cheap first look at each mod in a couple of slots,
    // then the handful that showed promise get tried properly everywhere.
    const probe = [0, gun.slots.indexOf(null) >= 0 ? gun.slots.indexOf(null) : gun.slots.length - 1]
      .filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
    let shortlist = pool;
    if (pool.length > SHORTLIST) {
      const rough = [];
      for (const id of pool) {
        let bestDps = 0;
        for (const i of probe) {
          if (gun.slots[i] === id) continue;
          const slots = gun.slots.slice();
          slots[i] = id;
          bestDps = Math.max(bestDps, score(slots));
        }
        rough.push({ id, bestDps });
      }
      rough.sort((a, b) => b.bestDps - a.bestDps);
      shortlist = rough.slice(0, SHORTLIST).map(r => r.id);
    }
    // bringing one mod in from the bag
    for (let i = 0; i < gun.slots.length; i++) {
      for (const id of shortlist) {
        if (gun.slots[i] === id) continue;
        const slots = gun.slots.slice();
        slots[i] = id;
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'fit', slot: i, id, dps, gain: dps / now.dps });
      }
    }
    // or just moving what is already on the gun, which is often the real fix
    for (let i = 0; i < gun.slots.length; i++) {
      for (let j = i + 1; j < gun.slots.length; j++) {
        if (!gun.slots[i] && !gun.slots[j]) continue;
        const slots = gun.slots.slice();
        slots[i] = gun.slots[j]; slots[j] = gun.slots[i];
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'move', slot: i, other: j, dps, gain: dps / now.dps });
      }
    }
    tips.sort((a, b) => b.dps - a.dps);
  }
  // one tip per slot, so the list does not fill up with variations on one idea
  const picked = [], usedSlot = {}, usedMod = {};
  for (const t of tips) {
    if (usedSlot[t.slot] || (t.other !== undefined && usedSlot[t.other])) continue;
    if (t.id && usedMod[t.id]) continue;   // you only own one of each, so only its best slot
    if (t.id) usedMod[t.id] = 1;
    usedSlot[t.slot] = 1;
    if (t.other !== undefined) usedSlot[t.other] = 1;
    picked.push(t);
    if (picked.length === 3) break;
  }
  return { now, limit, tips: picked };
}

// Which slots come out together on one pull. A modifier lands in the same group
// as the shots it modifies, which is exactly what the outline in the build screen
// draws. Null means the order is shuffled, so there is nothing fixed to show.
function castGroups(gun) {
  if (gun.shuffle) return null;
  const sim = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  const groups = [];
  for (let guard = 0; guard < 64; guard++) {
    const from = sim.idx;
    if (from >= sim.order.length) break;
    const plan = planCast(sim);
    let to = sim.idx;
    const wrapped = to <= from;              // a multicast that ran back to the front
    if (wrapped) to = sim.order.length;
    if (plan.shots.length) groups.push({ from, to, wrapped, shots: plan.shots.length, plan });
    if (plan.wrap) break;
  }
  return groups;
}

// Replay a pull with its modifiers stripped out, so the difference is exactly
// what the mods in that group are contributing.
function groupStats(gun, gr) {
  const plan = gr.plan;
  const ids = plan.defs.map(d => d.id);
  const bare = planCast(resetGun(Object.assign({}, gun, {
    cap: Math.max(1, ids.length), slots: ids.slice(),
    multi: Math.max(1, ids.length), shuffle: false })));
  const sum = (p, f) => p.shots.reduce((t, sh) => t + (sh[f] || 0), 0);
  // damage is what the whole pull puts out, so a pellet spray counts every pellet
  const power = p => p.shots.reduce((t, sh) => t + shotPower(sh), 0);
  const topOf = (sh, f) => (sh.payload || []).reduce((n, ps) => Math.max(n, topOf(ps, f)), sh[f] || 0);
  const top = (p, f) => p.shots.reduce((t, sh) => Math.max(t, topOf(sh, f)), 0);
  const pellets = p => p.shots.reduce((t, sh) => t + shotPellets(sh), 0);
  const avg = (p, f) => (p.shots.length ? sum(p, f) / p.shots.length : 0);

  const out = [];
  const add = (label, now, was, better, fmt, always) => {
    const d = now - was;
    if (!always && Math.abs(d) < 1e-6) return;
    const dir = Math.abs(d) < 1e-6 ? '' : (d > 0) === (better > 0) ? 'up' : 'down';
    const delta = Math.abs(d) < 1e-6 ? ''
      : (d > 0 ? '+' : '\u2212') + fmt(Math.abs(d));
    out.push({ label, value: fmt(now), delta, dir });
  };
  const n = v => String(Math.round(v * 100) / 100);
  const sec = v => (Math.round(v * 1000) / 1000) + 's';

  // recharge counts from any slot, so credit it to the group its mods sit in
  const without = Object.assign({}, gun, {
    slots: gun.slots.map((id, i) => (i >= gr.from && i < gr.to ? null : id)) });
  add('recharge', effRecharge(gun), effRecharge(without), -1, sec);

  add('dmg', power(plan), power(bare), 1, n, true);
  add('shots', pellets(plan), pellets(bare), 1, n, pellets(plan) > plan.shots.length);
  add('mana', plan.cost, bare.cost, -1, n, true);
  add('delay', plan.delay, bare.delay, -1, sec, true);
  add('speed', avg(plan, 'speed'), avg(bare, 'speed'), 1, v => String(Math.round(v)));
  add('spread', avg(plan, 'spread'), avg(bare, 'spread'), -1, v => n(v) + '\u00b0');
  add('homing', top(plan, 'homing'), top(bare, 'homing'), 1, n);
  add('bounces', top(plan, 'bounce'), top(bare, 'bounce'), 1, n);
  add('pierce', top(plan, 'pierce'), top(bare, 'pierce'), 1, n);
  add('blast', top(plan, 'explode'), top(bare, 'explode'), 1, n);
  add('drill', top(plan, 'bore'), top(bare, 'bore'), 1, n);
  add('life', avg(plan, 'life'), avg(bare, 'life'), 1, sec);
  return out;
}

// what the gun actually does with the mods on it right now
function gunPassives(g) {
  let rech = 0, rechMul = 1, manaMax = 0, manaRegen = 0;
  for (const id of g.slots) {
    if (!id) continue;
    const m = MODS[id];
    if (m.rech) rech += m.rech;
    if (m.rechMul) rechMul *= m.rechMul;
    if (m.manaMax) manaMax += m.manaMax;
    if (m.manaRegen) manaRegen += m.manaRegen;
  }
  return { rech, rechMul, manaMax, manaRegen };
}

// The bag screen's slot animation: the filled slots in the order one full cycle fires
// them, each tagged with the pull it comes out on. Empty slots are skipped. Null for a
// shuffled gun, whose order changes every recharge.
function pullSteps(g) {
  const groups = castGroups(g);
  if (!groups) return null;
  const steps = [], seen = new Set();
  groups.forEach((gr, n) => {
    for (let i = gr.from; i < gr.to && i < g.slots.length; i++)
      if (g.slots[i] && !seen.has(i)) { seen.add(i); steps.push({ slot: i, pull: n }); }
  });
  return steps;
}

// The bag screen's "trigger held down" preview: the Game's own cast loop (cast() and the
// per-frame gun tick) run on a copy of the gun, so the slot lights and the stat bars move at
// the gun's real pace — cast delay between pulls, recharge after the last, mana drained per
// pull and regenerating, a pause when it runs dry. No perks: the gun as it is.
function fireSimNew(gun) {
  const g = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  const max = gun.manaMax + gunPassives(gun).manaMax;
  return { g, max, mana: max, delayT: 0, delayMax: 0, rechT: 0, rechLen: 0, pull: 0, lit: null, fired: 0 };
}
function fireSimStep(S, dt) {
  const g = S.g, pas = gunPassives(g);
  S.delayT -= dt; S.rechT -= dt;
  S.mana = Math.min(S.max, S.mana + (g.manaRegen + pas.manaRegen) * dt);
  if (S.lit && (S.lit.t -= dt) <= 0) S.lit = null;
  if (S.delayT > 0 || S.rechT > 0) return;
  const wrap = () => { g.idx = 0; S.rechT = S.rechLen = effRecharge(g); S.pull = 0; shuffleOrder(g); };
  const start = g.idx;
  const plan = planCast(g);
  if (!plan.shots.length) { wrap(); return; }
  if (S.mana < plan.cost) { g.idx = plan.start; S.delayT = S.delayMax = 0.12; return; }
  S.mana -= plan.cost;
  const end = plan.wrap || g.idx <= start ? g.order.length : g.idx;
  const slots = [];
  for (let i = start; i < end; i++) if (g.slots[g.order[i]]) slots.push(g.order[i]);
  // modifiers the pull ran past at the end of the list modify nothing, so they don't light
  const casts = id => MODS[id].kind === 'shot' || MODS[id].kind === 'static';
  while (slots.length && !casts(g.slots[slots[slots.length - 1]])) slots.pop();
  // the light holds for the pull's cast delay, but never so briefly you can't see it
  S.lit = { slots, pull: S.pull, t: Math.max(0.1, Math.min(plan.delay, 0.45)) };
  S.pull++; S.fired++;
  S.delayT = S.delayMax = plan.delay;
  if (plan.wrap) wrap();
}
// the live gauges, 0-1, the same readiness the right stick's rings show
function fireSimGauges(S) {
  return { mana: S.max > 0 ? Math.max(0, S.mana / S.max) : 0,
    castDelay: S.delayT > 0 && S.delayMax ? Math.max(0, 1 - S.delayT / S.delayMax) : 1,
    recharge: S.rechT > 0 && S.rechLen ? Math.max(0, 1 - S.rechT / S.rechLen) : 1 };
}

// How close a gun stat is to perfect: 0 at the worst end of its GUN_RANGE, 1 at the best.
// Double cast and cast order are yes/no, so they are 0 or 1.
function statQual(k, v) {
  if (k === 'multi') return v > 1 ? 1 : 0;
  if (k === 'shuffle') return v ? 0 : 1;
  const [w, b] = GUN_RANGE[k];
  return Math.max(0, Math.min(1, (v - w) / (b - w)));
}

// What the mods on a gun do to its own stats, as a change from the gun's bare number.
// Cast delay, spread and shot speed are averaged over every pull of one full cycle
// (spread and speed against the same pull with its modifiers stripped out).
function gunModDeltas(g) {
  const pas = gunPassives(g);
  const out = { cap: 0, castDelay: 0, recharge: effRecharge(g) - g.recharge,
    manaMax: pas.manaMax, manaRegen: pas.manaRegen, spread: 0, speedMul: 0, multi: 0, shuffle: 0 };
  const sim = resetGun(Object.assign({}, g, { slots: g.slots.slice(), shuffle: false }));
  const plans = [];
  for (let guard = 0; guard < 64 && sim.idx < sim.order.length; guard++) {
    const p = planCast(sim);
    if (p.shots.length) plans.push(p);
    if (p.wrap) break;
  }
  if (!plans.length) return out;
  const avg = (sh, f) => sh.reduce((t, x) => t + (x[f] || 0), 0) / sh.length;
  let d = 0, sp = 0, spd = 0;
  for (const p of plans) {
    const ids = p.defs.map(x => x.id);
    const bare = planCast(resetGun(Object.assign({}, g, { cap: Math.max(1, ids.length), slots: ids.slice(),
      multi: Math.max(1, ids.length), shuffle: false })));
    d += p.delay;
    sp += avg(p.shots, 'spread') - (bare.shots.length ? avg(bare.shots, 'spread') : g.spread);
    const bs = bare.shots.length ? avg(bare.shots, 'speed') : 0;
    spd += bs > 0 ? avg(p.shots, 'speed') / bs - 1 : 0;
  }
  out.castDelay = d / plans.length - g.castDelay;
  out.spread = sp / plans.length;
  out.speedMul = (g.speedMul || 1) * spd / plans.length;
  return out;
}

// ---- sprites ----
// Everything is drawn from primitives at world scale (the player is 12x22 units),
// so it stays crisp at any zoom and there are no images to load.
function rr(ctx, x, y, w, hh, r) {
  const k = Math.min(r, w / 2, hh / 2);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, hh, k);
  else {
    ctx.moveTo(x + k, y);
    ctx.arcTo(x + w, y, x + w, y + hh, k);
    ctx.arcTo(x + w, y + hh, x, y + hh, k);
    ctx.arcTo(x, y + hh, x, y, k);
    ctx.arcTo(x, y, x + w, y, k);
    ctx.closePath();
  }
}

// A gun, grip at the origin, barrel down +x. Scaled so the same drawing works for
// the one in your hands and the little one lying on the cave floor.
function drawGun(ctx, x, y, ang, sc, accent) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  if (Math.cos(ang) < 0) ctx.scale(1, -1);     // aiming left: flip, don't hang upside down
  ctx.scale(sc, sc);
  ctx.fillStyle = '#20242c';                    // stock and grip
  rr(ctx, -6.5, -4.6, 4.5, 3.6, 1.2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-1.4, -1.2); ctx.lineTo(1.8, -1.2); ctx.lineTo(0.9, 4.6); ctx.lineTo(-2.2, 4.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3c424e';                    // magazine
  ctx.beginPath();
  ctx.moveTo(2.2, -1); ctx.lineTo(5, -1); ctx.lineTo(4.4, 3.4); ctx.lineTo(1.8, 3.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a515f';                    // receiver
  rr(ctx, -4.4, -5.2, 10.5, 4.4, 1.3); ctx.fill();
  ctx.fillStyle = '#5f6878';                    // barrel
  rr(ctx, 5.5, -4.4, 7.5, 2.4, 1); ctx.fill();
  ctx.fillStyle = '#343a45';                    // sight
  rr(ctx, 0.5, -6.6, 2.4, 1.6, 0.6); ctx.fill();
  ctx.fillStyle = accent || COL.bullet;         // muzzle and a flash of the gun's colour
  rr(ctx, 12.4, -5, 1.8, 3.6, 0.7); ctx.fill();
  rr(ctx, -3.4, -4.4, 2.6, 2.6, 0.8); ctx.fill();
  ctx.restore();
}

// The runner: jetpack on the back, sealed helmet, legs that actually move.
function drawRunner(ctx, x, y, w, hh, face, gait, air, jet, flash) {
  const suit = flash ? '#ffffff' : '#ff5a36';
  const dark = flash ? '#d8dde6' : '#c33a1f';
  ctx.save();
  ctx.translate(x + w / 2, y);
  ctx.scale(face, 1);
  // jetpack
  ctx.fillStyle = '#2b3039';
  rr(ctx, -6.2, 6.5, 4.4, 9, 1.6); ctx.fill();
  ctx.fillStyle = '#ff8a1f';
  rr(ctx, -5.6, 8.4, 3.2, 1.4, 0.6); ctx.fill();
  ctx.fillStyle = '#1b1f26';
  rr(ctx, -5.4, 15, 3, 2.2, 0.8); ctx.fill();
  if (jet > 0) {                                  // the nozzle glows when it is lit
    ctx.fillStyle = COL.flame2;
    rr(ctx, -5.2, 16.4, 2.6, 1.6, 0.8); ctx.fill();
  }
  // legs: a stride on the ground, tucked up in the air
  ctx.fillStyle = dark;
  const swing = air ? -1.4 : gait * 2.6;
  const lift = air ? 2 : 0;
  rr(ctx, -3.4 + swing, 15.5 - lift * 0.5, 3, 6.5 - lift, 1.2); ctx.fill();
  rr(ctx, 0.4 - swing, 15.5 - lift, 3, 6.5 - lift * 0.6, 1.2); ctx.fill();
  ctx.fillStyle = '#24282f';                      // boots
  rr(ctx, -3.6 + swing, 20.2 - lift * 1.2, 3.6, 1.8, 0.7); ctx.fill();
  rr(ctx, 0.2 - swing, 20.2 - lift * 1.4, 3.6, 1.8, 0.7); ctx.fill();
  // torso
  ctx.fillStyle = suit;
  rr(ctx, -3.8, 6, 7.6, 10.5, 2.6); ctx.fill();
  ctx.fillStyle = dark;
  rr(ctx, -3.8, 12.4, 7.6, 2.2, 1); ctx.fill();   // belt
  // arm reaching for the gun
  ctx.fillStyle = suit;
  rr(ctx, 1, 8.4, 5, 2.8, 1.3); ctx.fill();
  // helmet
  ctx.fillStyle = flash ? '#ffffff' : '#d7dbe3';
  ctx.beginPath(); ctx.arc(0, 4.4, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1d2733';                      // visor
  rr(ctx, -0.6, 1.9, 4.6, 4.2, 1.8); ctx.fill();
  ctx.fillStyle = 'rgba(126,214,255,0.75)';       // glint
  rr(ctx, 1.4, 2.7, 1.8, 1.4, 0.6); ctx.fill();
  ctx.restore();
}

// The torch in the runner's free hand. `flick` is the very same number the lamp is drawn
// with, so the flame and the light it throws gutter together and the cave reads as
// torchlight rather than as a dimmer switch. The embers are the loop's particles.
// A teardrop of fire: a round base at (bx, by) of radius r, drawn out to a point at (tx, ty).
// The tip is wherever the flame is being dragged, so one shape covers upright and leaning.
function flameDrop(ctx, bx, by, tx, ty, r) {
  const dx = tx - bx, dy = ty - by, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const px = -uy, py = ux, a = Math.atan2(py, px);
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.quadraticCurveTo(bx + px * r * 1.15 + ux * L * 0.35, by + py * r * 1.15 + uy * L * 0.35, bx + px * r, by + py * r);
  ctx.arc(bx, by, r, a, a + Math.PI);
  ctx.quadraticCurveTo(bx - px * r * 1.15 + ux * L * 0.35, by - py * r * 1.15 + uy * L * 0.35, tx, ty);
  ctx.fill();
}
// The flame itself, three layers, its tip pushed by (lx, ly) — the drag of moving — and a
// small lick of its own. s scales the whole thing (the wall torches are smaller).
function drawFlame(ctx, fx, fy, lx, ly, s, flick, time) {
  const wob = Math.sin(time * 17) * 0.6 + Math.sin(time * 29) * 0.35;
  const h = 9.5 * s * (0.85 + 0.2 * flick);
  ctx.fillStyle = COL.flame;
  ctx.globalAlpha = 0.9;
  flameDrop(ctx, fx, fy, fx + lx * s + wob * s, fy - h + ly * s, 2.9 * s);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.flame2;
  flameDrop(ctx, fx, fy + 0.3 * s, fx + (lx * 0.6 + wob * 0.5) * s, fy - h * 0.6 + ly * 0.6 * s, 1.7 * s);
  ctx.fillStyle = '#fff6d8';
  flameDrop(ctx, fx, fy + 0.6 * s, fx + lx * 0.3 * s, fy - h * 0.28 + ly * 0.3 * s, 0.8 * s);
}
// A soft warm glow at (x, y): additive, so it brightens whatever is under it. Used for the
// halo round a flame and for the torch's small second light round the player.
function glowAt(ctx, x, y, r, a, rgb) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(0.45, 'rgba(' + rgb + ',' + (a * 0.4) + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// The torch in the runner's free hand. `flick` is the very same number the lamp is drawn
// with, so the flame and the light it throws gutter together and the cave reads as
// torchlight rather than as a dimmer switch. (lx, ly) drags the flame about as you move.
function drawTorch(ctx, x, y, face, flick, embers, lx, ly, time) {
  const fx = x + face * 1.6, fy = y - 7;           // the flame rides above the fist
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#5b4630'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(x, y + 2.5); ctx.lineTo(fx, fy); ctx.stroke();
  ctx.strokeStyle = '#8a6b45'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + 2.5); ctx.lineTo(fx, fy); ctx.stroke();
  drawFlame(ctx, fx, fy - 1, lx, ly, 1, flick, time);
  ctx.restore();
  for (const q of embers) {
    ctx.globalAlpha = Math.max(0, q.life / q.max) * 0.85;
    ctx.fillStyle = q.c;
    ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}
// A smaller torch in an iron bracket on the wall, either side of a portal or a room's prize.
// Its flame sways a little on its own; ph keeps neighbours out of step.
function drawSconce(ctx, x, y, time, ph) {
  const s = 0.72, fl = 0.9 + 0.1 * Math.sin(time * 13 + ph) * Math.sin(time * 7.3 + ph * 2);
  ctx.save();
  ctx.fillStyle = '#2b2a30';
  ctx.fillRect(x - 2.5, y + 5, 5, 2);               // the wall plate
  ctx.fillRect(x - 0.8, y + 1, 1.6, 5);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#5b4630'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y - 3); ctx.stroke();
  ctx.fillStyle = '#3a3840';
  ctx.fillRect(x - 2.2, y - 3.5, 4.4, 2);           // the cup
  drawFlame(ctx, x, y - 4, Math.sin(time * 1.9 + ph) * 1.2, 0, s, fl, time + ph);
  ctx.restore();
}

// The enemies, one sprite per body. Every one of them takes the same colour set
// ({ a main, b dark, c light, eye }) so a creature's identity is carried by shape and
// colour together, and a flash on hit is the same white for all of them.
//
// The drone: a hovering gunner with one big eye that follows you around.
function drawDrone(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const shell = flash ? '#f4f0ff' : col.b;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lx * 0.22);
  // thruster wash underneath
  const puff = 0.55 + 0.25 * Math.sin(time * 9 + phase);
  ctx.globalAlpha = 0.3 * puff;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.9, r * 0.45, r * 0.8 * puff, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // stubby fins, drawn first so they read as sticking out of the hull
  ctx.fillStyle = flash ? '#e6e0f5' : col.b;
  rr(ctx, -r * 1.52, -r * 0.4, r * 0.62, r * 0.9, r * 0.22); ctx.fill();
  rr(ctx, r * 0.9, -r * 0.4, r * 0.62, r * 0.9, r * 0.22); ctx.fill();
  rr(ctx, -r * 0.34, r * 0.5, r * 0.68, r * 0.5, r * 0.18); ctx.fill();    // vent
  // hull
  ctx.fillStyle = shell;
  rr(ctx, -r * 1.05, -r * 0.78, r * 2.1, r * 1.5, r * 0.62); ctx.fill();
  ctx.strokeStyle = flash ? '#ffffff' : col.a;
  ctx.lineWidth = r * 0.14;
  rr(ctx, -r * 1.05, -r * 0.78, r * 2.1, r * 1.5, r * 0.62); ctx.stroke();
  ctx.fillStyle = flash ? '#ffffff' : col.c;
  rr(ctx, -r * 0.72, -r * 0.7, r * 1.44, r * 0.46, r * 0.22); ctx.fill();  // canopy
  ctx.restore();
  // the eye sits in the hull and swivels to keep you in view
  const ex = x + lx * r * 0.34, ey = y + ly * r * 0.26;
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#ffffff' : col.eye;
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b1526';
  ctx.beginPath(); ctx.arc(ex + lx * r * 0.15, ey + ly * r * 0.15, r * 0.16, 0, Math.PI * 2); ctx.fill();
}

// The spider: eight legs planted on the rock (or gripping its line), body turned so its
// underside faces the surface it's on. Legs scuttle while it bursts, sit still at rest.
function drawSpider(ctx, x, y, r, time, phase, flash, col, S) {
  let nx = 0, ny = -1, side = 1, moving = false;
  if (S) {
    if (S.mode === 'line' && S.line) {
      const L = S.line, len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
      nx = -(L.by - L.ay) / len; ny = (L.bx - L.ax) / len;
      if (ny > 0) { nx = -nx; ny = -ny; }                  // hang under the line
      side = S.dir * ((L.bx - L.ax) >= 0 ? 1 : -1);
    } else if (S.mode === 'surf' || S.mode === 'shoot') { nx = S.nx; ny = S.ny; side = S.side; }
    moving = S.on > 0 && S.mode !== 'shoot';
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(nx, -ny));
  const t = moving ? time * 38 + phase : phase;
  ctx.strokeStyle = flash ? '#ffffff' : col.b;
  ctx.lineWidth = r * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    const o = (i - 1.5) * r * 0.28, sw = Math.sin(t + i * 1.7) * r * 0.22;
    for (const s of [-1, 1]) {
      const fx = s * (r * (0.75 + Math.abs(i - 1.5) * 0.35)) + sw * s;
      ctx.beginPath();
      ctx.moveTo(o * 0.5, 0);
      ctx.lineTo(o * 0.5 + fx * 0.55, -r * 0.55 - Math.abs(sw) * 0.3);   // knee, up
      ctx.lineTo(o * 0.5 + fx, r * 0.62);                               // foot, on the rock
      ctx.stroke();
    }
  }
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(-side * r * 0.45, -r * 0.05, r * 0.62, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(-side * r * 0.45, -r * 0.12, r * 0.48, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(side * r * 0.3, 0, r * 0.38, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.eye;
  for (const [ex, ey, er] of [[0.5, -0.1, 0.1], [0.42, 0.06, 0.08], [0.58, 0.08, 0.07], [0.36, -0.14, 0.07]]) {
    ctx.beginPath(); ctx.arc(side * r * ex, r * ey, r * er, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// The crawler: a low body on six legs that scuttle as it walks. Spiders, hounds,
// kobolds and the armoured Lohkare all wear this one.
function drawCrawler(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const s = Math.sin(time * 7 + phase);
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = flash ? '#ffffff' : col.b;
  ctx.lineWidth = r * 0.2; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const o = (i - 1) * r * 0.5, sw = s * r * 0.26 * (i % 2 ? 1 : -1);
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(o * 0.6, 0);
      ctx.lineTo(o * 0.6 + side * r * 0.8, side * r * 0.5 + sw);
      ctx.lineTo(o * 0.6 + side * r * 1.3, side * r * 0.95 - sw * 0.5);
      ctx.stroke();
    }
  }
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.05, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.12, r * 0.82, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const side of [-1, 1]) {
    ctx.fillStyle = flash ? '#ffffff' : col.eye;
    ctx.beginPath(); ctx.arc(x + lx * r * 0.35 + side * r * 0.3, y + ly * r * 0.25, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
}

// The blob: a wobbling sac with two eyes. Slimes, toads and the fungal turret.
function drawBlob(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  const wob = 1 + 0.09 * Math.sin(time * 3.4 + phase);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.85, r * 0.72, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#f4f0ff' : col.b;
  ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 1.0, r * 0.92 * wob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.76, r * 0.66 * wob, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#1b1526';
    ctx.beginPath(); ctx.arc(x + lx * r * 0.3 + side * r * 0.26, y + r * 0.12 + ly * r * 0.18,
      r * 0.15, 0, Math.PI * 2); ctx.fill();
  }
}

// The skull: bone, a jaw, and a halo of whatever it is made of. The Jäätiö and the
// living bones are both this, one frozen blue and one bare.
function drawSkull(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lx * 0.18);
  ctx.globalAlpha = 0.26 + 0.1 * Math.sin(time * 4 + phase);
  ctx.fillStyle = col.a;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = flash ? '#ffffff' : col.a;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.85, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  rr(ctx, -r * 0.55, r * 0.4, r * 1.1, r * 0.55, r * 0.2); ctx.fill();      // jaw
  ctx.fillStyle = '#1b1526';
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(side * r * 0.34, -r * 0.18, r * 0.24, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = col.eye;
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.arc(side * r * 0.34 + lx * r * 0.1, -r * 0.18 + ly * r * 0.1,
      r * 0.11, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// The worm: a chain of segments that trails behind wherever the head is pointing.
function drawWorm(ctx, x, y, r, lx, ly, time, phase, flash, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(ly, lx));
  for (let i = 4; i >= 0; i--) {
    const t = i / 4, off = -r * 1.5 * i * 0.62, w = r * (1 - t * 0.4);
    ctx.fillStyle = flash ? '#ffffff' : (i % 2 ? col.b : col.a);
    ctx.beginPath();
    ctx.ellipse(off, Math.sin(time * 6 + phase - i * 0.7) * r * 0.34, w * 0.62, w, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#1b1526';
  ctx.beginPath(); ctx.arc(r * 0.55, 0, r * 0.26, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Whatever this enemy is, plus the ring that warns you a charged shot is coming.
function drawEnemy(ctx, e, time) {
  const k = e.k, flash = e.flash > 0;
  const x = e.x, y = e.ty, r = e.r, lx = e.lx, ly = e.ly;
  if (k.body === 'spider') drawSpider(ctx, x, y, r, time, e.phase, flash, k.col, e.sp);
  else if (k.body === 'crawler') drawCrawler(ctx, x, y, r, lx, ly, time, e.phase, flash, k.col);
  else if (k.body === 'blob') drawBlob(ctx, x, y, r, lx, ly, time, e.phase, flash, k.col);
  else if (k.body === 'skull') drawSkull(ctx, x, y, r, lx, ly, time, e.phase, flash, k.col);
  else if (k.body === 'worm') drawWorm(ctx, x, y, r, lx, ly, time, e.phase, flash, k.col);
  else drawDrone(ctx, x, y, r, lx, ly, time, e.phase, flash, k.col);
  if (e.charge > 0 && k.tele) {
    ctx.globalAlpha = 0.65;
    ctx.strokeStyle = k.col.eye;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(x, y, e.r + 4 + e.charge * 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// the colour a gun wears: its level's colour, or (starter guns, which have no level)
// whatever family its first shot belongs to
const gunLvCol = g => (g && g.lvl ? GUN_LV_COL[Math.min(GUN_LV_MAX, g.lvl) - 1] : null);
function gunAccent(g) {
  if (g && g.lvl) return gunLvCol(g);
  if (g) for (const id of g.slots) if (id && MODS[id].kind === 'shot') return famCol(id);
  return COL.bullet;
}

// shortest signed angle from b to a
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
// swing a projectile's velocity without changing how fast it is going
function turn(b, by) {
  const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(b.vy, b.vx) + by;
  b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
}

const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

const PERK_IDS = Object.keys(PERKS);

// Everything the perks you are carrying add up to. Multipliers multiply, flags stick,
// `mana: 0` means unlimited and stays unlimited however many of them you find.
function perkBag(ids) {
  const P = { dmg: 1, speed: 1, spread: 1, bounce: 0, recoil: 1, crit: 0, mana: 1,
    delay: 1, rech: 1, walk: 1, jet: 1, hpMul: 1, hpAdd: 0, heal: 1, gold: 1, goldPull: 1,
    shield: 0, lives: 0, ghost: 0, homing: 0, trail: 0, contact: 0, close: 0, invis: 0,
    repel: 0, seeAll: 0, radarEnemy: 0, radarItem: 0, radarWand: 0, tinker: 0,
    extraItem: 0, pinpointer: 0, trajectory: 0 };
  for (const id of ids || []) {
    const k = PERKS[id];
    if (!k) continue;
    P.dmg *= k.dmg || 1; P.speed *= k.speed || 1; P.spread *= k.spread || 1;
    P.recoil *= k.recoil || 1; P.delay *= k.delay || 1; P.rech *= k.rech || 1;
    P.walk *= k.walk || 1; P.jet *= k.jet || 1; P.hpMul *= k.hpMul || 1;
    P.heal *= k.heal || 1; P.gold *= k.gold || 1; P.goldPull *= k.goldPull || 1;
    if (k.mana === 0) P.mana = 0; else P.mana *= k.mana || 1;
    P.bounce += k.bounce || 0; P.crit += k.crit || 0; P.hpAdd += k.hpAdd || 0;
    P.lives += k.lives || 0; P.ghost += k.ghost || 0;
    P.homing = Math.max(P.homing, k.homing || 0);
    for (const f of ['shield', 'trail', 'contact', 'close', 'invis', 'repel', 'seeAll',
      'radarEnemy', 'radarItem', 'radarWand', 'tinker', 'extraItem', 'pinpointer', 'trajectory'])
      if (k[f]) P[f] = 1;
  }
  P.maxHp = Math.max(10, Math.round((PLAYER_HP + P.hpAdd) * P.hpMul));
  return P;
}

// Gold for the deck readout: a bare number under 1000, and thousands truncated (not
// rounded) to one decimal with a "k" — 999 -> "999", 1234 -> "1.2k", 2000 -> "2k".
// Pure and above makeLevel so the logic suite can load it.
function fmtGold(g) {
  g = Math.max(0, Math.floor(g || 0));
  if (g < 1000) return String(g);
  return (Math.floor(g / 100) / 10).toString() + 'k';
}

// Where the round deck buttons sit, in css px relative to the sticks row's top-left (the
// row is W wide, the two sticks `size` across, spaced evenly). The gun buttons ride an arc
// centred on the right stick: from the top of the gap between the sticks, clockwise over
// the top, to near the right edge. The bag mirrors the last gun on the left, and the map
// button sits straight above the bag. Returns centres plus the button diameter.
function deckLayout(W, size, n) {
  n = n || 4;
  const g = (W - 2 * size) / 3;
  const rc = { x: 2 * g + 1.5 * size, y: size / 2 };
  const btn = Math.round(Math.max(34, Math.min(46, size * 0.24)));
  const sx = W / 2, sy = size * 0.05 + 10;             // the old gold spot
  const R = Math.max(Math.hypot(sx - rc.x, sy - rc.y), size / 2 + btn / 2 + 4);
  const a0 = Math.atan2(sy - rc.y, sx - rc.x);
  const xmax = W - btn / 2 - 4;
  const a1 = Math.max(a0 + 0.3, -Math.acos(Math.max(-1, Math.min(1, (xmax - rc.x) / R))));
  const guns = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * (n > 1 ? i / (n - 1) : 0);
    guns.push({ x: rc.x + Math.cos(a) * R, y: rc.y + Math.sin(a) * R });
  }
  const last = guns[n - 1];
  const bag = { x: W - last.x, y: last.y };
  const map = { x: bag.x, y: bag.y - btn - 8 };
  return { btn, R, rc, guns, bag, map };
}

// ---- level decoration: pass 2 (baked pixels) and pass 3 (props) ----
// Every floor's theme gets five decorations. They come in three sorts:
//   bake   pass 2, purely visual. Painted straight into pixels: onto the rock itself (moss,
//          cracks, fissures — erased for free when the rock is dug), or into the decoration
//          layer `dimg`, a full-size non-colliding image drawn between the background and the
//          rock (rubble, beams, pillars, gears, ribs). dig/explode wipe that layer too.
//   amb    pass 2, a theme-wide particle effect spawned round the camera, not tied to a spot.
//   a prop kind (pass 3), something that does something. Props are NOT in `mat`: they never
//          block movement or enemy flight, they carry their own box (l,t,r,b about x,y) and
//          the Game checks overlaps against it. Most hang off a cell of rock (`anc`); the
//          Game re-checks that cell every 30 frames and drops the prop if it's gone.
// `at` is where it goes: ceil / floor / flat (level floor, width `w` cells) / pit (a dip
// in the floor) / wall / surf (floor or wall) / air (open space).
const DECOR = [
  [ // 1 Mossy caves
    { id: 'vines',   name: 'Hanging Vines',      at: 'ceil',  kind: 'climb', style: 'vine', n: 24 },
    { id: 'rubble',  name: 'Overgrown Rubble',   at: 'flat',  kind: 'bake',  style: 'rubble', w: 4, n: 45 },
    { id: 'drips',   name: 'Dripping Water',     at: 'ceil',  kind: 'drip',  style: 'water', n: 26 },
    { id: 'spores',  name: 'Luminescent Spores', at: 'air',   kind: 'amb',   style: 'spores' },
    { id: 'moss',    name: 'Soft Moss Patches',  at: 'floor', kind: 'bake',  style: 'moss', n: 80 } ],
  [ // 2 Coal seams
    { id: 'beams',   name: 'Wooden Support Beams', at: 'flat',  kind: 'bake',   style: 'beams', w: 9, n: 26 },
    { id: 'carts',   name: 'Explosive Minecarts',  at: 'flat',  kind: 'barrel', style: 'cart', w: 5, n: 12 },
    { id: 'soot',    name: 'Soot Falls',           at: 'ceil',  kind: 'drip',   style: 'soot', n: 22 },
    { id: 'lanterns', name: 'Rusted Lanterns',     at: 'wall',  kind: 'lamp',   style: 'lantern', n: 22 },
    { id: 'picks',   name: 'Discarded Pickaxes',   at: 'floor', kind: 'bake',   style: 'pickaxe', n: 30 } ],
  [ // 3 Frozen deep
