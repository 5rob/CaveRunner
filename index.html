// What the map is allowed to remember is worked out as a fan of rays out from the player,
// each stopping at the first wall: one ray per fog cell the fan crosses, so a shadow edge
// lands on about the grid it is drawn into. See fogReveal.
const VIS_RAYS = 160;

// Light every cell within r world units of (wx, wy) that the torch can actually reach,
// and return how many were newly lit so the caller can leave the overlay alone on the
// frames where nothing changed. `pts` is the fan visPoly cast from the same spot, and a
// cell is only lit if the fan reaches at least that far in its direction — so ground
// round the corner of a wall is not seen and never goes on the map.
function fogReveal(seen, wx, wy, r, pts, rays) {
  const cx = wx / FOG_U, cy = wy / FOG_U, cr = r / FOG_U, r2 = cr * cr;
  const x0 = Math.max(0, Math.floor(cx - cr)), x1 = Math.min(FW - 1, Math.ceil(cx + cr));
  const y0 = Math.max(0, Math.floor(cy - cr)), y1 = Math.min(FH - 1, Math.ceil(cy + cr));
  let n = 0;
  for (let y = y0; y <= y1; y++) {
    const row = y * FW, dy = y + 0.5 - cy, dy2 = dy * dy;
    for (let x = x0; x <= x1; x++) {
      if (seen[row + x]) continue;
      const dx = x + 0.5 - cx;
      if (dx * dx + dy2 > r2) continue;
      const d = Math.sqrt(dx * dx + dy2) * FOG_U;            // world units, to match the fan
      // how far the fan got in this direction: the shorter of the two rays either side of
      // it, so a cell only goes on the map if a ray actually reached it. Interpolating
      // between the two would reach a little further than either and mark cells just round
      // a corner — which is the one thing this is here to stop.
      const t = (Math.atan2(dy, dx) / (Math.PI * 2) + 1) % 1 * rays;
      const i0 = Math.floor(t), i1 = (i0 + 1) % rays;
      const a = Math.hypot(pts[i0 * 2] - wx, pts[i0 * 2 + 1] - wy);
      const b = Math.hypot(pts[i1 * 2] - wx, pts[i1 * 2 + 1] - wy);
      if (d > Math.min(a, b)) continue;
      seen[row + x] = 1; n++;
    }
  }
  return n;
}

// A fresh grid for a fresh floor. 0 is never been there, 1 is been there, 2 is never
// fogged at all - which is the shop, a known safe room you are put down in, where a
// haze over the plinths would just hide the stock you came here to buy.
function fogStart() {
  const seen = new Uint8Array(FW * FH);
  for (let y = Math.floor((SHOP_TOP - SHOP_ROOF) / FOG); y < FH; y++)
    for (let x = 0; x < FW; x++) seen[y * FW + x] = 2;
  return seen;
}

// How far a ray from (x, y) heading (dx, dy) gets before it walks into a solid cell,
// capped at r. It steps from one cell boundary to the next, so it visits every cell the
// ray crosses — a fixed sampling step would jump clean over a one-pixel wall and let a
// sliver of light through the far side of it.
function rayDist(x, y, dx, dy, r, solidCell) {
  let cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
  const dtx = dx ? Math.abs(CELL / dx) : Infinity;
  const dty = dy ? Math.abs(CELL / dy) : Infinity;
  let tx = dx ? (dx > 0 ? ((cx + 1) * CELL - x) / dx : (cx * CELL - x) / dx) : Infinity;
  let ty = dy ? (dy > 0 ? ((cy + 1) * CELL - y) / dy : (cy * CELL - y) / dy) : Infinity;
  let t = 0;
  for (;;) {
    if (tx < ty) { t = tx; tx += dtx; cx += sx; }
    else { t = ty; ty += dty; cy += sy; }
    if (t >= r) return r;
    if (solidCell(cx, cy)) return t;
  }
}

// Is the straight line from one point to another clear of rock? Marched the same way the
// light is, so "can I shoot that" and "can I see that" give the same answer, and a
// one-pixel wall stops both.
function losClear(x0, y0, x1, y1, solidCell) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  if (d < 0.001) return true;
  return rayDist(x0, y0, dx / d, dy / d, d, solidCell) >= d - 0.001;
}

// ---- shared creature movement ----
// Pieces more than one creature is built from: the spider and the jellyfish use them now,
// and the next creature reworked should reach for these before writing its own. All pure.

// The roam spot: a point that wanders slowly round home (e.hx, e.hy) and turns back
// whenever it strays past the roam radius. A roaming creature heads for it. Keeps rx, ry,
// ra, roamR, roamSpd on the creature's state R; radius and drift speed are the creature's
// knobs pre+'RoamR' / pre+'RoamSpd', rolled again each time it turns back. ok(x, y), if
// given, is where the spot may go: it turns back toward home at the edge of that too.
function roamStep(R, e, dt, rnd, pre, ok) {
  if (R.rx === undefined) { R.rx = e.hx; R.ry = e.hy; R.ra = rnd() * 6.28; }
  R.ra += (rnd() - 0.5) * 3 * dt;
  if (!R.roamR) { R.roamR = kr(pre + 'RoamR', rnd); R.roamSpd = kr(pre + 'RoamSpd', rnd); }
  if (Math.hypot(R.rx - e.hx, R.ry - e.hy) > R.roamR) {
    R.ra = Math.atan2(e.hy - R.ry, e.hx - R.rx);
    R.roamR = kr(pre + 'RoamR', rnd); R.roamSpd = kr(pre + 'RoamSpd', rnd);
  }
  const nx = R.rx + Math.cos(R.ra) * R.roamSpd * dt, ny = R.ry + Math.sin(R.ra) * R.roamSpd * dt;
  if (ok && !ok(nx, ny) && ok(R.rx, R.ry)) { R.ra = Math.atan2(e.hy - R.ry, e.hx - R.rx); return; }
  R.rx = nx; R.ry = ny;
}

// a heading `a` turned toward `to` by at most `max` radians: a turn-rate limit. Kept
// within ±π so it never winds up.
function turnToward(a, to, max) {
  const d = angDiff(to, a), r = a + Math.max(-max, Math.min(max, d));
  return r > Math.PI ? r - 2 * Math.PI : r < -Math.PI ? r + 2 * Math.PI : r;
}

// Move a free-flying body by its velocity (V.vx, V.vy) in steps short enough that it
// can't pass through a thin wall, and bounce it off rock: anything nearer than r pushes
// it straight back out, and the part of its velocity going into the rock is turned round
// and scaled by `bounce` (0 stops dead against it, 1 is a perfect bounce). surfNormal's
// smoothed normal means it glances off lumpy rock rather than snagging on a pixel.
// true if it touched rock.
function flyMove(e, V, dt, r, solidCell, bounce) {
  const n = Math.max(1, Math.ceil(Math.hypot(V.vx, V.vy) * dt / CELL));
  let hit = false;
  for (let i = 0; i < n; i++) {
    e.x += V.vx * dt / n; e.y += V.vy * dt / n;
    const s = surfNormal(e.x, e.y, r + CELL, solidCell);
    if (!s || s.d >= r) continue;
    hit = true;
    // right on the rock there's no nearest-point direction; the smoothed normal still knows
    const ox = s.d > 0.5 ? s.px : s.x, oy = s.d > 0.5 ? s.py : s.y;
    e.x += ox * (r - s.d); e.y += oy * (r - s.d);
    const into = V.vx * ox + V.vy * oy;
    if (into < 0) { V.vx -= (1 + bounce) * into * ox; V.vy -= (1 + bounce) * into * oy; }
  }
  return hit;
}

// ---- the spider (Hämähäkki) ----
// It lives on the rock and on its own silk and nowhere else. On rock it slides along the
// surface: the "normal" is the average direction from the rock in a small disc round it
// to its centre, which smooths the pixel steps away, so it glides round bumps and
// corners instead of snagging on single pixels. It moves in short fast bursts with rests
// between (rests long when roaming, short when it has you). At the start of each burst
// it looks at where it wants to be: if that's off the surface (dot with the normal ≥
// the Dev 'Web instead of walk above dot' knob) it rides a nearby line that heads that way, or else shoots a new line at
// the rock over there and crosses on it. Lines stay. Pure, so the logic tests can run it
// on a hand-made grid. Nearly every number is a Dev-panel range (SP_KNOBS, rolled by spr);
// SPIDER holds only the body's own geometry.
const SPIDER = { hold: 6, feel: 14, step: 1.5, fall: 900 };

// the smoothed surface normal at (x, y): points away from the rock, null if there's no
// rock within R. Also the nearest rock: d is the distance to it, (px, py) the way out.
function surfNormal(x, y, R, solidCell) {
  const cx0 = Math.floor(x / CELL), cy0 = Math.floor(y / CELL), rc = Math.ceil(R / CELL);
  let nx = 0, ny = 0, n = 0, d = Infinity, px = 0, py = -1;
  for (let dy = -rc; dy <= rc; dy++) for (let dx = -rc; dx <= rc; dx++) {
    const wx = (cx0 + dx + 0.5) * CELL - x, wy = (cy0 + dy + 0.5) * CELL - y;
    if (wx * wx + wy * wy > R * R) continue;
    if (!solidCell(cx0 + dx, cy0 + dy)) continue;
    nx -= wx; ny -= wy; n++;
    // the nearest point of this cell's box
    const qx = Math.max(wx - CELL / 2, Math.min(0, wx + CELL / 2)), qy = Math.max(wy - CELL / 2, Math.min(0, wy + CELL / 2));
    const q = Math.hypot(qx, qy);
    if (q < d) { d = q; if (q > 1e-6) { px = -qx / q; py = -qy / q; } }
  }
  if (!n) return null;
  const l = Math.hypot(nx, ny);
  return l < 1e-6 ? { x: px, y: py, d, px, py } : { x: nx / l, y: ny / l, d, px, py };
}

// sit the spider at `hold` off the nearest rock: pushed straight out of anything closer
// (so a spike or a step just lifts it over, like a ball rolling on it), pulled in along
// the smoothed normal if it has drifted off. false if there's no rock to sit on.
function spiderSeat(e, S, solidCell, maxMove) { return surfSeat(e, S, solidCell, maxMove, SPIDER.hold, SPIDER.feel); }
// the same for any surface crawler: hold is how far off the rock it sits, feel how far it feels
function surfSeat(e, S, solidCell, maxMove, hold, feel) {
  let n = surfNormal(e.x, e.y, feel, solidCell);
  if (!n) return false;
  if (n.d < hold) {
    const m = hold - n.d;
    e.x += n.px * m; e.y += n.py * m;
    n = surfNormal(e.x, e.y, feel, solidCell) || n;
  } else {
    const m = Math.min(maxMove, n.d - hold);
    e.x -= n.x * m; e.y -= n.y * m;
  }
  S.nx = n.x; S.ny = n.y; S.py = n.py;          // py: straight out from the nearest rock
  return true;
}

const segNear = (L, x, y) => {
  const vx = L.bx - L.ax, vy = L.by - L.ay, ll = vx * vx + vy * vy || 1;
  const u = Math.max(0, Math.min(1, ((x - L.ax) * vx + (y - L.ay) * vy) / ll));
  return { u, d: Math.hypot(L.ax + vx * u - x, L.ay + vy * u - y) };
};

// a new line from (x, y) toward the rock along (dx, dy), or null if no rock within reach.
// Tries straight at it first, then fans out a little.
function spiderAim(x, y, dx, dy, reach, solidCell) {
  for (const a of [0, 0.22, -0.22, 0.45, -0.45]) {
    const c = Math.cos(a), s = Math.sin(a), ux = dx * c - dy * s, uy = dx * s + dy * c;
    const d = rayDist(x, y, ux, uy, reach, solidCell);
    if (d < reach && d > SPIDER.hold * 2.5) return { dx: ux, dy: uy, len: d };
  }
  return null;
}

// One frame of one spider. env: { solidCell, webs, goal: {x,y}, hunting, rnd, speed,
// reach }. Moves e, may push a line onto env.webs. Returns 'web' on the frame a shot
// line lands (for a sound), else null.
function spiderStep(e, env, dt) {
  const { solidCell, webs, rnd } = env;
  const S = e.sp || (e.sp = { mode: 'fall', vy: 0, nx: 0, ny: -1, on: 0, rest: rnd() * 0.5,
    side: 1, line: null, u: 0, dir: 1, shot: null, rx: e.hx, ry: e.hy, ra: rnd() * 6.28, high: false });
  // the roam point drifts slowly round home, and is pulled back if it wanders too far
  S.webT = (S.webT || 0) - dt;
  roamStep(S, e, dt, rnd, 'sp');
  const goal = env.hunting ? env.goal : { x: S.rx, y: S.ry };
  let out = null;

  if (S.mode === 'fall') {
    S.vy = Math.min(S.vy + SPIDER.fall * dt, 600);
    const n = Math.max(1, Math.ceil(S.vy * dt / SPIDER.step));
    for (let i = 0; i < n; i++) {
      e.y += S.vy * dt / n;
      if (e.y > CH * CELL) { e.y = CH * CELL; break; }
      if (surfNormal(e.x, e.y, SPIDER.hold + 1, solidCell)) {
        spiderSeat(e, S, solidCell, SPIDER.hold);
        S.mode = 'surf'; S.vy = 0; S.on = 0; S.rest = 0.1;
        break;
      }
    }
    return null;
  }

  if (S.mode === 'shoot') {
    const sh = S.shot;
    sh.t += sh.spd * dt;
    if (sh.t < sh.len) return null;
    // the line lands: it only holds if the rock is still there
    const hx = sh.x + sh.dx * sh.len, hy = sh.y + sh.dy * sh.len;
    const inx = hx + sh.dx * 1.2, iny = hy + sh.dy * 1.2;
    S.mode = sh.from; S.shot = null;
    if (!solidCell(Math.floor(inx / CELL), Math.floor(iny / CELL))) return null;
    const L = { ax: sh.x, ay: sh.y, bx: hx - sh.dx * SPIDER.hold, by: hy - sh.dy * SPIDER.hold,
      a0x: sh.ax0, a0y: sh.ay0, b0x: hx, b0y: hy, ain: sh.ain, bin: { x: inx, y: iny }, owner: e };
    webs.push(L);
    // an old line of this spider's goes, unless something is riding it
    const mine = webs.filter(w => w.owner === e);
    if (mine.length > Math.round(spr('spMaxLines', rnd))) {
      const old = mine.find(w => w !== S.line);
      if (old) webs.splice(webs.indexOf(old), 1);
    }
    S.mode = 'line'; S.line = L; S.u = 0; S.dir = 1;
    return 'web';
  }

  // on a line whose rock has gone: drop
  if (S.mode === 'line' && webs.indexOf(S.line) < 0) { S.mode = 'fall'; S.line = null; S.vy = 0; return null; }
  // on rock that has been dug away from under it: drop
  if (S.mode === 'surf' && !surfNormal(e.x, e.y, SPIDER.hold + 2, solidCell)) { S.mode = 'fall'; S.vy = 0; return null; }

  // resting: count down, then start a burst and decide where it goes. Nothing worth doing
  // (already there, right under it): look again shortly — never sit with no clock running
  if (S.on <= 0) {
    if ((S.rest -= dt) > 0) return null;
    S.on = spr(env.hunting ? 'spHuntOn' : 'spRoamOn', rnd);
    // this burst's own numbers
    S.spd = env.speed || spr('spSpeed', rnd); S.arrive = env.hunting ? spr('spArrive', rnd) : 3;
    S.dot = spr('spDot', rnd);
    decide();
    if (S.mode === 'shoot') return null;
    if (S.on <= 0) { S.rest = 0.1 + rnd() * 0.2; return null; }
  }
  if (S.mode === 'shoot') return null;

  const speed = (S.spd || spr('spSpeed', rnd)) * (env.speedMul || 1);
  const dist = speed * Math.min(dt, S.on);
  S.on -= dt;
  const n = Math.max(1, Math.ceil(dist / SPIDER.step));
  for (let i = 0; i < n && S.mode !== 'shoot'; i++) {
    const st = dist / n;
    if (S.mode === 'surf') {
      const tx = -S.ny * S.side, ty = S.nx * S.side;
      e.x += tx * st; e.y += ty * st;
      if (!spiderSeat(e, S, solidCell, st * 2)) {
        // stepped off the edge of nothing: curl back round toward where the rock was
        e.x -= S.nx * st * 2; e.y -= S.ny * st * 2;
        if (!spiderSeat(e, S, solidCell, st * 2)) { S.mode = 'fall'; S.vy = 0; break; }
      }
      // came round a corner and now faces the goal off the surface: look again
      const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy) || 1;
      const high = (gx * S.nx + gy * S.ny) / gd >= S.dot;
      if (high && !S.high) { S.high = true; decide(); }
      else if (!high) S.high = false;
      // there, or just walked past the closest it gets on this surface: stop
      if (gd < (S.arrive || 3) || (-S.ny * gx + S.nx * gy) * S.side < 0) { S.on = 0; break; }
    } else if (S.mode === 'line') {
      const L = S.line, len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
      const ux = (L.bx - L.ax) / len * S.dir, uy = (L.by - L.ay) / len * S.dir;
      // hanging: going further along would take it away from the goal
      if (!S.go && (goal.x - e.x) * ux + (goal.y - e.y) * uy <= 0) { S.on = 0; break; }
      S.u += S.dir * st / len;
      if (S.u >= 1 || S.u <= 0) {
        S.u = S.u >= 1 ? 1 : 0;
        e.x = S.u ? L.bx : L.ax; e.y = S.u ? L.by : L.ay;
        S.mode = 'surf'; S.line = null; S.go = false;
        if (!spiderSeat(e, S, solidCell, SPIDER.hold)) { S.mode = 'fall'; S.vy = 0; break; }
        decide();
        continue;
      }
      e.x = L.ax + (L.bx - L.ax) * S.u; e.y = L.ay + (L.by - L.ay) * S.u;
    }
  }
  if (S.on <= 0 && S.rest <= 0) S.rest = spr(env.hunting ? 'spHuntOff' : 'spRoamOff', rnd);
  return out;

  // where to go this burst: along the rock, onto a line, or shoot a new one
  function decide() {
    const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy);
    if (gd < (S.arrive || 3)) { S.on = 0; return; }
    const dx = gx / gd, dy = gy / gd;
    const tryLine = () => {
      let best = null, bd = spr('spGrab', rnd);
      for (const L of webs) {
        if (L === S.line) continue;
        const q = segNear(L, e.x, e.y);
        if (q.d > bd) continue;
        const len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
        const ux = (L.bx - L.ax) / len, uy = (L.by - L.ay) / len, al = ux * dx + uy * dy;
        if (Math.abs(al) < 0.5) continue;
        if ((al > 0 && q.u > 0.97) || (al < 0 && q.u < 0.03)) continue;   // nowhere left to go on it
        best = { L, u: q.u, dir: al > 0 ? 1 : -1 }; bd = q.d;
      }
      if (!best) return false;
      S.mode = 'line'; S.line = best.L; S.u = best.u; S.dir = best.dir;
      e.x = best.L.ax + (best.L.bx - best.L.ax) * best.u; e.y = best.L.ay + (best.L.by - best.L.ay) * best.u;
      return true;
    };
    const tryShoot = from => {
      // a roaming spider spins a new line now and then, not every hop; hunting, much more often
      if (S.webT > 0 || (!env.hunting && gd < 40)) return false;
      const a = spiderAim(e.x, e.y, dx, dy, env.reach || spr('spWeb', rnd), solidCell);
      if (!a) return false;
      let ax0 = e.x, ay0 = e.y, ain = null;
      if (from === 'surf') {
        const d = rayDist(e.x, e.y, -S.nx, -S.ny, SPIDER.feel + 4, solidCell);
        ax0 = e.x - S.nx * d; ay0 = e.y - S.ny * d;
        ain = { x: e.x - S.nx * (d + 1.2), y: e.y - S.ny * (d + 1.2) };
      }
      S.webT = spr(env.hunting ? 'spHuntWeb' : 'spRoamWeb', rnd);
      S.shot = { spd: spr('spLineSpd', rnd), x: e.x, y: e.y, dx: a.dx, dy: a.dy, len: a.len, t: 0, from, ax0, ay0, ain };
      S.mode = 'shoot';
      return true;
    };
    if (S.mode === 'surf') {
      const dot = dx * S.nx + dy * S.ny;
      S.high = dot >= (S.dot || 0.6);
      if (S.high && (tryLine() || tryShoot('surf'))) return;
      const t = -S.ny * dx + S.nx * dy;
      if (Math.abs(t) * gd < 4) { S.on = 0; return; }   // right under it already
      S.side = t > 0 ? 1 : -1;
    } else if (S.mode === 'line') {
      const L = S.line, len = Math.hypot(L.bx - L.ax, L.by - L.ay) || 1;
      const al = ((L.bx - L.ax) * dx + (L.by - L.ay) * dy) / len;
      S.go = false;
      if (Math.abs(al) > 0.3) { S.dir = al > 0 ? 1 : -1; return; }
      // the goal is off to the side of this line: another line, a new one, or the nearer end
      if (tryLine() || tryShoot('line')) return;
      const da = Math.hypot(goal.x - L.ax, goal.y - L.ay), db = Math.hypot(goal.x - L.bx, goal.y - L.by);
      S.dir = db < da ? 1 : -1;
      S.go = true;
    }
  }
}

// ---- the rat (Rotta) and its nest (Rotanpesä) ----
// A rat runs the rock surfaces the way the spider does (surfSeat keeps it sat on the rock,
// sliding round bumps), in short bursts with rests between, but it has no silk: when where it
// wants to be is up off the surface and near enough, it jumps there, and it drops off
// anything it finds itself hanging under. Its nest is a room in the rock at the end of a
// tunnel too thin for you (path, room first, mouth last); in there it just follows the path.
// What it wants (you, loose gold, home, or its roam spot) is the Game's call: env.goal.
// env.home: wants to go in, so reaching the mouth takes it down the tunnel. Returns 'home'
// the moment it reaches the nest room, 'out' as it comes out of the hole, 'jump' on a jump.
// Pure; the numbers are Dev ranges (RA_KNOBS).
const RAT = { hold: 3.5, feel: 9, step: 1, fall: 900, ceil: 0.55, tunnel: 0.6 };
// the point `d` along a path of points, and which way it's heading there
function pathAt(P, d) {
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i], l = Math.hypot(b.x - a.x, b.y - a.y);
    if (d <= l || i === P.length - 1) {
      const u = l ? Math.max(0, Math.min(1, d / l)) : 0;
      return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, dx: (b.x - a.x) / (l || 1), dy: (b.y - a.y) / (l || 1) };
    }
    d -= l;
  }
  return { x: P[0].x, y: P[0].y, dx: 0, dy: -1 };
}
const pathLen = P => { let l = 0; for (let i = 1; i < P.length; i++) l += Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y); return l; };

function ratStep(e, env, dt) {
  const { solidCell, rnd } = env;
  const S = e.ra || (e.ra = { mode: 'air', vx: 0, vy: 0, nx: 0, ny: -1, on: 0, rest: rnd() * 0.3, side: 1, face: 1, s: 0, dir: 1, wait: 0 });
  const goal = env.goal;
  const P = env.path, speed = (env.speed || kr('raSpeed', rnd)) * (env.speedMul || 1);

  if (S.noT > 0) S.noT -= dt;
  if (S.mode === 'tunnel') {
    if (!P) { S.mode = 'air'; S.vx = S.vy = 0; return null; }
    if (S.wait > 0) { S.wait -= dt; return null; }
    const L = S.len || (S.len = pathLen(P));
    S.s += S.dir * speed * RAT.tunnel * dt;
    if (S.s <= 0) {                       // down in the nest
      S.s = 0; S.dir = 1; S.wait = kr('raNestRest', rnd);
      e.x = P[0].x; e.y = P[0].y;
      return 'home';
    }
    if (S.s >= L) {                       // out of the hole
      const m = P[P.length - 1];
      e.x = m.x; e.y = m.y;
      S.mode = 'surf'; S.on = 0; S.rest = 0.05 + rnd() * 0.2;
      if (!surfSeat(e, S, solidCell, RAT.hold, RAT.hold, RAT.feel)) { S.mode = 'air'; S.vx = S.vy = 0; }
      return 'out';
    }
    const q = pathAt(P, S.s);
    e.x = q.x; e.y = q.y; S.face = q.dx * S.dir >= 0 ? 1 : -1;
    S.nx = 0; S.ny = -1;
    return null;
  }

  // at the hole, wanting in: down the tunnel (landing on it counts too)
  if (env.home && P) {
    const m = P[P.length - 1];
    if (Math.hypot(m.x - e.x, m.y - e.y) < 12) { S.mode = 'tunnel'; S.len = pathLen(P); S.s = S.len; S.dir = -1; S.wait = 0; S.vx = S.vy = 0; return null; }
  }

  // with a way found (env.follow: goal is a waypoint off navField), it just runs the way,
  // pushed out of the rock and settled onto floors as it goes, so it can't wedge or fall
  // off anything: the path already knows what a rat can climb
  if (env.follow && goal) {
    if (S.mode !== 'path') { S.mode = 'path'; S.vx = S.vy = 0; }
    const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy), go = Math.min(gd, speed * dt);
    const rock = (x, y) => solidCell(Math.floor(x / CELL), Math.floor(y / CELL));
    if (gd > 0.01) {                       // never a step into the rock (small steps, so not over a thin wall either)
      const k = Math.max(1, Math.ceil(go / 0.8)), mx = gx / gd * go / k, my = gy / gd * go / k;
      let moved = false;
      for (let q = 0; q < k; q++) {
        if (!rock(e.x + mx, e.y + my)) { e.x += mx; e.y += my; moved = true; }
        else if (!rock(e.x + mx, e.y)) { e.x += mx; moved = true; }
        else if (!rock(e.x, e.y + my)) { e.y += my; moved = true; }
        else break;
      }
      if (Math.abs(gx) > 0.5) S.face = gx > 0 ? 1 : -1;
      // boxed in on that line: a little hop to come at it again
      S.blockT = moved ? 0 : (S.blockT || 0) + dt;
      if (S.blockT > 0.3) { S.blockT = 0; S.mode = 'air'; S.vx = (rnd() - 0.5) * 120; S.vy = -160; return null; }
    }
    const n = surfNormal(e.x, e.y, RAT.feel, solidCell);
    if (n) {
      if (n.d < RAT.hold && n.d > 0.01 && !rock(e.x + n.px * (RAT.hold - n.d), e.y + n.py * (RAT.hold - n.d))) {
        e.x += n.px * (RAT.hold - n.d); e.y += n.py * (RAT.hold - n.d);
      } else if (n.d >= RAT.hold && n.py < -0.5 && n.d < RAT.hold + 7 && gy > -2) {   // not climbing: down onto the floor
        const m = Math.min(n.d - RAT.hold, 80 * dt); e.x -= n.px * m; e.y -= n.py * m;
      }
      S.nx = n.x; S.ny = n.y; S.py = n.py;
    } else { S.nx = 0; S.ny = -1; S.py = -1; }
    return null;
  }
  if (S.mode === 'path') { S.mode = 'air'; S.vx = S.vy = 0; }   // lost the way: plain physics again

  if (S.mode === 'air') {
    S.vy = Math.min(S.vy + RAT.fall * dt, 600);
    const n = Math.max(1, Math.ceil(Math.hypot(S.vx, S.vy) * dt / RAT.step));
    for (let i = 0; i < n; i++) {
      e.x += S.vx * dt / n; e.y += S.vy * dt / n;
      if (e.y > CH * CELL) { e.y = CH * CELL; break; }
      const s = surfNormal(e.x, e.y, RAT.hold + 0.5, solidCell);
      if (!s) continue;
      if (s.py > RAT.ceil) {              // bumped its head (the nearest rock is above): out, and on down
        e.x += s.px * (RAT.hold + 0.5 - s.d); e.y += s.py * (RAT.hold + 0.5 - s.d);
        S.vy = Math.max(S.vy, 0); S.vx *= 0.5;
        continue;
      }
      surfSeat(e, S, solidCell, RAT.hold, RAT.hold, RAT.feel);
      S.mode = 'surf'; S.vx = S.vy = 0; S.on = 0; S.rest = Math.min(S.rest, 0.05);
      return 'land';
    }
    return null;
  }

  // on rock that has been dug out from under it, or hanging off a ceiling: drop
  // (a ceiling is where the nearest rock is overhead: the averaged normal misreads a crack)
  if (!surfNormal(e.x, e.y, RAT.hold + 2, solidCell) || S.py > RAT.ceil) { S.mode = 'air'; S.vx = S.vy = 0; return null; }

  // Roaming it scurries in bursts with rests between; with a job on (you, gold, home) it
  // runs flat out and only stops to pick a new way (raHuntOff is 0 by default)
  if (S.on <= 0) {
    if ((S.rest -= dt) > 0) return null;
    S.on = kr(env.hunting ? 'raHuntOn' : 'raRoamOn', rnd);
    S.spd = speed; S.arrive = env.arrive != null ? env.arrive : 3;
    S.dot = kr('raDot', rnd);
    const j = decide();
    if (j) return j;
    if (S.on <= 0) { S.rest = env.hunting ? 0.03 : 0.1 + rnd() * 0.2; return null; }
  }
  const dist = S.spd * Math.min(dt, S.on);
  S.on -= dt;
  const n = Math.max(1, Math.ceil(dist / RAT.step));
  for (let i = 0; i < n; i++) {
    const st = dist / n, tx = -S.ny * S.side, ty = S.nx * S.side;
    e.x += tx * st; e.y += ty * st;
    if (!surfSeat(e, S, solidCell, st * 2, RAT.hold, RAT.feel)) {
      e.x -= S.nx * st * 2; e.y -= S.ny * st * 2;
      if (!surfSeat(e, S, solidCell, st * 2, RAT.hold, RAT.feel)) { S.mode = 'air'; S.vx = tx * S.spd * 0.5; S.vy = 0; break; }
    }
    // walked up under an overhang: it drops, and won't try that way again for a bit
    if (S.py > RAT.ceil) { S.mode = 'air'; S.vx = tx * S.spd * 0.3; S.vy = 0; S.noSide = S.side; S.noT = 1.5; break; }
    if (Math.abs(tx) > 0.2) S.face = tx > 0 ? 1 : -1;
    if (!goal) continue;
    const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy) || 1;
    if (gd < S.arrive || (-S.ny * gx + S.nx * gy) * S.side < 0) { S.on = 0; break; }
    // came round onto a surface where it's now up off the rock: look again (maybe jump)
    const high = (gx * S.nx + gy * S.ny) / gd >= S.dot;
    if (high && !S.high) { S.high = true; const j = decide(); if (j) return j; if (S.on <= 0) break; }
    else if (!high) S.high = false;
  }
  if (S.on <= 0 && S.rest <= 0) S.rest = kr(env.hunting ? 'raHuntOff' : 'raRoamOff', rnd);
  return null;

  // this burst: run along the rock toward the goal, or jump at it if it's up off the rock
  function decide() {
    if (!goal) { S.on = 0; return null; }
    const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy);
    if (gd < S.arrive) { S.on = 0; return null; }
    const dx = gx / gd, dy = gy / gd, t = -S.ny * dx + S.nx * dy;
    // the way it wants to run is the way it just fell off an overhang: jump for it if it can, else turn back
    const barred = S.noT > 0 && (t > 0 ? 1 : -1) === S.noSide;
    if ((barred || (env.jump !== false && dx * S.nx + dy * S.ny >= S.dot)) && gd < kr('raJumpR', rnd)) {
      // a hop that lands on it: time of flight from how far, the lift to make up the drop.
      // Higher and higher arcs until one clears the rock (round the edge of a slab, not into it)
      const v = kr('raJump', rnd), cap = v * 1.4, x0 = e.x + S.nx * 1.5, y0 = e.y + S.ny * 1.5;
      for (const T of [Math.max(0.18, Math.min(0.6, gd / v)), 0.4, 0.55, 0.7]) {
        let vx = gx / T, vy = gy / T - 0.5 * RAT.fall * T;
        const sp = Math.hypot(vx, vy);
        if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
        let ok = true;
        for (let k = 1; k <= 16 && ok; k++) {
          const t = T * k / 16, px = x0 + vx * t, py = y0 + vy * t + 0.5 * RAT.fall * t * t;
          if (Math.hypot(px - goal.x, py - goal.y) < RAT.hold + 3) break;
          for (const [ox, oy] of [[0, 0], [2.5, 0], [-2.5, 0], [0, 2.5], [0, -2.5]])
            if (solidCell(Math.floor((px + ox) / CELL), Math.floor((py + oy) / CELL))) { ok = false; break; }
        }
        if (!ok) continue;
        S.vx = vx; S.vy = vy; e.x = x0; e.y = y0;
        S.mode = 'air'; S.on = 0; S.rest = 0.05;
        if (Math.abs(S.vx) > 1) S.face = S.vx > 0 ? 1 : -1;
        return 'jump';
      }
    }
    if (barred) { S.side = -S.noSide; return null; }
    if (Math.abs(t) * gd < 2) { S.on = 0; return null; }
    S.side = t > 0 ? 1 : -1;
    return null;
  }
}

// ---- rat pathfinding ----
// A rat with somewhere to be (you, a coin, its nest) follows a distance field: a Dijkstra
// out from the goal over a grid of NAV-pixel cells, costed for a rat — cheap along rock
// (floors, walls), dear to go up through open air (it can only jump so high), free to drop.
// navWay walks a few cells down the field from the rat to give it a waypoint just ahead,
// which it runs (or jumps) to with ratStep. solid(px, py) is the rat's view of the
// terrain, in pixels. R is the field's half-size in cells.
const NAV = 4;                               // terrain pixels per nav cell
function navField(solid, tx, ty, R) {
  const gi = Math.floor(tx / CELL / NAV), gj = Math.floor(ty / CELL / NAV);
  const x0 = gi - R, y0 = gj - R, w = 2 * R + 1, n = w * w;
  const open = new Uint8Array(n), surf = new Uint8Array(n);
  const sol = (i, j) => solid((x0 + i) * NAV + 2, (y0 + j) * NAV + 2);
  // open: a rat fits — the middle 2x2 pixels of the cell are all clear, not just one
  // (a hairline crack the centre happened to land in is not a way through)
  const fits = (i, j) => {
    const px = (x0 + i) * NAV, py = (y0 + j) * NAV;
    for (let b = 1; b <= 2; b++) for (let a = 1; a <= 2; a++) if (solid(px + a, py + b)) return false;
    return true;
  };
  for (let j = 0; j < w; j++) for (let i = 0; i < w; i++) open[j * w + i] = fits(i, j) ? 1 : 0;
  for (let j = 0; j < w; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i;
    if (open[k]) surf[k] = sol(i, j + 1) || sol(i - 1, j) || sol(i + 1, j) || sol(i - 1, j + 1) || sol(i + 1, j + 1) ? 1 : 0;
  }
  const d = new Float32Array(n).fill(Infinity), done = new Uint8Array(n);
  // a binary heap of cell indices keyed on d (a cell can be in it more than once)
  const cap = n * 8, hp = new Int32Array(cap);
  let hn = 0;
  const push = k => {
    let c = hn++; hp[c] = k;
    while (c) { const p = (c - 1) >> 1; if (d[hp[p]] <= d[k]) break; hp[c] = hp[p]; hp[p] = k; c = p; }
  };
  const pop = () => {
    const top = hp[0], last = hp[--hn];
    let c = 0;
    if (hn) {
      hp[0] = last;
      while (true) {
        const l = 2 * c + 1, r = l + 1;
        let m = c;
        if (l < hn && d[hp[l]] < d[hp[m]]) m = l;
        if (r < hn && d[hp[r]] < d[hp[m]]) m = r;
        if (m === c) break;
        hp[c] = hp[m]; hp[m] = last; c = m;
      }
    }
    return top;
  };
  // start at the goal's cell, or the nearest open one to it
  let s = -1;
  for (let r = 0; r <= 2 && s < 0; r++) for (let dj = -r; dj <= r && s < 0; dj++) for (let di = -r; di <= r; di++) {
    const q = (R + dj) * w + R + di;
    if (open[q]) { s = q; break; }
  }
  if (s >= 0) { d[s] = 0; push(s); }
  while (hn && hn < cap - 8) {
    const k = pop();
    if (done[k]) continue;
    done[k] = 1;
    const i = k % w, j = (k / w) | 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const a = i + di, b = j + dj;
      if (a < 0 || b < 0 || a >= w || b >= w) continue;
      const q = b * w + a;
      if (!open[q] || done[q]) continue;
      if (di && dj && !open[j * w + a] && !open[b * w + i]) continue;    // no squeezing between two corners
      // the rat goes q -> k: dear up through open air, free to drop, cheap along rock
      const up = -dj, step = di && dj ? 1.414 : 1;
      const c = step * (surf[k] ? 1 : up < 0 ? 8 : up > 0 ? 1 : 3);
      if (d[k] + c < d[q]) { d[q] = d[k] + c; push(q); }
    }
  }
  return { x0, y0, w, d, surf };
}
// a point `steps` cells down the field from (x, y) (world units), or null if the rat is off
// the field or can't get to the goal from here. dist: the field's value where it stands.
function navWay(F, x, y, steps) {
  let i = Math.floor(x / CELL / NAV) - F.x0, j = Math.floor(y / CELL / NAV) - F.y0;
  const w = F.w, d = F.d;
  if (i < 1 || j < 1 || i >= w - 1 || j >= w - 1) return null;
  if (!isFinite(d[j * w + i])) {                     // sat on a cell edge: the best one round it
    let b = -1;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const q = (j + dj) * w + i + di;
      if (isFinite(d[q]) && (b < 0 || d[q] < d[b])) b = q;
    }
    if (b < 0) return null;
    i = b % w; j = (b / w) | 0;
  }
  const dist = d[j * w + i];
  let air = false;                                  // the way climbs through open air: a jump
  for (let s = 0; s < steps; s++) {
    let b = j * w + i;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const a = i + di, c = j + dj;
      if (a < 0 || c < 0 || a >= w || c >= w) continue;
      if (d[c * w + a] < d[b]) b = c * w + a;
    }
    if (b === j * w + i) break;
    if ((b / w | 0) < j && !F.surf[b]) air = true;
    i = b % w; j = (b / w) | 0;
    // going up through open air: a jump, so aim for where it lands again (up to 12 cells on)
    if (air && s === steps - 1 && !F.surf[b] && steps < 12) steps++;
  }
  return { x: (F.x0 + i + 0.5) * NAV * CELL, y: (F.y0 + j + 0.5) * NAV * CELL, dist, air };
}

// Rat nests, carved into a level's rock (floor 1: `nb` in the built-up zones, `nw` in the
// natural ones). Each is a spot on an up- or side-facing surface with room to stand in
// front of it; a room (a small blob) found a little way into solid rock behind it; and a
// tunnel from the room back out to the spot that bends as it goes, so no sightline runs
// down it and the fog over the room never lifts — you find a nest by digging. The mouth
// gets a little mound of earth. Everything in terrain pixels. `zone` is the level's zone
// map (null: everything is natural); `keep` spots {x, y, r} (px) no nest goes near.
// Returns [{ x, y, r (room), path: [{x, y}] room → mouth, mouth, built, mound: [i...] }].
function ratNests(mat, rnd, zone, keep, nb, nw) {
  const inb = (x, y) => x >= 4 && y >= 4 && x < CW - 4 && y < CH - 4;
  const rock = (x, y) => { x = Math.round(x); y = Math.round(y); return inb(x, y) && mat[y * CW + x] === ROCK; };
  const open = (x, y) => { x = Math.round(x); y = Math.round(y); return inb(x, y) && !mat[y * CW + x]; };
  const isBuilt = (x, y) => !!zone && zone[Math.round(y) * CW + Math.round(x)] === 1;
  const allRock = (x, y, r) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
      if (dx * dx + dy * dy <= r * r && !rock(x + dx, y + dy)) return false;
    return true;
  };
  const nests = [];
  const make = wantBuilt => {
    for (let a = 0; a < 400; a++) {
      const x = 8 + Math.floor(rnd() * (CW - 16)), y = 60 + Math.floor(rnd() * (SHOP_TOP - SHOP_ROOF - 110));
      if (!open(x, y) || isBuilt(x, y) !== wantBuilt) continue;
      // the surface: down to a floor, or (a third of the time) across to a wall
      let sx = x, sy = y, found = false;
      const dir = rnd() < 0.33 ? (rnd() < 0.5 ? -1 : 1) : 0;
      for (let k = 0; k < 30; k++) {
        const nx = dir ? sx + dir : sx, ny = dir ? sy : sy + 1;
        if (!inb(nx, ny)) break;
        if (mat[ny * CW + nx]) { found = rock(nx, ny); break; }
        sx = nx; sy = ny;
      }
      if (!found) continue;
      // its normal, from the rock round it; up or sideways only
      let nx = 0, ny = 0;
      for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++)
        if (dx * dx + dy * dy <= 25 && inb(sx + dx, sy + dy) && mat[(sy + dy) * CW + sx + dx]) { nx -= dx; ny -= dy; }
      const nl = Math.hypot(nx, ny);
      if (nl < 1e-6) continue;
      nx /= nl; ny /= nl;
      if (ny > 0.35) continue;
      // room to stand in front of it (the mound mustn't pinch a squeeze shut)
      let clear = true;
      for (let k = 2; k <= 22 && clear; k += 2) if (!open(sx + nx * k, sy + ny * k)) clear = false;
      if (!clear) continue;
      // the room, a little way back into solid rock, angled off the way in
      const ang = Math.atan2(-ny, -nx) + (rnd() - 0.5) * 1.3, D = 20 + rnd() * 14, rr = 5 + Math.floor(rnd() * 3);
      const cx = Math.round(sx + Math.cos(ang) * D), cy = Math.round(sy + Math.sin(ang) * D);
      if (cy > SHOP_TOP - SHOP_ROOF - 14 || !allRock(cx, cy, rr + 5)) continue;
      if (keep.some(k => Math.hypot(k.x - cx, k.y - cy) < k.r + rr || Math.hypot(k.x - sx, k.y - sy) < k.r)) continue;
      if (nests.some(n => Math.hypot(n.x - cx, n.y - cy) < 50 || Math.hypot(n.mouth.x - sx, n.mouth.y - sy) < 40)) continue;
      // the tunnel: room to surface with a sideways wave that's zero at both ends
      const M = 4 + rnd() * 1.5;                           // the mound's radius
      const tx = sx + nx * (M - 0.5), ty = sy + ny * (M - 0.5);   // up through the mound
      const L = Math.hypot(tx - cx, ty - cy), px = -(ty - cy) / L, py = (tx - cx) / L;
      const amp = (4 + rnd() * 4) * (rnd() < 0.5 ? -1 : 1), waves = 1 + rnd() * 0.8, steps = Math.ceil(L * 2);
      const path = [];
      let buried = true;
      for (let k = 0; k <= steps; k++) {
        const t = k / steps, w = amp * Math.sin(t * Math.PI * waves) * Math.sin(t * Math.PI);
        const qx = cx + (tx - cx) * t + px * w, qy = cy + (ty - cy) * t + py * w;
        path.push({ x: qx, y: qy });
        // buried in rock the whole way, bar the last bit up to the surface
        if (Math.hypot(qx - sx, qy - sy) > 6 && Math.hypot(qx - cx, qy - cy) > rr && !allRock(qx, qy, 3)) { buried = false; break; }
      }
      if (!buried) continue;
      // carve: the mound first (open ground only, a lens on the surface), then the room and tunnel
      const mound = [];
      const mx = sx - nx * 1.5, my = sy - ny * 1.5, Mr = Math.ceil(M + 2);
      for (let dy = -Mr; dy <= Mr; dy++) for (let dx = -Mr; dx <= Mr; dx++) {
        const X = Math.round(mx) + dx, Y = Math.round(my) + dy;
        if (!inb(X, Y) || Math.hypot(X - mx, Y - my) > M) continue;
        if (!mat[Y * CW + X]) mat[Y * CW + X] = ROCK;
        if (mat[Y * CW + X] === ROCK) mound.push(Y * CW + X);
      }
      for (let dy = -rr - 2; dy <= rr + 2; dy++) for (let dx = -rr - 2; dx <= rr + 2; dx++) {
        const a2 = Math.atan2(dy, dx), wob = rr * (0.8 + 0.25 * Math.sin(a2 * 3 + cx) + 0.12 * Math.sin(a2 * 5 + cy));
        if (Math.hypot(dx, dy * 1.25) <= wob) mat[(cy + dy) * CW + cx + dx] = 0;
      }
      const cut = (qx, qy) => {
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const X = Math.round(qx + dx), Y = Math.round(qy + dy);
          if (inb(X, Y) && Math.hypot(X - qx, Y - qy) <= 1.6) mat[Y * CW + X] = 0;
        }
      };
      for (const q of path) cut(q.x, q.y);
      cut(tx + nx, ty + ny);
      const mouth = { x: tx + nx * 2.5, y: ty + ny * 2.5 };
      path.push(mouth);
      // a rat walks the tunnel along its middle; thinned out so it's cheap to follow
      const thin = path.filter((q, i) => i % 3 === 0 || i === path.length - 1);
      nests.push({ x: cx, y: cy, r: rr, path: thin, mouth, built: wantBuilt, mound, nx, ny });
      return true;
    }
    return false;
  };
  for (let i = 0; i < nb; i++) make(true);
  for (let i = 0; i < nw; i++) make(false);
  return nests;
}

// ---- the jellyfish (Myrkkymeduusa) ----
// Swims the way a jelly does. Its head (the top of the bell) is its heading, and the
// heading turns no faster than the turn-rate knob. Now and then it pulses: a short, hard
// push along wherever the head points — but only once the head is near enough on where
// it's going, so a big turn is made first, drifting. Then it coasts, water drag bleeding
// the speed away and a little sinking, until the next pulse. Roaming it heads for a roam
// spot round home (roamStep); with aggro it heads for you until it's in spitting range,
// then hangs there turning its head onto you. The spitting is the Game's job: jellyStep
// reports S.inRange and S.aimed. S.shape is the bell, 1 thin (just pushed, fast) to 0 flat
// (slowed, stopped), weighted to the thin side so it only flattens right near the stop.
// The tentacles are a few points each, dragged behind the rim follow-the-leader style.
// Pure, so the logic suite runs it on a hand-made grid; the numbers are Dev ranges (JE_KNOBS).
const JELLY = { hitR: 0.8 };            // collision radius, × body r

// the bell at shape s (0 flat .. 1 thin) and squash q (how much the shape changes), body r.
// top is the head end, rim the open end, in the jelly's own frame (head up). Shared by the
// tentacle roots (jellyStep) and the sprite (drawJelly), so the two always agree.
function jellyBell(r, s, q) {
  const t = Math.max(0, Math.min(1.5, s * q));
  const w = r * (1.15 - 0.36 * t), h = r * (0.95 + 0.6 * t);
  return { w, h, rw: w * (0.96 - 0.24 * t), top: -h * 0.62, rim: h * 0.38 };
}

// One frame of one jelly. env: { solidCell, goal: {x,y}, hunting, rnd, speedMul, rangeMul,
// stay }. stay(x, y), if given, is where it may swim (the natural zones): its roam spot keeps
// inside, and from inside it never pulses toward a spot its glide would carry it out of —
// hunting you into a built-up corridor, it hangs at the edge and spits from there.
// Returns 'pulse' on the frame a pulse starts, else null.
function jellyStep(e, env, dt) {
  const { solidCell, rnd } = env;
  let S = e.je;
  if (!S) {
    // looks are rolled once, as fractions of their knob ranges (kru), so each jelly is its
    // own but a Dev-panel change still shows on every one at once
    S = e.je = { hd: -Math.PI / 2 + (rnd() - 0.5) * 0.6, vx: 0, vy: 0, push: 0, pushA: 0,
      rest: rnd() * 1.5, shape: 0, vref: Math.max(1, kr('jeRoamPush', rnd)), t: rnd() * 10, tent: [],
      u: { thin: rnd(), sq: rnd(), len: rnd(), wave: rnd(), sag: rnd(), glow: rnd(), glowR: rnd(), flare: rnd(), col: rnd(), plant: rnd() } };
    feel(false);
    const nt = Math.round(kr('jeTents', rnd));
    for (let i = 0; i < nt; i++) {
      const T = [], nv = Math.max(2, Math.round(kr('jeVerts', rnd)));
      for (let j = 0; j < nv; j++) T.push({ x: NaN, y: NaN });        // laid out behind the rim below
      S.tent.push(T);
    }
  }
  const mul = env.speedMul || 1;
  let hunt = !!(env.hunting && env.goal);
  S.t += dt;
  roamStep(S, e, dt, rnd, 'je', env.stay);
  // strayed into a built-up zone: it forgets you and heads home
  const lost = !!(env.stay && !env.stay(e.x, e.y));
  if (lost) hunt = false;
  if (hunt && !S.range) S.range = kr('jeRange', rnd);
  if (!hunt) S.range = 0;
  const goal = hunt ? env.goal : lost ? { x: e.hx, y: e.hy } : { x: S.rx, y: S.ry };
  const gx = goal.x - e.x, gy = goal.y - e.y, gd = Math.hypot(gx, gy);
  const range = S.range * (env.rangeMul || 1);
  // turn, no faster than the limit. Idle with nowhere to be, it rights itself, head up
  const want = !hunt && gd < 12 ? -Math.PI / 2 : Math.atan2(gy, gx);
  S.hd = turnToward(S.hd, want, S.turn * Math.PI / 180 * mul * dt);
  const off = Math.abs(angDiff(want, S.hd)) * 180 / Math.PI;
  S.inRange = hunt && gd < range;
  S.aimed = hunt && off < S.aimTol;
  let out = null;
  if (S.push > 0) {
    // mid-pulse: thrust along the head (the whole pulse adds up to the rolled push speed)
    const a = S.pushA * mul * Math.min(dt, S.push);
    S.vx += Math.cos(S.hd) * a; S.vy += Math.sin(S.hd) * a;
    S.push -= dt;
  } else if ((S.rest -= dt) <= 0) {
    // ready: pulse only if there's somewhere to go and the head is (nearly) on it
    const v = (hunt ? gd > range : gd > 10) && off < S.tol ? kr(hunt ? 'jeHuntPush' : 'jeRoamPush', rnd) : 0;
    // where this pulse would glide it to (drag bleeds speed exponentially, so a speed v
    // carries it v / drag), no further than where it's going, plus the drift it already has
    const dg = Math.max(0.1, S.drag), glide = Math.min(gd, 160, Math.max(20, v / dg));
    const stay = env.stay, out0 = stay && !lost &&
      !stay(e.x + Math.cos(S.hd) * glide + S.vx / dg, e.y + Math.sin(S.hd) * glide + S.vy / dg);
    if (v > 0 && !out0) {
      const pt = kr('jePushT', rnd);
      S.push = pt; S.pushA = v / Math.max(pt, 0.001); S.vref = Math.max(v, 1);
      S.rest = kr(hunt ? 'jeHuntRest' : 'jeRoamRest', rnd);
      feel(hunt);
      out = 'pulse';
    } else S.rest = 0.05 + rnd() * 0.1;       // look again shortly
  }
  // the water: drag slows it (exponentially — quick at first, then a long glide) and it sinks
  const k = Math.exp(-S.drag * dt);
  S.vx *= k; S.vy = S.vy * k + S.sink * dt;
  flyMove(e, S, dt, e.r * JELLY.hitR, solidCell, S.bounce);
  // the bell: thin at speed, flat at rest, weighted to the thin side
  const f = Math.min(1, Math.hypot(S.vx, S.vy) / S.vref);
  S.shape = 1 - Math.pow(1 - f, kru('jeThin', S.u.thin));
  // tentacles: the first point rides the rim, the rest follow at a fixed spacing, swaying
  // sideways a little and drooping, so they stream out behind a push and hang when it rests
  const B = jellyBell(e.r, S.shape, kru('jeSquash', S.u.sq));
  const c = Math.cos(S.hd), s = Math.sin(S.hd), n = S.tent.length;
  const len = kru('jeTentLen', S.u.len), wave = kru('jeWave', S.u.wave), sag = kru('jeSag', S.u.sag);
  for (let i = 0; i < n; i++) {
    const T = S.tent[i], seg = len / (T.length - 1);
    const lx = n > 1 ? (i / (n - 1) - 0.5) * 1.4 * B.rw : 0;
    T[0].x = e.x - lx * s - B.rim * c; T[0].y = e.y + lx * c - B.rim * s;   // (lx, rim) in the jelly's frame
    if (isNaN(T[1].x)) for (let j = 1; j < T.length; j++) { T[j].x = T[0].x - c * seg * j; T[j].y = T[0].y - s * seg * j; }
    for (let j = 1; j < T.length; j++) {
      const q = T[j], pq = T[j - 1];
      const sw = Math.sin(S.t * 3.1 + i * 0.5 - j * 0.9) * wave * dt * j / (T.length - 1);   // near in step, so they don't cross
      q.x -= s * sw; q.y += c * sw + sag * dt;
      const dx = q.x - pq.x, dy = q.y - pq.y, d = Math.hypot(dx, dy) || 1;
      q.x = pq.x + dx / d * seg; q.y = pq.y + dy / d * seg;
    }
  }
  return out;

  // this pulse's own feel: how fast it turns, how true it must face, drag, sink, bounce, aim
  function feel(h) {
    S.turn = kr('jeTurn', rnd); S.tol = kr('jePushTol', rnd); S.drag = kr('jeDrag', rnd);
    S.sink = kr('jeSink', rnd); S.bounce = kr('jeBounce', rnd); S.aimTol = kr('jeAimTol', rnd);
    S.range = h ? kr('jeRange', rnd) : 0;
  }
}

// Does the line from (ax, ay) to (bx, by) pass through the box x0..x1, y0..y1? Clips the
// line to the box one edge at a time (Liang–Barsky) — exact, so a thin tentacle crossing
// a corner of you counts, and one passing close by doesn't.
function segHitsBox(ax, ay, bx, by, x0, y0, x1, y1) {
  const dx = bx - ax, dy = by - ay;
  let t0 = 0, t1 = 1;
  const clip = (p, q) => {
    if (p === 0) return q >= 0;
    const t = q / p;
    if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
    else { if (t < t0) return false; if (t < t1) t1 = t; }
    return true;
  };
  return clip(-dx, ax - x0) && clip(dx, x1 - ax) && clip(-dy, ay - y0) && clip(dy, y1 - ay);
}
// where a jelly's tentacles cross the box (the middle of the first segment that does), or null
function tentacleTouch(S, x0, y0, x1, y1) {
  if (!S || !S.tent) return null;
  for (const T of S.tent) for (let j = 1; j < T.length; j++) {
    const a = T[j - 1], b = T[j];
    if (!isNaN(a.x) && segHitsBox(a.x, a.y, b.x, b.y, x0, y0, x1, y1)) return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  return null;
}

// ---- the jellyfish's plant glow ----
// Green vegetation near a jelly glows and twinkles in its colour, built the way the owner
// (a VFX compositor) laid it out: take the art round the jelly, pull the green channel,
// levels it so only the top 25% of the floor's green is left (black point at 75% of the
// white point), × a ramp from the jelly out to its reach, × an animated soft noise (the
// twinkle), × the jelly's glow colour, and add that on top of the level. One change to a
// straight green pull: pixels where green isn't the strongest channel are held out —
// otherwise the gold seams (255,210,60) and pale flowers, bright in green too, set the
// white point and take the top 25%, and the moss gets none of it.
const TW_N = 64;
const TW_TILE = (() => {
  let q = 12345; const a = new Float32Array(TW_N * TW_N);
  for (let i = 0; i < a.length; i++) { q = (q * 16807) % 2147483647; a[i] = q / 2147483647; }
  return a;
})();
// smooth value noise, 0..1, repeating every 64
function twNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const x0 = ((xi % TW_N) + TW_N) % TW_N, y0 = ((yi % TW_N) + TW_N) % TW_N, x1 = (x0 + 1) % TW_N, y1 = (y0 + 1) % TW_N;
  const a = TW_TILE[y0 * TW_N + x0], b = TW_TILE[y0 * TW_N + x1], c = TW_TILE[y1 * TW_N + x0], d = TW_TILE[y1 * TW_N + x1];
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
// the twinkle at world (x, y), time t: two layers of that noise drifting past each other,
// multiplied, the contrast pushed so it reads as soft points coming and going. 0..1.
function twinkle(x, y, t, size) {
  const u = x / size, v = y / size;
  const n = twNoise(u + t * 0.37, v - t * 0.23) * twNoise(u * 1.7 - t * 0.31 + 17, v * 1.7 + t * 0.29 + 5);
  const k = Math.min(1, Math.max(0, (n - 0.12) / 0.45));
  return k * k * (3 - 2 * k);
}
// the white point: the floor's brightest green (its 99.9th percentile, so a stray pixel
// can't set it) among mostly-opaque pixels where green is the strongest channel. A faint
// anti-aliased edge (alpha 1/255 comes back as junk like 0,255,0) must not count.
function plantWhite(...datas) {
  const hist = new Uint32Array(256);
  let n = 0;
  for (const d of datas) if (d) for (let i = 0; i < d.length; i += 4)
    if (d[i + 3] >= 128 && d[i + 1] >= d[i] && d[i + 1] >= d[i + 2]) { hist[d[i + 1]]++; n++; }
  if (!n) return 255;
  for (let g = 0, c = 0; g < 256; g++) { c += hist[g]; if (c >= n * 0.999) return Math.max(1, g); }
  return 255;
}
// The comp for one box of art (RGBA `art`, w×h, each pixel `o.px` world units, top-left
// at world (o.ox, o.oy)) lit by a jelly at (o.cx, o.cy): writes out (RGBA, same size) with
// the colour o.rgb at alpha = key × ramp × twinkle × strength. o.lit(x, y), if given, holds
// out ground you haven't seen. Returns how many pixels glow.
function plantGlowFill(out, art, w, h, o) {
  const black = o.white * (1 - o.top), span = Math.max(1, o.white - black);
  const r = o.rgb[0], g = o.rgb[1], b = o.rgb[2];
  let any = 0;
  for (let y = 0; y < h; y++) {
    const wy = o.oy + (y + 0.5) * o.px, dy = wy - o.cy;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, G = art[i + 1];
      out[i + 3] = 0;
      if (!art[i + 3] || G <= black || G < art[i] || G < art[i + 2]) continue;      // the green key
      const wx = o.ox + (x + 0.5) * o.px, dx = wx - o.cx;
      const ramp = 1 - Math.sqrt(dx * dx + dy * dy) / o.reach;                        // × the ramp
      if (ramp <= 0 || (o.lit && !o.lit(wx, wy))) continue;
      const a = Math.min(1, (G - black) / span) * ramp * twinkle(wx, wy, o.t, o.size) * o.strength * art[i + 3] / 255;
      if (a < 0.004) continue;
      out[i] = r; out[i + 1] = g; out[i + 2] = b; out[i + 3] = Math.min(255, a * 255);
      any++;
    }
  }
  return any;
}

// The fan of points that bound what can be seen from (cx, cy) out to r. The lamp is
// clipped to this, which is what makes walls cast shadows.
function visPoly(cx, cy, r, solidCell, rays) {
  const pts = [];
  for (let i = 0; i < rays; i++) {
    const a = i / rays * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, r, solidCell);
    pts.push(cx + dx * d, cy + dy * d);
  }
  return pts;
}

for (const k of Object.keys(MODS)) MODS[k].id = k;

const MIN_CAST = 0.016;      // one frame: the fastest a gun can chain casts
const MIN_RECH = 0.05;

// Recharge counts every slot on the gun, wherever the mod sits, so the number on
// the gun card is always the number you get.
function effRecharge(g) {
  const pas = gunPassives(g);
  return Math.max(MIN_RECH, (g.recharge + pas.rech) * pas.rechMul);
}

// `off` mods (the Greek letters, for now) stay in MODS but are never handed out
const SHOT_IDS = Object.keys(MODS).filter(k => MODS[k].kind === 'shot' && !MODS[k].off);
// a found gun is seeded with something that hurts on its own, so never a bare trigger
const SEED_SHOTS = SHOT_IDS.filter(k => !MODS[k].trig);
const ALL_IDS = Object.keys(MODS).filter(k => !MODS[k].off);

// ---- guns ----
const GUN_A = ['Rusty', 'Bone', 'Cracked', 'Copper', 'Glass', 'Ivory', 'Molten', 'Static',
               'Hollow', 'Ember', 'Quartz', 'Iron', 'Pale', 'Gilded'];
const GUN_B = ['Pistol', 'Repeater', 'Carbine', 'Scattergun', 'Lance', 'Sidearm',
               'Blaster', 'Cannon', 'Spitter', 'Wand'];

function shuffleOrder(g) {
  g.order = g.slots.map((_, i) => i);
  if (g.shuffle) for (let i = g.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [g.order[i], g.order[j]] = [g.order[j], g.order[i]];
  }
}
function resetGun(g) {
  g.idx = 0; g.delayT = 0; g.rechT = 0;
  shuffleOrder(g);
  return g;
}

// A gun's level (1-10) comes from the floor alone: floor 1 rolls level 1 guns, floor 10
// and beyond roll level 10. Every stat has a worst and a best end. A level 1 gun rolls
// anywhere between them (wild); each level squeezes the roll toward the best end, until a
// level 10 gun lands in the best tenth of every range (a little variance, never junk).
const GUN_LV_MAX = 10;
const RARE_GUN = 0.2;                     // chance a cave gun rolls a random higher level
const GUN_RANGE = {                       // [worst, best]
  cap: [2, 25], castDelay: [1.5, 0.01], recharge: [1.5, 0.01], manaMax: [50, 1000],
  manaRegen: [10, 500], spread: [20, 0], speedMul: [0.5, 2] };
// the colour a gun's level wears: grey through green, blue, purple to gold
const GUN_LV_COL = ['#9a9a9a', '#d8d8d8', '#5fd35f', '#3fc9a8', '#4aa3ff',
                    '#7a7aff', '#b565ff', '#ff5fcf', '#ff9a2a', '#ffd23c'];
const gunLvTier = lvl => Math.min(1, Math.max(0, (lvl - 1) / (GUN_LV_MAX - 1)));
function gunStat(rnd, k, t) {
  const [w, b] = GUN_RANGE[k];
  const f = rnd() * (1 - t) + rnd() * 0.1 * t;       // share of the way from best to worst
  return b + (w - b) * f;
}
// the level of a gun found on this floor: the floor's own, or now and then a rare one
// somewhere between the next level up and 10
function gunLevel(floor, rnd) {
  const base = Math.min(GUN_LV_MAX, Math.max(1, floor));
  if (base < GUN_LV_MAX && rnd() < RARE_GUN) return base + 1 + Math.floor(rnd() * (GUN_LV_MAX - base));
  return base;
}

// a gun of level `lvl` (the Dev panel's Spawn gun uses it to try deeper floors' guns on floor 1)
function caveGun(lvl, rnd) {
  return makeGun(rnd, Math.min(GUN_LV_MAX, Math.max(1, Math.floor(lvl))));
}

function makeGun(rnd, lvl) {
  const t = gunLvTier(lvl);
  const cap = Math.max(2, Math.min(25, Math.round(gunStat(rnd, 'cap', t))));
  const g = {
    name: GUN_A[Math.floor(rnd() * GUN_A.length)] + ' ' + GUN_B[Math.floor(rnd() * GUN_B.length)],
    lvl, cap,
    castDelay: gunStat(rnd, 'castDelay', t),
    recharge: gunStat(rnd, 'recharge', t),
    manaMax: Math.round(gunStat(rnd, 'manaMax', t)),
    manaRegen: Math.round(gunStat(rnd, 'manaRegen', t)),
    spread: gunStat(rnd, 'spread', t),
    speedMul: gunStat(rnd, 'speedMul', t),
    multi: rnd() < 0.1 + t * 0.4 ? 2 : 1,
    shuffle: rnd() < 0.5 * (1 - t),
    slots: new Array(cap).fill(null),
    hue: Math.floor(rnd() * 360),
  };
  // seed it with something that already shoots
  const used = 1 + Math.floor(rnd() * Math.min(cap, 2 + t * 3));
  const spots = g.slots.map((_, i) => i).sort(() => rnd() - 0.5).slice(0, used);
  const asFloor = 1 + t * 5;                  // a high-level gun comes with better mods on it
  spots.forEach((slot, n) => {
    g.slots[slot] = n === 0 ? SEED_SHOTS[Math.floor(rnd() * SEED_SHOTS.length)]
                            : rollMod(rnd, asFloor);
  });
  if (!g.slots.some(id => id && MODS[id].kind === 'shot')) g.slots[spots[0]] = 'bolt';
  g.mana = g.manaMax;
  return resetGun(g);
}

function startingGuns() {
  // The Scratch Pistol is a weak backup on purpose: slow, thirsty and single-shot, so
  // anything you find on floor 1 is an upgrade over it. It's first in line (selected).
  const pistol = resetGun({ name: 'Scratch Pistol', cap: 3, castDelay: 0.32, recharge: 1.7,
    manaMax: 90, manaRegen: 22, spread: 5, multi: 1, shuffle: false, mana: 90, speedMul: 1,
    slots: ['bolt', null, null], hue: Math.floor(Math.random() * 360) });
  // The Pick Axe holds a Buzzsaw: no travel, a big circular slice right in front that chews
  // rock and shreds anything close. Buzzsaw zeroes cast delay, so recharge (1s) sets the swing.
  const pickaxe = resetGun({ name: 'Pick Axe', cap: 1, castDelay: 0.05, recharge: 1.0,
    manaMax: 120, manaRegen: 60, spread: 0, multi: 1, shuffle: false, mana: 120, speedMul: 1,
    slots: ['saw'], hue: 20 });
  return [pistol, pickaxe, null, null];
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the shots that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// Anything that comes out of the barrel: a shot has these and nothing else, so a
// modifier's f() can only touch fields that exist here.
function blankShot(sm, spread) {
  return { dmg: sm.dmg || 0, speed: sm.speed || 0, spread: (sm.spread || 0) + spread,
    size: sm.size || 2, life: sm.life || 1, count: sm.count || 1,
    bounce: sm.bounce || 0, pierce: sm.pierce || 0, explode: sm.explode || 0,
    grav: sm.grav || 0, homing: sm.homing || 0, accel: 0, bore: sm.bore || 0, recoil: sm.recoil || 0,
    col: sm.col, knock: 0, crit: 0, boomer: 0, spiral: 0, pong: 0, orbit: 0,
    autoaim: 0, homeR: sm.homeR || 0, flat: 0, eat: sm.eat || 0, pull: sm.pull || 0,
    split: 0, cluster: 0, bounceFx: null, friendly: 0, chain: sm.chain || 0,
    fuse: sm.fuse || 0, beam: sm.beam || 0, payload: null,
    trig: sm.trig || null, timer: sm.timer != null ? sm.timer : TIMER_ADD,
    reach: sm.reach != null ? sm.reach : 10,     // how far ahead of the muzzle it spawns
    hidden: sm.hidden || 0,                       // don't draw it (Buzzsaw cuts unseen)
    drift: sm.drift || 0, pop: sm.pop || 0,       // Pollen: slows, floats, locks on; small pop on contact
    arc: sm.arc || 0,                             // Lightning: jagged bolt that throws side arcs
    fire: sm.fire || 0,                           // sets grass, moss, timber and creatures alight
    tele: sm.tele || 0,                           // Teleport Bolt: you go where it stops
    sid: sm.id,                                   // which spell it is, for its sound
    still: sm.kind === 'static' ? 1 : 0, field: sm.field || null, r: sm.r || 0 };
}

// Work out what the next pull of the trigger fires. Walks the slot list from where
// the gun left off, piling up modifiers and applying them to the spells that follow.
// Advances g.idx; the caller rolls it back if there isn't the mana to pay.
// `others` is your other guns, which only Zeta looks at.
function planCast(g, others) {
  const start = g.idx, mods = [], defs = [];
  // what each cast spell is carrying, by its index in defs: a trigger fills this
  // with the payload it drew, and everything else leaves it empty
  const holds = [];
  let addTrig = null;                   // an Add Trigger waiting for the next projectile
  let multi = g.multi, cost = 0, manaMul = 1, ran = false, wrapped = 0;
  // delay is walked in draw order: most mods nudge it, a few reset it outright,
  // and anything drawn after a reset adds its own delay back on top
  let delay = g.castDelay;
  let form = null, hp = 0;
  const acts = [];
  const timing = m => {
    if (m.setDelay !== undefined) delay = m.setDelay;
    else delay += (m.kind === 'shot' || m.kind === 'static' ? m.delay : m.d) || 0;
  };
  const live = () => g.slots.filter(id => id && MODS[id].kind !== 'passive');
  const casts = id => id && (MODS[id].kind === 'shot' || MODS[id].kind === 'static');
  // how many things the gun still has left to fire this cycle, which is what Myriad takes
  const rest = () => {
    let n = 0;
    for (let i = g.idx; i < g.order.length; i++) if (casts(g.slots[g.order[i]])) n++;
    return n;
  };

  let queued = 0;                       // copies waiting in the queue that will fire
  // A Greek letter drops the spells it copies into this queue, and they are drawn
  // before the gun moves on. Copies never copy again, so Omega cannot run away.
  const queue = [];
  const copiesOf = m => {
    const all = live().filter(id => !MODS[id].copy);   // a copy never copies a copy
    if (m.copy === 'first') return all.slice(0, 1);
    if (m.copy === 'last') return all.slice(-1);
    if (m.copy === 'all') return all;
    if (m.copy === 'shots') return all.filter(id => MODS[id].kind === 'shot');
    if (m.copy === 'statics') return all.filter(id => MODS[id].kind === 'static');
    if (m.copy === 'next2') {
      const out = [];
      for (let i = g.idx; i < g.order.length && out.length < 2; i++) {
        const id = g.slots[g.order[i]];

    if (m.copy === 'other') {
      const pool = [];

  // reaches in and nothing in it leaks out. It may wrap round the gun once (shared with
  // the main draw), and the depth cap plus the one wrap keep it from running away.

        if (m.addTrig) pAdd = m.addTrig;
        continue;
      }
      const sh = dress(m, pm);
      if (pAdd && m.kind === 'shot' && !sh.trig) sh.trig = pAdd;
      pAdd = null;
      if (sh.trig) sh.payload = depth < 6 ? payloadOf(m.draw || 1, depth + 1) : [];
      out.push(sh);
    }
    if (pform) out.forEach((sh, i) => { sh.ang = pform[i % pform.length]; });
    return out;
  };

  for (let guard = 0; defs.length < multi && guard < 96; guard++) {
    let id, copied = false;
    if (queue.length) { id = queue.shift(); copied = true; }
    else {
      if (g.idx >= g.order.length) {
        ran = true;

        if (defs.length >= multi || wrapped++ || !defs.length && !mods.length) break;
        g.idx = 0;
      }
      id = g.slots[g.order[g.idx]];
      took.add(g.idx);
      g.idx++;
    }
    if (!id) continue;
    const m = MODS[id];
    if (m.kind === 'passive') continue;
    if (m.kind === 'mod' || m.kind === 'util') {
      cost += m.mana || 0;
      if (m.hp) hp += m.hp;
      if (m.act) acts.push(m.act);
      if (m.manaMul) manaMul *= m.manaMul;
      if (m.f) mods.push(m);
      if (m.addTrig) addTrig = m.addTrig;
      // Copies and multicasts only open up on the first pass. Once the gun has
      // wrapped round to the front they are skipped, or a Myriad would widen the
      // cast every time it came round and never finish.
      if (!copied && !wrapped) {
        if (m.multi) multi += m.multi;
        if (m.form) form = m.form;
        if (m.myriad) { multi += rest(); multi = Math.min(multi, queued + onGun()); }
        if (m.copy === 'mods') {
          for (const oid of live()) if (MODS[oid].f && !mods.includes(MODS[oid])) mods.push(MODS[oid]);
        } else if (m.copy) {
          let room = 0;
          for (const c of copiesOf(m)) { queue.push(c); if (casts(c)) { room++; queued++; } }
          // the copies need room, and so do the originals they came from: sweeping the
          // whole gun fires everything on it, and Tau fires its pair twice
          if (m.copy === 'all' || m.copy === 'shots' || m.copy === 'statics') multi += room + rest();
          else if (m.copy === 'next2') multi += room * 2;
          else multi += room;

          // hands out a stray extra shot
          multi = Math.min(multi, queued + onGun());
        }
      }
      timing(m);
      continue;
    }
    defs.push(m);
    cost += m.mana;
    timing(m);
    // a carrier (a "with Trigger" spell, or any projectile after Add Trigger) draws its
    // payload right now, so the spells it takes are not cast from the barrel as well
    const kind = m.trig || (m.kind === 'shot' && addTrig) || null;
    if (m.kind === 'shot') addTrig = null;
    if (kind) holds[defs.length - 1] = { kind, list: payloadOf(m.draw || 1, 1) };
  }
  const shots = defs.map((sm, i) => {
    const sh = dress(sm, mods);
    if (holds[i]) { sh.trig = holds[i].kind; sh.payload = holds[i].list; }
    return sh;
  });
  if (form) shots.forEach((sh, i) => { sh.ang = form[i % form.length]; });
  let more = false;                       // anything left worth firing this cycle?
  for (let i = g.idx; i < g.order.length; i++) {
    const id = g.slots[g.order[i]];
    const k = id && MODS[id].kind;
    if (k === 'shot' || k === 'static') { more = true; break; }
  }
  return { shots, defs, start, cost: cost * manaMul, acts, hp,
    delay: Math.max(MIN_CAST, delay),
    wrap: ran || !more };
}

// What does this mod actually do? Rather than describing it by hand, run a plain
// bolt through the planner with and without it and report whatever changed.
const PREVIEW_FIELDS = [['dmg', 'damage'], ['speed', 'speed'], ['spread', 'spread', '\u00b0'],
  ['size', 'size'], ['life', 'flight time', 's'], ['bounce', 'bounces'], ['pierce', 'pierce'],
  ['homing', 'homing'], ['explode', 'blast radius'], ['bore', 'drill'], ['recoil', 'recoil'],
  ['accel', 'acceleration']];

  const r = Math.round(v * 100) / 100;
  return String(r);
};
function previewGun(slots, over) {
  return resetGun(Object.assign({ name: 'p', cap: slots.length, castDelay: 0.2, recharge: 1,
    manaMax: 99999, manaRegen: 0, spread: 0, multi: 1, shuffle: false, mana: 99999,
    speedMul: 1, slots }, over || {}));
}

  const m = MODS[id];
  const rows = [];
  const push = (label, x, y, unit) => {
    if (Math.abs(x - y) < 1e-6) return;
    rows.push([label, num(x) + (unit || '') + ' \u2192 ' + num(y) + (unit || '')]);
  };

  if (m.kind === 'passive') {
    const a = ref(['bolt']), b = ref([id, 'bolt']);
    push('recharge', effRecharge(a), effRecharge(b), 's');
    push('mana', a.manaMax + gunPassives(a).manaMax, b.manaMax + gunPassives(b).manaMax);
    push('mana regen', a.manaRegen + gunPassives(a).manaRegen,
      b.manaRegen + gunPassives(b).manaRegen, '/s');
    return { rows };
  }

  if (m.kind === 'static') {
    const p = previewPlan([id]);
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's'],
      ['radius', num(m.r)]);

    rows.push(['does', FIELD_WHAT[m.field] || m.field]);

  }

  if (m.kind === 'util') {
    const p = previewPlan([id, 'bolt']), a = previewPlan(['bolt']);
    rows.push(['mana', num(m.mana || 0)]);
    push('cast delay', a.delay, p.delay, 's');
    push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
    if (m.manaMul) rows.push(['mana cost', '\u00d7' + num(m.manaMul)]);
    if (m.hp) rows.push(['health per pull', '\u2212' + num(m.hp)]);
    const sa = a.shots[0], sb = p.shots[0];
    if (sa && sb) for (const [key, label, unit] of PREVIEW_FIELDS) push(label, sa[key] || 0, sb[key] || 0, unit);
    return { rows };
  }

  if (m.kind === 'shot') {
    const p = previewPlan([id]);
    const sh = p.shots[0];
    rows.push(['mana', num(p.cost)], ['cast delay', num(p.delay) + 's']);
    if (m.trig) rows.push(['carries',
      (m.draw === 1 ? 'the next spell' : 'the next ' + m.draw + ' spells')
      + (m.trig === 'hit' ? ', on a hit' : m.trig === 'timer' ? ', after ' + num(m.timer) + 's'
        : ', when it dies')]);

      if (!sh[key]) continue;

  const a = previewPlan(['bolt']);

  push('shots per pull', a.shots.length, b.shots.length);
  push('mana', a.cost, b.cost);
  push('cast delay', a.delay, b.delay, 's');
  push('recharge', effRecharge(ref(['bolt'])), effRecharge(ref([id, 'bolt'])), 's');
  const sa = a.shots[0], sb = b.shots[0];

// How much damage a gun really puts out, averaged over a whole cycle: every pull
// in the list, then the recharge. Firing faster than mana allows just stalls, so
// the rate is capped by what regen can sustain.
// what your health can pay out per second and still last a decent fight
const HP_BUDGET = PLAYER_HP / 25;

// What one planned shot is worth: every pellet of it, plus anything a trigger is
// carrying to the point of impact. Payloads nest, but are finite, so this ends.
const shotPower = sh => (sh.dmg || 0) * Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPower(ps), 0);
const shotCount = sh => 1 + (sh.payload || []).reduce((t, ps) => t + shotCount(ps), 0);
const shotPellets = sh => Math.max(1, Math.round(sh.count || 1))
  + (sh.payload || []).reduce((t, ps) => t + shotPellets(ps), 0);

function gunRate(gun) {
  const g = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  let cast = 0, dmg = 0, cost = 0, shots = 0, blood = 0;
  for (let guard = 0; guard < 16; guard++) {
    const p = planCast(g);
    cast += p.delay;
    cost += p.cost;
    blood += p.hp || 0;
    for (const sh of p.shots) {
      // a trigger's mana is already counted; its payload's damage has to be too
      shots += shotCount(sh);
      dmg += shotPower(sh);
    }
    if (p.wrap) break;
  }
  const rech = effRecharge(g);
  const cycle = Math.max(0.001, cast + rech);
  const pas = gunPassives(gun);
  const regen = gun.manaRegen + pas.manaRegen;
  const manaPerSec = cost / cycle;
  const sustain = manaPerSec > regen ? regen / manaPerSec : 1;
  // health is a resource too: a gun that bleeds you dry in five seconds is not really
  // doing that much damage per second, however good the raw numbers look
  const hpPerSec = blood / cycle;
  const bleed = hpPerSec > HP_BUDGET ? HP_BUDGET / hpPerSec : 1;
  return { dps: (dmg / cycle) * sustain * bleed, cycle, cast, rech, manaPerSec, regen,
    shots, sustain, hpPerSec, bleed };
}

// Spot the bottleneck, then brute-force every single swap between the gun and the
// bag to see which one helps most. No cleverness, just the planner run a few
// hundred times, which costs a few milliseconds.
// how many promising mods get the full every-slot treatment
const SHORTLIST = 14;

function buildAdvice(gun, bag) {
  const now = gunRate(gun);
  let limit;
  if (!now.shots) limit = { key: 'none', text: 'Nothing on this gun fires — it needs a shot mod' };
  else if (now.bleed < 0.95) limit = { key: 'blood',
    text: 'Your health is the limit — ' + now.hpPerSec.toFixed(1) + ' hp/s to keep this up' };
  else if (now.sustain < 0.95) limit = { key: 'mana',
    text: 'Mana is the limit — ' + Math.round(now.manaPerSec) + '/s used against ' +
      Math.round(now.regen) + '/s regen' };
  else if (now.rech > now.cast) limit = { key: 'rech',
    text: 'Recharge is the limit — ' + Math.round(100 * now.rech / now.cycle) + '% of the cycle' };
  else limit = { key: 'cast',
    text: 'Cast delay is the limit — ' + Math.round(100 * now.cast / now.cycle) + '% of the cycle' };

  const tips = [];
  const score = slots => gunRate(Object.assign({}, gun, { slots })).dps;
  if (now.shots) {
    const seen = {};
    const pool = bag.filter(id => !seen[id] && (seen[id] = 1));
    // With a hundred-odd mods to hand, trying every one in every slot is far too much
    // work for one render. So: a cheap first look at each mod in a couple of slots,
    // then the handful that showed promise get tried properly everywhere.
    const probe = [0, gun.slots.indexOf(null) >= 0 ? gun.slots.indexOf(null) : gun.slots.length - 1]
      .filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
    let shortlist = pool;
    if (pool.length > SHORTLIST) {
      const rough = [];
      for (const id of pool) {
        let bestDps = 0;
        for (const i of probe) {
          if (gun.slots[i] === id) continue;
          const slots = gun.slots.slice();
          slots[i] = id;
          bestDps = Math.max(bestDps, score(slots));
        }
        rough.push({ id, bestDps });
      }
      rough.sort((a, b) => b.bestDps - a.bestDps);
      shortlist = rough.slice(0, SHORTLIST).map(r => r.id);
    }
    // bringing one mod in from the bag
    for (let i = 0; i < gun.slots.length; i++) {
      for (const id of shortlist) {
        if (gun.slots[i] === id) continue;
        const slots = gun.slots.slice();
        slots[i] = id;
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'fit', slot: i, id, dps, gain: dps / now.dps });
      }
    }
    // or just moving what is already on the gun, which is often the real fix
    for (let i = 0; i < gun.slots.length; i++) {
      for (let j = i + 1; j < gun.slots.length; j++) {
        if (!gun.slots[i] && !gun.slots[j]) continue;
        const slots = gun.slots.slice();
        slots[i] = gun.slots[j]; slots[j] = gun.slots[i];
        const dps = score(slots);
        if (dps > now.dps * 1.05) tips.push({ kind: 'move', slot: i, other: j, dps, gain: dps / now.dps });
      }
    }
    tips.sort((a, b) => b.dps - a.dps);
  }

  const picked = [], usedSlot = {}, usedMod = {};
  for (const t of tips) {
    if (usedSlot[t.slot] || (t.other !== undefined && usedSlot[t.other])) continue;
    if (t.id && usedMod[t.id]) continue;   // you only own one of each, so only its best slot
    if (t.id) usedMod[t.id] = 1;
    usedSlot[t.slot] = 1;
    if (t.other !== undefined) usedSlot[t.other] = 1;

}

// Which slots come out together on one pull. A modifier lands in the same group
// as the shots it modifies, which is exactly what the outline in the build screen
// draws. Null means the order is shuffled, so there is nothing fixed to show.
function castGroups(gun) {
  if (gun.shuffle) return null;
  const sim = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  const groups = [];
  for (let guard = 0; guard < 64; guard++) {
    const from = sim.idx;
    if (from >= sim.order.length) break;
    const plan = planCast(sim);
    let to = sim.idx;
    const wrapped = to <= from;              // a multicast that ran back to the front
    if (wrapped) to = sim.order.length;
    if (plan.shots.length) groups.push({ from, to, wrapped, shots: plan.shots.length, plan });
    if (plan.wrap) break;
  }
  return groups;
}

// Replay a pull with its modifiers stripped out, so the difference is exactly
// what the mods in that group are contributing.
function groupStats(gun, gr) {
  const plan = gr.plan;

    cap: Math.max(1, ids.length), slots: ids.slice(),
    multi: Math.max(1, ids.length), shuffle: false })));
  const sum = (p, f) => p.shots.reduce((t, sh) => t + (sh[f] || 0), 0);
  // damage is what the whole pull puts out, so a pellet spray counts every pellet
  const power = p => p.shots.reduce((t, sh) => t + shotPower(sh), 0);
  const topOf = (sh, f) => (sh.payload || []).reduce((n, ps) => Math.max(n, topOf(ps, f)), sh[f] || 0);

    const d = now - was;

    const dir = Math.abs(d) < 1e-6 ? '' : (d > 0) === (better > 0) ? 'up' : 'down';
    const delta = Math.abs(d) < 1e-6 ? ''

  const sec = v => (Math.round(v * 1000) / 1000) + 's';

  const without = Object.assign({}, gun, {
    slots: gun.slots.map((id, i) => (i >= gr.from && i < gr.to ? null : id)) });
  add('recharge', effRecharge(gun), effRecharge(without), -1, sec);

  add('dmg', power(plan), power(bare), 1, n, true);
  add('shots', pellets(plan), pellets(bare), 1, n, pellets(plan) > plan.shots.length);
  add('mana', plan.cost, bare.cost, -1, n, true);
  add('delay', plan.delay, bare.delay, -1, sec, true);
  add('speed', avg(plan, 'speed'), avg(bare, 'speed'), 1, v => String(Math.round(v)));
  add('spread', avg(plan, 'spread'), avg(bare, 'spread'), -1, v => n(v) + '\u00b0');
  add('homing', top(plan, 'homing'), top(bare, 'homing'), 1, n);
  add('bounces', top(plan, 'bounce'), top(bare, 'bounce'), 1, n);
  add('pierce', top(plan, 'pierce'), top(bare, 'pierce'), 1, n);
  add('blast', top(plan, 'explode'), top(bare, 'explode'), 1, n);
  add('drill', top(plan, 'bore'), top(bare, 'bore'), 1, n);

// what the gun actually does with the mods on it right now
function gunPassives(g) {
  let rech = 0, rechMul = 1, manaMax = 0, manaRegen = 0;
  for (const id of g.slots) {
    if (!id) continue;
    const m = MODS[id];
    if (m.rech) rech += m.rech;
    if (m.rechMul) rechMul *= m.rechMul;
    if (m.manaMax) manaMax += m.manaMax;
    if (m.manaRegen) manaRegen += m.manaRegen;
  }
  return { rech, rechMul, manaMax, manaRegen };

// The bag screen's slot animation: the filled slots in the order one full cycle fires
// them, each tagged with the pull it comes out on. Empty slots are skipped. Null for a
// shuffled gun, whose order changes every recharge.
function pullSteps(g) {
  const groups = castGroups(g);
  if (!groups) return null;
  const steps = [], seen = new Set();
  groups.forEach((gr, n) => {
    for (let i = gr.from; i < gr.to && i < g.slots.length; i++)
      if (g.slots[i] && !seen.has(i)) { seen.add(i); steps.push({ slot: i, pull: n }); }
  });
  return steps;
}

// per-frame gun tick) run on a copy of the gun, so the slot lights and the stat bars move at
// the gun's real pace — cast delay between pulls, recharge after the last, mana drained per
// pull and regenerating, a pause when it runs dry. No perks: the gun as it is.

  const g = resetGun(Object.assign({}, gun, { slots: gun.slots.slice() }));
  const max = gun.manaMax + gunPassives(gun).manaMax;
