<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CaveRunner</title>
<style>
:root{
  --bg:#cfdbe4; --sky:#e3ebf1; --grid:rgba(30,50,70,0.08);
  --plat:#2f4256; --plat-top:#5f7d99; --goal:#2e9a6a;
  --player:#ff5a36; --visor:#17222e; --bullet:#e0a100;
  --flame:#ff8a1f; --flame2:#ffe066;
  --text:#1c2a38; --muted:rgba(28,42,56,0.55);
  --pad:rgba(28,42,56,0.07); --ring:rgba(28,42,56,0.25);
  --line:rgba(28,42,56,0.3); --knob:#1c2a38; --jet:rgba(255,138,31,0.18);
  --target:#8b3fd9; --target-ring:#f4f0ff; --smoke:#8a949e; --hp:#2e9a6a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --sky:#162230; --grid:rgba(200,220,240,0.06);
    --plat:#7d97b0; --plat-top:#b4c8da; --goal:#46c48c;
    --player:#ff6b4a; --visor:#0d141c; --bullet:#ffc93c;
    --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
    --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
    --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
    --target:#c08bff; --target-ring:#1a1030; --smoke:#8793a0; --hp:#46c48c;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --sky:#162230; --grid:rgba(200,220,240,0.06);
  --plat:#7d97b0; --plat-top:#b4c8da; --goal:#46c48c;
  --player:#ff6b4a; --visor:#0d141c; --bullet:#ffc93c;
  --text:#dbe6ef; --muted:rgba(219,230,239,0.5);
  --pad:rgba(219,230,239,0.06); --ring:rgba(219,230,239,0.22);
  --line:rgba(219,230,239,0.3); --knob:#dbe6ef; --jet:rgba(255,138,31,0.2);
    --target:#c08bff; --target-ring:#1a1030; --smoke:#8793a0; --hp:#46c48c;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.view{position:relative;flex:1 1 auto;min-height:0}
.game{display:block;width:100%;height:100%}
.controls{flex:0 0 38%;display:flex;justify-content:space-evenly;align-items:center;
  padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
.stick{position:relative;flex:none;border-radius:50%;background:var(--pad);
  border:2px solid var(--ring);overflow:hidden;touch-action:none}
.hline{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.jetzone{position:absolute;left:0;right:0;top:0;height:50%;background:var(--jet);opacity:0;transition:opacity .1s}
.jetting .jetzone{opacity:1}
.knob{position:absolute;left:50%;top:50%;width:26%;height:26%;border-radius:50%;
  background:var(--knob);opacity:.75;pointer-events:none}
.lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.lbl.top{top:13%}
.lbl.bot{bottom:13%}
.reset{position:absolute;top:10px;right:10px;border:1px solid var(--ring);background:var(--bg);
  color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useRef, useEffect, useState } = React;
const h = React.createElement;

// ---- tuning ----
const W = 360, H = 3200;          // world size
const GRAVITY = 1400;
const WALK = 180, GROUND_ACC = 1400, AIR_ACC = 600;
const JET = 260, JET_ACC = 900;
const DEAD = 0.12;                // stick dead zone
const BULLET = 540, FIRE_RATE = 0.1;
const FUEL_DRAIN = 0.28;          // per second at full thrust
const FUEL_REGEN = 0.7;           // per second while on the ground
const FUEL_RESTART = 0.2;         // needed before jets work again after running dry
const PLAYER_HP = 100;
const ENEMY_HP = 3, ENEMY_RANGE = 250, ENEMY_BULLET = 190, ENEMY_DMG = 10;
const NO_INPUT = { active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false };

function makeLevel() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const plats = [{ x: 0, y: H - 20, w: W, h: 20 }];
  const targets = [];
  for (let y = H - 125; y > 180; y -= 105) {
    if (rnd() < 0.55) targets.push({ x: 20 + rnd() * (W - 40), y: y - 52, r: 10, phase: rnd() * 6.28, hp: ENEMY_HP, cd: 1 + rnd() * 2, flash: 0, ty: y - 52, lx: 0, ly: 1 });
    const two = rnd() < 0.35;
    const n = two ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const w = 60 + rnd() * 70;
      const x = two ? (i === 0 ? rnd() * (W / 2 - 20 - w) : W / 2 + 20 + rnd() * (W / 2 - 20 - w)) : rnd() * (W - w);
      plats.push({ x, y, w, h: 12 });
    }
  }
  plats.push({ x: W / 2 - 60, y: 100, w: 120, h: 14, goal: true });
  return { plats, targets };
}

function readColors() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue('--' + n).trim();
  return { sky: g('sky'), grid: g('grid'), plat: g('plat'), platTop: g('plat-top'), goal: g('goal'),
    player: g('player'), visor: g('visor'), bullet: g('bullet'), flame: g('flame'), flame2: g('flame2'),
    text: g('text'), muted: g('muted'), target: g('target'), targetRing: g('target-ring'), smoke: g('smoke'), hp: g('hp') };
}

const approach = (v, t, a) => (v < t ? Math.min(t, v + a) : Math.max(t, v - a));

function Game({ input }) {
  const cv = useRef(null);
  useEffect(() => {
    const c = cv.current, ctx = c.getContext('2d');
    const { plats, targets } = makeLevel();
    const total = targets.length;
    const sparks = [];
    let time = 0;
    const p = { x: W / 2 - 9, y: H - 50, w: 18, h: 30, vx: 0, vy: 0, onGround: false, face: 1, jet: 0, fuel: 1, empty: false, hp: PLAYER_HP, hitT: 0, dead: false };
    const bullets = [], enemyShots = [], smoke = [];
    let smokeAcc = 0;
    let fireT = 0, camY = H, col = readColors(), frame = 0, won = false, best = 0;
    let raf, last = performance.now();

    const resize = () => {
      const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      c.width = Math.max(1, r.width * d); c.height = Math.max(1, r.height * d);
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(c);

    function burst(x, y, n, c) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.28, sp = 60 + Math.random() * 160;
        sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, c });
      }
    }

    function step(dt) {
      time += dt;
      const L = p.dead ? NO_INPUT : input.current.left, R = p.dead ? NO_INPUT : input.current.right;
      const raw = L.active ? L.mag : 0;
      const mag = raw > DEAD ? (raw - DEAD) / (1 - DEAD) : 0;
      const wantJet = mag > 0 && L.dy < 0;   // above the line = jetpack
      if (p.empty && p.fuel >= FUEL_RESTART) p.empty = false;
      const jet = wantJet && !p.empty;
      p.jet = jet ? mag : 0;
      if (jet) {
        p.fuel -= FUEL_DRAIN * (0.5 + 0.5 * mag) * dt;
        if (p.fuel <= 0) { p.fuel = 0; p.empty = true; }
      } else if (p.onGround) {
        p.fuel = Math.min(1, p.fuel + FUEL_REGEN * dt);
      }

      if (jet) {
        p.vx = approach(p.vx, L.nx * mag * JET, JET_ACC * dt);
        p.vy = approach(p.vy, L.ny * mag * JET, JET_ACC * dt);
      } else {
        const target = mag > 0 ? L.nx * mag * WALK : 0;
        p.vx = approach(p.vx, target, (p.onGround ? GROUND_ACC : AIR_ACC) * dt);
        p.vy = Math.min(p.vy + GRAVITY * dt, 900);
      }

      // move in small steps so fast movement can't skip through platforms
      const hits = q => p.x < q.x + q.w && p.x + p.w > q.x && p.y < q.y + q.h && p.y + p.h > q.y;
      const n = Math.max(1, Math.ceil(Math.max(Math.abs(p.vx), Math.abs(p.vy)) * dt / 5));
      const sdt = dt / n;
      for (let i = 0; i < n; i++) {
        p.x += p.vx * sdt;
        if (p.x < 0) { p.x = 0; p.vx = 0; }
        if (p.x + p.w > W) { p.x = W - p.w; p.vx = 0; }
        for (const q of plats) {
          if (!hits(q)) continue;
          if (p.vx > 0) p.x = q.x - p.w; else if (p.vx < 0) p.x = q.x + q.w;
          p.vx = 0;
        }
        p.y += p.vy * sdt;
        for (const q of plats) {
          if (!hits(q)) continue;
          if (p.vy > 0) p.y = q.y - p.h;          // land on top
          else if (p.vy < 0) p.y = q.y + q.h;     // bonk head underneath
          p.vy = 0;
        }
        if (p.y < 0) { p.y = 0; if (p.vy < 0) p.vy = 0; }
      }

      // standing check
      p.onGround = false;
      for (const q of plats) {
        if (p.x < q.x + q.w && p.x + p.w > q.x && Math.abs(p.y + p.h - q.y) < 0.5) {
          p.onGround = true;
          if (q.goal) won = true;
          break;
        }
      }

      // facing
      if (R.on) p.face = R.nx >= 0 ? 1 : -1;
      else if (Math.abs(p.vx) > 10) p.face = p.vx > 0 ? 1 : -1;

      // shooting
      fireT -= dt;
      if (R.on && fireT <= 0) {
        fireT = FIRE_RATE;
        const cx = p.x + p.w / 2, cy = p.y + p.h * 0.4;
        bullets.push({ x: cx + R.nx * 14, y: cy + R.ny * 14, vx: R.nx * BULLET, vy: R.ny * BULLET, life: 1.2 });
      }
      for (let i = bullets.length - 1; i >= 0; i--) {
        const k = bullets[i];
        k.x += k.vx * dt; k.y += k.vy * dt; k.life -= dt;
        let dead = k.life <= 0 || k.x < 0 || k.x > W || k.y < 0 || k.y > H;
        if (!dead) for (const q of plats) {
          if (k.x > q.x && k.x < q.x + q.w && k.y > q.y && k.y < q.y + q.h) { dead = true; break; }
        }
        if (!dead) for (let j = targets.length - 1; j >= 0; j--) {
          const t = targets[j];
          if (Math.hypot(k.x - t.x, k.y - t.ty) < t.r + 2.5) {
            t.hp--; t.flash = 0.08;
            if (t.hp <= 0) { burst(t.x, t.ty, 16, 'target'); targets.splice(j, 1); }
            else burst(k.x, k.y, 4, 'bullet');
            dead = true;
            break;
          }
        }
        if (dead) bullets.splice(i, 1);
      }
      // enemies: bob, watch the player, shoot when close
      const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
      for (const t of targets) {
        t.ty = t.y + Math.sin(time * 2 + t.phase) * 4;
        t.flash -= dt;
        const dx = pcx - t.x, dy = pcy - t.ty, dist = Math.hypot(dx, dy) || 1;
        t.lx = dx / dist; t.ly = dy / dist;
        t.cd -= dt;
        if (!p.dead && dist < ENEMY_RANGE && t.cd <= 0) {
          t.cd = 1.4 + Math.random() * 1.2;
          const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.25;
          enemyShots.push({ x: t.x + Math.cos(a) * 12, y: t.ty + Math.sin(a) * 12,
            vx: Math.cos(a) * ENEMY_BULLET, vy: Math.sin(a) * ENEMY_BULLET, life: 2.5 });
        }
      }
      for (let i = enemyShots.length - 1; i >= 0; i--) {
        const k = enemyShots[i];
        k.x += k.vx * dt; k.y += k.vy * dt; k.life -= dt;
        let gone = k.life <= 0 || k.x < 0 || k.x > W;
        if (!gone) for (const q of plats) {
          if (k.x > q.x && k.x < q.x + q.w && k.y > q.y && k.y < q.y + q.h) { gone = true; break; }
        }
        if (!gone && !p.dead && k.x > p.x - 3 && k.x < p.x + p.w + 3 && k.y > p.y - 3 && k.y < p.y + p.h + 3) {
          gone = true;
          p.hp = Math.max(0, p.hp - ENEMY_DMG);
          p.hitT = 0.3;
          burst(k.x, k.y, 5, 'player');
          if (p.hp === 0) { p.dead = true; burst(pcx, pcy, 24, 'player'); }
        }
        if (gone) enemyShots.splice(i, 1);
      }
      p.hitT -= dt;

      // jetpack smoke trail
      if (p.jet > 0) {
        let fx = -input.current.left.nx, fy = -input.current.left.ny + 0.8;
        const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
        smokeAcc += dt * (25 + 35 * p.jet);
        while (smokeAcc >= 1) {
          smokeAcc--;
          smoke.push({ x: pcx + (Math.random() - 0.5) * 6, y: p.y + p.h + 4,
            vx: fx * 50 + (Math.random() - 0.5) * 20, vy: fy * 50 + (Math.random() - 0.5) * 20,
            r: 1.5 + Math.random(), life: 0.9 });
        }
      }
      for (let i = smoke.length - 1; i >= 0; i--) {
        const m = smoke[i];
        m.x += m.vx * dt; m.y += m.vy * dt;
        m.vx *= 1 - 2.5 * dt; m.vy = m.vy * (1 - 2.5 * dt) - 12 * dt;
        m.r += 5 * dt; m.life -= dt;
        if (m.life <= 0) smoke.splice(i, 1);
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const q = sparks[i];
        q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; q.life -= dt;
        if (q.life <= 0) sparks.splice(i, 1);
      }

      best = Math.max(best, Math.round((H - 20 - (p.y + p.h)) / 10));
    }

    function draw() {
      if (frame++ % 30 === 0) col = readColors();
      const d = window.devicePixelRatio || 1;
      const s = c.width / W, vh = c.height / s;

      // camera
      const target = Math.max(0, Math.min(H - vh, p.y + p.h / 2 - vh * 0.55));
      camY += (target - camY) * 0.15;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = col.sky;
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.setTransform(s, 0, 0, s, 0, -camY * s);

      // height lines
      ctx.strokeStyle = col.grid; ctx.lineWidth = 1;
      ctx.fillStyle = col.muted; ctx.font = '9px system-ui, sans-serif';
      for (let y = Math.floor(camY / 100) * 100; y < camY + vh; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.fillText(Math.round((H - 20 - y) / 10) + ' m', 4, y - 3);
      }

      // platforms
      for (const q of plats) {
        if (q.y > camY + vh || q.y + q.h < camY) continue;
        ctx.fillStyle = q.goal ? col.goal : col.plat;
        ctx.fillRect(q.x, q.y, q.w, q.h);
        if (!q.goal) { ctx.fillStyle = col.platTop; ctx.fillRect(q.x, q.y, q.w, 3); }
        if (q.goal) {
          ctx.fillStyle = col.plat; ctx.fillRect(q.x + q.w / 2 - 1, q.y - 40, 2, 40);
          ctx.fillStyle = col.goal;
          ctx.beginPath(); ctx.moveTo(q.x + q.w / 2 + 1, q.y - 40);
          ctx.lineTo(q.x + q.w / 2 + 24, q.y - 33); ctx.lineTo(q.x + q.w / 2 + 1, q.y - 26); ctx.fill();
        }
      }

      // smoke
      ctx.fillStyle = col.smoke;
      for (const m of smoke) {
        ctx.globalAlpha = Math.max(0, m.life / 0.9) * 0.55;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // enemies
      for (const t of targets) {
        const ty = t.ty;
        if (ty > camY + vh + 20 || ty < camY - 20) continue;
        ctx.fillStyle = t.flash > 0 ? col.targetRing : col.target;
        ctx.beginPath(); ctx.arc(t.x, ty, t.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col.targetRing;
        ctx.beginPath(); ctx.arc(t.x + t.lx * 2, ty + t.ly * 2, t.r * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col.target;
        ctx.beginPath(); ctx.arc(t.x + t.lx * 4, ty + t.ly * 4, t.r * 0.25, 0, Math.PI * 2); ctx.fill();
        // health bar
        const hw = 22, hx = t.x - hw / 2, hy = ty - t.r - 7;
        ctx.fillStyle = col.grid; ctx.fillRect(hx, hy, hw, 3);
        ctx.fillStyle = col.player; ctx.fillRect(hx, hy, hw * t.hp / ENEMY_HP, 3);
      }

      // enemy shots
      ctx.fillStyle = col.target;
      for (const k of enemyShots) { ctx.beginPath(); ctx.arc(k.x, k.y, 3.2, 0, Math.PI * 2); ctx.fill(); }

      // sparks
      for (const q of sparks) {
        ctx.fillStyle = col[q.c];
        ctx.globalAlpha = Math.max(0, q.life / 0.45);
        ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;

      // bullets
      ctx.fillStyle = col.bullet;
      for (const k of bullets) { ctx.beginPath(); ctx.arc(k.x, k.y, 2.5, 0, Math.PI * 2); ctx.fill(); }

      // jet flame (points away from thrust, biased downward)
      const cx = p.x + p.w / 2;
      if (p.jet > 0) {
        const L = input.current.left;
        let fx = -L.nx, fy = -L.ny + 0.8;
        const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
        const len = 8 + p.jet * 20 + Math.random() * 4;
        const bx = cx, by = p.y + p.h - 2;
        ctx.fillStyle = col.flame;
        ctx.beginPath(); ctx.moveTo(bx - 6, by); ctx.lineTo(bx + 6, by);
        ctx.lineTo(bx + fx * len, by + fy * len); ctx.fill();
        ctx.fillStyle = col.flame2;
        ctx.beginPath(); ctx.moveTo(bx - 3, by); ctx.lineTo(bx + 3, by);
        ctx.lineTo(bx + fx * len * 0.55, by + fy * len * 0.55); ctx.fill();
      }

      // gun / aim
      const R = input.current.right;
      const ax = R.on ? R.nx : p.face, ay = R.on ? R.ny : 0;
      const gy = p.y + p.h * 0.4;
      ctx.strokeStyle = col.visor; ctx.lineWidth = 3; ctx.lineCap = 'round';
      if (!p.dead) { ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(cx + ax * 14, gy + ay * 14); ctx.stroke(); }

      // player
      if (p.dead) ctx.globalAlpha = 0.35;
      const flashing = p.hitT > 0 && Math.floor(p.hitT * 30) % 2 === 0;
      ctx.fillStyle = flashing ? col.targetRing : col.player;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = col.visor;
      ctx.fillRect(p.face > 0 ? p.x + p.w - 9 : p.x + 1, p.y + 5, 8, 5);
      ctx.globalAlpha = 1;

      // HUD
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.fillStyle = col.text;
      ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText('Best ' + best + ' m', 12, 26);
      ctx.fillText('Enemies ' + (total - targets.length) + '/' + total, 12, 46);
      const bar = (label, y, frac, fill) => {
        ctx.fillStyle = col.text;
        ctx.fillText(label, 12, y + 10);
        ctx.fillStyle = col.grid; ctx.fillRect(66, y, 110, 10);
        ctx.fillStyle = fill; ctx.fillRect(66, y, 110 * frac, 10);
        ctx.strokeStyle = col.muted; ctx.lineWidth = 1;
        ctx.strokeRect(66.5, y + 0.5, 109, 9);
      };
      bar('Health', 58, p.hp / PLAYER_HP, p.hp <= 30 ? col.player : col.hp);
      bar('Fuel', 78, p.fuel, p.empty ? col.player : col.flame);
      ctx.fillStyle = col.text;
      if (p.dead) {
        ctx.textAlign = 'center';
        ctx.font = '700 22px system-ui, sans-serif';
        ctx.fillText('You were shot down', c.width / d / 2, 124);
        ctx.font = '500 14px system-ui, sans-serif';
        ctx.fillText('Tap Restart to try again', c.width / d / 2, 146);
        ctx.textAlign = 'left';
      }
      if (targets.length === 0 && !p.dead) {
        ctx.textAlign = 'center';
        ctx.font = '700 18px system-ui, sans-serif';
        ctx.fillText('All enemies destroyed', c.width / d / 2, won ? 150 : 124);
        ctx.textAlign = 'left';
      }
      if (won && !p.dead) {
        ctx.textAlign = 'center';
        ctx.font = '700 22px system-ui, sans-serif';
        ctx.fillText('You made it to the top', c.width / d / 2, 124);
        ctx.textAlign = 'left';
      }
    }

    const loop = t => {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;
      step(dt); draw();
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);
  return h('canvas', { ref: cv, className: 'game' });
}

function Stick({ size, kind, input }) {
  const [knob, setKnob] = useState({ x: 0, y: 0, jet: false });
  const ref = useRef(null);
  const pid = useRef(null);

  const update = e => {
    const r = ref.current.getBoundingClientRect();
    const rad = r.width / 2;
    const dx = e.clientX - (r.left + rad), dy = e.clientY - (r.top + rad);
    const dist = Math.hypot(dx, dy);
    const maxD = rad * 0.72;
    const cl = Math.min(dist, maxD);
    const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0;
    const mag = cl / maxD;
    const st = input.current[kind];
    st.active = true; st.nx = nx; st.ny = ny; st.mag = mag; st.dy = dy; st.on = mag > 0.15;
    setKnob({ x: nx * cl, y: ny * cl, jet: kind === 'left' && dy < 0 && mag > DEAD });
  };
  const down = e => {
    if (pid.current !== null) return;
    pid.current = e.pointerId;
    try { ref.current.setPointerCapture(e.pointerId); } catch (_) {}
    update(e);
  };
  const move = e => { if (e.pointerId === pid.current) update(e); };
  const end = e => {
    if (e.pointerId !== pid.current) return;
    pid.current = null;
    Object.assign(input.current[kind], { active: false, mag: 0, on: false, dy: 0 });
    setKnob({ x: 0, y: 0, jet: false });
  };

  const left = kind === 'left';
  return h('div', {
      ref, className: 'stick' + (knob.jet ? ' jetting' : ''),
      style: { width: size, height: size },
      onPointerDown: down, onPointerMove: move, onPointerUp: end,
      onPointerCancel: end, onLostPointerCapture: end,
    },
    left && h('div', { className: 'jetzone' }),
    left && h('div', { className: 'hline' }),
    h('span', { className: 'lbl top' }, left ? 'jet' : 'aim'),
    left && h('span', { className: 'lbl bot' }, 'walk'),
    h('div', { className: 'knob', style: { transform: `translate(-50%,-50%) translate(${knob.x}px,${knob.y}px)` } })
  );
}

function App() {
  const blank = () => ({ active: false, nx: 0, ny: 0, mag: 0, dy: 0, on: false });
  const input = useRef({ left: blank(), right: blank() });
  const ctrl = useRef(null);
  const [size, setSize] = useState(150);
  const [run, setRun] = useState(0);

  useEffect(() => {
    const fit = () => {
      const r = ctrl.current.getBoundingClientRect();
      setSize(Math.max(80, Math.floor(Math.min((r.width - 36) / 2, r.height - 24))));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  useEffect(() => {
    const stop = e => e.preventDefault();
    document.addEventListener('contextmenu', stop);
    document.addEventListener('touchmove', stop, { passive: false });
    return () => {
      document.removeEventListener('contextmenu', stop);
      document.removeEventListener('touchmove', stop);
    };
  }, []);

  return h('div', { className: 'app' },
    h('div', { className: 'view' },
      h(Game, { key: run, input }),
      h('button', { className: 'reset', onClick: () => setRun(r => r + 1) }, 'Restart')
    ),
    h('div', { className: 'controls', ref: ctrl },
      h(Stick, { size, kind: 'left', input }),
      h(Stick, { size, kind: 'right', input })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
