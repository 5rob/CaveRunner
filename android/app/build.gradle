plugins {
    id 'com.android.application'
}

// -PcaveAuto=true (CI, on the autobattler branch) builds the second app, CaveRunner Auto: its own
// package id (installs beside the main app, its own save) and its own update address (Pages' auto/).
// -PcaveGrem=true (CI, on the grem branch) builds the third app, CaveRunner Grem, the same way (Pages' grem/).
// Without either the build is the main app as always.
def caveAuto = project.findProperty('caveAuto') == 'true'
def caveGrem = project.findProperty('caveGrem') == 'true'

android {
    namespace 'com.caverunner.app'
    compileSdk 34

    defaultConfig {
        applicationId caveGrem ? 'com.caverunner.grem' : caveAuto ? 'com.caverunner.auto' : 'com.caverunner.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'app_name', caveGrem ? 'CaveRunner Grem' : caveAuto ? 'CaveRunner Auto' : 'CaveRunner'
        buildConfigField 'String', 'PAGES_BASE', caveGrem ? '"https://5rob.github.io/CaveRunner/grem/"' : caveAuto ? '"https://5rob.github.io/CaveRunner/auto/"' : '"https://5rob.github.io/CaveRunner/"'
    }

    signingConfigs {
        debug {
            // Fixed keystore committed to the repo so every CI build signs
            // identically. Without this the runner mints a fresh debug key each
            // build and the phone refuses to update the shell in place.
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
