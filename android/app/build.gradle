plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caverunner.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caverunner.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            // Fixed keystore committed to the repo so every CI build signs
            // identically. Without this the runner mints a fresh debug key each
            // build and the phone refuses to update the shell in place.
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
